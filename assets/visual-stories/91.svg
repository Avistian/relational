<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">R-GCN: the edge type chooses the message map</title><desc id="desc">Different relationships should not all use one indistinguishable transformation. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">R-GCN: the edge type chooses the message map</text><text x="28" y="67" font-size="15">Different relationships should not all use one indistinguishable transformation.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Preserve relation types</text><g transform="translate(36 133)"><title id="vs-91-1-title">Preserve relation types</title><desc id="vs-91-1-desc">A multi-relational graph distinguishes, for example, an authorship edge from a citation edge.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#7660ad" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#7660ad" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><text x="102" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">r₁</text><text x="203" y="149" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#7660ad">r₂</text></g><text x="36" y="374" font-size="14" font-weight="650">Different edge colors mean different</text><text x="36" y="394" font-size="14" font-weight="650">relations</text><text x="36" y="426" font-size="12">A multi-relational graph distinguishes, for</text><text x="36" y="443" font-size="12">example, an authorship edge from a citation</text><text x="36" y="460" font-size="12">edge.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Transform by relation</text><g transform="translate(391 133)"><title id="vs-91-2-title">Transform by relation</title><desc id="vs-91-2-desc">Each relation contributes through its configured map and normalization. Basis sharing can reduce how many independent parameters are stored.</desc><rect x="10" y="24" width="93" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="56.5" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">relation 1</text><path d="M111,39 L145,39" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="145.0,39.0 138.0,42.8 138.0,35.2" fill="#087f8c"/><rect x="153" y="24" width="111" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="208.5" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">W₁ h</text><rect x="10" y="81" width="93" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="56.5" y="101" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">relation 2</text><path d="M111,96 L145,96" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="145.0,96.0 138.0,99.8 138.0,92.2" fill="#087f8c"/><rect x="153" y="81" width="111" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="208.5" y="101" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">W₂ h</text><rect x="10" y="138" width="93" height="30" rx="6" fill="#fff" stroke="#b46519"/><text x="56.5" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#b46519">self</text><path d="M111,153 L145,153" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="145.0,153.0 138.0,156.8 138.0,149.2" fill="#087f8c"/><rect x="153" y="138" width="111" height="30" rx="6" fill="#fff" stroke="#b46519"/><text x="208.5" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#b46519">W₀ h</text><text x="150" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">combine the relation contributions</text></g><text x="391" y="374" font-size="14" font-weight="650">Neighbor h → Wᵣ h → relation-wise</text><text x="391" y="394" font-size="14" font-weight="650">reduction</text><text x="391" y="426" font-size="12">Each relation contributes through its</text><text x="391" y="443" font-size="12">configured map and normalization. Basis</text><text x="391" y="460" font-size="12">sharing can reduce how many independent</text><text x="391" y="477" font-size="12">parameters are stored.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Combine with a self term</text><g transform="translate(746 133)"><title id="vs-91-3-title">Combine with a self term</title><desc id="vs-91-3-desc">Combine incoming relation messages and the node’s own transformed state, then apply the nonlinearity.</desc><rect x="20" y="40" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#b46519"/><rect x="38" y="40" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#b46519"/><rect x="56" y="40" width="14" height="24" rx="3" fill="#459eaa" stroke="#b46519"/><rect x="74" y="40" width="14" height="24" rx="3" fill="#087f8c" stroke="#b46519"/><text x="56" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">self</text><rect x="188" y="40" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="206" y="40" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="224" y="40" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="242" y="40" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><text x="224" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">neighbors</text><path d="M224,72 L224,110" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="224.0,110.0 220.2,103.0 227.8,103.0" fill="#087f8c"/><rect x="174" y="114" width="100" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="224.0" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">Σ</text><path d="M60,72 L60,168" fill="none" stroke="#b46519" stroke-width="2"/><path d="M60,168 L78,168" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="78.0,168.0 71.0,171.8 71.0,164.2" fill="#b46519"/><path d="M224,149 L178,170" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="178.0,170.0 182.8,163.6 186.0,170.6" fill="#087f8c"/><rect x="80" y="154" width="98" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="129.0" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">+</text><path d="M129,184 L129,205" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="129.0,205.0 125.2,198.0 132.8,198.0" fill="#7660ad"/><text x="213" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">→ update / head</text></g><text x="746" y="374" font-size="14" font-weight="650">Sum relation contributions + self</text><text x="746" y="394" font-size="14" font-weight="650">update</text><text x="746" y="426" font-size="12">Combine incoming relation messages and the</text><text x="746" y="443" font-size="12">node’s own transformed state, then apply the</text><text x="746" y="460" font-size="12">nonlinearity.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/1703.06103v4"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/1703.06103v4</text></a></svg>