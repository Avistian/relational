<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">Local PFNs: choose the evidence around a query</title><desc id="desc">Retrieval and parameter adaptation are separate decisions. Conceptual local-context/adaptation route. Consult the lesson sources for the exact retrieval and fine-tuning variants.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">Local PFNs: choose the evidence around a query</text><text x="28" y="67" font-size="15">Retrieval and parameter adaptation are separate decisions.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Find a local context</text><g transform="translate(36 133)"><title id="vs-67-1-title">Find a local context</title><desc id="vs-67-1-desc">Retrieve using allowed features and the declared fitted transform. A close row is still inadmissible if its label is unavailable.</desc><circle cx="45" cy="65" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="69" cy="116" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="130" cy="58" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="138" cy="140" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="237" cy="45" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="230" cy="145" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="196" cy="92" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="109" cy="102" r="13" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="109" y="107" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#b46519">q</text><ellipse cx="108" cy="103" rx="64" ry="56" fill="none" stroke="#087f8c" stroke-dasharray="5 4"/><path d="M115,94 L130,64" fill="none" stroke="#b46519" stroke-width="2"/><path d="M98,108 L73,115" fill="none" stroke="#b46519" stroke-width="2"/><path d="M117,113 L135,135" fill="none" stroke="#b46519" stroke-width="2"/><text x="150" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">near in learned feature space</text></g><text x="36" y="374" font-size="14" font-weight="650">Query features select eligible support</text><text x="36" y="394" font-size="14" font-weight="650">rows</text><text x="36" y="426" font-size="12">Retrieve using allowed features and the</text><text x="36" y="443" font-size="12">declared fitted transform. A close row is</text><text x="36" y="460" font-size="12">still inadmissible if its label is</text><text x="36" y="477" font-size="12">unavailable.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Condition the PFN</text><g transform="translate(391 133)"><title id="vs-67-2-title">Condition the PFN</title><desc id="vs-67-2-desc">The selected neighborhood replaces a global support set. This changes what evidence the network can see.</desc><text x="83" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">support</text><text x="233" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">query</text><rect x="20" y="40" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="58" y="40" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="40" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="68" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="58" y="68" width="35" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="96" y="68" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="96" width="35" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="58" y="96" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="96" y="96" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="124" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="58" y="124" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="124" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="186" y="76" width="30" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="219" y="76" width="30" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="252" y="76" width="30" height="27" rx="3" fill="#fff" stroke="#b46519"/><text x="267.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><path d="M143,53 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 171.4,88.5 177.0,83.3" fill="#087f8c"/><path d="M143,81 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 171.2,92.8 173.3,85.4" fill="#087f8c"/><path d="M143,109 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 174.4,97.6 171.0,90.7" fill="#087f8c"/><path d="M143,137 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 177.7,98.9 171.7,94.2" fill="#087f8c"/><text x="150" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">observed y → predict unknown y</text></g><text x="391" y="374" font-size="14" font-weight="650">Local support + query → pretrained</text><text x="391" y="394" font-size="14" font-weight="650">network</text><text x="391" y="426" font-size="12">The selected neighborhood replaces a global</text><text x="391" y="443" font-size="12">support set. This changes what evidence the</text><text x="391" y="460" font-size="12">network can see.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Optional fine-tuning</text><g transform="translate(746 133)"><title id="vs-67-3-title">Optional fine-tuning</title><desc id="vs-67-3-desc">If fine-tuning is used, name its data and budget separately. Changing context and changing model weights are different mechanisms.</desc><rect x="116" y="23" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="134" y="23" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="152" y="23" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="170" y="23" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><text x="152" y="15" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">shared input</text><path d="M145,57 L74,100" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="74.0,100.0 78.0,93.1 82.0,99.6" fill="#087f8c"/><path d="M157,57 L228,100" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="228.0,100.0 220.0,99.6 224.0,93.1" fill="#7660ad"/><rect x="14" y="111" width="113" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="70.5" y="131" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">frozen</text><rect x="173" y="111" width="113" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="229.5" y="131" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">fine-tune</text><text x="150" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">two distinct routes</text></g><text x="746" y="374" font-size="14" font-weight="650">Frozen inference or declared weight</text><text x="746" y="394" font-size="14" font-weight="650">updates</text><text x="746" y="426" font-size="12">If fine-tuning is used, name its data and</text><text x="746" y="443" font-size="12">budget separately. Changing context and</text><text x="746" y="460" font-size="12">changing model weights are different</text><text x="746" y="477" font-size="12">mechanisms.</text><text x="28" y="548" font-size="13">Conceptual local-context/adaptation route. Consult the lesson sources for the exact retrieval and fine-tuning variants.</text><a href="https://github.com/layer6ai-labs/LoCalPFN/tree/ff8803c57cd277380b2444f0f5ed4856b46f47f5"><text x="28" y="604" font-size="13">Source: https://github.com/layer6ai-labs/LoCalPFN/tree/ff8803c57cd277380b2444f0f5ed4856b46f47f5</text></a></svg>