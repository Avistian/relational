<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">TGN: memory changes after events</title><desc id="desc">Read time in one direction: predict from admissible history, then update state. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">TGN: memory changes after events</text><text x="28" y="67" font-size="15">Read time in one direction: predict from admissible history, then update state.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Read past memory</text><g transform="translate(36 133)"><title id="vs-102-1-title">Read past memory</title><desc id="vs-102-1-desc">Each node’s memory summarizes processed events. Event order and the memory-update schedule are part of the model contract.</desc><path d="M15,121 L285,121" fill="none" stroke="#597181" stroke-width="2"/><polygon points="285.0,121.0 278.0,124.8 278.0,117.2" fill="#597181"/><circle cx="41" cy="121" r="9" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="41" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">t₁</text><circle cx="96" cy="121" r="9" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="96" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">t₂</text><circle cx="151" cy="121" r="9" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="151" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">t₃</text><circle cx="240" cy="121" r="9" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="240" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">query</text><path d="M204,31 L204,178" fill="none" stroke="#b46519" stroke-width="2" stroke-dasharray="5 4"/><text x="150" y="203" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">history     |     prediction cutoff</text></g><text x="36" y="374" font-size="14" font-weight="650">Events before cutoff → node memory</text><text x="36" y="426" font-size="12">Each node’s memory summarizes processed</text><text x="36" y="443" font-size="12">events. Event order and the memory-update</text><text x="36" y="460" font-size="12">schedule are part of the model contract.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Build temporal embeddings</text><g transform="translate(391 133)"><title id="vs-102-2-title">Build temporal embeddings</title><desc id="vs-102-2-desc">The embedding module can combine memory with neighbor information at the query time. A decoder scores the requested interaction.</desc><rect x="6" y="73" width="110" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="61.0" y="93" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">memory</text><path d="M124,88 L169,88" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="169.0,88.0 162.0,91.8 162.0,84.2" fill="#7660ad"/><rect x="179" y="73" width="115" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="236.5" y="93" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">embedding</text><path d="M233,113 L233,158 L62,158 L62,109" fill="none" stroke="#b46519" stroke-width="2"/><text x="150" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">state reused by later computation</text></g><text x="391" y="374" font-size="14" font-weight="650">Memory + temporal neighborhood →</text><text x="391" y="394" font-size="14" font-weight="650">embeddings</text><text x="391" y="426" font-size="12">The embedding module can combine memory with</text><text x="391" y="443" font-size="12">neighbor information at the query time. A</text><text x="391" y="460" font-size="12">decoder scores the requested interaction.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Update after observation</text><g transform="translate(746 133)"><title id="vs-102-3-title">Update after observation</title><desc id="vs-102-3-desc">Once an event is available under the chosen schedule, create and aggregate messages, then update memory for subsequent predictions.</desc><rect x="6" y="73" width="110" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="61.0" y="93" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">state t</text><path d="M124,88 L169,88" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="169.0,88.0 162.0,91.8 162.0,84.2" fill="#7660ad"/><rect x="179" y="73" width="115" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="236.5" y="93" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">state t+1</text><path d="M233,113 L233,158 L62,158 L62,109" fill="none" stroke="#b46519" stroke-width="2"/><text x="150" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">state reused by later computation</text></g><text x="746" y="374" font-size="14" font-weight="650">New event → message → memory update</text><text x="746" y="426" font-size="12">Once an event is available under the chosen</text><text x="746" y="443" font-size="12">schedule, create and aggregate messages, then</text><text x="746" y="460" font-size="12">update memory for subsequent predictions.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/2006.10637v3#S3"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2006.10637v3#S3</text></a></svg>