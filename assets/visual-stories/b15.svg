<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">An information boundary: two worlds can look identical</title><desc id="desc">Ask what reaches the predictor before asking how expressive it is. Information-boundary illustration for the lesson’s finite experiment; not a claimed reconstruction of the paper’s entire theorem or benchmark.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">An information boundary: two worlds can look identical</text><text x="28" y="67" font-size="15">Ask what reaches the predictor before asking how expressive it is.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Construct two possible worlds</text><g transform="translate(36 133)"><title id="vs-b15-1-title">Construct two possible worlds</title><desc id="vs-b15-1-desc">The lesson pairs cases that agree on the admitted observations but require different answers.</desc><text x="74" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">world A</text><rect x="22" y="45" width="31" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="56" y="45" width="31" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="90" y="45" width="31" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="22" y="73" width="31" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="56" y="73" width="31" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="90" y="73" width="31" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="22" y="101" width="31" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="56" y="101" width="31" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="90" y="101" width="31" height="25" rx="3" fill="#fff" stroke="#b46519"/><text x="105.5" y="119" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><rect x="22" y="155" width="100" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="72.0" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">y = 0</text><text x="225" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">world B</text><rect x="173" y="45" width="31" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="207" y="45" width="31" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="241" y="45" width="31" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="173" y="73" width="31" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="207" y="73" width="31" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="241" y="73" width="31" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="173" y="101" width="31" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="207" y="101" width="31" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="241" y="101" width="31" height="25" rx="3" fill="#fff" stroke="#b46519"/><text x="256.5" y="119" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><rect x="173" y="155" width="100" height="30" rx="6" fill="#fff" stroke="#b46519"/><text x="223.0" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#b46519">y = 1</text><text x="150" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#597181">same visible cells; different answer</text></g><text x="36" y="374" font-size="14" font-weight="650">Same observed features; different</text><text x="36" y="394" font-size="14" font-weight="650">hidden target</text><text x="36" y="426" font-size="12">The lesson pairs cases that agree on the</text><text x="36" y="443" font-size="12">admitted observations but require different</text><text x="36" y="460" font-size="12">answers.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Apply the observation mask</text><g transform="translate(391 133)"><title id="vs-b15-2-title">Apply the observation mask</title><desc id="vs-b15-2-desc">A learned or parameter-free encoder cannot distinguish worlds that produce exactly the same input to it.</desc><rect x="40" y="25" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="85" y="25" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="25" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="175" y="25" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="220" y="25" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="55" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="85" y="55" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="55" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="175" y="55" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="220" y="55" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="85" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="85" y="85" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="130" y="85" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="175" y="85" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="220" y="85" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="115" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="85" y="115" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="115" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="175" y="115" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="220" y="115" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="145" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="85" y="145" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="145" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="175" y="145" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="220" y="145" width="42" height="27" rx="3" fill="#fff" stroke="#b46519"/><text x="241.0" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><text x="150" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">rows × columns; target hidden</text></g><text x="391" y="374" font-size="14" font-weight="650">An encoder can use only the visible</text><text x="391" y="394" font-size="14" font-weight="650">inputs</text><text x="391" y="426" font-size="12">A learned or parameter-free encoder cannot</text><text x="391" y="443" font-size="12">distinguish worlds that produce exactly the</text><text x="391" y="460" font-size="12">same input to it.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Reveal a separating observation</text><g transform="translate(746 133)"><title id="vs-b15-3-title">Reveal a separating observation</title><desc id="vs-b15-3-desc">The extra observation must be available under the protocol. Separating the worlds with an oracle label is not a deployable improvement.</desc><text x="83" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">support</text><text x="233" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">query</text><rect x="20" y="40" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="58" y="40" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="40" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="68" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="58" y="68" width="35" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="96" y="68" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="96" width="35" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="58" y="96" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="96" y="96" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="124" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="58" y="124" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="124" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="186" y="76" width="30" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="219" y="76" width="30" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="252" y="76" width="30" height="27" rx="3" fill="#fff" stroke="#b46519"/><text x="267.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><path d="M143,53 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 171.4,88.5 177.0,83.3" fill="#087f8c"/><path d="M143,81 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 171.2,92.8 173.3,85.4" fill="#087f8c"/><path d="M143,109 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 174.4,97.6 171.0,90.7" fill="#087f8c"/><path d="M143,137 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 177.7,98.9 171.7,94.2" fill="#087f8c"/><text x="150" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">observed y → predict unknown y</text></g><text x="746" y="374" font-size="14" font-weight="650">An available support label may break</text><text x="746" y="394" font-size="14" font-weight="650">the tie</text><text x="746" y="426" font-size="12">The extra observation must be available under</text><text x="746" y="443" font-size="12">the protocol. Separating the worlds with an</text><text x="746" y="460" font-size="12">oracle label is not a deployable improvement.</text><text x="28" y="548" font-size="13">Information-boundary illustration for the lesson’s finite experiment; not a claimed reconstruction of the paper’s entire theorem</text><text x="28" y="566" font-size="13">or benchmark.</text><a href="https://arxiv.org/html/2607.05476v2#S3"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2607.05476v2#S3</text></a></svg>