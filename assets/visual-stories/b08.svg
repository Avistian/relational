<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">LimiX: make the hidden cells explicit</title><desc id="desc">An objective is defined by what is observed, what is hidden and what is scored. Conceptual objective/visibility guide. Exact LimiX architecture and objective scope are in the cited lesson sources.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">LimiX: make the hidden cells explicit</text><text x="28" y="67" font-size="15">An objective is defined by what is observed, what is hidden and what is scored.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Choose observed cells</text><g transform="translate(36 133)"><title id="vs-b08-1-title">Choose observed cells</title><desc id="vs-b08-1-desc">The mask specifies which cells are input evidence and which are prediction targets.</desc><rect x="40" y="25" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="85" y="25" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="25" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="175" y="25" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="220" y="25" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="55" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="85" y="55" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="55" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="175" y="55" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="220" y="55" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="85" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="85" y="85" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="130" y="85" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="175" y="85" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="220" y="85" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="115" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="85" y="115" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="115" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="175" y="115" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="220" y="115" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="145" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="85" y="145" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="145" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="175" y="145" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="220" y="145" width="42" height="27" rx="3" fill="#fff" stroke="#b46519"/><text x="241.0" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><text x="150" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">rows × columns; target hidden</text></g><text x="36" y="374" font-size="14" font-weight="650">One table, a declared visibility mask</text><text x="36" y="426" font-size="12">The mask specifies which cells are input</text><text x="36" y="443" font-size="12">evidence and which are prediction targets.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Process available context</text><g transform="translate(391 133)"><title id="vs-b08-2-title">Process available context</title><desc id="vs-b08-2-desc">Representations combine allowed information across the table. Hidden targets must not re-enter through another feature or preprocessing fit.</desc><rect x="52" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="26" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="52" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="91" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="55" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="169" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="208" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="52" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="91" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="130" y="84" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="169" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="208" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="52" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="113" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><path d="M53,163 L243,163" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="243.0,163.0 236.0,166.8 236.0,159.2" fill="#087f8c"/><path d="M267,139 L267,30" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="267.0,30.0 270.8,37.0 263.2,37.0" fill="#7660ad"/><text x="150" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">feature mixing ↔ row mixing</text></g><text x="391" y="374" font-size="14" font-weight="650">Table-aware computation over visible</text><text x="391" y="394" font-size="14" font-weight="650">evidence</text><text x="391" y="426" font-size="12">Representations combine allowed information</text><text x="391" y="443" font-size="12">across the table. Hidden targets must not re-</text><text x="391" y="460" font-size="12">enter through another feature or preprocessing</text><text x="391" y="477" font-size="12">fit.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Score the hidden targets</text><g transform="translate(746 133)"><title id="vs-b08-3-title">Score the hidden targets</title><desc id="vs-b08-3-desc">The training objective can reward more than one target pattern. The lesson’s ablation isolates what objective changes, holding other choices fixed.</desc><rect x="116" y="23" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="134" y="23" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="152" y="23" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="170" y="23" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><text x="152" y="15" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">shared input</text><path d="M145,57 L74,100" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="74.0,100.0 78.0,93.1 82.0,99.6" fill="#087f8c"/><path d="M157,57 L228,100" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="228.0,100.0 220.0,99.6 224.0,93.1" fill="#7660ad"/><rect x="14" y="111" width="113" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="70.5" y="131" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">mask</text><rect x="173" y="111" width="113" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="229.5" y="131" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">values</text><text x="150" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">two distinct routes</text></g><text x="746" y="374" font-size="14" font-weight="650">Prediction heads → configured</text><text x="746" y="394" font-size="14" font-weight="650">reconstruction losses</text><text x="746" y="426" font-size="12">The training objective can reward more than</text><text x="746" y="443" font-size="12">one target pattern. The lesson’s ablation</text><text x="746" y="460" font-size="12">isolates what objective changes, holding other</text><text x="746" y="477" font-size="12">choices fixed.</text><text x="28" y="548" font-size="13">Conceptual objective/visibility guide. Exact LimiX architecture and objective scope are in the cited lesson sources.</text><a href="https://arxiv.org/html/2509.03505v2#S2"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2509.03505v2#S2</text></a></svg>