<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">Drift-Resilient TabPFN: time enters the prior and the input</title><desc id="desc">The model practices tasks whose relationships change across domains. Conceptual drift-prior and inference route. The lesson’s historical release and time encoding remain authoritative.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">Drift-Resilient TabPFN: time enters the prior and the input</text><text x="28" y="67" font-size="15">The model practices tasks whose relationships change across domains.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Generate changing mechanisms</text><g transform="translate(36 133)"><title id="vs-68-1-title">Generate changing mechanisms</title><desc id="vs-68-1-desc">The pretraining generator creates related domains with changing mechanisms. A temporal prior is a modeling assumption, not a guarantee about every real drift process.</desc><path d="M45,45 L143,93" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="143.0,93.0 135.0,93.4 138.4,86.5" fill="#087f8c"/><path d="M45,145 L143,105" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="143.0,105.0 137.9,111.2 135.1,104.1" fill="#087f8c"/><path d="M162,97 L255,145" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="255.0,145.0 247.0,145.2 250.5,138.4" fill="#087f8c"/><path d="M60,145 L252,150" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="252.0,150.0 244.9,153.7 245.1,146.0" fill="#087f8c"/><circle cx="40" cy="40" r="17" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="40" y="45" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">u</text><circle cx="40" cy="150" r="17" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="40" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">x</text><circle cx="155" cy="98" r="17" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="155" y="103" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">z</text><circle cx="267" cy="154" r="17" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="267" y="159" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">y</text><text x="150" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">sample a directed mechanism</text></g><text x="36" y="374" font-size="14" font-weight="650">Shared graph; mechanisms evolve across</text><text x="36" y="394" font-size="14" font-weight="650">domains</text><text x="36" y="426" font-size="12">The pretraining generator creates related</text><text x="36" y="443" font-size="12">domains with changing mechanisms. A temporal</text><text x="36" y="460" font-size="12">prior is a modeling assumption, not a</text><text x="36" y="477" font-size="12">guarantee about every real drift process.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Encode the domain coordinate</text><g transform="translate(391 133)"><title id="vs-68-2-title">Encode the domain coordinate</title><desc id="vs-68-2-desc">The released route pairs a domain coordinate with feature inputs. Query coordinates use the source-fitted transformation, including extrapolation when necessary.</desc><path d="M25,169 L278,169" fill="none" stroke="#597181" stroke-width="2"/><path d="M25,169 L25,27" fill="none" stroke="#597181" stroke-width="2"/><polyline points="27.0,100.0 29.5,97.5 32.0,95.0 34.4,92.