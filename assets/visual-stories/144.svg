<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">ContextGNN: combine local context and global identity</title><desc id="desc">The two prediction routes cover different candidate situations. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">ContextGNN: combine local context and global identity</text><text x="28" y="67" font-size="15">The two prediction routes cover different candidate situations.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Build query-local context</text><g transform="translate(36 133)"><title id="vs-144-1-title">Build query-local context</title><desc id="vs-144-1-desc">Local graph computation builds representations conditioned on the query neighborhood.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">q</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text></g><text x="36" y="374" font-size="14" font-weight="650">Query entity → sampled relational</text><text x="36" y="394" font-size="14" font-weight="650">neighborhood</text><text x="36" y="426" font-size="12">Local graph computation builds representations</text><text x="36" y="443" font-size="12">conditioned on the query neighborhood.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Keep two scoring routes</text><g transform="translate(391 133)"><title id="vs-144-2-title">Keep two scoring routes</title><desc id="vs-144-2-desc">Candidates available in local context can use contextual representations. A global embedding route supplies representations beyond that neighborhood.</desc><rect x="116" y="23" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="134" y="23" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="152" y="23" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="170" y="23" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><text x="152" y="15" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">shared input</text><path d="M145,57 L74,100" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="74.0,100.0 78.0,93.1 82.0,99.6" fill="#087f8c"/><path d="M157,57 L228,100" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="228.0,100.0 220.0,99.6 224.0,93.1" fill="#7660ad"/><rect x="14" y="111" width="113" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="70.5" y="131" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">local</text><rect x="173" y="111" width="113" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="229.5" y="131" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">global</text><text x="150" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">two distinct routes</text></g><text x="391" y="374" font-size="14" font-weight="650">Contextual candidates | global</text><text x="391" y="394" font-size="14" font-weight="650">candidate embeddings</text><text x="391" y="426" font-size="12">Candidates available in local context can use</text><text x="391" y="443" font-size="12">contextual representations. A global embedding</text><text x="391" y="460" font-size="12">route supplies representations beyond that</text><text x="391" y="477" font-size="12">neighborhood.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Combine into candidate scores</text><g transform="translate(746 133)"><title id="vs-144-3-title">Combine into candidate scores</title><desc id="vs-144-3-desc">The prediction layer combines the relevant routes. Candidate eligibility and ranking evaluation are separate from the architecture.</desc><text x="82" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">candidate i</text><rect x="149" y="24" width="115" height="24" rx="3" fill="#087f8c" stroke="none"/><text x="82" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">candidate j</text><rect x="149" y="77" width="83" height="24" rx="3" fill="#7660ad" stroke="none"/><text x="82" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">candidate k</text><rect x="149" y="130" width="51" height="24" rx="3" fill="#b46519" stroke="none"/><text x="150" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">rank admitted candidates</text></g><text x="746" y="374" font-size="14" font-weight="650">Route-aware scores → ranked candidates</text><text x="746" y="426" font-size="12">The prediction layer combines the relevant</text><text x="746" y="443" font-size="12">routes. Candidate eligibility and ranking</text><text x="746" y="460" font-size="12">evaluation are separate from the architecture.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/2411.19513v1#S4"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2411.19513v1#S4</text></a></svg>