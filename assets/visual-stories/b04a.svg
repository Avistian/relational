<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">TabFlex: summarize keys and values before the query</title><desc id="desc">Associativity can change the cost of attention without building every pairwise score. Normalized kernel calculation used by the lesson to explain support statistics; see the full TabFlex diagram for its encoders and output heads.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">TabFlex: summarize keys and values before the query</text><text x="28" y="67" font-size="15">Associativity can change the cost of attention without building every pairwise score.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Encode support and query</text><g transform="translate(36 133)"><title id="vs-b04a-1-title">Encode support and query</title><desc id="vs-b04a-1-desc">Pretrained encoders prepare representations. Label visibility and feature preprocessing still define which information enters.</desc><text x="83" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">support</text><text x="233" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">query</text><rect x="20" y="40" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="58" y="40" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="40" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="68" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="58" y="68" width="35" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="96" y="68" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="96" width="35" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="58" y="96" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="96" y="96" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="124" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="58" y="124" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="124" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="186" y="76" width="30" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="219" y="76" width="30" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="252" y="76" width="30" height="27" rx="3" fill="#fff" stroke="#b46519"/><text x="267.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><path d="M143,53 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 171.4,88.5 177.0,83.3" fill="#087f8c"/><path d="M143,81 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 171.2,92.8 173.3,85.4" fill="#087f8c"/><path d="M143,109 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 174.4,97.6 171.0,90.7" fill="#087f8c"/><path d="M143,137 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 177.7,98.9 171.7,94.2" fill="#087f8c"/><text x="150" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">observed y → predict unknown y</text></g><text x="36" y="374" font-size="14" font-weight="650">Support keys/values; separate query</text><text x="36" y="394" font-size="14" font-weight="650">features</text><text x="36" y="426" font-size="12">Pretrained encoders prepare representations.</text><text x="36" y="443" font-size="12">Label visibility and feature preprocessing</text><text x="36" y="460" font-size="12">still define which information enters.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Accumulate sufficient statistics</text><g transform="translate(391 133)"><title id="vs-b04a-2-title">Accumulate sufficient statistics</title><desc id="vs-b04a-2-desc">Aggregate support contributions before processing each query. These statistics depend on the chosen feature map and attention formulation.</desc><rect x="12" y="25" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="30" y="25" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="48" y="25" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><text x="83" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="400" fill="#7660ad">⊗</text><rect x="106" y="25" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#7660ad"/><rect x="124" y="25" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#7660ad"/><rect x="142" y="25" width="14" height="24" rx="3" fill="#459eaa" stroke="#7660ad"/><path d="M169,37 L220,100" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="220.0,100.0 212.6,97.0 218.6,92.1" fill="#087f8c"/><rect x="12" y="78" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="30" y="78" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="48" y="78" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><text x="83" y="97" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="400" fill="#7660ad">⊗</text><rect x="106" y="78" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#7660ad"/><rect x="124" y="78" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#7660ad"/><rect x="142" y="78" width="14" height="24" rx="3" fill="#459eaa" stroke="#7660ad"/><path d="M169,90 L220,100" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="220.0,100.0 212.4,102.4 213.8,94.9" fill="#087f8c"/><rect x="12" y="131" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="30" y="131" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="48" y="131" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><text x="83" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="400" fill="#7660ad">⊗</text><rect x="106" y="131" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#7660ad"/><rect x="124" y="131" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#7660ad"/><rect x="142" y="131" width="14" height="24" rx="3" fill="#459eaa" stroke="#7660ad"/><path d="M169,143 L220,100" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="220.0,100.0 217.1,107.5 212.2,101.6" fill="#087f8c"/><rect x="224" y="87" width="60" height="30" rx="6" fill="#fff" stroke="#b46519"/><text x="254.0" y="107" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#b46519">Σ</text><text x="150" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#597181">fixed-size accumulated support state</text></g><text x="391" y="374" font-size="14" font-weight="650">S = Σ φ(kᵢ)vᵢᵀ; z = Σ φ(kᵢ)</text><text x="391" y="426" font-size="12">Aggregate support contributions before</text><text x="391" y="443" font-size="12">processing each query. These statistics depend</text><text x="391" y="460" font-size="12">on the chosen feature map and attention</text><text x="391" y="477" font-size="12">formulation.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Read the summary</text><g transform="translate(746 133)"><title id="vs-b04a-3-title">Read the summary</title><desc id="vs-b04a-3-desc">A query reads the accumulated support state. This avoids explicitly materializing the full query-by-support interaction matrix in the illustrated normalized kernel calculation.</desc><rect x="20" y="67" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#b46519"/><rect x="38" y="67" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#b46519"/><rect x="56" y="67" width="14" height="24" rx="3" fill="#459eaa" stroke="#b46519"/><text x="47" y="59" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">φ(q)</text><path d="M86,80 L116,80" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="116.0,80.0 109.0,83.8 109.0,76.2" fill="#087f8c"/><rect x="129" y="39" width="27" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="159" y="39" width="27" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="189" y="39" width="27" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="129" y="67" width="27" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="159" y="67" width="27" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="189" y="67" width="27" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="129" y="95" width="27" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="159" y="95" width="27" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="189" y="95" width="27" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><path d="M227,80 L270,80" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="270.0,80.0 263.0,83.8 263.0,76.2" fill="#087f8c"/><text x="150" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">divide by the support normalizer</text><text x="150" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#597181">fixed-size accumulated support state</text></g><text x="746" y="374" font-size="14" font-weight="650">Read φ(q)ᵀS, normalize with φ(q)ᵀz</text><text x="746" y="426" font-size="12">A query reads the accumulated support state.</text><text x="746" y="443" font-size="12">This avoids explicitly materializing the full</text><text x="746" y="460" font-size="12">query-by-support interaction matrix in the</text><text x="746" y="477" font-size="12">illustrated normalized kernel calculation.</text><text x="28" y="548" font-size="13">Normalized kernel calculation used by the lesson to explain support statistics; see the full TabFlex diagram for its encoders and</text><text x="28" y="566" font-size="13">output heads.</text><a href="https://arxiv.org/html/2506.05584v1#S3"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2506.05584v1#S3</text></a></svg>