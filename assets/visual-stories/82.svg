<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">GCN: smooth along edges, learn across features</title><desc id="desc">Graph mixing and feature mixing act on different axes. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">GCN: smooth along edges, learn across features</text><text x="28" y="67" font-size="15">Graph mixing and feature mixing act on different axes.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Include the node itself</text><g transform="translate(36 133)"><title id="vs-82-1-title">Include the node itself</title><desc id="vs-82-1-desc">Self-loops retain a self contribution. Symmetric degree normalization controls how neighbor contributions are scaled.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><path d="M140,89 C107,28 200,32 162,89" fill="none" stroke="#b46519" stroke-width="3"/><text x="150" y="25" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">self contribution</text></g><text x="36" y="374" font-size="14" font-weight="650">Adjacency A → A + I → degree scaling</text><text x="36" y="426" font-size="12">Self-loops retain a self contribution.</text><text x="36" y="443" font-size="12">Symmetric degree normalization controls how</text><text x="36" y="460" font-size="12">neighbor contributions are scaled.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Apply S H W</text><g transform="translate(391 133)"><title id="vs-82-2-title">Apply S H W</title><desc id="vs-82-2-desc">Multiply node states by the shared feature map and normalized graph operator. A hidden-layer nonlinearity follows.</desc><rect x="13" y="51" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="38" y="51" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="63" y="51" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="13" y="76" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="38" y="76" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="63" y="76" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="13" y="101" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="38" y="101" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="63" y="101" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><text x="43" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#b46519">S</text><rect x="112" y="51" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="137" y="51" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="162" y="51" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="112" y="76" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="137" y="76" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="162" y="76" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="112" y="101" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="137" y="101" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="162" y="101" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><text x="142" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#087f8c">H</text><rect x="211" y="51" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="236" y="51" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="211" y="76" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="236" y="76" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="211" y="101" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="236" y="101" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><text x="241" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#7660ad">W</text><text x="150" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">node mixing × states × feature map</text></g><text x="391" y="374" font-size="14" font-weight="650">S mixes nodes; W mixes feature</text><text x="391" y="394" font-size="14" font-weight="650">channels</text><text x="391" y="426" font-size="12">Multiply node states by the shared feature map</text><text x="391" y="443" font-size="12">and normalized graph operator. A hidden-layer</text><text x="391" y="460" font-size="12">nonlinearity follows.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Repeat to produce logits</text><g transform="translate(746 133)"><title id="vs-82-3-title">Repeat to produce logits</title><desc id="vs-82-3-desc">The usual two-layer classifier has different weights per layer, shared across nodes. Only permitted labels enter the training loss.</desc><rect x="44" y="21" width="212" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="150.0" y="41" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">S X W₀ → ReLU</text><path d="M150,60 L150,99" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="150.0,99.0 146.2,92.0 153.8,92.0" fill="#087f8c"/><rect x="44" y="109" width="212" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="150.0" y="129" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">S H W₁ → logits</text><text x="150" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">same graph S; different layer weights</text></g><text x="746" y="374" font-size="14" font-weight="650">Hidden GCN layer → output GCN layer</text><text x="746" y="426" font-size="12">The usual two-layer classifier has different</text><text x="746" y="443" font-size="12">weights per layer, shared across nodes. Only</text><text x="746" y="460" font-size="12">permitted labels enter the training loss.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/1609.02907v4#S2"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/1609.02907v4#S2</text></a></svg>