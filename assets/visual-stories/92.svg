<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">HAN: attend within paths, then between paths</title><desc id="desc">A meta-path chooses a semantic neighborhood before attention weights it. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">HAN: attend within paths, then between paths</text><text x="28" y="67" font-size="15">A meta-path chooses a semantic neighborhood before attention weights it.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Choose a relation sequence</text><g transform="translate(36 133)"><title id="vs-92-1-title">Choose a relation sequence</title><desc id="vs-92-1-desc">A meta-path specifies which multi-step relation connects neighbors. Different paths create different semantic neighborhoods.</desc><path d="M41,65 L93,122" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="93.0,122.0 85.4,119.4 91.1,114.2" fill="#087f8c"/><path d="M113,122 L179,65" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,65.0 176.2,72.5 171.2,66.7" fill="#087f8c"/><path d="M199,65 L253,122" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="253.0,122.0 245.4,119.5 251.0,114.3" fill="#087f8c"/><circle cx="33" cy="65" r="19" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="33" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">A</text><circle cx="105" cy="122" r="19" fill="#eee9fa" stroke="#7660ad" stroke-width="2"/><text x="105" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">P</text><circle cx="191" cy="65" r="19" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="191" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">A</text><circle cx="265" cy="122" r="19" fill="#eee9fa" stroke="#7660ad" stroke-width="2"/><text x="265" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">P</text><text x="150" y="199" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">type-constrained route</text></g><text x="36" y="374" font-size="14" font-weight="650">Example: author → paper → author</text><text x="36" y="426" font-size="12">A meta-path specifies which multi-step</text><text x="36" y="443" font-size="12">relation connects neighbors. Different paths</text><text x="36" y="460" font-size="12">create different semantic neighborhoods.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Attend within each path</text><g transform="translate(391 133)"><title id="vs-92-2-title">Attend within each path</title><desc id="vs-92-2-desc">Node-level attention builds a representation for each chosen path. These summaries do not yet decide which path matters most.</desc><rect x="5" y="94" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="23" y="94" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="41" y="94" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><path d="M64,106 L102,40" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="102.0,40.0 101.8,48.0 95.2,44.2" fill="#087f8c"/><rect x="106" y="26" width="91" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="151.5" y="46" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">head 1</text><path d="M203,41 L251,108" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="251.0,108.0 243.8,104.5 250.0,100.1" fill="#087f8c"/><path d="M64,106 L102,101" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="102.0,101.0 95.5,105.7 94.5,98.1" fill="#7660ad"/><rect x="106" y="87" width="91" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="151.5" y="107" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">head 2</text><path d="M203,102 L251,108" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="251.0,108.0 243.6,110.9 244.5,103.3" fill="#7660ad"/><path d="M64,106 L102,162" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="102.0,162.0 94.9,158.3 101.2,154.0" fill="#b46519"/><rect x="106" y="148" width="91" height="30" rx="6" fill="#fff" stroke="#b46519"/><text x="151.5" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#b46519">head 3</text><path d="M203,163 L251,108" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="251.0,108.0 249.3,115.8 243.5,110.8" fill="#b46519"/><circle cx="269" cy="108" r="18" fill="#fff" stroke="#7660ad" stroke-width="2"/><text x="269" y="113" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="400" fill="#7660ad">∥</text><text x="150" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">combine the parallel predictions</text></g><text x="391" y="374" font-size="14" font-weight="650">One neighborhood summary per meta-path</text><text x="391" y="426" font-size="12">Node-level attention builds a representation</text><text x="391" y="443" font-size="12">for each chosen path. These summaries do not</text><text x="391" y="460" font-size="12">yet decide which path matters most.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Mix semantic summaries</text><g transform="translate(746 133)"><title id="vs-92-3-title">Mix semantic summaries</title><desc id="vs-92-3-desc">Semantic-level attention combines the path-specific representations into a node representation for the task.</desc><rect x="25" y="23" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="43" y="23" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="61" y="23" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><path d="M90,35 L159,35" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="159.0,35.0 152.0,38.8 152.0,31.2" fill="#087f8c"/><rect x="178" y="23" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="196" y="23" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="214" y="23" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="232" y="23" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><rect x="25" y="62" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="43" y="62" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="61" y="62" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><path d="M90,74 L159,74" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="159.0,74.0 152.0,77.8 152.0,70.2" fill="#7660ad"/><rect x="178" y="62" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="196" y="62" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="214" y="62" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="232" y="62" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><rect x="25" y="101" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="43" y="101" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="61" y="101" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><path d="M90,113 L159,113" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="159.0,113.0 152.0,116.8 152.0,109.2" fill="#b46519"/><rect x="178" y="101" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="196" y="101" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="214" y="101" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="232" y="101" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><rect x="25" y="140" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="43" y="140" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="61" y="140" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><path d="M90,152 L159,152" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="159.0,152.0 152.0,155.8 152.0,148.2" fill="#087f8c"/><rect x="178" y="140" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="196" y="140" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="214" y="140" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="232" y="140" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><text x="150" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#597181">mix meta-path summaries</text></g><text x="746" y="374" font-size="14" font-weight="650">Path representations → semantic</text><text x="746" y="394" font-size="14" font-weight="650">attention</text><text x="746" y="426" font-size="12">Semantic-level attention combines the path-</text><text x="746" y="443" font-size="12">specific representations into a node</text><text x="746" y="460" font-size="12">representation for the task.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/1903.07293v2#S4"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/1903.07293v2#S4</text></a></svg>