<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">Mitra: change the distribution of training tasks</title><desc id="desc">The mixture lives before the learner sees an episode. Mitra prior-mixture concept; the lesson separately discusses Mitra-v2 and the bounded course experiment.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">Mitra: change the distribution of training tasks</text><text x="28" y="67" font-size="15">The mixture lives before the learner sees an episode.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Choose a generator family</text><g transform="translate(36 133)"><title id="vs-b06-1-title">Choose a generator family</title><desc id="vs-b06-1-desc">The training prior determines which kinds of prediction problems the model practices.</desc><rect x="17" y="30" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="42" y="30" width="22" height="21" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="67" y="30" width="22" height="21" rx="3" fill="#fff0de" stroke="#fff"/><rect x="17" y="54" width="22" height="21" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="42" y="54" width="22" height="21" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="67" y="54" width="22" height="21" rx="3" fill="#fff0de" stroke="#fff"/><rect x="17" y="78" width="22" height="21" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="42" y="78" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="67" y="78" width="22" height="21" rx="3" fill="#fff" stroke="#b46519"/><text x="78.0" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><path d="M49,121 L49,150" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="49.0,150.0 45.2,143.0 52.8,143.0" fill="#087f8c"/><rect x="111" y="52" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="136" y="52" width="22" height="21" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="161" y="52" width="22" height="21" rx="3" fill="#fff0de" stroke="#fff"/><rect x="111" y="76" width="22" height="21" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="136" y="76" width="22" height="21" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="161" y="76" width="22" height="21" rx="3" fill="#fff0de" stroke="#fff"/><rect x="111" y="100" width="22" height="21" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="136" y="100" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="161" y="100" width="22" height="21" rx="3" fill="#fff" stroke="#b46519"/><text x="172.0" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><path d="M143,121 L143,150" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="143.0,150.0 139.2,143.0 146.8,143.0" fill="#7660ad"/><rect x="205" y="30" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="230" y="30" width="22" height="21" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="255" y="30" width="22" height="21" rx="3" fill="#fff0de" stroke="#fff"/><rect x="205" y="54" width="22" height="21" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="230" y="54" width="22" height="21" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="255" y="54" width="22" height="21" rx="3" fill="#fff0de" stroke="#fff"/><rect x="205" y="78" width="22" height="21" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="230" y="78" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="255" y="78" width="22" height="21" rx="3" fill="#fff" stroke="#b46519"/><text x="266.0" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><path d="M237,121 L237,150" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="237.0,150.0 233.2,143.0 240.8,143.0" fill="#b46519"/><rect x="58" y="163" width="184" height="35" rx="6" fill="#f0edf8" stroke="#7660ad"/><text x="150" y="186" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="650" fill="#7660ad">sample a generator</text><path d="M52,15 L142,15" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M142,15 L235,15" fill="none" stroke="#7660ad" stroke-width="2"/><circle cx="52" cy="15" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="142" cy="15" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="235" cy="15" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/></g><text x="36" y="374" font-size="14" font-weight="650">Several task families → declared</text><text x="36" y="394" font-size="14" font-weight="650">mixing weights</text><text x="36" y="426" font-size="12">The training prior determines which kinds of</text><text x="36" y="443" font-size="12">prediction problems the model practices.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Sample a task and episode</text><g transform="translate(391 133)"><title id="vs-b06-2-title">Sample a task and episode</title><desc id="vs-b06-2-desc">Each draw instantiates a task. Split observed evidence from targets within that episode.</desc><rect x="47" y="12" width="206" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="150.0" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">sample one mechanism</text><path d="M150,51 L150,86" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="150.0,86.0 146.2,79.0 153.8,79.0" fill="#7660ad"/><rect x="68" y="98" width="40" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="111" y="98" width="40" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="154" y="98" width="40" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="197" y="98" width="40" height="22" rx="3" fill="#fff0de" stroke="#fff"/><rect x="68" y="123" width="40" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="111" y="123" width="40" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="154" y="123" width="40" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="197" y="123" width="40" height="22" rx="3" fill="#fff0de" stroke="#fff"/><rect x="68" y="148" width="40" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="111" y="148" width="40" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="154" y="148" width="40" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="197" y="148" width="40" height="22" rx="3" fill="#fff" stroke="#b46519"/><text x="217.0" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><text x="150" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">generate observations in that world</text></g><text x="391" y="374" font-size="14" font-weight="650">Generator draw → support and query</text><text x="391" y="394" font-size="14" font-weight="650">rows</text><text x="391" y="426" font-size="12">Each draw instantiates a task. Split observed</text><text x="391" y="443" font-size="12">evidence from targets within that episode.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Train a shared predictor</text><g transform="translate(746 133)"><title id="vs-b06-3-title">Train a shared predictor</title><desc id="vs-b06-3-desc">The controlled lesson experiment holds the learner and budget fixed while changing its task distribution.</desc><rect x="17" y="30" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="42" y="30" width="22" height="21" rx="3" fill="#edf5f