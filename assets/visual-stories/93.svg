<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">HGT: types enter both attention and messages</title><desc id="desc">Follow the source type, relation type and destination type through one edge. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">HGT: types enter both attention and messages</text><text x="28" y="67" font-size="15">Follow the source type, relation type and destination type through one edge.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Keep the edge triplet</text><g transform="translate(36 133)"><title id="vs-93-1-title">Keep the edge triplet</title><desc id="vs-93-1-desc">The node and relation types are computational inputs, not merely graph annotations.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#7660ad" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#7660ad" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><text x="102" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">r₁</text><text x="203" y="149" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#7660ad">r₂</text></g><text x="36" y="374" font-size="14" font-weight="650">Source type — relation → destination</text><text x="36" y="394" font-size="14" font-weight="650">type</text><text x="36" y="426" font-size="12">The node and relation types are computational</text><text x="36" y="443" font-size="12">inputs, not merely graph annotations.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Build typed attention</text><g transform="translate(391 133)"><title id="vs-93-2-title">Build typed attention</title><desc id="vs-93-2-desc">Type-specific projections and relation-specific transformations determine attention scores and message content.</desc><rect x="7" y="22" width="103" height="30" rx="6" fill="#fff" stroke="#b46519"/><text x="58.5" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#b46519">Q target</text><path d="M117,37 L151,37" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="151.0,37.0 144.0,40.8 144.0,33.2" fill="#087f8c"/><rect x="160" y="22" width="131" height="30" rx="6" fill="#fff" stroke="#b46519"/><text x="225.5" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#b46519">typed projection</text><rect x="7" y="75" width="103" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="58.5" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">K source</text><path d="M117,90 L151,90" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="151.0,90.0 144.0,93.8 144.0,86.2" fill="#087f8c"/><rect x="160" y="75" width="131" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="225.5" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">typed projection</text><rect x="7" y="128" width="103" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="58.5" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">V source</text><path d="M117,143 L151,143" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="151.0,143.0 144.0,146.8 144.0,139.2" fill="#087f8c"/><rect x="160" y="128" width="131" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="225.5" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">typed projection</text><text x="150" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#597181">relations transform scores and messages</text></g><text x="391" y="374" font-size="14" font-weight="650">Typed Q/K/V + relation transformations</text><text x="391" y="426" font-size="12">Type-specific projections and relation-</text><text x="391" y="443" font-size="12">specific transformations determine attention</text><text x="391" y="460" font-size="12">scores and message content.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Reduce into the target</text><g transform="translate(746 133)"><title id="vs-93-3-title">Reduce into the target</title><desc id="vs-93-3-desc">Aggregate the allowed incoming messages and apply the target-side transformation and residual route.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="6"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="9"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><text x="150" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">edge width ∝ attention</text></g><text x="746" y="374" font-size="14" font-weight="650">Weighted messages → target-type update</text><text x="746" y="426" font-size="12">Aggregate the allowed incoming messages and</text><text x="746" y="443" font-size="12">apply the target-side transformation and</text><text x="746" y="460" font-size="12">residual route.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/2003.01332v1#S3"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2003.01332v1#S3</text></a></svg>