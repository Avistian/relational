<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">Numerical embeddings and shared ensembles: locate the ensemble mechanism</title><desc id="desc">Trace the member-specific paths through one shared weight matrix. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="20" font-weight="650">Numerical embeddings and shared ensembles: locate the ensemble mechanism</text><text x="28" y="67" font-size="15">Trace the member-specific paths through one shared weight matrix.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. One row, several members</text><g transform="translate(36 133)"><title id="vs-b02-1-title">One row, several members</title><desc id="vs-b02-1-desc">Each ensemble member sees the row. Member-specific scaling lets the paths behave differently without storing k independent large matrices.</desc><rect x="5" y="94" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="23" y="94" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="41" y="94" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><path d="M64,106 L102,40" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="102.0,40.0 101.8,48.0 95.2,44.2" fill="#087f8c"/><rect x="106" y="26" width="91" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="151.5" y="46" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">member 1</text><path d="M203,41 L251,108" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="251.0,108.0 243.8,104.5 250.0,100.1" fill="#087f8c"/><path d="M64,106 L102,101" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="102.0,101.0 95.5,105.7 94.5,98.1" fill="#7660ad"/><rect x="106" y="87" width="91" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="151.5" y="107" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">member 2</text><path d="M203,102 L251,108" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="251.0,108.0 243.6,110.9 244.5,103.3" fill="#7660ad"/><path d="M64,106 L102,162" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="102.0,162.0 94.9,158.3 101.2,154.0" fill="#b46519"/><rect x="106" y="148" width="91" height="30" rx="6" fill="#fff" stroke="#b46519"/><text x="151.5" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#b46519">member 3</text><path d="M203,163 L251,108" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="251.0,108.0 249.3,115.8 243.5,110.8" fill="#b46519"/><circle cx="269" cy="108" r="18" fill="#fff" stroke="#7660ad" stroke-width="2"/><text x="269" y="113" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="400" fill="#7660ad">μ</text><text x="150" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">combine the parallel predictions</text></g><text x="36" y="374" font-size="14" font-weight="650">The same row enters k member paths</text><text x="36" y="426" font-size="12">Each ensemble member sees the row. Member-</text><text x="36" y="443" font-size="12">specific scaling lets the paths behave</text><text x="36" y="460" font-size="12">differently without storing k independent</text><text x="36" y="477" font-size="12">large matrices.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Share W, vary the scales</text><g transform="translate(391 133)"><title id="vs-b02-2-title">Share W, vary the scales</title><desc id="vs-b02-2-desc">The small r and s vectors belong to members; the large W is shared. Repeat the configured ensemble layers through the backbone.</desc><rect x="5" y="94" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="23" y="94" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="41" y="94" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><path d="M64,106 L102,40" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="102.0,40.0 101.8,48.0 95.2,44.2" fill="#087f8c"/><rect x="106" y="26" width="91" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="151.5" y="46" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">r · W · s</text><path d="M203,41 L251,108" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="251.0,108.0 243.8,104.5 250.0,100.1" fill="#087f8c"/><path d="M64,106 L102,101" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="102.0,101.0 95.5,105.7 94.5,98.1" fill="#7660ad"/><rect x="106" y="87" width="91" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="151.5" y="107" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">r · W · s</text><path d="M203,102 L251,108" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="251.0,108.0 243.6,110.9 244.5,103.3" fill="#7660ad"/><path d="M64,106 L102,162" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="102.0,162.0 94.9,158.3 101.2,154.0" fill="#b46519"/><rect x="106" y="148" width="91" height="30" rx="6" fill="#fff" stroke="#b46519"/><text x="151.5" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#b46519">r · W · s</text><path d="M203,163 L251,108" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="251.0,108.0 249.3,115.8 243.5,110.8" fill="#b46519"/><circle cx="269" cy="108" r="18" fill="#fff" stroke="#7660ad" stroke-width="2"/><text x="269" y="113" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="400" fill="#7660ad">μ</text><text x="150" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">shared W</text></g><text x="391" y="374" font-size="14" font-weight="650">Member i: ((x ⊙ rᵢ) W) ⊙ sᵢ</text><text x="391" y="426" font-size="12">The small r and s vectors belong to members;</text><text x="391" y="443" font-size="12">the large W is shared. Repeat the configured</text><text x="391" y="460" font-size="12">ensemble layers through the backbone.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Train separately, combine</text><g transform="translate(746 133)"><title id="vs-b02-3-title">Train separately, combine</title><desc id="vs-b02-3-desc">Each member receives a learning signal. Combine the member predictions at evaluation; averaging before the training loss is a different objective.</desc><rect x="5" y="94" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="23" y="94" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="41" y="94" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><path d="M64,106 L102,40" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="102.0,40.0 101.8,48.0 95.2,44.2" fill="#087f8c"/><rect x="106" y="26" width="91" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="151.5" y="46" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">member 1</text><path d="M203,41 L251,108" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="251.0,108.0 243.8,104.5 250.0,100.1" fill="#087f8c"/><path d="M64,106 L102,101" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="102.0,101.0 95.5,105.7 94.5,98.1" fill="#7660ad"/><rect x="106" y="87" width="91" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="151.5" y="107" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">member 2</text><path d="M203,102 L251,108" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="251.0,108.0 243.6,110.9 244.5,103.3" fill="#7660ad"/><path d="M64,106 L102,162" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="102.0,162.0 94.9,158.3 101.2,154.0" fill="#b46519"/><rect x="106" y="148" width="91" height="30" rx="6" fill="#fff" stroke="#b46519"/><text x="151.5" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#b46519">member 3</text><path d="M203,163 L251,108" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="251.0,108.0 249.3,115.8 243.5,110.8" fill="#b46519"/><circle cx="269" cy="108" r="18" fill="#fff" stroke="#7660ad" stroke-width="2"/><text x="269" y="113" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="400" fill="#7660ad">μ</text><text x="150" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">combine the parallel predictions</text></g><text x="746" y="374" font-size="14" font-weight="650">Member losses during fitting; average</text><text x="746" y="394" font-size="14" font-weight="650">at inference</text><text x="746" y="426" font-size="12">Each member receives a learning signal.</text><text x="746" y="443" font-size="12">Combine the member predictions at evaluation;</text><text x="746" y="460" font-size="12">averaging before the training loss is a</text><text x="746" y="477" font-size="12">different objective.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/2410.24210v3#S3.SS2"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2410.24210v3#S3.SS2</text></a></svg>