<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">BPR: train a relative preference</title><desc id="desc">The training object is a user–positive–negative triple. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">BPR: train a relative preference</text><text x="28" y="67" font-size="15">The training object is a user–positive–negative triple.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Sample a comparison</text><g transform="translate(36 133)"><title id="vs-97-1-title">Sample a comparison</title><desc id="vs-97-1-desc">The sampler chooses the comparison. An unobserved item is not automatically a proven dislike.</desc><text x="82" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">candidate i</text><rect x="149" y="24" width="115" height="24" rx="3" fill="#087f8c" stroke="none"/><text x="82" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">candidate j</text><rect x="149" y="77" width="83" height="24" rx="3" fill="#7660ad" stroke="none"/><text x="82" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">candidate k</text><rect x="149" y="130" width="51" height="24" rx="3" fill="#b46519" stroke="none"/><text x="150" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">u supplies the comparison context</text></g><text x="36" y="374" font-size="14" font-weight="650">User u, observed item i, sampled item</text><text x="36" y="394" font-size="14" font-weight="650">j</text><text x="36" y="426" font-size="12">The sampler chooses the comparison. An</text><text x="36" y="443" font-size="12">unobserved item is not automatically a proven</text><text x="36" y="460" font-size="12">dislike.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Score the difference</text><g transform="translate(391 133)"><title id="vs-97-2-title">Score the difference</title><desc id="vs-97-2-desc">Use one scoring model for both pairs. The objective depends on their score gap, not two independent class labels.</desc><text x="82" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">candidate i</text><rect x="149" y="24" width="115" height="24" rx="3" fill="#087f8c" stroke="none"/><text x="82" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">candidate j</text><rect x="149" y="77" width="83" height="24" rx="3" fill="#7660ad" stroke="none"/><text x="82" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">candidate k</text><rect x="149" y="130" width="51" height="24" rx="3" fill="#b46519" stroke="none"/><text x="150" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">compare two scores: sᵢ − sⱼ</text></g><text x="391" y="374" font-size="14" font-weight="650">s(u,i) − s(u,j)</text><text x="391" y="426" font-size="12">Use one scoring model for both pairs. The</text><text x="391" y="443" font-size="12">objective depends on their score gap, not two</text><text x="391" y="460" font-size="12">independent class labels.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Optimize a ranking loss</text><g transform="translate(746 133)"><title id="vs-97-3-title">Optimize a ranking loss</title><desc id="vs-97-3-desc">Update the configured parameters to favor the observed item over the sampled alternative; evaluate with a declared candidate set.</desc><text x="82" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">candidate i</text><rect x="149" y="24" width="115" height="24" rx="3" fill="#087f8c" stroke="none"/><text x="82" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">candidate j</text><rect x="149" y="77" width="83" height="24" rx="3" fill="#7660ad" stroke="none"/><text x="82" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">candidate k</text><rect x="149" y="130" width="51" height="24" rx="3" fill="#b46519" stroke="none"/><text x="150" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">rank admitted candidates</text></g><text x="746" y="374" font-size="14" font-weight="650">Increase log σ(score gap), with</text><text x="746" y="394" font-size="14" font-weight="650">regularization</text><text x="746" y="426" font-size="12">Update the configured parameters to favor the</text><text x="746" y="443" font-size="12">observed item over the sampled alternative;</text><text x="746" y="460" font-size="12">evaluate with a declared candidate set.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/abs/1205.2618"><text x="28" y="604" font-size="13">Source: https://arxiv.org/abs/1205.2618</text></a></svg>