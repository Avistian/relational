"6"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="9"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><text x="150" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">edge width ∝ attention</text><text x="150" y="24" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#7660ad">score + time information</text></g><text x="746" y="374" font-size="14" font-weight="650">Earlier neighbor representations →</text><text x="746" y="394" font-size="14" font-weight="650">query state</text><text x="746" y="426" font-size="12">Temporal attention combines the eligible</text><text x="746" y="443" font-size="12">representations across layers. This route</text><text x="746" y="460" font-size="12">differs from maintaining a persistent TGN</text><text x="746" y="477" font-size="12">memory.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/2002.07962v1#S3"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2002.07962v1#S3</text></a></svg>