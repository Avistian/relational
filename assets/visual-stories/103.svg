<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">TGAT: encode elapsed time inside attention</title><desc id="desc">A recursive neighborhood query carries a timestamp at every level. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">TGAT: encode elapsed time inside attention</text><text x="28" y="67" font-size="15">A recursive neighborhood query carries a timestamp at every level.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Retrieve earlier neighbors</text><g transform="translate(36 133)"><title id="vs-103-1-title">Retrieve earlier neighbors</title><desc id="vs-103-1-desc">Each recursive call has its own time boundary. A root-valid edge can still be invalid inside an earlier nested query.</desc><path d="M15,121 L285,121" fill="none" stroke="#597181" stroke-width="2"/><polygon points="285.0,121.0 278.0,124.8 278.0,117.2" fill="#597181"/><circle cx="41" cy="121" r="9" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="41" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">t₁</text><circle cx="96" cy="121" r="9" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="96" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">t₂</text><circle cx="151" cy="121" r="9" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="151" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">t₃</text><circle cx="240" cy="121" r="9" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="240" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">query</text><path d="M204,31 L204,178" fill="none" stroke="#b46519" stroke-width="2" stroke-dasharray="5 4"/><text x="150" y="203" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">history     |     prediction cutoff</text></g><text x="36" y="374" font-size="14" font-weight="650">For query (v,t), only events before t</text><text x="36" y="426" font-size="12">Each recursive call has its own time boundary.</text><text x="36" y="443" font-size="12">A root-valid edge can still be invalid inside</text><text x="36" y="460" font-size="12">an earlier nested query.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Encode time differences</text><g transform="translate(391 133)"><title id="vs-103-2-title">Encode time differences</title><desc id="vs-103-2-desc">Functional time encoding gives attention a representation of relative event time alongside node and edge features.</desc><path d="M25,169 L278,169" fill="none" stroke="#597181" stroke-width="2"/><path d="M25,169 L25,27" fill="none" stroke="#597181" stroke-width="2"/><polyline points="27.0,100.0 29.5,97.5 32.0,95.0 34.4,92.5 36.9,90.1 39.4,87.6 41.9,85.3 44.4,83.0 46.8,80.7 49.3,78.6 51.8,76.5 54.3,74.5 56.8,72.6 59.2,70.8 61.7,69.2 64.2,67.6 66.7,66.2 69.2,64.9 71.6,63.8 74.1,62.8 76.6,62.0 79.1,61.3 81.6,60.7 84.0,60.3 86.5,60.1 89.0,60.0 91.5,60.1 94.0,60.3 96.4,60.7 98.9,61.3 101.4,62.0 103.9,62.8 106.4,63.8 108.8,64.9 111.3,66.2 113.8,67.6 116.3,69.2 118.8,70.8 121.2,72.6 123.7,74.5 126.2,76.5 128.7,78.6 131.2,80.7 133.6,83.0 136.1,85.3 138.6,87.6 141.1,90.1 143.6,92.5 146.0,95.0 148.5,97.5 151.0,100.0 153.5,102.5 156.0,105.0 158.4,107.5 160.9,109.9 163.4,112.4 165.9,114.7 168.4,117.0 170.8,119.3 173.3,121.4 175.8,123.5 178.3,125.5 180.8,127.4 183.2,