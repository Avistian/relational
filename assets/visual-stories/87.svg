<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">SEAL: classify a neighborhood around an edge</title><desc id="desc">The candidate pair defines the graph that the classifier will inspect. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">SEAL: classify a neighborhood around an edge</text><text x="28" y="67" font-size="15">The candidate pair defines the graph that the classifier will inspect.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Mark the candidate pair</text><g transform="translate(36 133)"><title id="vs-87-1-title">Mark the candidate pair</title><desc id="vs-87-1-desc">Extract a local subgraph around the candidate link. The split and target-edge removal rules prevent the candidate from revealing its own label.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><path d="M65,48 L239,48" fill="none" stroke="#b46519" stroke-width="3" stroke-dasharray="5 4"/><text x="150" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">candidate edge</text></g><text x="36" y="374" font-size="14" font-weight="650">Two endpoints + enclosing neighborhood</text><text x="36" y="426" font-size="12">Extract a local subgraph around the candidate</text><text x="36" y="443" font-size="12">link. The split and target-edge removal rules</text><text x="36" y="460" font-size="12">prevent the candidate from revealing its own</text><text x="36" y="477" font-size="12">label.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Label structural positions</text><g transform="translate(391 133)"><title id="vs-87-2-title">Label structural positions</title><desc id="vs-87-2-desc">Endpoint-relative structure distinguishes nodes that identical raw features might otherwise make indistinguishable.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><text x="150" y="207" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">labels refer to the two endpoints</text></g><text x="391" y="374" font-size="14" font-weight="650">Node labels encode position relative</text><text x="391" y="394" font-size="14" font-weight="650">to endpoints</text><text x="391" y="426" font-size="12">Endpoint-relative structure distinguishes</text><text x="391" y="443" font-size="12">nodes that identical raw features might</text><text x="391" y="460" font-size="12">otherwise make indistinguishable.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Predict one link</text><g transform="translate(746 133)"><title id="vs-87-3-title">Predict one link</title><desc id="vs-87-3-desc">A graph classifier summarizes this candidate-specific subgraph. Different candidate links can induce different computations.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><path d="M150,132 L150,181" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="150.0,181.0 146.2,174.0 153.8,174.0" fill="#7660ad"/><rect x="114" y="186" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#7660ad"/><rect x="132" y="186" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#7660ad"/><rect x="150" y="186" width="14" height="24" rx="3" fill="#459eaa" stroke="#7660ad"/><rect x="168" y="186" width="14" height="24" rx="3" fill="#087f8c" stroke="#7660ad"/></g><text x="746" y="374" font-size="14" font-weight="650">GNN → subgraph readout → link score</text><text x="746" y="426" font-size="12">A graph classifier summarizes this candidate-</text><text x="746" y="443" font-size="12">specific subgraph. Different candidate links</text><text x="746" y="460" font-size="12">can induce different computations.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/abs/1802.09691"><text x="28" y="604" font-size="13">Source: https://arxiv.org/abs/1802.09691</text></a></svg>