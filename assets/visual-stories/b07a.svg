<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">HyperFast: write a predictor from a support table</title><desc id="desc">The generated weights are an output of one network and an input to another. Conceptual HyperFast route. Random projection, dimensionality reduction and refinement details remain in the full architecture.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">HyperFast: write a predictor from a support table</text><text x="28" y="67" font-size="15">The generated weights are an output of one network and an input to another.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Summarize labeled support</text><g transform="translate(36 133)"><title id="vs-b07a-1-title">Summarize labeled support</title><desc id="vs-b07a-1-desc">Process the support table to represent the current prediction problem.</desc><text x="83" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">support</text><text x="233" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">query</text><rect x="20" y="40" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="58" y="40" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="40" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="68" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="58" y="68" width="35" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="96" y="68" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="96" width="35" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="58" y="96" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="96" y="96" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="124" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="58" y="124" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="124" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="186" y="76" width="30" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="219" y="76" width="30" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="252" y="76" width="30" height="27" rx="3" fill="#fff" stroke="#b46519"/><text x="267.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><path d="M143,53 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 171.4,88.5 177.0,83.3" fill="#087f8c"/><path d="M143,81 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 171.2,92.8 173.3,85.4" fill="#087f8c"/><path d="M143,109 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 174.4,97.6 171.0,90.7" fill="#087f8c"/><path d="M143,137 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 177.7,98.9 171.7,94.2" fill="#087f8c"/><text x="150" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">observed y → predict unknown y</text></g><text x="36" y="374" font-size="14" font-weight="650">Support features + labels → task</text><text x="36" y="394" font-size="14" font-weight="650">representation</text><text x="36" y="426" font-size="12">Process the support table to represent the</text><text x="36" y="443" font-size="12">current prediction problem.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Generate network weights</text><g transform="translate(391 133)"><title id="vs-b07a-2-title">Generate network weights</title><desc id="vs-b07a-2-desc">A parameter-generating network writes the downstream predictor. This differs from merely storing support tokens for attention.</desc><rect x="70" y="20" width="160" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="150.0" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">θ</text><path d="M150,58 L150,93" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="150.0,93.0 146.2,86.0 153.8,86.0" fill="#7660ad"/><rect x="70" y="103" width="160" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="150.0" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">predictor</text><path d="M150,140 L150,180" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="150.0,180.0 146.2,173.0 153.8,173.0" fill="#087f8c"/><text x="150" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">query prediction</text></g><text x="391" y="374" font-size="14" font-weight="650">Hypernetwork → parameters θ for a</text><text x="391" y="394" font-size="14" font-weight="650">predictor</text><text x="391" y="426" font-size="12">A parameter-generating network writes the</text><text x="391" y="443" font-size="12">downstream predictor. This differs from merely</text><text x="391" y="460" font-size="12">storing support tokens for attention.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Run the generated predictor</text><g transform="translate(746 133)"><title id="vs-b07a-3-title">Run the generated predictor</title><desc id="vs-b07a-3-desc">Queries use the generated predictor, with any declared refinement accounted for separately. Repeated-query cost differs from one-time generation cost.</desc><ci