<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">GraphSAGE: sample, aggregate, combine</title><desc id="desc">A learned neighborhood function can operate on newly encountered nodes. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">GraphSAGE: sample, aggregate, combine</text><text x="28" y="67" font-size="15">A learned neighborhood function can operate on newly encountered nodes.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Sample a neighborhood</text><g transform="translate(36 133)"><title id="vs-83-1-title">Sample a neighborhood</title><desc id="vs-83-1-desc">Sampling determines the computation neighborhood. Multi-hop expansion still needs an explicit fanout budget.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><path d="M239,48 L282,20" fill="none" stroke="#c4d5dc" stroke-width="2" stroke-dasharray="5 4"/><circle cx="282" cy="20" r="7" fill="#fff" stroke="#c4d5dc" stroke-width="2"/><text x="150" y="204" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">sampled computation</text></g><text x="36" y="374" font-size="14" font-weight="650">Bound the neighbors considered at each</text><text x="36" y="394" font-size="14" font-weight="650">hop</text><text x="36" y="426" font-size="12">Sampling determines the computation</text><text x="36" y="443" font-size="12">neighborhood. Multi-hop expansion still needs</text><text x="36" y="460" font-size="12">an explicit fanout budget.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Keep self and neighbors</text><g transform="translate(391 133)"><title id="vs-83-2-title">Keep self and neighbors</title><desc id="vs-83-2-desc">The chosen aggregator summarizes the neighbors. Concatenate this with the node’s own state before the learned update.</desc><rect x="20" y="40" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#b46519"/><rect x="38" y="40" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#b46519"/><rect x="56" y="40" width="14" height="24" rx="3" fill="#459eaa" stroke="#b46519"/><rect x="74" y="40" width="14" height="24" rx="3" fill="#087f8c" stroke="#b46519"/><text x="56" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">self</text><rect x="188" y="40" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="206" y="40" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="224" y="40" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="242" y="40" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><text x="224" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">neighbors</text><path d="M224,72 L224,110" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="224.0,110.0 220.2,103.0 227.8,103.0" fill="#087f8c"/><rect x="174" y="114" width="100" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="224.0" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">aggregate</text><path d="M60,72 L60,168" fill="none" stroke="#b46519" stroke-width="2"/><path d="M60,168 L78,168" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="78.0,168.0 71.0,171.8 71.0,164.2" fill="#b46519"/><path d="M224,149 L178,170" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="178.0,170.0 182.8,163.6 186.0,170.6" fill="#087f8c"/><rect x="80" y="154" width="98" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="129.0" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">concat</text><path d="M129,184 L129,205" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="129.0,205.0 125.2,198.0 132.8,198.0" fill="#7660ad"/><text x="213" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">→ update / head</text></g><text x="391" y="374" font-size="14" font-weight="650">Self state ∥ aggregated neighbor</text><text x="391" y="394" font-size="14" font-weight="650">states</text><text x="391" y="426" font-size="12">The chosen aggregator summarizes the</text><text x="391" y="443" font-size="12">neighbors. Concatenate this with the node’s</text><text x="391" y="460" font-size="12">own state before the learned update.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Reuse the learned rule</text><g transform="translate(746 133)"><title id="vs-83-3-title">Reuse the learned rule</title><desc id="vs-83-3-desc">The model learns an update function, rather than requiring one independent learned embedding for every node identity.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><text x="150" y="207" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">a new node, the same update rule</text></g><text x="746" y="374" font-size="14" font-weight="650">Same weights on a new node’s features</text><text x="746" y="426" font-size="12">The model learns an update function, rather</text><text x="746" y="443" font-size="12">than requiring one independent learned</text><text x="746" y="460" font-size="12">embedding for every node identity.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/1706.02216v4"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/1706.02216v4</text></a></svg>