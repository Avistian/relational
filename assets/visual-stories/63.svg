<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">An SCM prior: sample a world, then observe it</title><desc id="desc">The generator’s causal graph is a way to make training tasks, not a recovered graph of your data. Conceptual SCM prior used to explain the lesson’s synthetic-task generator.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">An SCM prior: sample a world, then observe it</text><text x="28" y="67" font-size="15">The generator’s causal graph is a way to make training tasks, not a recovered graph of your data.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Sample a mechanism graph</text><g transform="translate(36 133)"><title id="vs-63-1-title">Sample a mechanism graph</title><desc id="vs-63-1-desc">Sample a directed acyclic graph and functions or noise variables that determine its values.</desc><path d="M45,45 L143,93" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="143.0,93.0 135.0,93.4 138.4,86.5" fill="#087f8c"/><path d="M45,145 L143,105" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="143.0,105.0 137.9,111.2 135.1,104.1" fill="#087f8c"/><path d="M162,97 L255,145" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="255.0,145.0 247.0,145.2 250.5,138.4" fill="#087f8c"/><path d="M60,145 L252,150" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="252.0,150.0 244.9,153.7 245.1,146.0" fill="#087f8c"/><circle cx="40" cy="40" r="17" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="40" y="45" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">u</text><circle cx="40" cy="150" r="17" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="40" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">x</text><circle cx="155" cy="98" r="17" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="155" y="103" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">z</text><circle cx="267" cy="154" r="17" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="267" y="159" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">y</text><text x="150" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">sample a directed mechanism</text></g><text x="36" y="374" font-size="14" font-weight="650">Directed dependencies + random</text><text x="36" y="394" font-size="14" font-weight="650">mechanisms</text><text x="36" y="426" font-size="12">Sample a directed acyclic graph and functions</text><text x="36" y="443" font-size="12">or noise variables that determine its values.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Generate rows in that world</text><g transform="translate(391 133)"><title id="vs-63-2-title">Generate rows in that world</title><desc id="vs-63-2-desc">Rows from one task share a generating mechanism. Different sampled mechanisms create different tasks for pretraining.</desc><rect x="47" y="12" width="206" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="150.0" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">sample one mechanism</text><path d="M150,51 L150,86" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="150.0,86.0 146.2,79.0 153.8,79.0" fill="#7660ad"/><rect x="68" y="98" width="40" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="111" y="98" width="40" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="154" y="98" width="40" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="197" y="98" width="40" height="22" rx="3" fill="#fff0de" stroke="#fff"/><rect x="68" y="123" width="40" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="111" y="123" width="40" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="154" y="123" width="40" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="197" y="123" width="40" height="22" rx="3" fill="#fff0de" stroke="#fff"/><rect x="68" y="148" width="40" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="111" y="148" width="40" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="154" y="148" width="40" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="197" y="148" width="40" height="22" rx="3" fill="#fff" stroke="#b46519"/><text x="217.0" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><text x="150" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">generate observations in that world</text></g><text x="391" y="374" font-size="14" font-weight="650">One sampled mechanism → many</text><text x="391" y="394" font-size="14" font-weight="650">observations</text><text x="391" y="426" font-size="12">Rows from one task share a generating</text><text x="391" y="443" font-size="12">mechanism. Different sampled mechanisms create</text><text x="391" y="460" font-size="12">different tasks for pretraining.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="13" font-weight="650">3. Choose observed and target variables</text><g transform="translate(746 133)"><title id="vs-63-3-title">Choose observed and target variables</title><desc id="vs-63-3-desc">The model sees only the admitted variables. Predictive success under this task distribution does not identify the real-world causal graph.</desc><rect x="40" y="25" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="85" y="25" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="25" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="175" y="25" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="220" y="25" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="55" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="85" y="55" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="55" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="175" y="55" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="220" y="55" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="85" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="85" y="85" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="130" y="85" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="175" y="85" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="220" y="85" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="115" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="85" y="115" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="115" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="175" y="115" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="220" y="115" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="145" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="85" y="145" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="145" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="175" y="145" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="220" y="145" width="42" height="27" rx="3" fill="#fff" stroke="#b46519"/><text x="241.0" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><text x="150" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">rows × columns; target hidden</text></g><text x="746" y="374" font-size="14" font-weight="650">Visible features + hidden target →</text><text x="746" y="394" font-size="14" font-weight="650">episode</text><text x="746" y="426" font-size="12">The model sees only the admitted variables.</text><text x="746" y="443" font-size="12">Predictive success under this task</text><text x="746" y="460" font-size="12">distribution does not identify the real-world</text><text x="746" y="477" font-size="12">causal graph.</text><text x="28" y="548" font-size="13">Conceptual SCM prior used to explain the lesson’s synthetic-task generator.</text><a href="https://arxiv.org/html/2207.01848v6#S2"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2207.01848v6#S2</text></a></svg>