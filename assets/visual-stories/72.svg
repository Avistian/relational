<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">SCARF and SubTab: preserve row identity across views</title><desc id="desc">The common idea is agreement; the view construction and objectives differ. Comparison of two view constructions, not a serial pipeline from SCARF into SubTab. SubTab source: arXiv:2110.04361.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">SCARF and SubTab: preserve row identity across views</text><text x="28" y="67" font-size="15">The common idea is agreement; the view construction and objectives differ.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. SCARF: replace cells</text><g transform="translate(36 133)"><title id="vs-72-1-title">SCARF: replace cells</title><desc id="vs-72-1-desc">SCARF pairs a clean row with a corrupted view. Both pass through the same encoder and projector.</desc><text x="72" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#087f8c">clean</text><text x="226" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#b46519">view</text><rect x="14" y="50" width="34" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="51" y="50" width="34" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="14" y="78" width="34" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="51" y="78" width="34" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="14" y="106" width="34" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="51" y="106" width="34" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="14" y="134" width="34" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="51" y="134" width="34" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="199" y="50" width="34" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="236" y="50" width="34" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="199" y="78" width="34" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="236" y="78" width="34" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="199" y="106" width="34" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="236" y="106" width="34" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="199" y="134" width="34" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="236" y="134" width="34" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="199" y="78" width="34" height="25" rx="3" fill="#edc79f" stroke="#b46519"/><rect x="236" y="134" width="34" height="25" rx="3" fill="#edc79f" stroke="#b46519"/><path d="M103,106 L184,106" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="184.0,106.0 177.0,109.8 177.0,102.2" fill="#087f8c"/><text x="150" y="197" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">same row; some values replaced</text></g><text x="36" y="374" font-size="14" font-weight="650">Clean row ↔ marginally corrupted row</text><text x="36" y="426" font-size="12">SCARF pairs a clean row with a corrupted view.</text><text x="36" y="443" font-size="12">Both pass through the same encoder and</text><text x="36" y="460" font-size="12">projector.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. SubTab: select columns</text><g transform="translate(391 133)"><title id="vs-72-2-title">SubTab: select columns</title><desc id="vs-72-2-desc">SubTab constructs several views from subsets of columns and combines reconstruction with configured representation objectives.</desc><rect x="52" y="26" width="36" height="26" rx="3" fill="#d8eef0" s