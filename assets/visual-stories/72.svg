nt-size="14" font-weight="650">row</text><text x="391" y="426" font-size="12">SubTab constructs several views from subsets</text><text x="391" y="443" font-size="12">of columns and combines reconstruction with</text><text x="391" y="460" font-size="12">configured representation objectives.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Transfer the encoder</text><g transform="translate(746 133)"><title id="vs-72-3-title">Transfer the encoder</title><desc id="vs-72-3-desc">Contrastive similarities identify same-row pairs. Downstream use retains the learned representation route, not necessarily the pretraining projector.</desc><rect x="64" y="24" width="35" height="31" rx="3" fill="#087f8c" stroke="none"/><rect x="104" y="24" width="35" height="31" rx="3" fill="#e5eff2" stroke="none"/><rect x="144" y="24" width="35" height="31" rx="3" fill="#e5eff2" stroke="none"/><rect x="184" y="24" width="35" height="31" rx="3" fill="#e5eff2" stroke="none"/><rect x="64" y="60" width="35" height="31" rx="3" fill="#e5eff2" stroke="none"/><rect x="104" y="60" width="35" height="31" rx="3" fill="#087f8c" stroke="none"/><rect x="144" y="60" width="35" height="31" rx="3" fill="#e5eff2" stroke="none"/><rect x="184" y="60" width="35" height="31" rx="3" fill="#e5eff2" stroke="none"/><rect x="64" y="96" width="35" height="31" rx="3" fill="#e5eff2" stroke="none"/><rect x="104" y="96" width="35" height="31" rx="3" fill="#e5eff2" stroke="none"/><rect x="144" y="96" width="35" height="31" rx="3" fill="#087f8c" stroke="none"/><rect x="184" y="96" width="35" height="31" rx="3" fill="#e5eff2" stroke="none"/><rect x="64" y="132" width="35" height="31" rx="3" fill="#e5eff2" stroke="none"/><rect x="104" y="132" width="35" height="31" rx="3" fill="#e5eff2" stroke="none"/><rect x="144" y="132" width="35" height="31" rx="3" fill="#e5eff2" stroke="none"/><rect x="184" y="132" width="35" height="31" rx="3" fill="#087f8c" stroke="none"/><text x="150" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">diagonal = matching row identity</text></g><text x="746" y="374" font-size="14" font-weight="650">Match views by row identity, then fit</text><text x="746" y="394" font-size="14" font-weight="650">the task</text><text x="746" y="426" font-size="12">Contrastive similarities identify same-row</text><text x="746" y="443" font-size="12">pairs. Downstream use retains the learned</text><text x="746" y="460" font-size="12">representation route, not necessarily the</text><text x="746" y="477" font-size="12">pretraining projector.</text><text x="28" y="548" font-size="13">Comparison of two view constructions, not a serial pipeline from SCARF into SubTab. SubTab source: arXiv:2110.04361.</text><a href="https://arxiv.org/html/2106.15147v2#S3"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2106.15147v2#S3</text></a></svg>