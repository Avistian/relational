<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">VIME: learn what was changed</title><desc id="desc">One corrupted row creates two complementary pretraining targets. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">VIME: learn what was changed</text><text x="28" y="67" font-size="15">One corrupted row creates two complementary pretraining targets.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Corrupt some cells</text><g transform="translate(36 133)"><title id="vs-71-1-title">Corrupt some cells</title><desc id="vs-71-1-desc">Replace selected cells using donor values. Preserve both the clean values and the corruption information for the pretext task.</desc><text x="72" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#087f8c">clean</text><text x="226" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#b46519">view</text><rect x="14" y="50" width="34" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="51" y="50" width="34" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="14" y="78" width="34" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="51" y="78" width="34" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="14" y="106" width="34" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="51" y="106" width="34" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="14" y="134" width="34" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="51" y="134" width="34" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="199" y="50" width="34" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="236" y="50" width="34" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="199" y="78" width="34" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="236" y="78" width="34" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="199" y="106" width="34" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="236" y="106" width="34" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="199" y="134" width="34" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="236" y="134" width="34" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="199" y="78" width="34" height="25" rx="3" fill="#edc79f" stroke="#b46519"/><rect x="236" y="134" width="34" height="25" rx="3" fill="#edc79f" stroke="#b46519"/><path d="M103,106 L184,106" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="184.0,106.0 177.0,109.8 177.0,102.2" fill="#087f8c"/><text x="150" y="197" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">same row; some values replaced</text></g><text x="36" y="374" font-size="14" font-weight="650">Clean row + donor values → changed row</text><text x="36" y="426" font-size="12">Replace selected cells using donor values.</text><text x="36" y="443" font-size="12">Preserve both the clean values and the</text><text x="36" y="460" font-size="12">corruption information for the pretext task.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Share an encoder</text><g transform="translate(391 133)"><title id="vs-71-2-title">Share an encoder</title><desc id="vs-71-2-desc">One head predicts which cells changed; another reconstructs values. Both losses train the encoder.</desc><rect x="116" y="23" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="134" y="23" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="152" y="23" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="170" y="23" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><text x="152" y="15" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">shared input</text><path d="M145,57 L74,100" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="74.0,100.0 78.0,93.1 82.0,99.6" fill="#087f8c"/><path d="M157,57 L228,100" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="228.0,100.0 220.0,99.6 224.0,93.1" fill="#7660ad"/><rect x="14" y="111" width="113" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="70.5" y="131" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">mask</text><rect x="173" y="111" width="113" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="229.5" y="131" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">values</text><text x="150" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">two distinct routes</text></g><text x="391" y="374" font-size="14" font-weight="650">Hidden state → mask head AND value</text><text x="391" y="394" font-size="14" font-weight="650">head</text><text x="391" y="426" font-size="12">One head predicts which cells changed; another</text><text x="391" y="443" font-size="12">reconstructs values. Both losses train the</text><text x="391" y="460" font-size="12">encoder.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Reuse the representation</text><g transform="translate(746 133)"><title id="vs-71-3-title">Reuse the representation</title><desc id="vs-71-3-desc">The pretext heads are not the downstream predictor. The released route and the lesson specify how the encoder and task head are trained or frozen.</desc><rect x="70" y="20" width="160" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="150.0" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">pretrain</text><path d="M150,58 L150,93" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="150.0,93.0 146.2,86.0 153.8,86.0" fill="#7660ad"/><rect x="70" y="103" width="160" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="150.0" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">task head</text><path d="M150,140 L150,180" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="150.0,180.0 146.2,173.0 153.8,173.0" fill="#087f8c"/><text x="150" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">query prediction</text></g><text x="746" y="374" font-size="14" font-weight="650">Retained encoder → supervised task</text><text x="746" y="394" font-size="14" font-weight="650">head</text><text x="746" y="426" font-size="12">The pretext heads are not the downstream</text><text x="746" y="443" font-size="12">predictor. The released route and the lesson</text><text x="746" y="460" font-size="12">specify how the encoder and task head are</text><text x="746" y="477" font-size="12">trained or frozen.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://proceedings.neurips.cc/paper/2020/hash/7d97667a3e056acab9aaf653807b4a03-Abstract.html"><text x="28" y="604" font-size="13">Source: https://proceedings.neurips.cc/paper/2020/hash/7d97667a3e056acab9aaf653807b4a03-Abstract.html</text></a></svg>