<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">CARTE: turn a row into a small graph</title><desc id="desc">Column names become relations; values become the neighboring content. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">CARTE: turn a row into a small graph</text><text x="28" y="67" font-size="15">Column names become relations; values become the neighboring content.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Build a star for one row</text><g transform="translate(36 133)"><title id="vs-74-1-title">Build a star for one row</title><desc id="vs-74-1-desc">A schema-flexible representation connects a row center to its cells. Encodings of column names describe the edges.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><text x="150" y="203" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">column names label the edges</text></g><text x="36" y="374" font-size="14" font-weight="650">Center = row; leaves = cell values</text><text x="36" y="426" font-size="12">A schema-flexible representation connects a</text><text x="36" y="443" font-size="12">row center to its cells. Encodings of column</text><text x="36" y="460" font-size="12">names describe the edges.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Condition the messages</text><g transform="translate(391 133)"><title id="vs-74-2-title">Condition the messages</title><desc id="vs-74-2-desc">The edge representation changes the message before attention aggregates it at the center. The names affect computation, not just display labels.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#7660ad" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#7660ad" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><text x="102" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">r₁</text><text x="203" y="149" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#7660ad">r₂</text><text x="150" y="203" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">column names label the edges</text><rect x="87" y="5" width="130" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="152.0" y="25" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">value ⊙ relation</text></g><text x="391" y="374" font-size="14" font-weight="650">Value vector ⊙ column-name vector</text><text x="391" y="426" font-size="12">The edge representation changes the message</text><text x="391" y="443" font-size="12">before attention aggregates it at the center.</text><text x="391" y="460" font-size="12">The names affect computation, not just display</text><text x="391" y="477" font-size="12">labels.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Read the row center</text><g transform="translate(746 133)"><title id="vs-74-3-title">Read the row center</title><desc id="vs-74-3-desc">Reuse learned graph computation and fit the chosen downstream head. The local route need not reproduce the full pretraining stack.</desc><rect x="70" y="20" width="160" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="150.0" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">pretrain</text><path d="M150,58 L150,93" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="150.0,93.0 146.2,86.0 153.8,86.0" fill="#7660ad"/><rect x="70" y="103" width="160" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="150.0" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">task head</text><path d="M150,140 L150,180" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="150.0,180.0 146.2,173.0 153.8,173.0" fill="#087f8c"/><text x="150" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">query prediction</text></g><text x="746" y="374" font-size="14" font-weight="650">Pretrained encoder → task-specific</text><text x="746" y="394" font-size="14" font-weight="650">prediction</text><text x="746" y="426" font-size="12">Reuse learned graph computation and fit the</text><text x="746" y="443" font-size="12">chosen downstream head. The local route need</text><text x="746" y="460" font-size="12">not reproduce the full pretraining stack.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/2402.16785v2#S3.SS3"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2402.16785v2#S3.SS3</text></a></svg>