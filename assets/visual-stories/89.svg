<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">Cluster-GCN: batch a connected piece of the graph</title><desc id="desc">The partition changes the sampled computation, not the GCN update rule. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">Cluster-GCN: batch a connected piece of the graph</text><text x="28" y="67" font-size="15">The partition changes the sampled computation, not the GCN update rule.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Partition the graph</text><g transform="translate(36 133)"><title id="vs-89-1-title">Partition the graph</title><desc id="vs-89-1-desc">A graph partitioner groups connected nodes so that sampled blocks retain many useful internal edges.</desc><circle cx="57" cy="65" r="41" fill="#f5f7fa" stroke="#c4d5dc" stroke-width="2"/><circle cx="40" cy="75" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="74" cy="75" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="57" cy="48" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><path d="M40,75 L57,48" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M57,48 L74,75" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="203" cy="65" r="41" fill="#f5f7fa" stroke="#c4d5dc" stroke-width="2"/><circle cx="186" cy="75" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="220" cy="75" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="203" cy="48" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><path d="M186,75 L203,48" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M203,48 L220,75" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="130" cy="155" r="41" fill="#f5f7fa" stroke="#c4d5dc" stroke-width="2"/><circle cx="113" cy="165" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="147" cy="165" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="130" cy="138" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><path d="M113,165 L130,138" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M130,138 L147,165" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M91,75 L169,75" fill="none" stroke="#c4d5dc" stroke-width="2" stroke-dasharray="5 4"/><path d="M77,101 L111,122" fill="none" stroke="#c4d5dc" stroke-width="2" stroke-dasharray="5 4"/><text x="150" y="217" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#597181">sample groups, retain internal edges</text></g><text x="36" y="374" font-size="14" font-weight="650">Dense connections stay mostly inside</text><text x="36" y="394" font-size="14" font-weight="650">groups</text><text x="36" y="426" font-size="12">A graph partitioner groups connected nodes so</text><text x="36" y="443" font-size="12">that sampled blocks retain many useful</text><text x="36" y="460" font-size="12">internal edges.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Choose clusters for a batch</text><g transform="translate(391 133)"><title id="vs-89-2-title">Choose clusters for a batch</title><desc id="vs-89-2-desc">Train on the graph induced by selected clusters. Edges outside that batch are absent from its computation.</desc><circle cx="57" cy="65" r="41" fill="#f5f7fa" stroke="#c4d5dc" stroke-width="2"/><circle cx="40" cy="75" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="74" cy="75" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="57" cy="48" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><path d="M40,75 L57,48" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M57,48 L74,75" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="203" cy="65" r="41" fill="#f5f7fa" stroke="#b46519" stroke-width="2"/><circle cx="186" cy="75" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="220" cy="75" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="203" cy="48" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><path d="M186,75 L203,48" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M203,48 L220,75" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="130" cy="155" r="41" fill="#f5f7fa" stroke="#c4d5dc" stroke-width="2"/><circle cx="113" cy="165" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="147" cy="165" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="130" cy="138" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><path d="M113,165 L130,138" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M130,138 L147,165" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M91,75 L169,75" fill="none" stroke="#c4d5dc" stroke-width="2" stroke-dasharray="5 4"/><path d="M77,101 L111,122" fill="none" stroke="#c4d5dc" stroke-width="2" stroke-dasharray="5 4"/><text x="150" y="217" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#597181">sample groups, retain internal edges</text></g><text x="391" y="374" font-size="14" font-weight="650">Selected groups → induced batch graph</text><text x="391" y="426" font-size="12">Train on the graph induced by selected</text><text x="391" y="443" font-size="12">clusters. Edges outside that batch are absent</text><text x="391" y="460" font-size="12">from its computation.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Run the GCN on that batch</text><g transform="translate(746 133)"><title id="vs-89-3-title">Run the GCN on that batch</title><desc id="vs-89-3-desc">The local GCN forward/backward pass uses the batch graph. Sampling and normalization choices still belong to the experiment contract.</desc><rect x="13" y="51" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="38" y="51" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="63" y="51" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="13" y="76" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="38" y="76" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="63" y="76" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="13" y="101" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="38" y="101" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="63" y="101" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><text x="43" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#b46519">S</text><rect x="112" y="51" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="137" y="51" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="162" y="51" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="112" y="76" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="137" y="76" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="162" y="76" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="112" y="101" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="137" y="101" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="162" y="101" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><text x="142" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#087f8c">H</text><rect x="211" y="51" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="236" y="51" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="211" y="76" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="236" y="76" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="211" y="101" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="236" y="101" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><text x="241" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#7660ad">W</text><text x="150" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">node mixing × states × feature map</text></g><text x="746" y="374" font-size="14" font-weight="650">Standard graph convolution, bounded</text><text x="746" y="394" font-size="14" font-weight="650">working set</text><text x="746" y="426" font-size="12">The local GCN forward/backward pass uses the</text><text x="746" y="443" font-size="12">batch graph. Sampling and normalization</text><text x="746" y="460" font-size="12">choices still belong to the experiment</text><text x="746" y="477" font-size="12">contract.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/1905.07953v2#S3"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/1905.07953v2#S3</text></a></svg>