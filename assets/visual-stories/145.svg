<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">RelGT: make a relational neighborhood into tokens</title><desc id="desc">A token needs both its content and its place in the relational context. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">RelGT: make a relational neighborhood into tokens</text><text x="28" y="67" font-size="15">A token needs both its content and its place in the relational context.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Sample around the target</text><g transform="translate(36 133)"><title id="vs-145-1-title">Sample around the target</title><desc id="vs-145-1-desc">The local relational neighborhood defines the input set. Temporal and ownership rules determine which records are eligible.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">q</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text></g><text x="36" y="374" font-size="14" font-weight="650">Target entity + typed, time-valid</text><text x="36" y="394" font-size="14" font-weight="650">neighbors</text><text x="36" y="426" font-size="12">The local relational neighborhood defines the</text><text x="36" y="443" font-size="12">input set. Temporal and ownership rules</text><text x="36" y="460" font-size="12">determine which records are eligible.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Encode relational position</text><g transform="translate(391 133)"><title id="vs-145-2-title">Encode relational position</title><desc id="vs-145-2-desc">Token encodings preserve the structural roles that a plain unordered collection of row vectors would omit.</desc><rect x="25" y="23" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="43" y="23" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="61" y="23" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><path d="M90,35 L159,35" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="159.0,35.0 152.0,38.8 152.0,31.2" fill="#087f8c"/><rect x="178" y="23" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="196" y="23" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="214" y="23" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="232" y="23" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><rect x="25" y="62" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="43" y="62" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="61" y="62" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><path d="M90,74 L159,74" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="159.0,74.0 152.0,77.8 152.0,70.2" fill="#7660ad"/><rect x="178" y="62" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="196" y="62" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="214" y="62" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="232" y="62" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><rect x="25" y="101" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="43" y="101" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="61" y="101" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><path d="M90,113 L159,113" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="159.0,113.0 152.0,116.8 152.0,109.2" fill="#b46519"/><rect x="178" y="101" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="196" y="101" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="214" y="101" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="232" y="101" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><rect x="25" y="140" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="43" y="140" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="61" y="140" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><path d="M90,152 L159,152" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="159.0,152.0 152.0,155.8 152.0,148.2" fill="#087f8c"/><rect x="178" y="140" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="196" y="140" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="214" y="140" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="232" y="140" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><text x="150" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#597181">content + type + hop + time + PE</text></g><text x="391" y="374" font-size="14" font-weight="650">Content + type + position/time</text><text x="391" y="394" font-size="14" font-weight="650">information</text><text x="391" y="426" font-size="12">Token encodings preserve the structural roles</text><text x="391" y="443" font-size="12">that a plain unordered collection of row</text><text x="391" y="460" font-size="12">vectors would omit.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Mix local and global context</text><g transform="translate(746 133)"><title id="vs-145-3-title">Mix local and global context</title><desc id="vs-145-3-desc">The local module mixes the sampled tokens. A global module reads learned centroid context; the task representation combines these routes before prediction.</desc><rect x="18" y="38" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="36" y="38" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="54" y="38" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><circle cx="240" cy="50" r="13" fill="#eee9fa" stroke="#7660ad" stroke-width="2"/><path d="M80,50 L225,50" fill="none" stroke="#7660ad" stroke-width="1"/><path d="M80,50 L225,99" fill="none" stroke="#7660ad" stroke-width="1"/><path d="M80,50 L225,148" fill="none" stroke="#7660ad" stroke-width="1"/><rect x="18" y="87" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="36" y="87" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="54" y="87" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><circle cx="240" cy="99" r="13" fill="#eee9fa" stroke="#7660ad" stroke-width="2"/><path d="M80,99 L225,50" fill="none" stroke="#7660ad" stroke-width="1"/><path d="M80,99 L225,99" fill="none" stroke="#7660ad" stroke-width="1"/><path d="M80,99 L225,148" fill="none" stroke="#7660ad" stroke-width="1"/><rect x="18" y="136" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="36" y="136" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="54" y="136" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><circle cx="240" cy="148" r="13" fill="#eee9fa" stroke="#7660ad" stroke-width="2"/><path d="M80,148 L225,50" fill="none" stroke="#7660ad" stroke-width="1"/><path d="M80,148 L225,99" fill="none" stroke="#7660ad" stroke-width="1"/><path d="M80,148 L225,148" fill="none" stroke="#7660ad" stroke-width="1"/><text x="60" y="202" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">local tokens</text><text x="236" y="202" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#7660ad">centroids</text></g><text x="746" y="374" font-size="14" font-weight="650">Local token attention + global</text><text x="746" y="394" font-size="14" font-weight="650">centroid attention</text><text x="746" y="426" font-size="12">The local module mixes the sampled tokens. A</text><text x="746" y="443" font-size="12">global module reads learned centroid context;</text><text x="746" y="460" font-size="12">the task representation combines these routes</text><text x="746" y="477" font-size="12">before prediction.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/2505.10960v1#S3"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2505.10960v1#S3</text></a></svg>