<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">Message passing: the graph routes the computation</title><desc id="desc">Track one node’s neighbors instead of imagining one dense layer over all nodes. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">Message passing: the graph routes the computation</text><text x="28" y="67" font-size="15">Track one node’s neighbors instead of imagining one dense layer over all nodes.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Choose incoming neighbors</text><g transform="translate(36 133)"><title id="vs-81-1-title">Choose incoming neighbors</title><desc id="vs-81-1-desc">Each node has a hidden state. For this update, the graph chooses which neighbor states and edge attributes are available.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text></g><text x="36" y="374" font-size="14" font-weight="650">Edges define who can send to the</text><text x="36" y="394" font-size="14" font-weight="650">center</text><text x="36" y="426" font-size="12">Each node has a hidden state. For this update,</text><text x="36" y="443" font-size="12">the graph chooses which neighbor states and</text><text x="36" y="460" font-size="12">edge attributes are available.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Build and reduce messages</text><g transform="translate(391 133)"><title id="vs-81-2-title">Build and reduce messages</title><desc id="vs-81-2-desc">Apply a message function on each incoming edge, then combine messages without depending on their arbitrary storage order.</desc><rect x="20" y="40" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#b46519"/><rect x="38" y="40" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#b46519"/><rect x="56" y="40" width="14" height="24" rx="3" fill="#459eaa" stroke="#b46519"/><rect x="74" y="40" width="14" height="24" rx="3" fill="#087f8c" stroke="#b46519"/><text x="56" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">self</text><rect x="188" y="40" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="206" y="40" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="224" y="40" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="242" y="40" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><text x="224" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">neighbors</text><path d="M224,72 L224,110" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="224.0,110.0 220.2,103.0 227.8,103.0" fill="#087f8c"/><rect x="174" y="114" width="100" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="224.0" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">Σ</text><path d="M60,72 L60,168" fill="none" stroke="#b46519" stroke-width="2"/><path d="M60,168 L78,168" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="78.0,168.0 71.0,171.8 71.0,164.2" fill="#b46519"/><path d="M224,149 L178,170" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="178.0,170.0 182.8,163.6 186.0,170.6" fill="#087f8c"/><rect x="80" y="154" width="98" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="129.0" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">+</text><path d="M129,184 L129,205" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="129.0,205.0 125.2,198.0 132.8,198.0" fill="#7660ad"/><text x="213" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">→ update / head</text></g><text x="391" y="374" font-size="14" font-weight="650">Messages → permutation-invariant</text><text x="391" y="394" font-size="14" font-weight="650">reduction</text><text x="391" y="426" font-size="12">Apply a message function on each incoming</text><text x="391" y="443" font-size="12">edge, then combine messages without depending</text><text x="391" y="460" font-size="12">on their arbitrary storage order.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Update, repeat, read out</text><g transform="translate(746 133)"><title id="vs-81-3-title">Update, repeat, read out</title><desc id="vs-81-3-desc">An update function creates the next state. Repeated rounds expand the receptive field; the task chooses a node, edge or graph readout.</desc><rect x="6" y="73" width="110" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="61.0" y="93" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">state t</text><path d="M124,88 L169,88" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="169.0,88.0 162.0,91.8 162.0,84.2" fill="#7660ad"/><rect x="179" y="73" width="115" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="236.5" y="93" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">state t+1</text><path d="M233,113 L233,158 L62,158 L62,109" fill="none" stroke="#b46519" stroke-width="2"/><text x="150" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">state reused by later computation</text></g><text x="746" y="374" font-size="14" font-weight="650">Old state + aggregate → new state</text><text x="746" y="426" font-size="12">An update function creates the next state.</text><text x="746" y="443" font-size="12">Repeated rounds expand the receptive field;</text><text x="746" y="460" font-size="12">the task chooses a node, edge or graph</text><text x="746" y="477" font-size="12">readout.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://proceedings.mlr.press/v70/gilmer17a.html"><text x="28" y="604" font-size="13">Source: https://proceedings.mlr.press/v70/gilmer17a.html</text></a></svg>