<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">TabDPT: a real table becomes a prediction task</title><desc id="desc">The chosen target column changes what retrieval is permitted to see. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">TabDPT: a real table becomes a prediction task</text><text x="28" y="67" font-size="15">The chosen target column changes what retrieval is permitted to see.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Choose a target column</text><g transform="translate(36 133)"><title id="vs-b05-1-title">Choose a target column</title><desc id="vs-b05-1-desc">Construct episodes from real tables by choosing a target. Prevent that target from entering the features used to retrieve neighbors.</desc><rect x="40" y="25" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="85" y="25" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="25" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="175" y="25" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="220" y="25" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="55" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="85" y="55" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="55" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="175" y="55" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="220" y="55" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="85" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="85" y="85" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="130" y="85" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="175" y="85" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="220" y="85" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="115" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="85" y="115" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="115" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="175" y="115" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="220" y="115" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="145" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="85" y="145" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="145" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="175" y="145" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="220" y="145" width="42" height="27" rx="3" fill="#fff" stroke="#b46519"/><text x="241.0" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><text x="150" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">rows × columns; target hidden</text></g><text x="36" y="374" font-size="14" font-weight="650">Real table → features and prediction</text><text x="36" y="394" font-size="14" font-weight="650">target</text><text x="36" y="426" font-size="12">Construct episodes from real tables by</text><text x="36" y="443" font-size="12">choosing a target. Prevent that target from</text><text x="36" y="460" font-size="12">entering the features used to retrieve</text><text x="36" y="477" font-size="12">neighbors.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Retrieve a local episode</text><g transform="translate(391 133)"><title id="vs-b05-2-title">Retrieve a local episode</title><desc id="vs-b05-2-desc">The neighborhood supplies labeled context. Retrieval is an information-selection step, not an exemption from leakage rules.</desc><circle cx="45" cy="65" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="69" cy="116" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="130" cy="58" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="138" cy="140" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="237" cy="45" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="230" cy="145" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="196" cy="92" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="109" cy="102" r="13" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="109" y="107" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#b46519">q</text><ellipse cx="108" cy="103" rx="64" ry="56" fill="none" stroke="#087f8c" stroke-dasharray="5 4"/><path d="M115,94 L130,64" fill="none" stroke="#b46519" stroke-width="2"/><path d="M98,108 L73,115" fill="none" stroke="#b46519" stroke-width="2"/><path d="M117,113 L135,135" fill="none" stroke="#b46519" stroke-width="2"/><text x="150" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">near in learned feature space</text></g><text x="391" y="374" font-size="14" font-weight="650">Feature-only neighborhood → support +</text><text x="391" y="394" font-size="14" font-weight="650">queries</text><text x="391" y="426" font-size="12">The neighborhood supplies labeled context.</text><text x="391" y="443" font-size="12">Retrieval is an information-selection step,</text><text x="391" y="460" font-size="12">not an exemption from leakage rules.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Learn across episodes</text><g transform="translate(746 133)"><title id="vs-b05-3-title">Learn across episodes</title><desc id="vs-b05-3-desc">Train on episodes and use context for prediction. The lesson separates released inference evidence from historical pretraining identity.</desc><text x="83" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">support</text><text x="233" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">query</text><rect x="20" y="40" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="58" y="40" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="40" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="68" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="58" y="68" width="35" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="96" y="68" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="96" width="35" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="58" y="96" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="96" y="96" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="124" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="58" y="124" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="124" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="186" y="76" width="30" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="219" y="76" width="30" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="252" y="76" width="30" height="27" rx="3" fill="#fff" stroke="#b46519"/><text x="267.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><path d="M143,53 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 171.4,88.5 177.0,83.3" fill="#087f8c"/><path d="M143,81 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 171.2,92.8 173.3,85.4" fill="#087f8c"/><path d="M143,109 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 174.4,97.6 171.0,90.7" fill="#087f8c"/><path d="M143,137 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 177.7,98.9 171.7,94.2" fill="#087f8c"/><text x="150" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">observed y → predict unknown y</text></g><text x="746" y="374" font-size="14" font-weight="650">Shared transformer → query predictions</text><text x="746" y="426" font-size="12">Train on episodes and use context for</text><text x="746" y="443" font-size="12">prediction. The lesson separates released</text><text x="746" y="460" font-size="12">inference evidence from historical pretraining</text><text x="746" y="477" font-size="12">identity.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/2410.18164v3#S3"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2410.18164v3#S3</text></a></svg>