<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">PFN generations: separate pretraining from task context</title><desc id="desc">Separate learning shared weights from conditioning those weights on a new table. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">PFN generations: separate pretraining from task context</text><text x="28" y="67" font-size="15">Separate learning shared weights from conditioning those weights on a new table.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Generate a task</text><g transform="translate(36 133)"><title id="vs-b03-1-title">Generate a task</title><desc id="vs-b03-1-desc">A task prior produces a dataset. Split its rows into observed support and targets whose labels will be predicted.</desc><rect x="47" y="12" width="206" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="150.0" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">sample one mechanism</text><path d="M150,51 L150,86" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="150.0,86.0 146.2,79.0 153.8,79.0" fill="#7660ad"/><rect x="68" y="98" width="40" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="111" y="98" width="40" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="154" y="98" width="40" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="197" y="98" width="40" height="22" rx="3" fill="#fff0de" stroke="#fff"/><rect x="68" y="123" width="40" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="111" y="123" width="40" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="154" y="123" width="40" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="197" y="123" width="40" height="22" rx="3" fill="#fff0de" stroke="#fff"/><rect x="68" y="148" width="40" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="111" y="148" width="40" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="154" y="148" width="40" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="197" y="148" width="40" height="22" rx="3" fill="#fff" stroke="#b46519"/><text x="217.0" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><text x="150" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">generate observations in that world</text></g><text x="36" y="374" font-size="14" font-weight="650">Sample a function, then its labeled</text><text x="36" y="394" font-size="14" font-weight="650">rows</text><text x="36" y="426" font-size="12">A task prior produces a dataset. Split its</text><text x="36" y="443" font-size="12">rows into observed support and targets whose</text><text x="36" y="460" font-size="12">labels will be predicted.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Learn across tasks</text><g transform="translate(391 133)"><title id="vs-b03-2-title">Learn across tasks</title><desc id="vs-b03-2-desc">During pretraining, query-label loss updates one network across sampled tasks. The network learns how support relates to query predictions.</desc><rect x="17" y="30" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="42" y="30" width="22" height="21" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="67" y="30" width="22" height="21" rx="3" fill="#fff0de" stroke="#fff"/><rect x="17" y="54" width="22" height="21" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="42" y="54" width="22" height="21" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="67" y="54" width="22" height="21" rx="3" fill="#fff0de" stroke="#fff"/><rect x="17" y="78" width="22" height="21" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="42" y="78" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="67" y="78" width="22" height="21" rx="3" fill="#fff" stroke="#b46519"/><text x="78.0" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><path d="M49,121 L49,150" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="49.0,150.0 45.2,143.0 52.8,143.0" fill="#087f8c"/><rect x="111" y="52" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="136" y="52" width="22" height="21" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="161" y="52" width="22" height="21" rx="3" fill="#fff0de" stroke="#fff"/><rect x="111" y="76" width="22" height="21" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="136" y="76" width="22" height="21" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="161" y="76" width="22" height="21" rx="3" fill="#fff0de" stroke="#fff"/><rect x="111" y="100" width="22" height="21" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="136" y="100" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="161" y="100" width="22" height="21" rx="3" fill="#fff" stroke="#b46519"/><text x="172.0" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><path d="M143,121 L143,150" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="143.0,150.0 139.2,143.0 146.8,143.0" fill="#7660ad"/><rect x="205" y="30" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="230" y="30" width="22" height="21" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="255" y="30" width="22" height="21" rx="3" fill="#fff0de" stroke="#fff"/><rect x="205" y="54" width="22" height="21" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="230" y="54" width="22" height="21" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="255" y="54" width="22" height="21" rx="3" fill="#fff0de" stroke="#fff"/><rect x="205" y="78" width="22" height="21" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="230" y="78" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="255" y="78" width="22" height="21" rx="3" fill="#fff" stroke="#b46519"/><text x="266.0" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><path d="M237,121 L237,150" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="237.0,150.0 233.2,143.0 240.8,143.0" fill="#b46519"/><rect x="58" y="163" width="184" height="35" rx="6" fill="#f0edf8" stroke="#7660ad"/><text x="150" y="186" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="650" fill="#7660ad">shared learner</text></g><text x="391" y="374" font-size="14" font-weight="650">Many tasks → shared predictive weights</text><text x="391" y="426" font-size="12">During pretraining, query-label loss updates</text><text x="391" y="443" font-size="12">one network across sampled tasks. The network</text><text x="391" y="460" font-size="12">learns how support relates to query</text><text x="391" y="477" font-size="12">predictions.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Condition on a new table</text><g transform="translate(746 133)"><title id="vs-b03-3-title">Condition on a new table</title><desc id="vs-b03-3-desc">In the basic PFN use case, inference supplies a new context to fixed weights. No query label enters that context.</desc><text x="83" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">support</text><text x="233" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">query</text><rect x="20" y="40" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="58" y="40" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="40" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="68" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="58" y="68" width="35" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="96" y="68" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="96" width="35" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="58" y="96" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="96" y="96" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="124" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="58" y="124" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="124" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="186" y="76" width="30" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="219" y="76" width="30" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="252" y="76" width="30" height="27" rx="3" fill="#fff" stroke="#b46519"/><text x="267.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><path d="M143,53 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 171.4,88.5 177.0,83.3" fill="#087f8c"/><path d="M143,81 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 171.2,92.8 173.3,85.4" fill="#087f8c"/><path d="M143,109 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 174.4,97.6 171.0,90.7" fill="#087f8c"/><path d="M143,137 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 177.7,98.9 171.7,94.2" fill="#087f8c"/><text x="150" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">observed y → predict unknown y</text></g><text x="746" y="374" font-size="14" font-weight="650">Labeled support + unlabeled query →</text><text x="746" y="394" font-size="14" font-weight="650">prediction</text><text x="746" y="426" font-size="12">In the basic PFN use case, inference supplies</text><text x="746" y="443" font-size="12">a new context to fixed weights. No query label</text><text x="746" y="460" font-size="12">enters that context.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/2112.10510v7#S3"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2112.10510v7#S3</text></a></svg>