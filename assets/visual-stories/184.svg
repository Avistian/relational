<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">GELGT: keep local edges and attend farther away</title><desc id="desc">Two parallel summaries meet at a learned gate. Released regression route, shown conceptually. Exact token budgets, depths and cutoff policies remain in the detailed diagram and protocol ledger.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">GELGT: keep local edges and attend farther away</text><text x="28" y="67" font-size="15">Two parallel summaries meet at a learned gate.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Encode and select tokens</text><g transform="translate(36 133)"><title id="vs-184-1-title">Encode and select tokens</title><desc id="vs-184-1-desc">Encode table, hop, time, field and structural information. Preserve nearby nodes, then use seed compatibility to select distant candidates.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><path d="M239,48 L282,20" fill="none" stroke="#c4d5dc" stroke-width="2" stroke-dasharray="5 4"/><circle cx="282" cy="20" r="7" fill="#fff" stroke="#c4d5dc" stroke-width="2"/><text x="150" y="204" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">sampled computation</text></g><text x="36" y="374" font-size="14" font-weight="650">Protect nearby nodes; rank distant</text><text x="36" y="394" font-size="14" font-weight="650">candidates</text><text x="36" y="426" font-size="12">Encode table, hop, time, field and structural</text><text x="36" y="443" font-size="12">information. Preserve nearby nodes, then use</text><text x="36" y="460" font-size="12">seed compatibility to select distant</text><text x="36" y="477" font-size="12">candidates.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Compute two summaries</text><g transform="translate(391 133)"><title id="vs-184-2-title">Compute two summaries</title><desc id="vs-184-2-desc">GraphSAGE follows retained edges. In parallel, attention compares tokens with time-dependent score bias.</desc><rect x="50" y="15" width="200" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="150.0" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">same retained tokens</text><path d="M150,52 L62,89" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="62.0,89.0 67.0,82.7 70.0,89.8" fill="#087f8c"/><path d="M150,52 L234,89" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="234.0,89.0 226.0,89.7 229.1,82.7" fill="#7660ad"/><rect x="4" y="99" width="120" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="64.0" y="119" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">GraphSAGE</text><rect x="167" y="99" width="130" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="232.0" y="119" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">time attention</text><text x="150" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">parallel, not serial</text></g><text x="391" y="374" font-size="14" font-weight="650">GraphSAGE branch ∥ temporal-attention</text><text x="391" y="394" font-size="14" font-weight="650">branch</text><text x="391" y="426" font-size="12">GraphSAGE follows retained edges. In parallel,</text><text x="391" y="443" font-size="12">attention compares tokens with time-dependent</text><text x="391" y="460" font-size="12">score bias.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Gate the two routes</text><g transform="translate(746 133)"><title id="vs-184-3-title">Gate the two routes</title><desc id="vs-184-3-desc">A learned sigmoid gate mixes the summaries before the regression head. The detailed lesson records source/paper depth differences.</desc><rect x="7" y="33" width="112" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="63.0" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">GNN</text><rect x="180" y="33" width="112" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="236.0" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">attention</text><path d="M63,72 L134,133" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="134.0,133.0 126.2,131.3 131.2,125.5" fill="#087f8c"/><path d="M237,72 L164,133" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="164.0,133.0 166.9,125.6 171.8,131.4" fill="#7660ad"/><circle cx="150" cy="151" r="24" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="157" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="400" fill="#b46519">g</text><text x="150" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">g · GNN + (1−g) · attention</text></g><text x="746" y="374" font-size="14" font-weight="650">g × GNN + (1 − g) × attention → head</text><text x="746" y="426" font-size="12">A learned sigmoid gate mixes the summaries</text><text x="746" y="443" font-size="12">before the regression head. The detailed</text><text x="746" y="460" font-size="12">lesson records source/paper depth differences.</text><text x="28" y="548" font-size="13">Released regression route, shown conceptually. Exact token budgets, depths and cutoff policies remain in the detailed diagram and</text><text x="28" y="566" font-size="13">protocol ledger.</text><a href="https://arxiv.org/html/2605.15575v2#S3"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2605.15575v2#S3</text></a></svg>