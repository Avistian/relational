<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">AutoGrable: choose whether to build a graph</title><desc id="desc">Graph construction is a selected modeling decision. Conceptual selection pipeline; see the lesson’s primary source for the exact AutoGrable scoring rule.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">AutoGrable: choose whether to build a graph</text><text x="28" y="67" font-size="15">Graph construction is a selected modeling decision.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Propose candidate columns</text><g transform="translate(36 133)"><title id="vs-b16-1-title">Propose candidate columns</title><desc id="vs-b16-1-desc">Each candidate construction proposes a way for table rows to become neighbors.</desc><rect x="52" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="26" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="52" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="91" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="55" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="169" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="208" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="52" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="91" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="130" y="84" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="169" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="208" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="52" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="113" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="49" y="23" width="78" height="117" rx="6" fill="none" stroke="#b46519"/><rect x="168" y="23" width="78" height="117" rx="6" fill="none" stroke="#7660ad"/><text x="150" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">overlapping feature views</text></g><text x="36" y="374" font-size="14" font-weight="650">Column subsets define candidate</text><text x="36" y="394" font-size="14" font-weight="650">relationships</text><text x="36" y="426" font-size="12">Each candidate construction proposes a way for</text><text x="36" y="443" font-size="12">table rows to become neighbors.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Score the constructions</text><g transform="translate(391 133)"><title id="vs-b16-2-title">Score the constructions</title><desc id="vs-b16-2-desc">Construction selection must use the allowed evidence and budget. Keep an explicit option to decline graph edges.</desc><text x="82" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">candidate i</text><rect x="149" y="24" width="115" height="24" rx="3" fill="#087f8c" stroke="none"/><text x="82" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">candidate j</text><rect x="149" y="77" width="83" height="24" rx="3" fill="#7660ad" stroke="none"/><text x="82" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">candidate k</text><rect x="149" y="130" width="51" height="24" rx="3" fill="#b46519" stroke="none"/><text x="150" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">select using allowed evidence</text></g><text x="391" y="374" font-size="14" font-weight="650">Evaluate candidates under the declared</text><text x="391" y="394" font-size="14" font-weight="650">rule</text><text x="391" y="426" font-size="12">Construction selection must use the allowed</text><text x="391" y="443" font-size="12">evidence and budget. Keep an explicit option</text><text x="391" y="460" font-size="12">to decline graph edges.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Train on the chosen input</text><g transform="translate(746 133)"><title id="vs-b16-3-title">Train on the chosen input</title><desc id="vs-b16-3-desc">The downstream GNN receives the selected structure. A schema or similarity function does not guarantee useful connections.</desc><circle cx="57" cy="65" r="41" fill="#f5f7fa" stroke="#c4d5dc" stroke-width="2"/><circle cx="40" cy="75" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="74" cy="75" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="57" cy="48" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><path d="M40,75 L57,48" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M57,48 L74,75" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="203" cy="65" r="41" fill="#f5f7fa" stroke="#c4d5dc" stroke-width="2"/><circle cx="186" cy="75" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="220" cy="75" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="203" cy="48" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><path d="M186,75 L203,48" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M203,48 L220,75" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="130" cy="155" r="41" fill="#f5f7fa" stroke="#c4d5dc" stroke-width="2"/><circle cx="113" cy="165" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="147" cy="165" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="130" cy="138" r="6" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><path d="M113,165 L130,138" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M130,138 L147,165" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M91,75 L169,75" fill="none" stroke="#c4d5dc" stroke-width="2" stroke-dasharray="5 4"/><path d="M77,101 L111,122" fill="none" stroke="#c4d5dc" stroke-width="2" stroke-dasharray="5 4"/><text x="150" y="217" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#597181">sample groups, retain internal edges</text></g><text x="746" y="374" font-size="14" font-weight="650">Selected graph or no-edge baseline →</text><text x="746" y="394" font-size="14" font-weight="650">predictor</text><text x="746" y="426" font-size="12">The downstream GNN receives the selected</text><text x="746" y="443" font-size="12">structure. A schema or similarity function</text><text x="746" y="460" font-size="12">does not guarantee useful connections.</text><text x="28" y="548" font-size="13">Conceptual selection pipeline; see the lesson’s primary source for the exact AutoGrable scoring rule.</text><a href="https://arxiv.org/html/2608.11431v1#S4"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2608.11431v1#S4</text></a></svg>