<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">GIN: keep multiplicities in the neighborhood</title><desc id="desc">Summing distinguishes some multisets that averaging collapses. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">GIN: keep multiplicities in the neighborhood</text><text x="28" y="67" font-size="15">Summing distinguishes some multisets that averaging collapses.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Read a multiset</text><g transform="translate(36 133)"><title id="vs-88-1-title">Read a multiset</title><desc id="vs-88-1-desc">A neighborhood is an unordered collection with multiplicity. Two copies of one state are different input from one copy.</desc><circle cx="60" cy="55" r="20" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#087f8c">a</text><circle cx="125" cy="55" r="20" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="125" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#087f8c">a</text><circle cx="60" cy="129" r="20" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#087f8c">a</text><circle cx="125" cy="129" r="20" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="125" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#087f8c">a</text><circle cx="190" cy="129" r="20" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="190" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="400" fill="#087f8c">a</text><text x="150" y="203" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">same values, different multiplicity</text></g><text x="36" y="374" font-size="14" font-weight="650">Neighbors may repeat feature values</text><text x="36" y="426" font-size="12">A neighborhood is an unordered collection with</text><text x="36" y="443" font-size="12">multiplicity. Two copies of one state are</text><text x="36" y="460" font-size="12">different input from one copy.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Sum, then learn</text><g transform="translate(391 133)"><title id="vs-88-2-title">Sum, then learn</title><desc id="vs-88-2-desc">The sum and self term feed a learned MLP. The expressiveness argument depends on the relevant assumptions, not just naming the block GIN.</desc><rect x="20" y="40" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#b46519"/><rect x="38" y="40" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#b46519"/><rect x="56" y="40" width="14" height="24" rx="3" fill="#459eaa" stroke="#b46519"/><rect x="74" y="40" width="14" height="24" rx="3" fill="#087f8c" stroke="#b46519"/><text x="56" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">self</text><rect x="188" y="40" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="206" y="40" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="224" y="40" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="242" y="40" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><text x="224" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">neighbors</text><path d="M224,72 L224,110" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="224.0,110.0 220.2,103.0 227.8,103.0" fill="#087f8c"/><rect x="174" y="114" width="100" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="224.0" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">Σ</text><path d="M60,72 L60,168" fill="none" stroke="#b46519" stroke-width="2"/><path d="M60,168 L78,168" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="78.0,168.0 71.0,171.8 71.0,164.2" fill="#b46519"/><path d="M224,149 L178,170" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="178.0,170.0 182.8,163.6 186.0,170.6" fill="#087f8c"/><rect x="80" y="154" width="98" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="129.0" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">+</text><path d="M129,184 L129,205" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="129.0,205.0 125.2,198.0 132.8,198.0" fill="#7660ad"/><text x="51" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">× (1+ε)</text><text x="183" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#7660ad">→ MLP</text></g><text x="391" y="374" font-size="14" font-weight="650">(1 + ε) self + Σ neighbors → MLP</text><text x="391" y="426" font-size="12">The sum and self term feed a learned MLP. The</text><text x="391" y="443" font-size="12">expressiveness argument depends on the</text><text x="391" y="460" font-size="12">relevant assumptions, not just naming the</text><text x="391" y="477" font-size="12">block GIN.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Read the whole graph</text><g transform="translate(746 133)"><title id="vs-88-3-title">Read the whole graph</title><desc id="vs-88-3-desc">A graph-level readout combines the node states, potentially from multiple depths, before the task head.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><path d="M150,132 L150,181" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="150.0,181.0 146.2,174.0 153.8,174.0" fill="#7660ad"/><rect x="114" y="186" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#7660ad"/><rect x="132" y="186" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#7660ad"/><rect x="150" y="186" width="14" height="24" rx="3" fill="#459eaa" stroke="#7660ad"/><rect x="168" y="186" width="14" height="24" rx="3" fill="#087f8c" stroke="#7660ad"/></g><text x="746" y="374" font-size="14" font-weight="650">Pool node representations across the</text><text x="746" y="394" font-size="14" font-weight="650">graph</text><text x="746" y="426" font-size="12">A graph-level readout combines the node</text><text x="746" y="443" font-size="12">states, potentially from multiple depths,</text><text x="746" y="460" font-size="12">before the task head.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/1810.00826v3#S4"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/1810.00826v3#S4</text></a></svg>