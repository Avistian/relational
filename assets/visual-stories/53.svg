<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">RealMLP: the recipe reaches beyond the layers</title><desc id="desc">See the input geometry, learned network and training schedule as one recipe. Numeric TD-S teaching route. This is a recipe overview, not the full TD architecture.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">RealMLP: the recipe reaches beyond the layers</text><text x="28" y="67" font-size="15">See the input geometry, learned network and training schedule as one recipe.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Scale the coordinates</text><g transform="translate(36 133)"><title id="vs-53-1-title">Scale the coordinates</title><desc id="vs-53-1-desc">Fit preprocessing on training rows. Smooth clipping limits extreme transformed values without a hard discontinuity.</desc><path d="M25,169 L278,169" fill="none" stroke="#597181" stroke-width="2"/><path d="M25,169 L25,27" fill="none" stroke="#597181" stroke-width="2"/><polyline points="27.0,148.0 29.5,147.8 32.0,147.5 34.4,147.3 36.9,147.0 39.4,146.8 41.9,146.4 44.4,146.1 46.8,145.8 49.3,145.4 51.8,145.0 54.3,144.6 56.8,144.2 59.2,143.7 61.7,143.2 64.2,142.7 66.7,142.1 69.2,141.5 71.6,140.8 74.1,140.2 76.6,139.4 79.1,138.7 81.6,137.9 84.0,137.0 86.5,136.1 89.0,135.2 91.5,134.2 94.0,133.2 96.4,132.1 98.9,130.9 101.4,129.7 103.9,128.5 106.4,127.2 108.8,125.8 111.3,124.4 113.8,122.9 116.3,121.4 118.8,119.8 121.2,118.2 123.7,116.6 126.2,114.8 128.7,113.1 131.2,111.3 133.6,109.5 136.1,107.6 138.6,105.7 141.1,103.8 143.6,101.9 146.0,99.9 148.5,98.0 151.0,96.0 153.5,94.0 156.0,92.1 158.4,90.1 160.9,88.2 163.4,86.3 165.9,84.4 168.4,82.5 170.8,80.7 173.3,78.9 175.8,77.2 178.3,75.4 180.8,73.8 1