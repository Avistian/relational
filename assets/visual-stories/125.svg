m-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">one representation per row</text></g><text x="391" y="374" font-size="14" font-weight="650">Type-specific encoders → common width</text><text x="391" y="426" font-size="12">Numerical, categorical and text encoders</text><text x="391" y="443" font-size="12">convert their inputs into column</text><text x="391" y="460" font-size="12">representations with a compatible hidden</text><text x="391" y="477" font-size="12">dimension.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Read out a row</text><g transform="translate(746 133)"><title id="vs-125-3-title">Read out a row</title><desc id="vs-125-3-desc">The configured backbone mixes or pools the tokens. A row encoder by itself does not pass messages between database rows.</desc><rect x="52" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="26" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="52" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="91" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="55" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="169" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="208" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="52" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="91" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="130" y="84" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="169" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="208" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="52" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="113" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><path d="M247,40 L273,40" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="273.0,40.0 266.0,43.8 266.0,36.2" fill="#087f8c"/><rect x="278" y="32" width="15" height="16" rx="3" fill="#7660ad" stroke="none"/><path d="M247,69 L273,69" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="273.0,69.0 266.0,72.8 266.0,65.2" fill="#087f8c"/><rect x="278" y="61" width="15" height="16" rx="3" fill="#7660ad" stroke="none"/><path d="M247,98 L273,98" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="273.0,98.0 266.0,101.8 266.0,94.2" fill="#087f8c"/><rect x="278" y="90" width="15" height="16" rx="3" fill="#7660ad" stroke="none"/><path d="M247,127 L273,127" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="273.0,127.0 266.0,130.8 266.0,123.2" fill="#087f8c"/><rect x="278" y="119" width="15" height="16" rx="3" fill="#7660ad" stroke="none"/><text x="150" y="199" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">one representation per row</text></g><text x="746" y="374" font-size="14" font-weight="650">Column tokens → backbone → task head</text><text x="746" y="426" font-size="12">The configured backbone mixes or pools the</text><text x="746" y="443" font-size="12">tokens. A row encoder by itself does not pass</text><text x="746" y="460" font-size="12">messages between database rows.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/2404.00776v2"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2404.00776v2</text></a></svg>