<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">Typed row encoding: materialize, tokenize, predict</title><desc id="desc">One table contains several kinds of values; keep their conversion explicit. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">Typed row encoding: materialize, tokenize, predict</text><text x="28" y="67" font-size="15">One table contains several kinds of values; keep their conversion explicit.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Group columns by type</text><g transform="translate(36 133)"><title id="vs-125-1-title">Group columns by type</title><desc id="vs-125-1-desc">A fitted materializer records statistics and vocabularies from training data. Held-out rows reuse that state.</desc><text x="65" y="27" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">123</text><text x="145" y="27" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">category</text><text x="225" y="27" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#7660ad">text</text><rect x="27" y="45" width="80" height="29" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="110" y="45" width="80" height="29" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="193" y="45" width="80" height="29" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="27" y="77" width="80" height="29" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="110" y="77" width="80" height="29" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="193" y="77" width="80" height="29" rx="3" fi