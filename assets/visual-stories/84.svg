<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">GAT: neighbors receive learned weights</title><desc id="desc">The graph still controls access; attention controls the mixture. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">GAT: neighbors receive learned weights</text><text x="28" y="67" font-size="15">The graph still controls access; attention controls the mixture.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Transform allowed neighbors</text><g transform="translate(36 133)"><title id="vs-84-1-title">Transform allowed neighbors</title><desc id="vs-84-1-desc">A shared feature projection prepares node states. Only graph-allowed pairs enter the attention calculation.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text></g><text x="36" y="374" font-size="14" font-weight="650">Project the center and its neighbors</text><text x="36" y="426" font-size="12">A shared feature projection prepares node</text><text x="36" y="443" font-size="12">states. Only graph-allowed pairs enter the</text><text x="36" y="460" font-size="12">attention calculation.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Normalize edge scores</text><g transform="translate(391 133)"><title id="vs-84-2-title">Normalize edge scores</title><desc id="vs-84-2-desc">Compute attention scores and normalize them over the receiving node’s neighbors. The drawn widths illustrate weights, not measured importance.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="6"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="9"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><text x="150" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">edge width ∝ attention</text></g><text x="391" y="374" font-size="14" font-weight="650">Pair score → softmax over this</text><text x="391" y="394" font-size="14" font-weight="650">neighborhood</text><text x="391" y="426" font-size="12">Compute attention scores and normalize them</text><text x="391" y="443" font-size="12">over the receiving node’s neighbors. The drawn</text><text x="391" y="460" font-size="12">widths illustrate weights, not measured</text><text x="391" y="477" font-size="12">importance.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Combine attention heads</text><g transform="translate(746 133)"><title id="vs-84-3-title">Combine attention heads</title><desc id="vs-84-3-desc">Each head forms its own neighborhood mixture. Concatenation or averaging depends on the layer and variant.</desc><rect x="5" y="94" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="23" y="94" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="41" y="94" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><path d="M64,106 L102,40" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="102.0,40.0 101.8,48.0 95.2,44.2" fill="#087f8c"/><rect x="106" y="26" width="91" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="151.5" y="46" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">head 1</text><path d="M203,41 L251,108" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="251.0,108.0 243.8,104.5 250.0,100.1" fill="#087f8c"/><path d="M64,106 L102,101" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="102.0,101.0 95.5,105.7 94.5,98.1" fill="#7660ad"/><rect x="106" y="87" width="91" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="151.5" y="107" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">head 2</text><path d="M203,102 L251,108" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="251.0,108.0 243.6,110.9 244.5,103.3" fill="#7660ad"/><path d="M64,106 L102,162" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="102.0,162.0 94.9,158.3 101.2,154.0" fill="#b46519"/><rect x="106" y="148" width="91" height="30" rx="6" fill="#fff" stroke="#b46519"/><text x="151.5" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#b46519">head 3</text><path d="M203,163 L251,108" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="251.0,108.0 249.3,115.8 243.5,110.8" fill="#b46519"/><circle cx="269" cy="108" r="18" fill="#fff" stroke="#7660ad" stroke-width="2"/><text x="269" y="113" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="400" fill="#7660ad">∥</text><text x="150" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">combine the parallel predictions</text></g><text x="746" y="374" font-size="14" font-weight="650">Several weighted sums → layer output</text><text x="746" y="426" font-size="12">Each head forms its own neighborhood mixture.</text><text x="746" y="443" font-size="12">Concatenation or averaging depends on the</text><text x="746" y="460" font-size="12">layer and variant.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/1710.10903v3#S2"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/1710.10903v3#S2</text></a></svg>