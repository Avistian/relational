tem-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><text x="102" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">r₁</text><text x="203" y="149" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#7660ad">r₂</text></g><path d="M88,90 L148,90" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="148.0,90.0 141.0,93.8 141.0,86.2" fill="#7660ad"/><path d="M189,158 L55,158" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="55.0,158.0 62.0,154.2 62.0,161.8" fill="#b46519"/><text x="121" y="181" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#b46519">reread using updated state</text><text x="150" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">cell reads ↔ graph updates</text></g><text x="391" y="374" font-size="14" font-weight="650">Cell attention ↔ relational row-state</text><text x="391" y="394" font-size="14" font-weight="650">updates</text><text x="391" y="426" font-size="12">The current task context guides cell reads.</text><text x="391" y="443" font-size="12">Relational messages update row and task state,</text><text x="391" y="460" font-size="12">which can change what is useful at the next</text><text x="391" y="477" font-size="12">read.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Read the requested roots</text><g transform="translate(746 133)"><title id="vs-164-3-title">Read the requested roots</title><desc id="vs-164-3-desc">Gather the task roots after the final updates. Classification and regression use different output routes; the lesson specifies the released transfer configuration.</desc><rect x="116" y="23" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="134" y="23" 