<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">Griffin: reread cells as graph context changes</title><desc id="desc">The row state evolves, but individual cells remain available for another read. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">Griffin: reread cells as graph context changes</text><text x="28" y="67" font-size="15">The row state evolves, but individual cells remain available for another read.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Keep cell keys and values</text><g transform="translate(36 133)"><title id="vs-164-1-title">Keep cell keys and values</title><desc id="vs-164-1-desc">Frozen input encoders produce cell representations. Keep the cell arrays rather than permanently collapsing them into a single row summary.</desc><rect x="22" y="30" width="80" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="62.0" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">age</text><rect x="110" y="30" width="80" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="150.0" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">type</text><rect x="198" y="30" width="80" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="238.0" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">value</text><rect x="25" y="100" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="43" y="100" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="61" y="100" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="79" y="100" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><rect x="113" y="100" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="131" y="100" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="149" y="100" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="167" y="100" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><rect x="201" y="100" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="219" y="100" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="237" y="100" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="255" y="100" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><text x="150" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">Retain a key and value per cell</text></g><text x="36" y="374" font-size="14" font-weight="650">Column metadata → keys; cell contents</text><text x="36" y="394" font-size="14" font-weight="650">→ values</text><text x="36" y="426" font-size="12">Frozen input encoders produce cell</text><text x="36" y="443" font-size="12">representations. Keep the cell arrays rather</text><text x="36" y="460" font-size="12">than permanently collapsing them into a single</text><text x="36" y="477" font-size="12">row summary.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Alternate reading and routing</text><g transform="translate(391 133)"><title id="vs-164-2-title">Alternate reading and routing</title><desc id="vs-164-2-desc">The current task context guides cell reads. Relational messages update row and task state, which can change what is useful at the next read.</desc><rect x="12" y="48" width="19" height="23" rx="3" fill="#d8eef0" 