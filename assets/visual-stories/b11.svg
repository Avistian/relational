<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">Supervised relational baselines: from database rows to predictions</title><desc id="desc">Rows become nodes; foreign keys route information between tables. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="20" font-weight="650">Supervised relational baselines: from database rows to predictions</text><text x="28" y="67" font-size="15">Rows become nodes; foreign keys route information between tables.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Map rows and keys</text><g transform="translate(36 133)"><title id="vs-b11-1-title">Map rows and keys</title><desc id="vs-b11-1-desc">Construct the relational graph without replacing the full neighborhood by one manually aggregated flat row.</desc><rect x="15" y="27" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="49" y="27" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="15" y="50" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="49" y="50" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="15" y="73" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="49" y="73" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="112" y="95" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="146" y="95" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="112" y="118" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="146" y="118" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="112" y="141" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="146" y="141" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="210" y="27" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="244" y="27" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="210" y="50" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="244" y="50" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="210" y="73" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="244" y="73" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><path d="M66,93 L119,121" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="119.0,121.0 111.0,121.1 114.6,114.3" fill="#087f8c"/><path d="M185,122 L233,94" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="233.0,94.0 228.9,100.9 225.0,94.2" fill="#7660ad"/><text x="150" y="206" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">rows linked by foreign keys</text></g><text x="36" y="374" font-size="14" font-weight="650">Table rows → nodes; foreign keys →</text><text x="36" y="394" font-size="14" font-weight="650">edges</text><text x="36" y="426" font-size="12">Construct the relational graph without</text><text x="36" y="443" font-size="12">replacing the full neighborhood by one</text><text x="36" y="460" font-size="12">manually aggregated flat row.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Encode, then pass messages</text><g transform="translate(391 133)"><title id="vs-b11-2-title">Encode, then pass messages</title><desc id="vs-b11-2-desc">Encoders handle row attributes. Relational message passing uses the schema connections to propagate information.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#7660ad" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#7660ad" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><text x="102" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">r₁</text><text x="203" y="149" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#7660ad">r₂</text></g><text x="391" y="374" font-size="14" font-weight="650">Row attributes → states → typed</text><text x="391" y="394" font-size="14" font-weight="650">messages</text><text x="391" y="426" font-size="12">Encoders handle row attributes. Relational</text><text x="391" y="443" font-size="12">message passing uses the schema connections to</text><text x="391" y="460" font-size="12">propagate information.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Read the task entity</text><g transform="translate(746 133)"><title id="vs-b11-3-title">Read the task entity</title><desc id="vs-b11-3-desc">The task chooses which entities are scored. Available features, neighborhood extraction and evaluation splits remain explicit.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">q</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text></g><text x="746" y="374" font-size="14" font-weight="650">Target-node state → prediction head</text><text x="746" y="426" font-size="12">The task chooses which entities are scored.</text><text x="746" y="443" font-size="12">Available features, neighborhood extraction</text><text x="746" y="460" font-size="12">and evaluation splits remain explicit.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/abs/2002.02046v1"><text x="28" y="604" font-size="13">Source: https://arxiv.org/abs/2002.02046v1</text></a></svg>