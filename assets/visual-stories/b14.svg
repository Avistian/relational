<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">A retrieval baseline sets a stronger flat-table bar</title><desc id="desc">Follow two information paths: the query itself and the labeled rows it retrieves. TabR mechanism reminder for baseline comparison; this is not the architecture of TabPFN-Rel or RDBLearn.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">A retrieval baseline sets a stronger flat-table bar</text><text x="28" y="67" font-size="15">Follow two information paths: the query itself and the labeled rows it retrieves.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Query + training memory</text><g transform="translate(36 133)"><title id="vs-b14-1-title">Query + training memory</title><desc id="vs-b14-1-desc">Encode the query and eligible training rows. Search in learned key space; the query must not retrieve itself during training.</desc><circle cx="45" cy="65" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="69" cy="116" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="130" cy="58" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="138" cy="140" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="237" cy="45" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="230" cy="145" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="196" cy="92" r="7" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><circle cx="109" cy="102" r="13" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="109" y="107" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#b46519">q</text><ellipse cx="108" cy="103" rx="64" ry="56" fill="none" stroke="#087f8c" stroke-dasharray="5 4"/><path d="M115,94 L130,64" fill="none" stroke="#b46519" stroke-width="2"/><path d="M98,108 L73,115" fill="none" stroke="#b46519" stroke-width="2"/><path d="M117,113 L135,135" fill="none" stroke="#b46519" stroke-width="2"/><text x="150" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">near in learned feature space</text></g><text x="36" y="374" font-size="14" font-weight="650">Features find neighbors; labels supply</text><text x="36" y="394" font-size="14" font-weight="650">values</text><text x="36" y="426" font-size="12">Encode the query and eligible training rows.</text><text x="36" y="443" font-size="12">Search in learned key space; the query must</text><text x="36" y="460" font-size="12">not retrieve itself during training.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Read the neighbors</text><g transform="translate(391 133)"><title id="vs-b14-2-title">Read the neighbors</title><desc id="vs-b14-2-desc">Distance-based weights combine values E(yᵢ) + T(k − kᵢ). The label and directed difference play different roles.</desc><rect x="12" y="20" width="60" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="42.0" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">E(y₁)</text><text x="88" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="400" fill="#597181">+</text><rect x="104" y="20" width="102" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="155.0" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">T(k − k1)</text><path d="M214,35 L246,98" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="246.0,98.0 239.4,93.5 246.2,90.0" fill="#087f8c"/><rect x="12" y="68" width="60" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="42.0" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">E(y₂)</text><text x="88" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="400" fill="#597181">+</text><rect x="104" y="68" width="102" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="155.0" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">T(k − k2)</text><path d="M214,83 L246,98" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="246.0,98.0 238.0,98.5 241.3,91.5" fill="#087f8c"/><rect x="12" y="116" width="60" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="42.0" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">E(y₃)</text><text x="88" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="400" fill="#597181">+</text><rect x="104" y="116" width="102" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="155.0" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">T(k − k3)</text><path d="M214,131 L246,98" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="246.0,98.0 243.9,105.7 238.4,100.4" fill="#087f8c"/><circle cx="263" cy="98" r="17" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="263" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="400" fill="#b46519">Σ</text><text x="150" y="198" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">weighted learned values</text></g><text x="391" y="374" font-size="14" font-weight="650">Value = label embedding + key</text><text x="391" y="394" font-size="14" font-weight="650">correction</text><text x="391" y="426" font-size="12">Distance-based weights combine values E(yᵢ) +</text><text x="391" y="443" font-size="12">T(k − kᵢ). The label and directed difference</text><text x="391" y="460" font-size="12">play different roles.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Keep the direct path</text><g transform="translate(746 133)"><title id="vs-b14-3-title">Keep the direct path</title><desc id="vs-b14-3-desc">Add the retrieved representation to the query representation, then use the prediction network. Retrieval is inside the model, not a replacement for its head.</desc><rect x="20" y="40" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#b46519"/><rect x="38" y="40" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#b46519"/><rect x="56" y="40" width="14" height="24" rx="3" fill="#459eaa" stroke="#b46519"/><rect x="74" y="40" width="14" height="24" rx="3" fill="#087f8c" stroke="#b46519"/><text x="56" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">self</text><rect x="188" y="40" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="206" y="40" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="224" y="40" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="242" y="40" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><text x="224" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">neighbors</text><path d="M224,72 L224,110" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="224.0,110.0 220.2,103.0 227.8,103.0" fill="#087f8c"/><rect x="174" y="114" width="100" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="224.0" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">Σ</text><path d="M60,72 L60,168" fill="none" stroke="#b46519" stroke-width="2"/><path d="M60,168 L78,168" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="78.0,168.0 71.0,171.8 71.0,164.2" fill="#b46519"/><path d="M224,149 L178,170" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="178.0,170.0 182.8,163.6 186.0,170.6" fill="#087f8c"/><rect x="80" y="154" width="98" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="129.0" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">+</text><path d="M129,184 L129,205" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="129.0,205.0 125.2,198.0 132.8,198.0" fill="#7660ad"/><text x="213" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">→ update / head</text></g><text x="746" y="374" font-size="14" font-weight="650">Query state + retrieved context → head</text><text x="746" y="426" font-size="12">Add the retrieved representation to the query</text><text x="746" y="443" font-size="12">representation, then use the prediction</text><text x="746" y="460" font-size="12">network. Retrieval is inside the model, not a</text><text x="746" y="477" font-size="12">replacement for its head.</text><text x="28" y="548" font-size="13">TabR mechanism reminder for baseline comparison; this is not the architecture of TabPFN-Rel or RDBLearn.</text><a href="https://arxiv.org/html/2307.14338v2#S3.SS2"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2307.14338v2#S3.SS2</text></a></svg>