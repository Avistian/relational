<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">Semantic row encoders: names become model inputs</title><desc id="desc">A numerical value and its meaning are separate pieces of information. Conceptual semantic-encoding route; not a single universal serialization or model architecture.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">Semantic row encoders: names become model inputs</text><text x="28" y="67" font-size="15">A numerical value and its meaning are separate pieces of information.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Keep names beside values</text><g transform="translate(36 133)"><title id="vs-163-1-title">Keep names beside values</title><desc id="vs-163-1-desc">Serialization or typed encoding must specify which schema text and cell content the model receives.</desc><text x="65" y="27" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">123</text><text x="145" y="27" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">category</text><text x="225" y="27" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#7660ad">text</text><rect x="27" y="45" width="80" height="29" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="110" y="45" width="80" height="29" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="193" y="45" width="80" height="29" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="27" y="77" width="80" height="29" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="110" y="77" width="80" height="29" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="193" y="77" width="80" height="29" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="27" y="109" width="80" height="29" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="110" y="109" width="80" height="29" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="193" y="109" width="80" height="29" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="27" y="141" width="80" height="29" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="110" y="141" width="80" height="29" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="193" y="141" width="80" height="29" rx="3" fill="#cee5e9" stroke="#fff"/><text x="150" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">Different types; aligned columns</text></g><text x="36" y="374" font-size="14" font-weight="650">Column name + cell value + declared</text><text x="36" y="394" font-size="14" font-weight="650">role</text><text x="36" y="426" font-size="12">Serialization or typed encoding must specify</text><text x="36" y="443" font-size="12">which schema text and cell content the model</text><text x="36" y="460" font-size="12">receives.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Use a language representation</text><g transform="translate(391 133)"><title id="vs-163-2-title">Use a language representation</title><desc id="vs-163-2-desc">A pretrained encoder can supply representations of names and text. Numeric handling still needs an explicit design.</desc><rect x="25" y="23" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="43" y="23" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="61" y="23" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><path d="M90,35 L159,35" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="159.0,35.0 152.0,38.8 152.0,31.2" fill="#087f8c"/><rect x="178" y="23" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="196" y="23" width="14" height="24" 