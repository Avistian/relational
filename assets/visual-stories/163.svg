on points="159.0,152.0 152.0,155.8 152.0,148.2" fill="#087f8c"/><rect x="178" y="140" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="196" y="140" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="214" y="140" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="232" y="140" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><text x="150" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#597181">meaning → vector coordinates</text></g><text x="391" y="374" font-size="14" font-weight="650">Text / semantic encoder → cell or row</text><text x="391" y="394" font-size="14" font-weight="650">vectors</text><text x="391" y="426" font-size="12">A pretrained encoder can supply</text><text x="391" y="443" font-size="12">representations of names and text. Numeric</text><text x="391" y="460" font-size="12">handling still needs an explicit design.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Connect to the task</text><g transform="translate(746 133)"><title id="vs-163-3-title">Connect to the task</title><desc id="vs-163-3-desc">The downstream model consumes those representations. A name-ablation comparison tests the contribution of semantic information.</desc><rect x="52" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="26" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="52" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="91" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="55" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="169" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="208" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="52" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="91" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="130" y="84" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="169" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="208" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="52" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="113" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><path d="M247,40 L273,40" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="273.0,40.0 266.0,43.8 266.0,36.2" fill="#087f8c"/><rect x="278" y="32" width="15" height="16" rx="3" fill="#7660ad" stroke="none"/><path d="M247,69 L273,69" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="273.0,69.0 266.0,72.8 266.0,65.2" fill="#087f8c"/><rect x="278" y="61" width="15" height="16" rx="3" fill="#7660ad" stroke="none"/><path d="M247,98 L273,98" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="273.0,98.0 266.0,101.8 266.0,94.2" fill="#087f8c"/><rect x="278" y="90" width="15" height="16" rx="3" fill="#7660ad" stroke="none"/><path d="M247,127 L273,127" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="273.0,127.0 266.0,130.8 266.0,123.2" fill="#087f8c"/><rect x="278" y="119" width="15" height="16" rx="3" fill="#7660ad" stroke="none"/><text x="150" y="199" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">one representation per row</text></g><text x="746" y="374" font-size="14" font-weight="650">Combine encoded content → downstream</text><text x="746" y="394" font-size="14" font-weight="650">predictor</text><text x="746" y="426" font-size="12">The downstream model consumes those</text><text x="746" y="443" font-size="12">representations. A name-ablation comparison</text><text x="746" y="460" font-size="12">tests the contribution of semantic</text><text x="746" y="477" font-size="12">information.</text><text x="28" y="548" font-size="13">Conceptual semantic-encoding route; not a single universal serialization or model architecture.</text><a href="https://arxiv.org/html/2305.15321v1#S2"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2305.15321v1#S2</text></a></svg>