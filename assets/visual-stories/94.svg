" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="159.0,152.0 152.0,155.8 152.0,148.2" fill="#087f8c"/><rect x="178" y="140" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="196" y="140" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="214" y="140" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="232" y="140" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><text x="150" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#597181">meaning → vector coordinates</text></g><text x="746" y="374" font-size="14" font-weight="650">Typed skip-gram objective → embedding</text><text x="746" y="394" font-size="14" font-weight="650">table</text><text x="746" y="426" font-size="12">Learn embeddings from those co-occurrences.</text><text x="746" y="443" font-size="12">Downstream evaluation requires a separate task</text><text x="746" y="460" font-size="12">and split contract.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://ericdongyx.github.io/metapath2vec/m2v.html"><text x="28" y="604" font-size="13">Source: https://ericdongyx.github.io/metapath2vec/m2v.html</text></a></svg>