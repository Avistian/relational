<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">metapath2vec: types constrain a random walk</title><desc id="desc">The walk defines the context pairs used to learn embeddings. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">metapath2vec: types constrain a random walk</text><text x="28" y="67" font-size="15">The walk defines the context pairs used to learn embeddings.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Select a schema path</text><g transform="translate(36 133)"><title id="vs-94-1-title">Select a schema path</title><desc id="vs-94-1-desc">The schema guides the random walk through heterogeneous relations rather than accepting any adjacent type.</desc><path d="M41,65 L93,122" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="93.0,122.0 85.4,119.4 91.1,114.2" fill="#087f8c"/><path d="M113,122 L179,65" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,65.0 176.2,72.5 171.2,66.7" fill="#087f8c"/><path d="M199,65 L253,122" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="253.0,122.0 245.4,119.5 251.0,114.3" fill="#087f8c"/><circle cx="33" cy="65" r="19" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="33" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">A</text><circle cx="105" cy="122" r="19" fill="#eee9fa" stroke="#7660ad" stroke-width="2"/><text x="105" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">P</text><circle cx="191" cy="65" r="19" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="191" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">A</text><circle cx="265" cy="122" r="19" fill="#eee9fa" stroke="#7660ad" stroke-width="2"/><text x="265" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">P</text><text x="150" y="199" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">type-constrained route</text></g><text x="36" y="374" font-size="14" font-weight="650">A repeating sequence of permitted node</text><text x="36" y="394" font-size="14" font-weight="650">types</text><text x="36" y="426" font-size="12">The schema guides the random walk through</text><text x="36" y="443" font-size="12">heterogeneous relations rather than accepting</text><text x="36" y="460" font-size="12">any adjacent type.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Walk to create contexts</text><g transform="translate(391 133)"><title id="vs-94-2-title">Walk to create contexts</title><desc id="vs-94-2-desc">Nearby positions in sampled walks become training contexts. This is a sampling construction, not a supervised task label.</desc><path d="M41,65 L93,122" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="93.0,122.0 85.4,119.4 91.1,114.2" fill="#087f8c"/><path d="M113,122 L179,65" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,65.0 176.2,72.5 171.2,66.7" fill="#087f8c"/><path d="M199,65 L253,122" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="253.0,122.0 245.4,119.5 251.0,114.3" fill="#087f8c"/><circle cx="33" cy="65" r="19" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="33" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">A</text><circle cx="105" cy="122" r="19" fill="#eee9fa" stroke="#7660ad" stroke-width="2"/><text x="105" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">P</text><circle cx="191" cy="65" r="19" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="191" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">A</text><circle cx="265" cy="122" r="19" fill="#eee9fa" stroke="#7660ad" stroke-width="2"/><text x="265" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#233c50">P</text><text x="150" y="199" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">type-constrained route</text></g><text x="391" y="374" font-size="14" font-weight="650">Walk sequence → center/context windows</text><text x="391" y="426" font-size="12">Nearby positions in sampled walks become</text><text x="391" y="443" font-size="12">training contexts. This is a sampling</text><text x="391" y="460" font-size="12">construction, not a supervised task label.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Fit node embeddings</text><g transform="translate(746 133)"><title id="vs-94-3-title">Fit node embeddings</title><desc id="vs-94-3-desc">Learn embeddings from those co-occurrences. Downstream evaluation requires a separate task and split contract.</desc><rect x="25" y="23" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="43" y="23" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="61" y="23" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><path d="M90,35 L159,35" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="159.0,35.0 152.0,38.8 152.0,31.2" fill="#087f8c"/><rect x="178" y="23" width="14" height="24" rx="3" fill="#c9e7e8" stroke=