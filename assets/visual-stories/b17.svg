<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">FlexTab: reuse features without reusing the labels</title><desc id="desc">Keep the feature stream separate from task-conditioned decoding. FlexTab mechanism; detailed dimensions below belong to the reduced untrained lab, not the published default model.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">FlexTab: reuse features without reusing the labels</text><text x="28" y="67" font-size="15">Keep the feature stream separate from task-conditioned decoding.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Encode features only</text><g transform="translate(36 133)"><title id="vs-b17-1-title">Encode features only</title><desc id="vs-b17-1-desc">The feature encoder does not read the target labels. The local model alternates attention across columns and allowed rows.</desc><rect x="52" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="26" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="52" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="91" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="55" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="169" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="208" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="52" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="91" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="130" y="84" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="169" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="208" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="52" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="113" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><path d="M247,40 L273,40" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="273.0,40.0 266.0,43.8 266.0,36.2" fill="#087f8c"/><rect x="278" y="32" width="15" height="16" rx="3" fill="#7660ad" stroke="none"/><path d="M247,69 L273,69" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="273.0,69.0 266.0,72.8 266.0,65.2" fill="#087f8c"/><rect x="278" y="61" width="15" height="16" rx="3" fill="#7660ad" stroke="none"/><path d="M247,98 L273,98" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="273.0,98.0 266.0,101.8 266.0,94.2" fill="#087f8c"/><rect x="278" y="90" width="15" height="16" rx="3" fill="#7660ad" stroke="none"/><path d="M247,127 L273,127" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="273.0,127.0 266.0,130.8 266.0,123.2" fill="#087f8c"/><rect x="278" y="119" width="15" height="16" rx="3" fill="#7660ad" stroke="none"/><text x="150" y="199" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">one representation per row</text></g><text x="36" y="374" font-size="14" font-weight="650">Cell tokens + row token → shared</text><text x="36" y="394" font-size="14" font-weight="650">feature stream</text><text x="36" y="426" font-size="12">The feature encoder does not read the target</text><text x="36" y="443" font-size="12">labels. The local model alternates attention</text><text x="36" y="460" font-size="12">across columns and allowed rows.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Combine outputs across depths</text><g transform="translate(391 133)"><title id="vs-b17-2-title">Combine outputs across depths</title><desc id="vs-b17-2-desc">Layer-specific projections combine row representations into the shared output. Cache Z only while its encoder dependencies are unchanged.</desc><rect x="10" y="21" width="87" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="53.5" y="41" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">layer 1</text><path d="M104,36 L133,36" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="133.0,36.0 126.0,39.8 126.0,32.2" fill="#087f8c"/><rect x="137" y="21" width="67" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="170.5" y="41" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">P1</text><path d="M211,36 L250,99" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="250.0,99.0 243.0,95.0 249.6,91.0" fill="#087f8c"/><rect x="10" y="74" width="87" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="53.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">layer 2</text><path d="M104,89 L133,89" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="133.0,89.0 126.0,92.8 126.0,85.2" fill="#087f8c"/><rect x="137" y="74" width="67" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="170.5" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">P2</text><path d="M211,89 L250,99" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="250.0,99.0 242.2,101.0 244.2,93.5" fill="#087f8c"/><rect x="10" y="127" width="87" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="53.5" y="147" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">layer 3</text><path d="M104,142 L133,142" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="133.0,142.0 126.0,145.8 126.0,138.2" fill="#087f8c"/><rect x="137" y="127" width="67" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="170.5" y="147" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">P3</text><path d="M211,142 L250,99" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="250.0,99.0 248.1,106.8 242.4,101.6" fill="#087f8c"/><circle cx="267" cy="100" r="17" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="267" y="106" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#b46519">Σ</text><text x="150" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#597181">collect row representations across depth</text></g><text x="391" y="374" font-size="14" font-weight="650">Projected row states from multiple</text><text x="391" y="394" font-size="14" font-weight="650">layers → Z</text><text x="391" y="426" font-size="12">Layer-specific projections combine row</text><text x="391" y="443" font-size="12">representations into the shared output. Cache</text><text x="391" y="460" font-size="12">Z only while its encoder dependencies are</text><text x="391" y="477" font-size="12">unchanged.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Decode each target stream</text><g transform="translate(746 133)"><title id="vs-b17-3-title">Decode each target stream</title><desc id="vs-b17-3-desc">Separate target streams read the shared row representations and the permitted support labels. A label edit can change predictions without changing Z.</desc><rect x="116" y="28" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="134" y="28" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="152" y="28" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="170" y="28" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><text x="152" y="20" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">shared Z</text><path d="M142,60 L71,98" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="71.0,98.0 75.4,91.3 79.0,98.1" fill="#087f8c"/><path d="M161,60 L226,98" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="226.0,98.0 218.0,97.8 221.9,91.1" fill="#7660ad"/><rect x="5" y="105" width="130" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="70.0" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">decoder A</text><rect x="165" y="105" width="130" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="230.0" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">decoder B</text><path d="M70,181 L70,143" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="70.0,143.0 73.8,150.0 66.2,150.0" fill="#b46519"/><path d="M228,181 L228,143" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="228.0,143.0 231.8,150.0 224.2,150.0" fill="#b46519"/><text x="70" y="204" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#b46519">labels A</text><text x="228" y="204" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#b46519">labels B</text></g><text x="746" y="374" font-size="14" font-weight="650">Same Z + task-specific support labels</text><text x="746" y="394" font-size="14" font-weight="650">→ predictions</text><text x="746" y="426" font-size="12">Separate target streams read the shared row</text><text x="746" y="443" font-size="12">representations and the permitted support</text><text x="746" y="460" font-size="12">labels. A label edit can change predictions</text><text x="746" y="477" font-size="12">without changing Z.</text><text x="28" y="548" font-size="13">FlexTab mechanism; detailed dimensions below belong to the reduced untrained lab, not the published default model.</text><a href="https://arxiv.org/html/2606.30336v2#S2.SS2"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2606.30336v2#S2.SS2</text></a></svg>