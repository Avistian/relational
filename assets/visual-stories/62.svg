<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">TabPFN v1: a table becomes a context</title><desc id="desc">The row is the token; support labels are observed information. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">TabPFN v1: a table becomes a context</text><text x="28" y="67" font-size="15">The row is the token; support labels are observed information.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Encode rows and labels</text><g transform="translate(36 133)"><title id="vs-62-1-title">Encode rows and labels</title><desc id="vs-62-1-desc">Feature and label encodings provide observed context. Query labels stay hidden.</desc><text x="83" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">support</text><text x="233" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">query</text><rect x="20" y="40" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="58" y="40" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="40" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="68" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="58" y="68" width="35" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="96" y="68" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="96" width="35" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="58" y="96" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="96" y="96" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="124" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="58" y="124" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="124" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="186" y="76" width="30" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="219" y="76" width="30" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="252" y="76" width="30" height="27" rx="3" fill="#fff" stroke="#b46519"/><text x="267.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><path d="M143,53 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 171.4,88.5 177.0,83.3" fill="#087f8c"/><path d="M143,81 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 171.2,92.8 173.3,85.4" fill="#087f8c"/><path d="M143,109 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 174.4,97.6 171.0,90.7" fill="#087f8c"/><path d="M143,137 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 177.7,98.9 171.7,94.2" fill="#087f8c"/><text x="150" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">observed y → predict unknown y</text></g><text x="36" y="374" font-size="14" font-weight="650">Support: x + y; query: x without its y</text><text x="36" y="426" font-size="12">Feature and label encodings provide observed</text><text x="36" y="443" font-size="12">context. Query labels stay hidden.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Use masked row attention</text><g transform="translate(391 133)"><title id="vs-62-2-title">Use masked row attention</title><desc id="vs-62-2-desc">The attention mask determines which rows can exchange information. Do not confuse access to query features with access to query targets.</desc><text x="83" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">support</text><text x="233" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">query</text><rect x="20" y="40" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="58" y="40" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="40" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="68" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="58" y="68" width="35" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="96" y="68" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="96" width="35" height="25" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="58" y="96" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="96" y="96" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="20" y="124" width="35" height="25" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="58" y="124" width="35" height="25" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="124" width="35" height="25" rx="3" fill="#fff0de" stroke="#fff"/><rect x="186" y="76" width="30" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="219" y="76" width="30" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="252" y="76" width="30" height="27" rx="3" fill="#fff" stroke="#b46519"/><text x="267.0" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><path d="M143,53 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 171.4,88.5 177.0,83.3" fill="#087f8c"/><path d="M143,81 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 171.2,92.8 173.3,85.4" fill="#087f8c"/><path d="M143,109 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 174.4,97.6 171.0,90.7" fill="#087f8c"/><path d="M143,137 L179,91" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="179.0,91.0 177.7,98.9 171.7,94.2" fill="#087f8c"/><text x="150" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">observed y → predict unknown y</text></g><text x="391" y="374" font-size="14" font-weight="650">A query reads support; queries stay</text><text x="391" y="394" font-size="14" font-weight="650">separate</text><text x="391" y="426" font-size="12">The attention mask determines which rows can</text><text x="391" y="443" font-size="12">exchange information. Do not confuse access to</text><text x="391" y="460" font-size="12">query features with access to query targets.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Read query predictions</text><g transform="translate(746 133)"><title id="vs-62-3-title">Read query predictions</title><desc id="vs-62-3-desc">A query representation feeds the prediction head. Any preprocessing and ensemble transformations remain part of the inference recipe.</desc><path d="M28,168 L276,168" fill="none" stroke="#597181" stroke-width="2"/><path d="M28,168 L28,40" fill="none" stroke="#597181" stroke-width="2"/><rect x="46" y="142" width="29" height="26" rx="4" fill="#aacfd5" stroke="none"/><rect x="91" y="93" width="29" height="75" rx="4" fill="#66acb6" stroke="none"/><rect x="136" y="54" width="29" height="114" rx="4" fill="#7660ad" stroke="none"/><rect x="181" y="107" width="29" height="61" rx="4" fill="#66acb6" stroke="none"/><rect x="226" y="146" width="29" height="22" rx="4" fill="#aacfd5" stroke="none"/><text x="150" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">predictive output</text></g><text x="746" y="374" font-size="14" font-weight="650">Shared pretrained transformer → class</text><text x="746" y="394" font-size="14" font-weight="650">scores</text><text x="746" y="426" font-size="12">A query representation feeds the prediction</text><text x="746" y="443" font-size="12">head. Any preprocessing and ensemble</text><text x="746" y="460" font-size="12">transformations remain part of the inference</text><text x="746" y="477" font-size="12">recipe.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/2207.01848v6#S2"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2207.01848v6#S2</text></a></svg>