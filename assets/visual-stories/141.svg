<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">RelGNN: compose a relation through a bridge</title><desc id="desc">A many-to-many relationship needs its intermediate records to stay visible. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">RelGNN: compose a relation through a bridge</text><text x="28" y="67" font-size="15">A many-to-many relationship needs its intermediate records to stay visible.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Keep the bridge table</text><g transform="translate(36 133)"><title id="vs-141-1-title">Keep the bridge table</title><desc id="vs-141-1-desc">A bridge row identifies an individual association. Its columns may carry information that a collapsed endpoint edge would discard.</desc><rect x="15" y="27" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="49" y="27" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="15" y="50" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="49" y="50" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="15" y="73" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="49" y="73" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="112" y="95" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="146" y="95" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="112" y="118" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="146" y="118" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="112" y="141" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="146" y="141" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="210" y="27" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="244" y="27" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="210" y="50" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="244" y="50" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="210" y="73" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="244" y="73" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><path d="M66,93 L119,121" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="119.0,121.0 111.0,121.1 114.6,114.3" fill="#087f8c"/><path d="M185,122 L233,94" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="233.0,94.0 228.9,100.9 225.0,94.2" fill="#7660ad"/><text x="150" y="206" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">rows linked by foreign keys</text></g><text x="36" y="374" font-size="14" font-weight="650">Entity → bridge row → related entity</text><text x="36" y="426" font-size="12">A bridge row identifies an individual</text><text x="36" y="443" font-size="12">association. Its columns may carry information</text><text x="36" y="460" font-size="12">that a collapsed endpoint edge would discard.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Compose before reducing</text><g transform="translate(391 133)"><title id="vs-141-2-title">Compose before reducing</title><desc id="vs-141-2-desc">A composite message combines the source row with the intermediate bridge row before destination aggregation. Distinguish this from two generic layers that prematurely compress the intermediate context.</desc><rect x="15" y="27" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="49" y="27" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="15" y="50" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="49" y="50" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="15" y="73" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="49" y="73" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="112" y="95" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="146" y="95" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="112" y="118" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="146" y="118" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="112" y="141" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="146" y="141" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="210" y="27" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="244" y="27" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="210" y="50" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="244" y="50" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="210" y="73" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="244" y="73" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><path d="M66,93 L119,121" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="119.0,121.0 111.0,121.1 114.6,114.3" fill="#087f8c"/><path d="M185,122 L233,94" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="233.0,94.0 228.9,100.9 225.0,94.2" fill="#7660ad"/><text x="150" y="206" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">rows linked by foreign keys</text><path d="M47,14 C100,-2 202,-2 254,14" fill="none" stroke="#b46519" stroke-width="3"/></g><text x="391" y="374" font-size="14" font-weight="650">Source state + bridge state →</text><text x="391" y="394" font-size="14" font-weight="650">destination message</text><text x="391" y="426" font-size="12">A composite message combines the source row</text><text x="391" y="443" font-size="12">with the intermediate bridge row before</text><text x="391" y="460" font-size="12">destination aggregation. Distinguish this from</text><text x="391" y="477" font-size="12">two generic layers that prematurely compress</text><text x="391" y="494" font-size="12">the intermediate context.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Update the target entity</text><g transform="translate(746 133)"><title id="vs-141-3-title">Update the target entity</title><desc id="vs-141-3-desc">Combine the admitted messages at the target and apply the downstream prediction head.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">q</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text></g><text x="746" y="374" font-size="14" font-weight="650">Relation-path evidence → task-node</text><text x="746" y="394" font-size="14" font-weight="650">state</text><text x="746" y="426" font-size="12">Combine the admitted messages at the target</text><text x="746" y="443" font-size="12">and apply the downstream prediction head.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/2502.06784v2#S4"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2502.06784v2#S4</text></a></svg>