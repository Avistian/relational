<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">GTAlign: adapt the graph encoder, then query the table model</title><desc id="desc">Follow which component is allowed to learn at each stage. Paper mechanism overview. GTAlign training and evaluation remain NOT_RUN in this lesson.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">GTAlign: adapt the graph encoder, then query the table model</text><text x="28" y="67" font-size="15">Follow which component is allowed to learn at each stage.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Pretrain graph representations</text><g transform="translate(36 133)"><title id="vs-b17-gtalign-1-title">Pretrain graph representations</title><desc id="vs-b17-gtalign-1-desc">Structural pretraining produces node representations. Graph-level tasks additionally need the declared pooling operation.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text></g><text x="36" y="374" font-size="14" font-weight="650">Graph views → PCA → graph encoder</text><text x="36" y="426" font-size="12">Structural pretraining produces node</text><text x="36" y="443" font-size="12">representations. Graph-level tasks</text><text x="36" y="460" font-size="12">additionally need the declared pooling</text><text x="36" y="477" font-size="12">operation.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Align graph outputs with a TFM</text><g transform="translate(391 133)"><title id="vs-b17-gtalign-2-title">Align graph outputs with a TFM</title><desc id="vs-b17-gtalign-2-desc">Graph embeddings become table rows; communities provide pseudo-labels for alignment episodes. The alignment stage can update both encoder and tabular model.</desc><g transform="translate(0 15) scale(.52)"><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text></g><path d="M161,76 L188,76" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="188.0,76.0 181.0,79.8 181.0,72.2" fill="#087f8c"/><rect x="198" y="35" width="27" height="23" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="228" y="35" width="27" height="23" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="258" y="35" width="27" height="23" rx="3" fill="#fff0de" stroke="#fff"/><rect x="198" y="61" width="27" height="23" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="228" y="61" width="27" height="23" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="258" y="61" width="27" height="23" rx="3" fill="#fff0de" stroke="#fff"/><rect x="198" y="87" width="27" height="23" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="228" y="87" width="27" height="23" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="258" y="87" width="27" height="23" rx="3" fill="#fff0de" stroke="#fff"/><rect x="198" y="113" width="27" height="23" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="228" y="113" width="27" height="23" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="258" y="113" width="27" height="23" rx="3" fill="#fff0de" stroke="#fff"/><text x="150" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">node embeddings become table rows</text></g><text x="391" y="374" font-size="14" font-weight="650">Graph embeddings + community pseudo-</text><text x="391" y="394" font-size="14" font-weight="650">labels → episodes</text><text x="391" y="426" font-size="12">Graph embeddings become table rows;</text><text x="391" y="443" font-size="12">communities provide pseudo-labels for</text><text x="391" y="460" font-size="12">alignment episodes. The alignment stage can</text><text x="391" y="477" font-size="12">update both encoder and tabular model.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Adapt one side of the interface</text><g transform="translate(746 133)"><title id="vs-b17-gtalign-3-title">Adapt one side of the interface</title><desc id="vs-b17-gtalign-3-desc">The target-domain prototype loss updates the graph encoder. Recompute embeddings, then perform in-context prediction with the frozen tabular predictor.</desc><rect x="52" y="28" width="213" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="158.5" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">graph encoder · update</text><path d="M158,68 L158,103" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="158.0,103.0 154.2,96.0 161.8,96.0" fill="#087f8c"/><rect x="52" y="113" width="213" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="158.5" y="133" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">table model · frozen</text><path d="M26,134 L26,43" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="26.0,43.0 29.8,50.0 22.2,50.0" fill="#b46519"/><path d="M26,43 L49,43" fill="none" stroke="#b46519" stroke-width="2"/><polygon points="49.0,43.0 42.0,46.8 42.0,39.2" fill="#b46519"/><text x="150" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">prototype loss updates the encoder</text></g><text x="746" y="374" font-size="14" font-weight="650">Target support adapts graph encoder;</text><text x="746" y="394" font-size="14" font-weight="650">TFM stays frozen</text><text x="746" y="426" font-size="12">The target-domain prototype loss updates the</text><text x="746" y="443" font-size="12">graph encoder. Recompute embeddings, then</text><text x="746" y="460" font-size="12">perform in-context prediction with the frozen</text><text x="746" y="477" font-size="12">tabular predictor.</text><text x="28" y="548" font-size="13">Paper mechanism overview. GTAlign training and evaluation remain NOT_RUN in this lesson.</text><a href="https://arxiv.org/html/2607.11374v1#S2"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2607.11374v1#S2</text></a></svg>