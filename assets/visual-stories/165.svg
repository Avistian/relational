<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">KumoRFM: condition on a relational task</title><desc id="desc">Draw the labeled examples and query as part of a relational context. Functional information-flow view. Public descriptions and the lesson’s evidence boundary govern what is known about internals.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">KumoRFM: condition on a relational task</text><text x="28" y="67" font-size="15">Draw the labeled examples and query as part of a relational context.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Declare the prediction task</text><g transform="translate(36 133)"><title id="vs-165-1-title">Declare the prediction task</title><desc id="vs-165-1-desc">The task tells the system what to predict and when. Admissible database history is determined relative to that task.</desc><rect x="15" y="27" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="49" y="27" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="15" y="50" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="49" y="50" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="15" y="73" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="49" y="73" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="112" y="95" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="146" y="95" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="112" y="118" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="146" y="118" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="112" y="141" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="146" y="141" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="210" y="27" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="244" y="27" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="210" y="50" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="244" y="50" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="210" y="73" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="244" y="73" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><path d="M66,93 L119,121" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="119.0,121.0 111.0,121.1 114.6,114.3" fill="#087f8c"/><path d="M185,122 L233,94" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="233.0,94.0 228.9,100.9 225.0,94.2" fill="#7660ad"/><text x="150" y="206" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">rows linked by foreign keys</text></g><text x="36" y="374" font-size="14" font-weight="650">Database + target entities +</text><text x="36" y="394" font-size="14" font-weight="650">prediction time</text><text x="36" y="426" font-size="12">The task tells the system what to predict and</text><text x="36" y="443" font-size="12">when. Admissible database history is</text><text x="36" y="460" font-size="12">determined relative to that task.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Supply labeled support</text><g transform="translate(391 133)"><title id="vs-165-2-title">Supply labeled support</title><desc id="vs-165-2-desc">Support labels convey the current task. The relational context can carry information beyond a flattened query row.</desc><text x="83" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#087f8c">