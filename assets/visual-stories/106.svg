<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">EdgeBank: remember observed edges</title><desc id="desc">A deliberately simple temporal baseline makes the value of recurrence visible. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">EdgeBank: remember observed edges</text><text x="28" y="67" font-size="15">A deliberately simple temporal baseline makes the value of recurrence visible.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Read historical events</text><g transform="translate(36 133)"><title id="vs-106-1-title">Read historical events</title><desc id="vs-106-1-desc">Admit only events that are available before the query. Decide whether the memory covers all history or a finite window.</desc><path d="M15,121 L285,121" fill="none" stroke="#597181" stroke-width="2"/><polygon points="285.0,121.0 278.0,124.8 278.0,117.2" fill="#597181"/><circle cx="41" cy="121" r="9" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="41" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">t₁</text><circle cx="96" cy="121" r="9" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="96" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">t₂</text><circle cx="151" cy="121" r="9" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="151" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">t₃</text><circle cx="240" cy="121" r="9" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="240" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">query</text><path d="M204,31 L204,178" fill="none" stroke="#b46519" stroke-width="2" stroke-dasharray="5 4"/><text x="150" y="203" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">history     |     prediction cutoff</text></g><text x="36" y="374" font-size="14" font-weight="650">History up to the prediction cutoff</text><text x="36" y="426" font-size="12">Admit only events that are available before</text><text x="36" y="443" font-size="12">the query. Decide whether the memory covers</text><text x="36" y="460" font-size="12">all history or a finite window.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Store edge membership</text><g transform="translate(391 133)"><title id="vs-106-2-title">Store edge membership</title><desc id="vs-106-2-desc">The baseline stores edge occurrence, rather than learning a node-feature transformation.</desc><path d="M15,121 L285,121" fill="none" stroke="#597181" stroke-width="2"/><polygon points="285.0,121.0 278.0,124.8 278.0,117.2" fill="#597181"/><circle cx="41" cy="121" r="9" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="41" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">t₁</text><circle cx="96" cy="121" r="9" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="96" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">t₂</text><circle cx="151" cy="121" r="9" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="151" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">t₃</text><circle cx="240" cy="121" r="9" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="240" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">query</text><path d="M204,31 L204,178" fill="none" stroke="#b46519" stroke-width="2" stroke-dasharray="5 4"/><text x="150" y="203" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">history     |     prediction cutoff</text><rect x="54" y="35" width="160" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="134.0" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">seen endpoint pairs</text></g><text x="391" y="374" font-size="14" font-weight="650">Was this endpoint pair seen in memory?</text><text x="391" y="426" font-size="12">The baseline stores edge occurrence, rather</text><text x="391" y="443" font-size="12">than learning a node-feature transformation.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Score candidate edges</text><g transform="translate(746 133)"><title id="vs-106-3-title">Score candidate edges</title><desc id="vs-106-3-desc">Candidate sampling and the time window can change apparent performance. State them alongside the score.</desc><path d="M65,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M60,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M239,48 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><path d="M242,157 L150,106" fill="none" stroke="#087f8c" stroke-width="2"/><circle cx="150" cy="106" r="19" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="150" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">v</text><circle cx="65" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="65" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">1</text><circle cx="60" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="60" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">2</text><circle cx="239" cy="48" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="239" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">3</text><circle cx="242" cy="157" r="14" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="242" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#233c50">4</text><path d="M65,48 L239,48" fill="none" stroke="#b46519" stroke-width="3" stroke-dasharray="5 4"/><text x="150" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#b46519">candidate edge</text></g><text x="746" y="374" font-size="14" font-weight="650">Seen versus unseen pair → baseline</text><text x="746" y="394" font-size="14" font-weight="650">score</text><text x="746" y="426" font-size="12">Candidate sampling and the time window can</text><text x="746" y="443" font-size="12">change apparent performance. State them</text><text x="746" y="460" font-size="12">alongside the score.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/2207.10128v2#S4"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2207.10128v2#S4</text></a></svg>