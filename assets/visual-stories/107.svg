<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">EvolveGCN: the evolving state is a weight matrix</title><desc id="desc">Distinguish changing graph features from changing the graph-convolution parameters. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">EvolveGCN: the evolving state is a weight matrix</text><text x="28" y="67" font-size="15">Distinguish changing graph features from changing the graph-convolution parameters.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Observe graph snapshots</text><g transform="translate(36 133)"><title id="vs-107-1-title">Observe graph snapshots</title><desc id="vs-107-1-desc">Each snapshot supplies its graph and node features. Node sets can differ between snapshots.</desc><path d="M15,121 L285,121" fill="none" stroke="#597181" stroke-width="2"/><polygon points="285.0,121.0 278.0,124.8 278.0,117.2" fill="#597181"/><circle cx="41" cy="121" r="9" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="41" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">t₁</text><rect x="24" y="39" width="14" height="19" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="41" y="39" width="14" height="19" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="24" y="61" width="14" height="19" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="41" y="61" width="14" height="19" rx="3" fill="#cee5e9" stroke="#fff"/><circle cx="96" cy="121" r="9" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="96" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">t₂</text><rect x="79" y="39" width="14" height="19" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="96" y="39" width="14" height="19" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="79" y="61" width="14" height="19" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="96" y="61" width="14" height="19" rx="3" fill="#cee5e9" stroke="#fff"/><circle cx="151" cy="121" r="9" fill="#e7f3f4" stroke="#087f8c" stroke-width="2"/><text x="151" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">t₃</text><rect x="134" y="39" width="14" height="19" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="151" y="39" width="14" height="19" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="134" y="61" width="14" height="19" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="151" y="61" width="14" height="19" rx="3" fill="#cee5e9" stroke="#fff"/><circle cx="240" cy="121" r="9" fill="#fff0de" stroke="#b46519" stroke-width="2"/><text x="240" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#233c50">query</text><rect x="223" y="39" width="14" height="19" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="240" y="39" width="14" height="19" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="223" y="61" width="14" height="19" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="240" y="61" width="14" height="19" rx="3" fill="#cee5e9" stroke="#fff"/><path d="M204,31 L204,178" fill="none" stroke="#b46519" stroke-width="2" stroke-dasharray="5 4"/><text x="150" y="203" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">history     |     prediction cutoff</text></g><text x="36" y="374" font-size="14" font-weight="650">G₁, G₂, G₃ … with node features</text><text x="36" y="426" font-size="12">Each snapshot supplies its graph and node</text><text x="36" y="443" font-size="12">features. Node sets can differ between</text><text x="36" y="460" font-size="12">snapshots.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Evolve convolution weights</text><g transform="translate(391 133)"><title id="vs-107-2-title">Evolve convolution weights</title><desc id="vs-107-2-desc">In EvolveGCN-H, summarized node embeddings help the GRU evolve weights; the O variant uses a different recurrence.</desc><rect x="6" y="73" width="110" height="30" rx="6" fill="#fff" stroke="#087f8c"/><text x="61.0" y="93" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#087f8c">Wₜ</text><path d="M124,88 L169,88" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="169.0,88.0 162.0,91.8 162.0,84.2" fill="#7660ad"/><rect x="179" y="73" width="115" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="236.5" y="93" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">Wₜ₊₁</text><path d="M233,113 L233,158 L62,158 L62,109" fill="none" stroke="#b46519" stroke-width="2"/><text x="150" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">state reused by later computation</text></g><text x="391" y="374" font-size="14" font-weight="650">Recurrent state → next GCN weight</text><text x="391" y="394" font-size="14" font-weight="650">matrix</text><text x="391" y="426" font-size="12">In EvolveGCN-H, summarized node embeddings</text><text x="391" y="443" font-size="12">help the GRU evolve weights; the O variant</text><text x="391" y="460" font-size="12">uses a different recurrence.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Convolve with current weights</text><g transform="translate(746 133)"><title id="vs-107-3-title">Convolve with current weights</title><desc id="vs-107-3-desc">Apply the GCN with the time-specific weights, then the task head. This is not the same state as TGN’s per-node memory.</desc><rect x="13" y="51" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="38" y="51" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="63" y="51" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="13" y="76" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="38" y="76" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="63" y="76" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="13" y="101" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="38" y="101" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="63" y="101" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><text x="43" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#b46519">S</text><rect x="112" y="51" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="137" y="51" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="162" y="51" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="112" y="76" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="137" y="76" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="162" y="76" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="112" y="101" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="137" y="101" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="162" y="101" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><text x="142" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#087f8c">H</text><rect x="211" y="51" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="236" y="51" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="211" y="76" width="22" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="236" y="76" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="211" y="101" width="22" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="236" y="101" width="22" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><text x="241" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#7660ad">W</text><text x="150" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">node mixing × states × feature map</text></g><text x="746" y="374" font-size="14" font-weight="650">Current graph + evolved Wₜ →</text><text x="746" y="394" font-size="14" font-weight="650">embeddings</text><text x="746" y="426" font-size="12">Apply the GCN with the time-specific weights,</text><text x="746" y="443" font-size="12">then the task head. This is not the same state</text><text x="746" y="460" font-size="12">as TGN’s per-node memory.</text><text x="28" y="548" font-size="13">Conceptual overview; the detailed architecture below specifies the pictured implementation.</text><a href="https://arxiv.org/html/1902.10191v3#S3"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/1902.10191v3#S3</text></a></svg>