<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">RDB-PFN: relational tasks become tabular context</title><desc id="desc">Synthetic relational structure enters through generated tasks and relational features. Synthetic-relational pretraining and released DFS-feature inference route. See the detailed diagram for the selected checkpoint’s six blocks and token dimensions.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">RDB-PFN: relational tasks become tabular context</text><text x="28" y="67" font-size="15">Synthetic relational structure enters through generated tasks and relational features.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Generate linked records</text><g transform="translate(36 133)"><title id="vs-166-1-title">Generate linked records</title><desc id="vs-166-1-desc">Pretraining samples relational databases and prediction tasks. These generators determine which dependencies the learner practices.</desc><text x="45" y="25" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#087f8c">table A</text><rect x="13" y="35" width="28" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="44" y="35" width="28" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="13" y="60" width="28" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="44" y="60" width="28" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="13" y="85" width="28" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="44" y="85" width="28" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><text x="147" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#087f8c">table B</text><rect x="115" y="105" width="28" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="146" y="105" width="28" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="115" y="130" width="28" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="146" y="130" width="28" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="115" y="155" width="28" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="146" y="155" width="28" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><text x="247" y="25" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#087f8c">table C</text><rect x="215" y="35" width="28" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="246" y="35" width="28" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="215" y="60" width="28" height="22" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="246" y="60" width="28" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="215" y="85" width="28" height="22" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="246" y="85" width="28" height="22" rx="3" fill="#d8eef0" stroke="#fff"/><path d="M58,111 L120,137" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="120.0,137.0 112.0,137.8 115.0,130.7" fill="#087f8c"/><path d="M181,137 L241,112" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="241.0,112.0 236.0,118.2 233.0,111.2" fill="#7660ad"/><text x="150" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#597181">sample tables and foreign-key structure</text></g><text x="36" y="374" font-size="14" font-weight="650">Synthetic schema + foreign keys +</text><text x="36" y="394" font-size="14" font-weight="650">table contents</text><text x="36" y="426" font-size="12">Pretraining samples relational databases and</text><text x="36" y="443" font-size="12">prediction tasks. These generators determine</text><text x="36" y="460" font-size="12">which dependencies the learner practices.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Construct relational features</text><g transform="translate(391 133)"><title id="vs-166-2-title">Construct relational features</title><desc id="vs-166-2-desc">Deep Feature Synthesis turns relational neighborhoods into tabular attributes such as counts and means. The released checkpoint receives this feature matrix, not raw graph edges.</desc><rect x="9" y="27" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="34" y="27" width="22" height="21" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="9" y="51" width="22" height="21" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="34" y="51" width="22" height="21" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="9" y="75" width="22" height="21" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="34" y="75" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="25" y="115" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="50" y="115" width="22" height="21" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="25" y="139" width="22" height="21" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="50" y="139" width="22" height="21" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="25" y="163" width="22" height="21" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="50" y="163" width="22" height="21" rx="3" fill="#d8eef0" stroke="#fff"/><path d="M75,67 L128,97" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="128.0,97.0 120.0,96.9 123.8,90.2" fill="#087f8c"/><path d="M85,143 L128,111" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="128.0,111.0 124.7,118.3 120.1,112.1" fill="#087f8c"/><rect x="133" y="89" width="70" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="168.0" y="109" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">DFS</text><path d="M207,104 L231,104" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="231.0,104.0 224.0,107.8 224.0,100.2" fill="#087f8c"/><rect x="237" y="65" width="23" height="24" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="263" y="65" width="23" height="24" rx="3" fill="#fff0de" stroke="#fff"/><rect x="237" y="92" width="23" height="24" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="263" y="92" width="23" height="24" rx="3" fill="#fff0de" stroke="#fff"/><rect x="237" y="119" width="23" height="24" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="263" y="119" width="23" height="24" rx="3" fill="#fff0de" stroke="#fff"/><text x="150" y="211" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">relational records → flat features</text></g><text x="391" y="374" font-size="14" font-weight="650">Related records → DFS aggregates →</text><text x="391" y="394" font-size="14" font-weight="650">feature table</text><text x="391" y="426" font-size="12">Deep Feature Synthesis turns relational</text><text x="391" y="443" font-size="12">neighborhoods into tabular attributes such as</text><text x="391" y="460" font-size="12">counts and means. The released checkpoint</text><text x="391" y="477" font-size="12">receives this feature matrix, not raw graph</text><text x="391" y="494" font-size="12">edges.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Predict from labeled support</text><g transform="translate(746 133)"><title id="vs-166-3-title">Predict from labeled support</title><desc id="vs-166-3-desc">The transformer mixes features and support rows. Query labels remain hidden; a decoder reads the query label token. Evaluation uses fixed pretrained weights.</desc><rect x="52" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="26" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="52" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="91" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="55" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="169" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="208" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="52" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="91" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="130" y="84" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="169" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="208" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="52" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="113" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><path d="M53,163 L243,163" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="243.0,163.0 236.0,166.8 236.0,159.2" fill="#087f8c"/><path d="M267,139 L267,30" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="267.0,30.0 270.8,37.0 263.2,37.0" fill="#7660ad"/><text x="150" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">feature mixing ↔ row mixing</text></g><text x="746" y="374" font-size="14" font-weight="650">Feature tokens + support labels →</text><text x="746" y="394" font-size="14" font-weight="650">query logits</text><text x="746" y="426" font-size="12">The transformer mixes features and support</text><text x="746" y="443" font-size="12">rows. Query labels remain hidden; a decoder</text><text x="746" y="460" font-size="12">reads the query label token. Evaluation uses</text><text x="746" y="477" font-size="12">fixed pretrained weights.</text><text x="28" y="548" font-size="13">Synthetic-relational pretraining and released DFS-feature inference route. See the detailed diagram for the selected checkpoint’s</text><text x="28" y="566" font-size="13">six blocks and token dimensions.</text><a href="https://arxiv.org/html/2603.03805v5#S5"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2603.03805v5#S5</text></a></svg>