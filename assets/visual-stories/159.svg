<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">Mask a cell, learn from its context</title><desc id="desc">A relational pretraining objective must define both the hidden target and the visible evidence. Conceptual relational masked-prediction objective, not a claim that one fixed architecture implements every vision paper.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">Mask a cell, learn from its context</text><text x="28" y="67" font-size="15">A relational pretraining objective must define both the hidden target and the visible evidence.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Choose the hidden value</text><g transform="translate(36 133)"><title id="vs-159-1-title">Choose the hidden value</title><desc id="vs-159-1-desc">Select a cell or target to predict, then remove its value from the visible input.</desc><rect x="40" y="25" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="85" y="25" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="25" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="175" y="25" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="220" y="25" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="55" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="85" y="55" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="55" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="175" y="55" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="220" y="55" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="85" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="85" y="85" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="130" y="85" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="175" y="85" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="220" y="85" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="115" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="85" y="115" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="115" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="175" y="115" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="220" y="115" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="145" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="85" y="145" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="145" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="175" y="145" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="220" y="145" width="42" height="27" rx="3" fill="#fff" stroke="#b46519"/><text x="241.0" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><text x="150" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">rows × columns; target hidden</text></g><text x="36" y="374" font-size="14" font-weight="650">Observed database + explicitly hidden</text><text x="36" y="394" font-size="14" font-weight="650">target</text><text x="36" y="426" font-size="12">Select a cell or target to predict, then</text><text x="36" y="443" font-size="12">remove its value from the visible input.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Build the allowed context</text><g transform="translate(391 133)"><title id="vs-159-2-title">Build the allowed context</title><desc id="vs-159-2-desc">The schema can connect informative records. Copies of the hidden value and unavailable future information still need exclusion.</desc><rect x="15" y="27" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="49" y="27" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="15" y="50" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="49" y="50" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="15" y="73" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="49" y="73" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="112" y="95" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="146" y="95" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="112" y="118" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="146" y="118" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="112" y="141" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="146" y="141" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="210" y="27" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="244" y="27" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="210" y="50" width="31" height="20" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="244" y="50" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="210" y="73" width="31" height="20" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="244" y="73" width="31" height="20" rx="3" fill="#d8eef0" stroke="#fff"/><path d="M66,93 L119,121" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="119.0,121.0 111.0,121.1 114.6,114.3" fill="#087f8c"/><path d="M185,122 L233,94" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="233.0,94.0 228.9,100.9 225.0,94.2" fill="#7660ad"/><text x="150" y="206" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">rows linked by foreign keys</text></g><text x="391" y="374" font-size="14" font-weight="650">Related rows can supply predictive</text><text x="391" y="394" font-size="14" font-weight="650">evidence</text><text x="391" y="426" font-size="12">The schema can connect informative records.</text><text x="391" y="443" font-size="12">Copies of the hidden value and unavailable</text><text x="391" y="460" font-size="12">future information still need exclusion.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Predict the missing content</text><g transform="translate(746 133)"><title id="vs-159-3-title">Predict the missing content</title><desc id="vs-159-3-desc">A loss teaches the model to recover the target from allowed context. The objective alone does not establish transfer to a new database.</desc><path d="M28,168 L276,168" fill="none" stroke="#597181" stroke-width="2"/><path d="M28,168 L28,40" fill="none" stroke="#597181" stroke-width="2"/><rect x="46" y="142" width="29" height="26" rx="4" fill="#aacfd5" stroke="none"/><rect x="91" y="93" width="29" height="75" rx="4" fill="#66acb6" stroke="none"/><rect x="136" y="54" width="29" height="114" rx="4" fill="#7660ad" stroke="none"/><rect x="181" y="107" width="29" height="61" rx="4" fill="#66acb6" stroke="none"/><rect x="226" y="146" width="29" height="22" rx="4" fill="#aacfd5" stroke="none"/><text x="150" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">predictive output</text></g><text x="746" y="374" font-size="14" font-weight="650">Shared representations → configured</text><text x="746" y="394" font-size="14" font-weight="650">prediction head</text><text x="746" y="426" font-size="12">A loss teaches the model to recover the target</text><text x="746" y="443" font-size="12">from allowed context. The objective alone does</text><text x="746" y="460" font-size="12">not establish transfer to a new database.</text><text x="28" y="548" font-size="13">Conceptual relational masked-prediction objective, not a claim that one fixed architecture implements every vision paper.</text><a href="https://arxiv.org/html/2305.15321v1#S2"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2305.15321v1#S2</text></a></svg>