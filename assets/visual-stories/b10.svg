<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">Relational Transformer: cells communicate through the schema</title><desc id="desc">A foreign key determines routes between cells in different rows. Conceptual cell-level routing view. Use the source-linked detailed diagram for the exact Relational Transformer operator.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">Relational Transformer: cells communicate through the schema</text><text x="28" y="67" font-size="15">A foreign key determines routes between cells in different rows.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Tokenize database cells</text><g transform="translate(36 133)"><title id="vs-b10-1-title">Tokenize database cells</title><desc id="vs-b10-1-desc">Represent individual cells rather than committing immediately to one fixed vector per row.</desc><rect x="22" y="30" width="80" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="62.0" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">age</text><rect x="110" y="30" width="80" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="150.0" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">type</text><rect x="198" y="30" width="80" height="30" rx="6" fill="#fff" stroke="#7660ad"/><text x="238.0" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650" fill="#7660ad">value</text><rect x="25" y="100" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="43" y="100" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="61" y="100" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="79" y="100" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><rect x="113" y="100" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="131" y="100" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="149" y="100" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="167" y="100" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><rect x="201" y="100" width="14" height="24" rx="3" fill="#c9e7e8" stroke="#087f8c"/><rect x="219" y="100" width="14" height="24" rx="3" fill="#8bc5ca" stroke="#087f8c"/><rect x="237" y="100" width="14" height="24" rx="3" fill="#459eaa" stroke="#087f8c"/><rect x="255" y="100" width="14" height="24" rx="3" fill="#087f8c" stroke="#087f8c"/><text x="150" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">Retain a key and value per cell</text></g><text x="36" y="374" font-size="14" font-weight="650">Each cell carries content and its</text><text x="36" y="394" font-size="14" font-weight="650">schema role</text><text x="36" y="426" font-size="12">Represent individual cells rather than</text><text x="36" y="443" font-size="12">committing immediately to one fixed vector per</text><text x="36" y="460" font-size="12">row.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Apply four attention routes</text><g transform="translate(391 133)"><title id="vs-b10-2-title">Apply four attention routes</title><desc id="vs-b10-2-desc">RT-v1 applies separately parameterized attention sublayers in sequence, then a feed-forward update. Relational masks structure some routes; the full-attention sublayer also mixes across the admitted context.</desc><text x="68" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#087f8c">column</text><rect x="131" y="12" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="154" y="12" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><rect x="177" y="12" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><rect x="200" y="12" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="223" y="12" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><rect x="246" y="12" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><rect x="131" y="24" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><rect x="154" y="24" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="177" y="24" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><rect x="200" y="24" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><rect x="223" y="24" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="246" y="24" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><rect x="131" y="36" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><rect x="154" y="36" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><rect x="177" y="36" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="200" y="36" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><rect x="223" y="36" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><rect x="246" y="36" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><text x="68" y="84" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#7660ad">feature</text><rect x="131" y="60" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="154" y="60" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="177" y="60" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="200" y="60" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><rect x="223" y="60" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><r