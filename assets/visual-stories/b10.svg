ting</text><text x="746" y="443" font-size="12">representation. The visibility mask must</text><text x="746" y="460" font-size="12">exclude target values and inadmissible copies.</text><text x="28" y="548" font-size="13">Conceptual cell-level routing view. Use the source-linked detailed diagram for the exact Relational Transformer operator.</text><a href="https://arxiv.org/html/2510.06377v1#S3.SS1"><text x="28" y="604" font-size="13">Source: https://arxiv.org/html/2510.06377v1#S3.SS1</text></a></svg>