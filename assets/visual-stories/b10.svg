" y="120" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="246" y="120" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="131" y="132" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><rect x="154" y="132" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><rect x="177" y="132" width="18" height="9" rx="2" fill="#e5eef1" stroke="none"/><rect x="200" y="132" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="223" y="132" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="246" y="132" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><text x="68" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#7660ad">full</text><rect x="131" y="156" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="154" y="156" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="177" y="156" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="200" y="156" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="223" y="156" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="246" y="156" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="131" y="168" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="154" y="168" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="177" y="168" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="200" y="168" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="223" y="168" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="246" y="168" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="131" y="180" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="154" y="180" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="177" y="180" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="200" y="180" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="223" y="180" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><rect x="246" y="180" width="18" height="9" rx="2" fill="#087f8c" stroke="none"/><text x="150" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#597181">separate masks; sequential sublayers</text></g><text x="391" y="374" font-size="14" font-weight="650">Column → feature → neighbor → full</text><text x="391" y="394" font-size="14" font-weight="650">attention</text><text x="391" y="426" font-size="12">RT-v1 applies separately parameterized</text><text x="391" y="443" font-size="12">attention sublayers in sequence, then a feed-</text><text x="391" y="460" font-size="12">forward update. Relational masks structure</text><text x="391" y="477" font-size="12">some routes; the full-attention sublayer also</text><text x="391" y="494" font-size="12">mixes across the admitted context.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Read the masked task cell</text><g transform="translate(746 133)"><title id="vs-b10-3-title">Read the masked task cell</title><desc id="vs-b10-3-desc">Predict the masked target from the resulting representation. The visibility mask must exclude target values and inadmissible copies.</desc><rect x="40" y="25" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="85" y="25" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="25" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="175" y="25" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="220" y="25" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="55" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="85" y="55" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x=