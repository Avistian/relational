<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">TabICL: change the unit of attention</title><desc id="desc">First understand a column, then a row, then the labeled dataset. Conceptual overview; the detailed architecture below specifies the pictured implementation.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">TabICL: change the unit of attention</text><text x="28" y="67" font-size="15">First understand a column, then a row, then the labeled dataset.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Learn column context</text><g transform="translate(36 133)"><title id="vs-66-1-title">Learn column context</title><desc id="vs-66-1-desc">Column processing uses a compact set of inducing points to construct contextual cell representations.</desc><rect x="52" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="26" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="52" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="91" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="55" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="169" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="208" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="52" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="91" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="130" y="84" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="169" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="208" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="52" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="113" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><circle cx="75" cy="177" r="10" fill="#eee9fa" stroke="#7660ad" stroke-width="2"/><path d="M75,137 L75,161" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="75.0,161.0 71.2,154.0 78.8,154.0" fill="#7660ad"/><circle cx="150" cy="177" r="10" fill="#eee9fa" stroke="#7660ad" stroke-width="2"/><path d="M150,137 L150,161" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="150.0,161.0 146.2,154.0 153.8,154.0" fill="#7660ad"/><circle cx="225" cy="177" r="10" fill="#eee9fa" stroke="#7660ad" stroke-width="2"/><path d="M225,137 L225,161" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="225.0,161.0 221.2,154.0 228.8,154.0" fill="#7660ad"/><text x="150" y="213" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">compact inducing-point set</text></g><text x="36" y="374" font-size="14" font-weight="650">Column values ↔ inducing points</text><text x="36" y="426" font-size="12">Column processing uses a compact set of</text><text x="36" y="443" font-size="12">inducing points to construct contextual cell</text><text x="36" y="460" font-size="12">representations.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Compress each row</text><g transform="translate(391 133)"><title id="vs-66-2-title">Compress each row</title><desc id="vs-66-2-desc">Row attention combines a row’s feature representations. The dataset-level learner then works on rows rather than the full cell grid.</desc><rect x="52" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="26" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="52" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="91" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="55" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="169" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="208" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="52" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="91" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="130" y="84" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="169" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="208" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="52" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="113" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><path d="M247,40 L273,40" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="273.0,40.0 266.0,43.8 266.