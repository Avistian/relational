<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">TabPFN v2: attend along two table axes</title><desc id="desc">Keep rows and feature groups visible before reading out the target. Historical TabPFN v2 conceptual route; grouping, masks and ensemble settings are detailed in the lesson.</desc><rect width="1080" height="630" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="28" y="37" font-size="24" font-weight="650">TabPFN v2: attend along two table axes</text><text x="28" y="67" font-size="15">Keep rows and feature groups visible before reading out the target.</text><rect x="20" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="36" y="121" font-size="16" font-weight="650">1. Make a token grid</text><g transform="translate(36 133)"><title id="vs-64-1-title">Make a token grid</title><desc id="vs-64-1-desc">Preprocessing and feature grouping produce a structured token grid. The target is represented with the required support/query masking.</desc><rect x="40" y="25" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="85" y="25" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="25" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="175" y="25" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="220" y="25" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="55" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="85" y="55" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="55" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="175" y="55" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="220" y="55" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="85" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="85" y="85" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="130" y="85" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="175" y="85" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="220" y="85" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="115" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="85" y="115" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="115" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="175" y="115" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="220" y="115" width="42" height="27" rx="3" fill="#fff0de" stroke="#fff"/><rect x="40" y="145" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="85" y="145" width="42" height="27" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="145" width="42" height="27" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="175" y="145" width="42" height="27" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="220" y="145" width="42" height="27" rx="3" fill="#fff" stroke="#b46519"/><text x="241.0" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#b46519">?</text><text x="150" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#597181">rows × columns; target hidden</text></g><text x="36" y="374" font-size="14" font-weight="650">Rows × feature groups × hidden width</text><text x="36" y="426" font-size="12">Preprocessing and feature grouping produce a</text><text x="36" y="443" font-size="12">structured token grid. The target is</text><text x="36" y="460" font-size="12">represented with the required support/query</text><text x="36" y="477" font-size="12">masking.</text><rect x="375" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="391" y="121" font-size="16" font-weight="650">2. Alternate attention axes</text><g transform="translate(391 133)"><title id="vs-64-2-title">Alternate attention axes</title><desc id="vs-64-2-desc">Feature attention combines information within an example. Row attention supplies evidence from the observed examples; the attention mask controls access.</desc><rect x="52" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="26" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="26" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="26" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="52" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="91" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="130" y="55" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="169" y="55" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="208" y="55" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="52" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="91" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="130" y="84" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="169" y="84" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="208" y="84" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="52" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="91" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><rect x="130" y="113" width="36" height="26" rx="3" fill="#cee5e9" stroke="#fff"/><rect x="169" y="113" width="36" height="26" rx="3" fill="#d8eef0" stroke="#fff"/><rect x="208" y="113" width="36" height="26" rx="3" fill="#edf5f6" stroke="#fff"/><path d="M53,163 L243,163" fill="none" stroke="#087f8c" stroke-width="2"/><polygon points="243.0,163.0 236.0,166.8 236.0,159.2" fill="#087f8c"/><path d="M267,139 L267,30" fill="none" stroke="#7660ad" stroke-width="2"/><polygon points="267.0,30.0 270.8,37.0 263.2,37.0" fill="#7660ad"/><text x="150" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">feature mixing ↔ row mixing</text></g><text x="391" y="374" font-size="14" font-weight="650">Across features, then across data rows</text><text x="391" y="426" font-size="12">Feature attention combines information within</text><text x="391" y="443" font-size="12">an example. Row attention supplies evidence</text><text x="391" y="460" font-size="12">from the observed examples; the attention mask</text><text x="391" y="477" font-size="12">controls access.</text><rect x="730" y="92" width="335" height="420" rx="14" fill="#f6fafb" stroke="#d1dfe4"/><text x="746" y="121" font-size="16" font-weight="650">3. Decode the query target</text><g transform="translate(746 133)"><title id="vs-64-3-title">Decode the query target</title><desc id="vs-64-3-desc">Read the query target representation after the repeated blocks. Classification and regression have different output contracts.</desc><path d="M28,168 L276,168" fill="none" stroke="#597181" stroke-width="2"/><path d="M28,168 L28,40" fill="none" stroke="#597181" stroke-width="2"/><rect x="46" y="142" width="29" height="26" rx="4" fill="#aacfd5" stroke="none"/><rect x="91" y="93" width="29" height="75" rx="4" fill="#66acb6" stroke="none"/><rect x="136" y="54" width="29" height="114" rx="4" fill="#7660ad" stroke="none"/><rect x="181" y="107" width="29" height="61" rx="4" fill="#66acb6" stroke="none"/><rect x="226" y="146" width="29" height="22" rx="4" fill="#aacfd5" stroke="none"/><text x="150" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#597181">predictive output</text></g><text x="746" y="374" font-size="14" font-weight="650">Target representation → predictive</text><text x="746" y="394" font-size="14" font-weight="650">head</text><text x="746" y="426" font-size="12">Read the query target representation after the</text><text x="746" y="443" font-size="12">repeated blocks. Classification and regression</text><text x="746" y="460" font-size="12">have different output contracts.</text><text x="28" y="548" font-size="13">Historical TabPFN v2 conceptual route; grouping, masks and ensemble settings are detailed in the lesson.</text><a href="https://www.nature.com/articles/s41586-024-08328-6"><text x="28" y="604" font-size="13">Source: https://www.nature.com/articles/s41586-024-08328-6</text></a></svg>