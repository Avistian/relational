<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">One pooled encoder, separate prediction heads</title><desc id="desc">The course model pools same-row cells and dated foreign-key-parent cells separately. Their vectors and a query-column embedding concatenate to width 96, then a 96→64→32 MLP feeds 21 local task heads.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">One pooled encoder, separate prediction heads</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><text x="175" y="110" font-size="19" style="fill:#233c50" text-anchor="middle">same-row cells</text><rect x="80" y="135" width="44" height="40" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="128" y="135" width="44" height="40" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="176" y="135" width="44" height="40" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="224" y="135" width="44" height="40" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><path d="M175 188L175 217" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="50" y="223" width="250" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="175.0" y="255.0" font-size="18" style="fill:#087f83" text-anchor="middle">embedding → mean</text><text x="175" y="306" font-size="21" style="fill:#087f83" text-anchor="middle">32</text><path d="M175 318L492 353" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="487" y="110" font-size="19" style="fill:#233c50" text-anchor="middle">dated FK-parent cells</text><rect x="392" y="135" width="44" height="40" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="440" y="135" width="44" height="40" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="488" y="135" width="44" height="40" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="536" y="135" width="44" height="40" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><path d="M487 188L487 217" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="362" y="223" width="250" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="487.0" y="255.0" font-size="18" style="fill:#087f83" text-anchor="middle">embedding → mean</text><text x="487" y="306" font-size="21" style="fill:#087f83" text-anchor="middle">32</text><path d="M487 318L492 353" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="799" y="110" font-size="19" style="fill:#233c50" text-anchor="middle">query-column ID</text><rect x="704" y="135" width="44" height="40" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="752" y="135" width="44" height="40" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="800" y="135" width="44" height="40" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="848" y="135" width="44" height="40" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><path d="M799 188L799 217" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="674" y="223" width="250" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="799.0" y="255.0" font-size="18" style="fill:#087f83" text-anchor="middle">column embedding</text><text x="799" y="306" font-size="21" style="fill:#087f83" text-anchor="middle">32</text><path d="M799 318L492 353" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="347" y="358" width="290" height="52" rx="9" fill="#f4f8fa" stroke="#7656a6"/><text x="492.0" y="390.0" font-size="18" style="fill:#7656a6" text-anchor="middle">concat 96 → MLP 64 → 32</text><path d="M493 415L185 442" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="57" y="448" width="256" height="52" rx="9" fill="#f4f8fa" stroke="#ab650a"/><text x="185.0" y="480.0" font-size="18" style="fill:#ab650a" text-anchor="middle">numeric head</text><path d="M493 415L493 442" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="365" y="448" width="256" height="52" rx="9" fill="#f4f8fa" stroke="#ab650a"/><text x="493.0" y="480.0" font-size="18" style="fill:#ab650a" text-anchor="middle">categorical head</text><path d="M493 415L801 442" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="673" y="448" width="256" height="52" rx="9" fill="#f4f8fa" stroke="#ab650a"/><text x="801.0" y="480.0" font-size="18" style="fill:#ab650a" text-anchor="middle">… 21 local heads</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">Erase the target identity on every route before pooling the context.</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">Course encoder with task-specific heads; this is not an RT attention block or cross-schema ICL.</text></svg>