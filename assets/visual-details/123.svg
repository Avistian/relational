<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">A root-owned cutoff stays fixed across hops</title><desc id="desc">For this REG contract, every sampled hop belongs to the query at time 8. A Memo at time 7 may inform a Transfer at time 4; a record arriving at time 11 remains excluded.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">A root-owned cutoff stays fixed across hops</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><text x="50" y="106" font-size="21" style="fill:#233c50" text-anchor="start">The clock belongs to the root query</text><circle cx="120" cy="245" r="49" fill="white" stroke="#087f83" stroke-width="3"/><text x="120" y="251" font-size="17" style="fill:#087f83" text-anchor="middle">query</text><circle cx="440" cy="245" r="49" fill="white" stroke="#087f83" stroke-width="3"/><text x="440" y="251" font-size="17" style="fill:#087f83" text-anchor="middle">Transfer</text><circle cx="760" cy="245" r="49" fill="white" stroke="#087f83" stroke-width="3"/><text x="760" y="251" font-size="17" style="fill:#087f83" text-anchor="middle">Memo</text><path d="M172 245L386 245" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M492 245L706 245" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="280" y="217" font-size="18" style="fill:#087f83" text-anchor="middle">edge / event 4</text><text x="600" y="217" font-size="18" style="fill:#087f83" text-anchor="middle">event time 7</text><rect x="43" y="330" width="154" height="52" rx="9" fill="#f4f8fa" stroke="#ab650a"/><text x="120.0" y="362.0" font-size="18" style="fill:#ab650a" text-anchor="middle">cutoff = 8</text><rect x="363" y="330" width="154" height="52" rx="9" fill="#f4f8fa" stroke="#ab650a"/><text x="440.0" y="362.0" font-size="18" style="fill:#ab650a" text-anchor="middle">cutoff = 8</text><rect x="683" y="330" width="154" height="52" rx="9" fill="#f4f8fa" stroke="#ab650a"/><text x="760.0" y="362.0" font-size="18" style="fill:#ab650a" text-anchor="middle">cutoff = 8</text><circle cx="760" cy="425" r="27" fill="white" stroke="#b54e55" stroke-width="3"/><text x="760" y="431" font-size="17" style="fill:#b54e55" text-anchor="middle">late</text><path d="M492 268L729 413" stroke="#b54e55" stroke-width="3" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="475" y="455" font-size="18" style="fill:#b54e55" text-anchor="start">arrival 11 &gt; root cutoff 8</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">Same root cutoff at every hop.</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">This REG policy differs from edge-time recursion.</text></svg>