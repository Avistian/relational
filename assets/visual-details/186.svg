<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Fast response, stale evidence</title><desc id="desc">An event can wait for a refresh before it reaches the cached representation. A quick response measures serving latency; it does not prove the evidence is fresh.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">Fast response, stale evidence</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><text x="50" y="112" font-size="21" style="fill:#233c50" text-anchor="start">Illustrative timing: short request, old cached evidence</text><path d="M85 245L924 245" stroke="#657b8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="120" cy="245" r="14" fill="white" stroke="#087f83" stroke-width="3"/><text x="120" y="251" font-size="17" style="fill:#087f83" text-anchor="middle">•</text><text x="120" y="180" font-size="17" style="fill:#233c50" text-anchor="middle">source event</text><text x="120" y="212" font-size="17" style="fill:#657b8b" text-anchor="middle">0 ms</text><circle cx="660" cy="245" r="14" fill="white" stroke="#087f83" stroke-width="3"/><text x="660" y="251" font-size="17" style="fill:#087f83" text-anchor="middle">•</text><text x="660" y="180" font-size="17" style="fill:#233c50" text-anchor="middle">cache refresh</text><text x="660" y="212" font-size="17" style="fill:#657b8b" text-anchor="middle">2000 ms</text><circle cx="810" cy="245" r="14" fill="white" stroke="#ab650a" stroke-width="3"/><text x="810" y="251" font-size="17" style="fill:#ab650a" text-anchor="middle">•</text><text x="810" y="180" font-size="17" style="fill:#233c50" text-anchor="middle">request</text><text x="810" y="212" font-size="17" style="fill:#657b8b" text-anchor="middle">2100 ms</text><circle cx="920" cy="245" r="14" fill="white" stroke="#ab650a" stroke-width="3"/><text x="920" y="251" font-size="17" style="fill:#ab650a" text-anchor="middle">•</text><text x="920" y="180" font-size="17" style="fill:#233c50" text-anchor="middle">response</text><text x="920" y="212" font-size="17" style="fill:#657b8b" text-anchor="middle">2120 ms</text><path d="M120 283L920 283" stroke="#657b8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="520" y="313" font-size="19" style="fill:#657b8b" text-anchor="middle">source age at response = 2120 ms</text><path d="M120 348L660 348" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="390" y="380" font-size="20" style="fill:#7656a6" text-anchor="middle">incorporation lag = 2000 ms</text><path d="M810 418L920 418" stroke="#ab650a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="770" y="459" font-size="20" style="fill:#ab650a" text-anchor="middle">response latency = 20 ms</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">The state can answer quickly while missing recent source changes.</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">Illustrative durations, not a measured serving benchmark. Intervals are not drawn to scale.</text></svg>