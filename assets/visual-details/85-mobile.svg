<svg xmlns="http://www.w3.org/2000/svg" width="320" height="871" viewBox="0 0 320 871" role="img" aria-labelledby="title desc"><title id="title">One averaging step can erase a node distinction</title><desc id="desc">For two connected nodes with self-loops, S has every entry 1/2. Multiplying [2,8] gives [5,5]; the common component remains while the difference vanishes.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="871" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="390" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Start with distinct nodes</text><g transform="translate(0 60)"><path d="M90.0 100.0L209.0 100.0" fill="none" stroke="#087f83" stroke-width="2"/><circle cx="65" cy="100" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="65" y="105" font-size="16" fill="#087f83" text-anchor="middle">2</text><circle cx="235" cy="100" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="235" y="105" font-size="16" fill="#087f83" text-anchor="middle">8</text><text x="150" y="171" font-size="20" fill="#7656a6" text-anchor="middle">difference = 6</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">The equal-degree, self-looped</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">two-node graph has S entries</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">equal to 1/2.</text></g><g transform="translate(10 438)"><rect x="0" y="0" width="300" height="390" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Apply the actual matrix</text><g transform="translate(0 60)"><rect x="32" y="36" width="48" height="39" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="56.0" y="60.5" font-size="16" fill="#087f83" text-anchor="middle">½</text><rect x="84" y="36" width="48" height="39" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="108.0" y="60.5" font-size="16" fill="#087f83" text-anchor="middle">½</text><rect x="32" y="79" width="48" height="39" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="56.0" y="103.5" font-size="16" fill="#087f83" text-anchor="middle">½</text><rect x="84" y="79" width="48" height="39" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="108.0" y="103.5" font-size="16" fill="#087f83" text-anchor="middle">½</text><text x="161" y="95" font-size="24" fill="#233c50" text-anchor="start">×</text><rect x="190" y="36" width="44" height="39" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="212.0" y="60.5" font-size="16" fill="#087f83" text-anchor="middle">2</text><rect x="190" y="79" width="44" height="39" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="212.0" y="103.5" font-size="16" fill="#087f83" text-anchor="middle">8</text><text x="150" y="176" font-size="25" fill="#087f83" text-anchor="middle">= [5, 5]</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Both outputs equal 5. This</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">exact example does not describe</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">every unequal-degree graph.</text></g></g></svg>