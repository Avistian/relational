<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Gather by source, scatter by destination</title><desc id="desc">For edge_index=[[0,2],[1,1]] and x=[2,4,8], the source gather yields [2,8]. Destination sum writes [0,10,0]. This is the routing primitive, before GCN loops and normalization.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">Gather by source, scatter by destination</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><text x="45" y="106" font-size="23" style="fill:#233c50" text-anchor="start">x = [2, 4, 8]</text><text x="390" y="106" font-size="23" style="fill:#233c50" text-anchor="start">edge_index</text><text x="785" y="106" font-size="23" style="fill:#233c50" text-anchor="start">output</text><rect x="100" y="156" width="90" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="145.0" y="188.0" font-size="18" style="fill:#087f83" text-anchor="middle">2</text><text x="62" y="189" font-size="18" style="fill:#657b8b" text-anchor="middle">0</text><rect x="816" y="156" width="90" height="52" rx="9" fill="#f4f8fa" stroke="#ab650a"/><text x="861.0" y="188.0" font-size="18" style="fill:#ab650a" text-anchor="middle">0</text><rect x="100" y="264" width="90" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="145.0" y="296.0" font-size="18" style="fill:#087f83" text-anchor="middle">4</text><text x="62" y="297" font-size="18" style="fill:#657b8b" text-anchor="middle">1</text><rect x="816" y="264" width="90" height="52" rx="9" fill="#f4f8fa" stroke="#ab650a"/><text x="861.0" y="296.0" font-size="18" style="fill:#ab650a" text-anchor="middle">10</text><rect x="100" y="372" width="90" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="145.0" y="404.0" font-size="18" style="fill:#087f83" text-anchor="middle">8</text><text x="62" y="405" font-size="18" style="fill:#657b8b" text-anchor="middle">2</text><rect x="816" y="372" width="90" height="52" rx="9" fill="#f4f8fa" stroke="#ab650a"/><text x="861.0" y="404.0" font-size="18" style="fill:#ab650a" text-anchor="middle">0</text><text x="368" y="155" font-size="17" style="fill:#657b8b" text-anchor="start">source</text><text x="526" y="155" font-size="17" style="fill:#657b8b" text-anchor="start">destination</text><rect x="382" y="180" width="84" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="424.0" y="212.0" font-size="18" style="fill:#087f83" text-anchor="middle">0</text><rect x="548" y="180" width="84" height="52" rx="9" fill="#f4f8fa" stroke="#7656a6"/><text x="590.0" y="212.0" font-size="18" style="fill:#7656a6" text-anchor="middle">1</text><path d="M195 182L374 206" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M471 206L540 206" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="507" y="256" font-size="17" style="fill:#087f83" text-anchor="middle">message 2</text><path d="M640 206L809 290" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="382" y="339" width="84" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="424.0" y="371.0" font-size="18" style="fill:#087f83" text-anchor="middle">2</text><rect x="548" y="339" width="84" height="52" rx="9" fill="#f4f8fa" stroke="#7656a6"/><text x="590.0" y="371.0" font-size="18" style="fill:#7656a6" text-anchor="middle">1</text><path d="M195 398L374 365" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M471 365L540 365" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="507" y="415" font-size="17" style="fill:#087f83" text-anchor="middle">message 8</text><path d="M640 365L809 290" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="757" y="457" font-size="23" style="fill:#ab650a" text-anchor="start">2 + 8 = 10</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">Two columns in edge_index mean two edges: 0→1 and 2→1.</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">Declare all 3 nodes. This sum-routing primitive omits GCN loops and degree normalization.</text></svg>