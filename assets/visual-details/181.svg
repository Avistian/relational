<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Masking the answer and excluding the future solve different problems</title><desc id="desc">An autocomplete query hides its own target cell. A separate temporal eligibility rule excludes future rows. Masking every historical value of the target column would change the context contract.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">Masking the answer and excluding the future solve different problems</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><text x="55" y="111" font-size="21" style="fill:#233c50" text-anchor="start">Rows available by the query cutoff</text><text x="330" y="153" font-size="18" style="fill:#657b8b" text-anchor="middle">field A</text><text x="485" y="153" font-size="18" style="fill:#657b8b" text-anchor="middle">field B</text><text x="640" y="153" font-size="18" style="fill:#657b8b" text-anchor="middle">target</text><text x="65" y="211" font-size="19" style="fill:#233c50" text-anchor="start">history 1</text><rect x="263" y="179" width="137" height="51" rx="9" fill="#e1f1ed" stroke="#087f83"/><text x="330" y="212" font-size="17" style="fill:#087f83" text-anchor="middle">observed</text><rect x="418" y="179" width="137" height="51" rx="9" fill="#e1f1ed" stroke="#087f83"/><text x="485" y="212" font-size="17" style="fill:#087f83" text-anchor="middle">observed</text><rect x="573" y="179" width="137" height="51" rx="9" fill="#e1f1ed" stroke="#087f83"/><text x="640" y="212" font-size="17" style="fill:#087f83" text-anchor="middle">observed</text><text x="65" y="276" font-size="19" style="fill:#233c50" text-anchor="start">history 2</text><rect x="263" y="244" width="137" height="51" rx="9" fill="#e1f1ed" stroke="#087f83"/><text x="330" y="277" font-size="17" style="fill:#087f83" text-anchor="middle">observed</text><rect x="418" y="244" width="137" height="51" rx="9" fill="#e1f1ed" stroke="#087f83"/><text x="485" y="277" font-size="17" style="fill:#087f83" text-anchor="middle">observed</text><rect x="573" y="244" width="137" height="51" rx="9" fill="#e1f1ed" stroke="#087f83"/><text x="640" y="277" font-size="17" style="fill:#087f83" text-anchor="middle">observed</text><text x="65" y="341" font-size="19" style="fill:#233c50" text-anchor="start">query</text><rect x="263" y="309" width="137" height="51" rx="9" fill="#e1f1ed" stroke="#087f83"/><text x="330" y="342" font-size="17" style="fill:#087f83" text-anchor="middle">observed</text><rect x="418" y="309" width="137" height="51" rx="9" fill="#e1f1ed" stroke="#087f83"/><text x="485" y="342" font-size="17" style="fill:#087f83" text-anchor="middle">observed</text><rect x="573" y="309" width="137" height="51" rx="9" fill="#fff0d8" stroke="#ab650a"/><text x="640" y="342" font-size="17" style="fill:#ab650a" text-anchor="middle">?</text><text x="65" y="406" font-size="19" style="fill:#233c50" text-anchor="start">future</text><rect x="263" y="374" width="137" height="51" rx="9" fill="#fceaea" stroke="#b54e55"/><text x="330" y="407" font-size="17" style="fill:#b54e55" text-anchor="middle">excluded</text><rect x="418" y="374" width="137" height="51" rx="9" fill="#fceaea" stroke="#b54e55"/><text x="485" y="407" font-size="17" style="fill:#b54e55" text-anchor="middle">excluded</text><rect x="573" y="374" width="137" height="51" rx="9" fill="#fceaea" stroke="#b54e55"/><text x="640" y="407" font-size="17" style="fill:#b54e55" text-anchor="middle">excluded</text><text x="790" y="340" font-size="18" style="fill:#ab650a" text-anchor="start">hide answer</text><text x="790" y="405" font-size="18" style="fill:#b54e55" text-anchor="start">exclude row</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">Column masking does not replace the temporal row filter.</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">Schematic autocomplete contract: historical target visibility must follow the declared task.</text></svg>