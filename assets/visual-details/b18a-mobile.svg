<svg xmlns="http://www.w3.org/2000/svg" width="320" height="2723" viewBox="0 0 320 2723" role="img" aria-labelledby="title desc"><title id="title">TACO compresses support into latent cells</title><desc id="desc">Support cells and K dummy rows enter the compressor. The resulting latent context passes through a residual MLP to the predictor alongside embedded queries. Compressor and predictor are pretrained together.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="2723" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Seed K masked dummy rows</text><g transform="translate(0 60)"><text x="20" y="21" font-size="17" fill="#087f83" text-anchor="start">support</text><text x="181" y="21" font-size="17" fill="#ab650a" text-anchor="start">dummy rows</text><rect x="20" y="42" width="24" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="32.0" y="60.0" font-size="16" fill="#087f83" text-anchor="middle">a</text><rect x="48" y="42" width="24" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="60.0" y="60.0" font-size="16" fill="#087f83" text-anchor="middle">b</text><rect x="76" y="42" width="24" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="88.0" y="60.0" font-size="16" fill="#087f83" text-anchor="middle">y</text><rect x="20" y="72" width="24" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="32.0" y="90.0" font-size="16" fill="#087f83" text-anchor="middle">a</text><rect x="48" y="72" width="24" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="60.0" y="90.0" font-size="16" fill="#087f83" text-anchor="middle">b</text><rect x="76" y="72" width="24" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="88.0" y="90.0" font-size="16" fill="#087f83" text-anchor="middle">y</text><rect x="20" y="102" width="24" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="32.0" y="120.0" font-size="16" fill="#087f83" text-anchor="middle">a</text><rect x="48" y="102" width="24" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="60.0" y="120.0" font-size="16" fill="#087f83" text-anchor="middle">b</text><rect x="76" y="102" width="24" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="88.0" y="120.0" font-size="16" fill="#087f83" text-anchor="middle">y</text><rect x="20" y="132" width="24" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="32.0" y="150.0" font-size="16" fill="#087f83" text-anchor="middle">a</text><rect x="48" y="132" width="24" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="60.0" y="150.0" font-size="16" fill="#087f83" text-anchor="middle">b</text><rect x="76" y="132" width="24" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="88.0" y="150.0" font-size="16" fill="#087f83" text-anchor="middle">y</text><rect x="182" y="80" width="24" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="194.0" y="98.0" font-size="16" fill="#087f83" text-anchor="middle">a</text><rect x="210" y="80" width="24" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="222.0" y="98.0" font-size="16" fill="#087f83" text-anchor="middle">b</text><rect x="238" y="80" width="24" height="26" rx="5" fill="#fff6df" stroke="#087f83"/><text x="250.0" y="98.0" font-size="16" fill="#087f83" text-anchor="middle">?</text><rect x="182" y="110" width="24" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="194.0" y="128.0" font-size="16" fill="#087f83" text-anchor="middle">a</text><rect x="210" y="110" width="24" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="222.0" y="128.0" font-size="16" fill="#087f83" text-anchor="middle">b</text><rect x="238" y="110" width="24" height="26" rx="5" fill="#fff6df" stroke="#087f83"/><text x="250.0" y="128.0" font-size="16" fill="#087f83" text-anchor="middle">?</text><path d="M115 55L176 85" fill="none" stroke="#ab650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#tip)"/><text x="20" y="193" font-size="16" fill="#087f83" text-anchor="start">N observed rows</text><text x="182" y="193" font-size="16" fill="#ab650a" text-anchor="start">K slots</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Embed support and dummy cells.</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">The release initializes dummy</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">features from the last K</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">preprocessed support rows.</text></g><g transform="translate(10 458)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Compress through attention</text><g transform="translate(0 60)"><text x="15" y="22" font-size="17" fill="#087f83" text-anchor="start">within each row</text><rect x="30" y="46" width="66" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="63.0" y="64.0" font-size="16" fill="#087f83" text-anchor="middle">a</text><rect x="100" y="46" width="66" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="133.0" y="64.0" font-size="16" fill="#087f83" text-anchor="middle">b</text><rect x="170" y="46" width="66" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="203.0" y="64.0" font-size="16" fill="#087f83" text-anchor="middle">y</text><path d="M46 92L220 92" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M220 108L46 108" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><text x="15" y="150" font-size="16" fill="#7656a6" text-anchor="start">across rows, for each feature</text><path d="M49 166L49 199" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><path d="M119 166L119 199" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><path d="M189 166L189 199" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><rect x="30" y="203" width="66" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="63.0" y="221.0" font-size="16" fill="#7656a6" text-anchor="middle">z</text><rect x="100" y="203" width="66" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="133.0" y="221.0" font-size="16" fill="#7656a6" text-anchor="middle">z</text><rect x="170" y="203" width="66" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="203.0" y="221.0" font-size="16" fill="#7656a6" text-anchor="middle">z</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Feature mixing and support-</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">conditioned row attention</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">update the dummy cells. The</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">compressor has 12 layers.</text></g><g transform="translate(10 906)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">03</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Keep latent cells</text><g transform="translate(0 60)"><text x="150" y="22" font-size="16" fill="#7656a6" text-anchor="middle">retain only the K dummy states</text><rect x="24" y="45" width="78" height="37" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="63.0" y="68.5" font-size="16" fill="#7656a6" text-anchor="middle">z₁₁</text><rect x="106" y="45" width="78" height="37" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="145.0" y="68.5" font-size="16" fill="#7656a6" text-anchor="middle">z₁₂</text><rect x="188" y="45" width="78" height="37" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="227.0" y="68.5" font-size="16" fill="#7656a6" text-anchor="middle">z₁y</text><rect x="24" y="86" width="78" height="37" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="63.0" y="109.5" font-size="16" fill="#7656a6" text-anchor="middle">z₂₁</text><rect x="106" y="86" width="78" height="37" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="145.0" y="109.5" font-size="16" fill="#7656a6" text-anchor="middle">z₂₂</text><rect x="188" y="86" width="78" height="37" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="227.0" y="109.5" font-size="16" fill="#7656a6" text-anchor="middle">z₂y</text><text x="150" y="164" font-size="22" fill="#7656a6" text-anchor="middle">K × (M+1) × L</text><text x="150" y="201" font-size="16" fill="#657b8b" text-anchor="middle">latent vectors, not copied rows</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Discard support-side outputs.</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">Retain K dummy representations,</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">each carrying an L-dimensional</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">cell state.</text></g><g transform="translate(10 1354)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">04</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Connect the two modules</text><g transform="translate(0 60)"><rect x="85" y="24" width="130" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="150.0" y="46.0" font-size="16" fill="#7656a6" text-anchor="middle">latent context</text><path d="M150 64L150 86" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><rect x="80" y="92" width="140" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="150.0" y="114.0" font-size="16" fill="#7656a6" text-anchor="middle">two-layer MLP</text><path d="M150 132L150 157" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><circle cx="150" cy="187" r="22" fill="white" stroke="#ab650a" stroke-width="2"/><text x="150" y="192" font-size="16" fill="#ab650a" text-anchor="middle">+</text><path d="M83 42L35 42" fill="none" stroke="#7656a6" stroke-width="2"/><path d="M35 42L35 186" fill="none" stroke="#7656a6" stroke-width="2"/><path d="M35 186L121 186" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><text x="215" y="192" font-size="17" fill="#087f83" text-anchor="start">to f</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">A residual MLP maps latent</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">context into the predictor</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">space. Its skip path preserves</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">a direct route.</text></g><g transform="translate(10 1802)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">05</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Attach the query rows</text><g transform="translate(0 60)"><text x="150" y="21" font-size="17" fill="#087f83" text-anchor="middle">predictor input</text><rect x="51" y="36" width="60" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="81.0" y="54.0" font-size="16" fill="#7656a6" text-anchor="middle">z</text><rect x="115" y="36" width="60" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="145.0" y="54.0" font-size="16" fill="#7656a6" text-anchor="middle">z</text><rect x="179" y="36" width="60" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="209.0" y="54.0" font-size="16" fill="#7656a6" text-anchor="middle">z</text><rect x="51" y="66" width="60" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="81.0" y="84.0" font-size="16" fill="#7656a6" text-anchor="middle">z</text><rect x="115" y="66" width="60" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="145.0" y="84.0" font-size="16" fill="#7656a6" text-anchor="middle">z</text><rect x="179" y="66" width="60" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="209.0" y="84.0" font-size="16" fill="#7656a6" text-anchor="middle">z</text><rect x="51" y="96" width="60" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="81.0" y="114.0" font-size="16" fill="#087f83" text-anchor="middle">q</text><rect x="115" y="96" width="60" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="145.0" y="114.0" font-size="16" fill="#087f83" text-anchor="middle">q</text><rect x="179" y="96" width="60" height="26" rx="5" fill="#fff6df" stroke="#087f83"/><text x="209.0" y="114.0" font-size="16" fill="#087f83" text-anchor="middle">?</text><path d="M60 150L229 150" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M240 54L240 113" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><text x="150" y="184" font-size="17" fill="#087f83" text-anchor="middle">feature + row attention</text><text x="150" y="214" font-size="16" fill="#657b8b" text-anchor="middle">12 layers · width 192</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Concatenate compressed context</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">with embedded queries. Hidden</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">query targets have their own</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">slots.</text></g><g transform="translate(10 2250)"><rect x="0" y="0" width="300" height="430" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">06</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Predict; learn jointly</text><g transform="translate(0 60)"><rect x="51" y="21" width="199" height="34" rx="5" fill="#f5f9fb" stroke="#ab650a"/><text x="150.5" y="43.0" font-size="16" fill="#ab650a" text-anchor="middle">query target state</text><path d="M150 61L150 80" fill="none" stroke="#ab650a" stroke-width="2" marker-end="url(#tip)"/><rect x="95" y="87" width="110" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="150.0" y="109.0" font-size="16" fill="#087f83" text-anchor="middle">task head</text><rect x="79" y="188" width="28" height="23" rx="5" fill="#d7eeee" stroke="#087f83"/><rect x="131" y="128" width="28" height="83" rx="5" fill="#d7eeee" stroke="#087f83"/><rect x="183" y="163" width="28" height="48" rx="5" fill="#d7eeee" stroke="#087f83"/><text x="150" y="234" font-size="16" fill="#087f83" text-anchor="middle">class probabilities</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">The predictor head reads query</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">states. During pretraining, the</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">query loss updates both</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">modules; serving uses frozen</text><text x="12" y="412" font-size="16" fill="#657b8b" text-anchor="start">weights.</text></g></g></svg>