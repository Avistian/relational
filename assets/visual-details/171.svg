<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Hold out the whole connected source family</title><desc id="desc">The held-out original shares a hash with a copy. Declared family links connect that copy to two more derivatives. Following all links quarantines the entire component from pretraining.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">Hold out the whole connected source family</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><text x="50" y="105" font-size="21" style="fill:#233c50" text-anchor="start">Evaluation source and its declared relatives</text><rect x="42" y="138" width="912" height="180" rx="9" fill="#fff3e5" stroke="#d8b478"/><circle cx="152" cy="230" r="62" fill="white" stroke="#ab650a" stroke-width="3"/><text x="152" y="236" font-size="17" style="fill:#ab650a" text-anchor="middle">original</text><circle cx="383" cy="230" r="62" fill="white" stroke="#ab650a" stroke-width="3"/><text x="383" y="236" font-size="17" style="fill:#ab650a" text-anchor="middle">copy</text><path d="M219 230L316 230" stroke="#ab650a" stroke-width="3" fill="none"/><circle cx="614" cy="230" r="62" fill="white" stroke="#ab650a" stroke-width="3"/><text x="614" y="236" font-size="17" style="fill:#ab650a" text-anchor="middle">derivative A</text><path d="M450 230L547 230" stroke="#ab650a" stroke-width="3" fill="none"/><circle cx="845" cy="230" r="62" fill="white" stroke="#ab650a" stroke-width="3"/><text x="845" y="236" font-size="17" style="fill:#ab650a" text-anchor="middle">derivative B</text><path d="M681 230L778 230" stroke="#ab650a" stroke-width="3" fill="none"/><text x="265" y="158" font-size="16" style="fill:#ab650a" text-anchor="middle">same hash</text><text x="495" y="158" font-size="16" style="fill:#ab650a" text-anchor="middle">family link</text><text x="726" y="158" font-size="16" style="fill:#ab650a" text-anchor="middle">family link</text><text x="153" y="354" font-size="18" style="fill:#ab650a" text-anchor="middle">held out</text><text x="595" y="354" font-size="19" style="fill:#ab650a" text-anchor="middle">quarantine all three relatives</text><rect x="100" y="415" width="260" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="230.0" y="447.0" font-size="18" style="fill:#087f83" text-anchor="middle">unrelated source C</text><rect x="628" y="415" width="260" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="758.0" y="447.0" font-size="18" style="fill:#087f83" text-anchor="middle">unrelated source D</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">Follow links until no additional snapshot is reached: a connected-component search.</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">Synthetic ancestry example. Different hashes alone do not prove independent source data.</text></svg>