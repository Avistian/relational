<svg xmlns="http://www.w3.org/2000/svg" width="320" height="463" viewBox="0 0 320 463" role="img" aria-labelledby="title desc"><title id="title">Missing, zero and an unknown category are different inputs</title><desc id="desc">Tokenization must preserve field identity, value type and missingness. A missing numeric field, an observed zero and an unseen categorical value are three different states.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="463" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Keep three states distinct</text><g transform="translate(0 60)"><rect x="12" y="20" width="72" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="48.0" y="42.0" font-size="16" fill="#087f83" text-anchor="middle">0</text><path d="M91 37L144 37" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><rect x="151" y="20" width="137" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="219.5" y="42.0" font-size="16" fill="#087f83" text-anchor="middle">observed</text><rect x="12" y="96" width="72" height="34" rx="5" fill="#f5f9fb" stroke="#ab650a"/><text x="48.0" y="118.0" font-size="16" fill="#ab650a" text-anchor="middle">—</text><path d="M91 113L144 113" fill="none" stroke="#ab650a" stroke-width="2" marker-end="url(#tip)"/><rect x="151" y="96" width="137" height="34" rx="5" fill="#f5f9fb" stroke="#ab650a"/><text x="219.5" y="118.0" font-size="16" fill="#ab650a" text-anchor="middle">missing</text><rect x="12" y="172" width="72" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="48.0" y="194.0" font-size="16" fill="#7656a6" text-anchor="middle">new</text><path d="M91 189L144 189" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><rect x="151" y="172" width="137" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="219.5" y="194.0" font-size="16" fill="#7656a6" text-anchor="middle">unknown</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">An observed numeric zero, a</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">missing number and an unknown</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">category must retain different</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">meanings.</text></g></g></svg>