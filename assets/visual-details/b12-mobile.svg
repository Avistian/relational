<svg xmlns="http://www.w3.org/2000/svg" width="320" height="911" viewBox="0 0 320 911" role="img" aria-labelledby="title desc"><title id="title">Follow the label to find the adaptation mechanism</title><desc id="desc">A supervised label can change model weights through a loss, or enter a frozen predictor as labeled context. In contextual adaptation, the support state changes while the parameter state stays fixed.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="911" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Adapt through weights</text><g transform="translate(0 60)"><rect x="10" y="18" width="280" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="150.0" y="40.0" font-size="16" fill="#087f83" text-anchor="middle">examples + labels</text><path d="M150 58L150 84" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><rect x="10" y="93" width="280" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="150.0" y="115.0" font-size="16" fill="#087f83" text-anchor="middle">prediction → loss</text><path d="M150 133L150 159" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><rect x="10" y="168" width="280" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="150.0" y="190.0" font-size="16" fill="#087f83" text-anchor="middle">optimizer: θ → θ′</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Training labels enter a loss;</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">the optimizer changes θ to θ′.</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">Later queries use the changed</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">weights.</text></g><g transform="translate(10 458)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Adapt through context</text><g transform="translate(0 60)"><rect x="10" y="18" width="280" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="150.0" y="40.0" font-size="16" fill="#7656a6" text-anchor="middle">support labels + query</text><path d="M150 58L150 84" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><rect x="10" y="93" width="280" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="150.0" y="115.0" font-size="16" fill="#7656a6" text-anchor="middle">predict with frozen θ</text><path d="M150 133L150 159" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><rect x="10" y="168" width="280" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="150.0" y="190.0" font-size="16" fill="#7656a6" text-anchor="middle">new support → new answer</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Support labels enter the</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">predictor as data. Changing</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">that support can change</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">predictions with θ frozen.</text></g></g></svg>