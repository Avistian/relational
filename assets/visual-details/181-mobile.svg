<svg xmlns="http://www.w3.org/2000/svg" width="320" height="911" viewBox="0 0 320 911" role="img" aria-labelledby="title desc"><title id="title">Masking the answer and excluding the future solve different problems</title><desc id="desc">An autocomplete query hides its own target cell. A separate temporal eligibility rule excludes future rows. Masking every historical value of the target column would change the context contract.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="911" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Hide the query answer</text><g transform="translate(0 60)"><text x="15" y="22" font-size="16" fill="#657b8b" text-anchor="start">row</text><text x="147" y="22" font-size="16" fill="#657b8b" text-anchor="middle">features</text><text x="227" y="22" font-size="16" fill="#657b8b" text-anchor="middle">target</text><text x="15" y="68" font-size="17" fill="#657b8b" text-anchor="start">history</text><rect x="109" y="45" width="76" height="38" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="147.0" y="69.0" font-size="16" fill="#087f83" text-anchor="middle">x</text><rect x="189" y="45" width="76" height="38" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="227.0" y="69.0" font-size="16" fill="#087f83" text-anchor="middle">y</text><text x="15" y="122" font-size="17" fill="#657b8b" text-anchor="start">query</text><rect x="109" y="99" width="76" height="38" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="147.0" y="123.0" font-size="16" fill="#087f83" text-anchor="middle">x</text><rect x="189" y="99" width="76" height="38" rx="5" fill="#fff6df" stroke="#087f83"/><text x="227.0" y="123.0" font-size="16" fill="#087f83" text-anchor="middle">?</text><text x="15" y="176" font-size="17" fill="#657b8b" text-anchor="start">future</text><rect x="109" y="153" width="76" height="38" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="147.0" y="177.0" font-size="16" fill="#087f83" text-anchor="middle">x</text><rect x="189" y="153" width="76" height="38" rx="5" fill="#fff6df" stroke="#087f83"/><text x="227.0" y="177.0" font-size="16" fill="#087f83" text-anchor="middle">?</text><text x="150" y="226" font-size="19" fill="#ab650a" text-anchor="middle">answer slot hidden</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Historical targets may remain</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">available under this task</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">contract. The query target slot</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">is hidden.</text></g><g transform="translate(10 458)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Exclude future rows too</text><g transform="translate(0 60)"><text x="15" y="22" font-size="16" fill="#657b8b" text-anchor="start">row</text><text x="147" y="22" font-size="16" fill="#657b8b" text-anchor="middle">features</text><text x="227" y="22" font-size="16" fill="#657b8b" text-anchor="middle">target</text><text x="15" y="68" font-size="17" fill="#657b8b" text-anchor="start">history</text><rect x="109" y="45" width="76" height="38" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="147.0" y="69.0" font-size="16" fill="#087f83" text-anchor="middle">x</text><rect x="189" y="45" width="76" height="38" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="227.0" y="69.0" font-size="16" fill="#087f83" text-anchor="middle">y</text><text x="15" y="122" font-size="17" fill="#657b8b" text-anchor="start">query</text><rect x="109" y="99" width="76" height="38" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="147.0" y="123.0" font-size="16" fill="#087f83" text-anchor="middle">x</text><rect x="189" y="99" width="76" height="38" rx="5" fill="#fff6df" stroke="#087f83"/><text x="227.0" y="123.0" font-size="16" fill="#087f83" text-anchor="middle">?</text><text x="15" y="176" font-size="17" fill="#657b8b" text-anchor="start">future</text><rect x="109" y="153" width="76" height="38" rx="5" fill="#eee8f7" stroke="#b54e55"/><text x="147.0" y="177.0" font-size="16" fill="#b54e55" text-anchor="middle">x</text><rect x="189" y="153" width="76" height="38" rx="5" fill="#eee8f7" stroke="#b54e55"/><text x="227.0" y="177.0" font-size="16" fill="#b54e55" text-anchor="middle">×</text><text x="150" y="226" font-size="19" fill="#b54e55" text-anchor="middle">future row removed</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Masking a target does not make</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">an ineligible future row legal.</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">Apply the temporal row filter</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">separately.</text></g></g></svg>