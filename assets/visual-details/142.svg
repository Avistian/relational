<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">A bridge can repeat the same source evidence</title><desc id="desc">In a linear path-counting illustration, one source-to-destination path carries a value once, while two bridge paths carry it twice. Collapsing the bridge can lose both multiplicity and role information.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">A bridge can repeat the same source evidence</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><circle cx="100" cy="200" r="27" fill="white" stroke="#087f83" stroke-width="3"/><text x="100" y="206" font-size="17" style="fill:#087f83" text-anchor="middle">x</text><circle cx="825" cy="200" r="27" fill="white" stroke="#ab650a" stroke-width="3"/><text x="825" y="206" font-size="17" style="fill:#ab650a" text-anchor="middle">Σ</text><circle cx="465" cy="200" r="27" fill="white" stroke="#7656a6" stroke-width="3"/><text x="465" y="206" font-size="17" style="fill:#7656a6" text-anchor="middle">b1</text><path d="M130 200L433 200" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M497 200L793 200" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="890" y="207" font-size="24" style="fill:#ab650a" text-anchor="start">x</text><circle cx="100" cy="385" r="27" fill="white" stroke="#087f83" stroke-width="3"/><text x="100" y="391" font-size="17" style="fill:#087f83" text-anchor="middle">x</text><circle cx="825" cy="385" r="27" fill="white" stroke="#ab650a" stroke-width="3"/><text x="825" y="391" font-size="17" style="fill:#ab650a" text-anchor="middle">Σ</text><circle cx="465" cy="328" r="27" fill="white" stroke="#7656a6" stroke-width="3"/><text x="465" y="334" font-size="17" style="fill:#7656a6" text-anchor="middle">b1</text><path d="M130 385L433 328" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M497 328L793 385" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="465" cy="442" r="27" fill="white" stroke="#7656a6" stroke-width="3"/><text x="465" y="448" font-size="17" style="fill:#7656a6" text-anchor="middle">b2</text><path d="M130 385L433 442" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M497 442L793 385" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="890" y="392" font-size="24" style="fill:#ab650a" text-anchor="start">2x</text><text x="45" y="111" font-size="21" style="fill:#233c50" text-anchor="start">Same source value; different numbers of bridge paths.</text><text x="360" y="482" font-size="18" style="fill:#7656a6" text-anchor="start">Bridge nodes remain distinct.</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">Two identity-weight paths contribute the same source twice.</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">A linear path-counting illustration: nonlinear aggregation need not reduce to this arithmetic.</text></svg>