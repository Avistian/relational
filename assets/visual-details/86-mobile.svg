<svg xmlns="http://www.w3.org/2000/svg" width="320" height="871" viewBox="0 0 320 871" role="img" aria-labelledby="title desc"><title id="title">Gather by source, scatter by destination</title><desc id="desc">For edge_index=[[0,2],[1,1]] and x=[2,4,8], the source gather yields [2,8]. Destination sum writes [0,10,0]. This is the routing primitive, before GCN loops and normalization.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="871" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="390" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Gather the senders</text><g transform="translate(0 60)"><rect x="35" y="37" width="58" height="42" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="64.0" y="63.0" font-size="16" fill="#087f83" text-anchor="middle">0</text><rect x="97" y="37" width="58" height="42" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="126.0" y="63.0" font-size="16" fill="#087f83" text-anchor="middle">2</text><rect x="35" y="83" width="58" height="42" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="64.0" y="109.0" font-size="16" fill="#087f83" text-anchor="middle">1</text><rect x="97" y="83" width="58" height="42" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="126.0" y="109.0" font-size="16" fill="#087f83" text-anchor="middle">1</text><text x="179" y="66" font-size="17" fill="#087f83" text-anchor="start">source</text><text x="179" y="112" font-size="17" fill="#7656a6" text-anchor="start">dest.</text><text x="150" y="191" font-size="22" fill="#087f83" text-anchor="middle">gather → [2, 8]</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Edge columns are 0→1 and 2→1.</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">Gathering x at the source</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">positions gives 2 and 8.</text></g><g transform="translate(10 438)"><rect x="0" y="0" width="300" height="390" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Sum at the destination</text><g transform="translate(0 60)"><path d="M74.20900775622351 67.13422322698821L132.10263193352753 128.14040784393225" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M225.7909922437765 67.13422322698821L167.89736806647247 128.14040784393225" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><circle cx="57" cy="49" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="57" y="54" font-size="16" fill="#087f83" text-anchor="middle">2</text><circle cx="243" cy="49" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="243" y="54" font-size="16" fill="#087f83" text-anchor="middle">8</text><circle cx="150" cy="147" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="150" y="152" font-size="16" fill="#087f83" text-anchor="middle">10</text><text x="150" y="214" font-size="20" fill="#ab650a" text-anchor="middle">output = [0, 10, 0]</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Both messages enter node 1.</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">Nodes 0 and 2 remain in the</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">output with zero incoming sum.</text></g></g></svg>