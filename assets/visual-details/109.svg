<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">One fact, two clocks</title><desc id="desc">An event at time 2 observed at time 7 cannot appear in a prediction issued at time 5. Point-in-time reconstruction needs the observation clock as well as the event clock.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">One fact, two clocks</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><text x="50" y="110" font-size="20" style="fill:#233c50" text-anchor="start">Would this fact have been visible when the prediction was issued?</text><rect x="565" y="145" width="350" height="255" rx="9" fill="#fff1f1" stroke="#f0c8cb"/><text x="690" y="180" font-size="18" style="fill:#b54e55" text-anchor="middle">Unavailable at query time</text><text x="55" y="236" font-size="18" style="fill:#233c50" text-anchor="start">event time</text><path d="M215 230L920 230" stroke="#657b8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="355" y="269" font-size="17" style="fill:#657b8b" text-anchor="middle">2</text><text x="565" y="269" font-size="17" style="fill:#657b8b" text-anchor="middle">5</text><text x="705" y="269" font-size="17" style="fill:#657b8b" text-anchor="middle">7</text><text x="845" y="269" font-size="17" style="fill:#657b8b" text-anchor="middle">9</text><text x="55" y="356" font-size="18" style="fill:#233c50" text-anchor="start">observed time</text><path d="M215 350L920 350" stroke="#657b8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="355" y="389" font-size="17" style="fill:#657b8b" text-anchor="middle">2</text><text x="565" y="389" font-size="17" style="fill:#657b8b" text-anchor="middle">5</text><text x="705" y="389" font-size="17" style="fill:#657b8b" text-anchor="middle">7</text><text x="845" y="389" font-size="17" style="fill:#657b8b" text-anchor="middle">9</text><path d="M565 135L565 414" stroke="#ab650a" stroke-width="3" fill="none" stroke-dasharray="7 5"/><text x="565" y="452" font-size="18" style="fill:#ab650a" text-anchor="middle">query issued at 5</text><circle cx="355" cy="230" r="27" fill="white" stroke="#087f83" stroke-width="3"/><text x="355" y="236" font-size="17" style="fill:#087f83" text-anchor="middle">2</text><circle cx="705" cy="350" r="27" fill="white" stroke="#b54e55" stroke-width="3"/><text x="705" y="356" font-size="17" style="fill:#b54e55" text-anchor="middle">7</text><path d="M368 257L684 326" stroke="#b54e55" stroke-width="3" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="270" y="151" font-size="18" style="fill:#233c50" text-anchor="start">Same fact</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">event_time = 2 passes the event cutoff; observed_time = 7 fails availability.</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">Select the version that was available then, not the version visible in a later snapshot.</text></svg>