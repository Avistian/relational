<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Two sums, with a root transform inside each relation</title><desc id="desc">For root feature 4, orders contribute 2×(1+2)+1+3×4 = 19. Tickets contribute 0.5×5−1−2×4 = −6.5. The outer relation sum is 12.5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">Two sums, with a root transform inside each relation</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><circle cx="95" cy="160" r="27" fill="white" stroke="#087f83" stroke-width="3"/><text x="95" y="166" font-size="17" style="fill:#087f83" text-anchor="middle">1</text><circle cx="95" cy="235" r="27" fill="white" stroke="#087f83" stroke-width="3"/><text x="95" y="241" font-size="17" style="fill:#087f83" text-anchor="middle">2</text><circle cx="95" cy="380" r="27" fill="white" stroke="#7656a6" stroke-width="3"/><text x="95" y="386" font-size="17" style="fill:#7656a6" text-anchor="middle">5</text><path d="M126 160L235 195" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M126 235L235 209" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="240" y="176" width="120" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="300.0" y="208.0" font-size="18" style="fill:#087f83" text-anchor="middle">sum = 3</text><path d="M365 202L428 202" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="434" y="176" width="340" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="604.0" y="208.0" font-size="18" style="fill:#087f83" text-anchor="middle">2×3 + 1 + 3×4 = 19</text><path d="M126 380L428 380" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="434" y="354" width="340" height="52" rx="9" fill="#f4f8fa" stroke="#7656a6"/><text x="604.0" y="386.0" font-size="18" style="fill:#7656a6" text-anchor="middle">0.5×5 − 1 − 2×4 = −6.5</text><rect x="434" y="83" width="340" height="52" rx="9" fill="#f4f8fa" stroke="#ab650a"/><text x="604.0" y="115.0" font-size="18" style="fill:#ab650a" text-anchor="middle">root feature = 4</text><path d="M780 202L858 266" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M780 380L858 309" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="884" cy="287" r="27" fill="white" stroke="#ab650a" stroke-width="3"/><text x="884" y="293" font-size="17" style="fill:#ab650a" text-anchor="middle">+</text><text x="884" y="355" font-size="27" style="fill:#ab650a" text-anchor="middle">12.5</text><text x="65" y="113" font-size="18" style="fill:#087f83" text-anchor="start">orders</text><text x="65" y="330" font-size="18" style="fill:#7656a6" text-anchor="start">tickets</text><text x="440" y="469" font-size="19" style="fill:#ab650a" text-anchor="start">The root term appears inside BOTH relation outputs.</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">First sum: neighbors within each relation. Second sum: complete relation outputs.</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">Teaching scalar trace of the selected sum-SAGE configuration; no normalization shown.</text></svg>