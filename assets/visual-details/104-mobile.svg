<svg xmlns="http://www.w3.org/2000/svg" width="320" height="871" viewBox="0 0 320 871" role="img" aria-labelledby="title desc"><title id="title">A recursive cutoff travels with each edge</title><desc id="desc">A root query at time 8 follows an edge at time 5. Its next lookup uses cutoff 5, so an event at time 6 is forbidden even though it precedes the root query.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="871" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="390" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Move the cutoff with the</text><text x="49" y="49" font-size="17" fill="#233c50" text-anchor="start">edge</text><g transform="translate(0 60)"><circle cx="65" cy="55" r="22" fill="white" stroke="#ab650a" stroke-width="2"/><text x="65" y="60" font-size="16" fill="#ab650a" text-anchor="middle">q</text><circle cx="235" cy="55" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="235" y="60" font-size="16" fill="#087f83" text-anchor="middle">5</text><path d="M93 55L205 55" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><rect x="20" y="127" width="111" height="34" rx="5" fill="#f5f9fb" stroke="#ab650a"/><text x="75.5" y="149.0" font-size="16" fill="#ab650a" text-anchor="middle">cutoff 8</text><rect x="169" y="127" width="111" height="34" rx="5" fill="#f5f9fb" stroke="#ab650a"/><text x="224.5" y="149.0" font-size="16" fill="#ab650a" text-anchor="middle">cutoff 5</text><text x="150" y="211" font-size="20" fill="#ab650a" text-anchor="middle">edge-time recursion</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">A root at 8 follows an edge at</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">5. The next neighborhood lookup</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">therefore uses cutoff 5.</text></g><g transform="translate(10 438)"><rect x="0" y="0" width="300" height="390" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Reject a later child event</text><g transform="translate(0 60)"><rect x="20" y="36" width="260" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="150.0" y="58.0" font-size="16" fill="#087f83" text-anchor="middle">event 2 &lt; 5</text><rect x="20" y="110" width="260" height="34" rx="5" fill="#f5f9fb" stroke="#b54e55"/><text x="150.0" y="132.0" font-size="16" fill="#b54e55" text-anchor="middle">event 6 &gt; 5</text><text x="150" y="209" font-size="19" fill="#b54e55" text-anchor="middle">Exclude the red path.</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Event 2 is allowed; event 6 is</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">too late for that lookup,</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">despite preceding root time 8.</text></g></g></svg>