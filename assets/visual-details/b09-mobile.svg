<svg xmlns="http://www.w3.org/2000/svg" width="320" height="2663" viewBox="0 0 320 2663" role="img" aria-labelledby="title desc"><title id="title">CAST exchanges summaries across the two table axes</title><desc id="desc">Feature attention mixes columns within a row; item attention mixes support examples within a column. CAST carries 3 item-summary tokens per row and 32 feature-summary tokens per feature, with cross-axis reads before axis-wise attention.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="2663" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Encode each cell</text><g transform="translate(0 60)"><text x="68" y="24" font-size="16" fill="#657b8b" text-anchor="middle">features</text><text x="149" y="24" font-size="16" fill="#657b8b" text-anchor="middle">target</text><rect x="18" y="42" width="49" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="42.5" y="60.0" font-size="16" fill="#087f83" text-anchor="middle">x</text><rect x="71" y="42" width="49" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="95.5" y="60.0" font-size="16" fill="#087f83" text-anchor="middle">x</text><rect x="124" y="42" width="49" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="148.5" y="60.0" font-size="16" fill="#087f83" text-anchor="middle">y</text><rect x="18" y="72" width="49" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="42.5" y="90.0" font-size="16" fill="#087f83" text-anchor="middle">x</text><rect x="71" y="72" width="49" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="95.5" y="90.0" font-size="16" fill="#087f83" text-anchor="middle">x</text><rect x="124" y="72" width="49" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="148.5" y="90.0" font-size="16" fill="#087f83" text-anchor="middle">y</text><rect x="18" y="102" width="49" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="42.5" y="120.0" font-size="16" fill="#087f83" text-anchor="middle">q</text><rect x="71" y="102" width="49" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="95.5" y="120.0" font-size="16" fill="#087f83" text-anchor="middle">q</text><rect x="124" y="102" width="49" height="26" rx="5" fill="#fff6df" stroke="#087f83"/><text x="148.5" y="120.0" font-size="16" fill="#087f83" text-anchor="middle">?</text><text x="187" y="70" font-size="16" fill="#087f83" text-anchor="start">support</text><text x="187" y="124" font-size="16" fill="#ab650a" text-anchor="start">query</text><path d="M93 142L93 171" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><rect x="28" y="178" width="20" height="23" rx="5" fill="#e5f2ef" stroke="#087f83"/><rect x="52" y="178" width="20" height="23" rx="5" fill="#e5f2ef" stroke="#087f83"/><rect x="76" y="178" width="20" height="23" rx="5" fill="#e5f2ef" stroke="#087f83"/><rect x="100" y="178" width="20" height="23" rx="5" fill="#e5f2ef" stroke="#087f83"/><rect x="124" y="178" width="20" height="23" rx="5" fill="#e5f2ef" stroke="#087f83"/><rect x="148" y="178" width="20" height="23" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="186" y="198" font-size="16" fill="#657b8b" text-anchor="start">d = 192</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Support targets are observed;</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">query targets are hidden.</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">Missingness also enters the</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">encoder.</text></g><g transform="translate(10 458)"><rect x="0" y="0" width="300" height="390" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Read the column memory</text><g transform="translate(0 60)"><text x="150" y="22" font-size="17" fill="#7656a6" text-anchor="middle">column f summaries</text><rect x="62.0" y="36" width="40" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="82.0" y="54.0" font-size="16" fill="#7656a6" text-anchor="middle">Sƒ</text><rect x="106.0" y="36" width="40" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="126.0" y="54.0" font-size="16" fill="#7656a6" text-anchor="middle">Sƒ</text><rect x="150.0" y="36" width="40" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="170.0" y="54.0" font-size="16" fill="#7656a6" text-anchor="middle">…</text><rect x="194.0" y="36" width="40" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="214.0" y="54.0" font-size="16" fill="#7656a6" text-anchor="middle">Sƒ</text><path d="M174 73L174 93" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><rect x="98" y="99" width="188" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="192.0" y="121.0" font-size="16" fill="#7656a6" text-anchor="middle">weights × values</text><rect x="15" y="160" width="70" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="50.0" y="182.0" font-size="16" fill="#087f83" text-anchor="middle">hᵢƒ</text><path d="M51 156L51 116" fill="none" stroke="#087f83" stroke-width="2"/><path d="M51 116L91 116" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><text x="63" y="104" font-size="16" fill="#087f83" text-anchor="start">Q</text><path d="M177 139L177 165" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><path d="M91 177L148 177" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><circle cx="177" cy="190" r="22" fill="white" stroke="#ab650a" stroke-width="2"/><text x="177" y="195" font-size="16" fill="#ab650a" text-anchor="middle">+</text><path d="M177 216L177 230" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><text x="60" y="247" font-size="17" fill="#233c50" text-anchor="start">updated cell state</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Each cell cross-attends to its</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">32 feature summaries and adds</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">the result to its own state.</text></g><g transform="translate(10 886)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">03</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Mix across features</text><g transform="translate(0 60)"><text x="150" y="22" font-size="17" fill="#657b8b" text-anchor="middle">one row i</text><rect x="20" y="43" width="44" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="42.0" y="61.0" font-size="16" fill="#087f83" text-anchor="middle">h₁</text><rect x="68" y="43" width="44" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="90.0" y="61.0" font-size="16" fill="#087f83" text-anchor="middle">h₂</text><rect x="116" y="43" width="44" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="138.0" y="61.0" font-size="16" fill="#087f83" text-anchor="middle">h₃</text><rect x="165" y="43" width="37" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="183.5" y="61.0" font-size="16" fill="#7656a6" text-anchor="middle">Sᵢ</text><rect x="206" y="43" width="37" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="224.5" y="61.0" font-size="16" fill="#7656a6" text-anchor="middle">Sᵢ</text><rect x="247" y="43" width="37" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="265.5" y="61.0" font-size="16" fill="#7656a6" text-anchor="middle">Sᵢ</text><path d="M34 100L275 100" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M275 118L34 118" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><text x="150" y="151" font-size="17" fill="#087f83" text-anchor="middle">all six slots mix together</text><rect x="20" y="175" width="44" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="42.0" y="193.0" font-size="16" fill="#087f83" text-anchor="middle">h′₁</text><rect x="68" y="175" width="44" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="90.0" y="193.0" font-size="16" fill="#087f83" text-anchor="middle">h′₂</text><rect x="116" y="175" width="44" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="138.0" y="193.0" font-size="16" fill="#087f83" text-anchor="middle">h′₃</text><rect x="165" y="175" width="37" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="183.5" y="193.0" font-size="16" fill="#7656a6" text-anchor="middle">S′ᵢ</text><rect x="206" y="175" width="37" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="224.5" y="193.0" font-size="16" fill="#7656a6" text-anchor="middle">S′ᵢ</text><rect x="247" y="175" width="37" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="265.5" y="193.0" font-size="16" fill="#7656a6" text-anchor="middle">S′ᵢ</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Append 3 item summaries per</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">row. Self-attend over cells</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">plus summaries; repeat twice</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">per layer.</text></g><g transform="translate(10 1334)"><rect x="0" y="0" width="300" height="390" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">04</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Read the row memory</text><g transform="translate(0 60)"><text x="150" y="22" font-size="17" fill="#7656a6" text-anchor="middle">row i summaries</text><rect x="84.0" y="36" width="40" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="104.0" y="54.0" font-size="16" fill="#7656a6" text-anchor="middle">Sᵢ</text><rect x="128.0" y="36" width="40" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="148.0" y="54.0" font-size="16" fill="#7656a6" text-anchor="middle">Sᵢ</text><rect x="172.0" y="36" width="40" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="192.0" y="54.0" font-size="16" fill="#7656a6" text-anchor="middle">Sᵢ</text><path d="M174 73L174 93" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><rect x="98" y="99" width="188" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="192.0" y="121.0" font-size="16" fill="#7656a6" text-anchor="middle">weights × values</text><rect x="15" y="160" width="70" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="50.0" y="182.0" font-size="16" fill="#087f83" text-anchor="middle">hᵢƒ</text><path d="M51 156L51 116" fill="none" stroke="#087f83" stroke-width="2"/><path d="M51 116L91 116" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><text x="63" y="104" font-size="16" fill="#087f83" text-anchor="start">Q</text><path d="M177 139L177 165" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><path d="M91 177L148 177" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><circle cx="177" cy="190" r="22" fill="white" stroke="#ab650a" stroke-width="2"/><text x="177" y="195" font-size="16" fill="#ab650a" text-anchor="middle">+</text><path d="M177 216L177 230" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><text x="60" y="247" font-size="17" fill="#233c50" text-anchor="start">updated cell state</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Each cell reads its 3 item</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">summaries through another</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">residual cross-attention path.</text></g><g transform="translate(10 1762)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">05</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Mix across support rows</text><g transform="translate(0 60)"><text x="150" y="22" font-size="17" fill="#657b8b" text-anchor="middle">one feature f</text><rect x="23" y="42" width="57" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="51.5" y="60.0" font-size="16" fill="#087f83" text-anchor="middle">h₁ƒ</text><rect x="23" y="72" width="57" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="51.5" y="90.0" font-size="16" fill="#087f83" text-anchor="middle">h₂ƒ</text><rect x="23" y="111" width="57" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="51.5" y="129.0" font-size="16" fill="#7656a6" text-anchor="middle">Sƒ</text><rect x="23" y="141" width="57" height="26" rx="5" fill="#eee8f7" stroke="#7656a6"/><text x="51.5" y="159.0" font-size="16" fill="#7656a6" text-anchor="middle">…</text><path d="M94 59L94 162" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M109 162L109 59" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M120 58L210 115" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><path d="M120 88L210 115" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><path d="M120 127L210 115" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><path d="M120 157L210 115" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><circle cx="243" cy="116" r="22" fill="white" stroke="#ab650a" stroke-width="2"/><text x="243" y="121" font-size="16" fill="#ab650a" text-anchor="middle">q</text><text x="243" y="178" font-size="16" fill="#ab650a" text-anchor="middle">query reads</text><text x="20" y="213" font-size="16" fill="#087f83" text-anchor="start">Support + summaries self-update.</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Support cells and feature</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">summaries update together.</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">Queries read them without</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">changing them.</text></g><g transform="translate(10 2210)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">06</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Repeat, then predict</text><g transform="translate(0 60)"><rect x="18" y="25" width="44" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="40.0" y="43.0" font-size="16" fill="#087f83" text-anchor="middle">q′</text><rect x="66" y="25" width="44" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="88.0" y="43.0" font-size="16" fill="#087f83" text-anchor="middle">q′</text><rect x="114" y="25" width="44" height="26" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="136.0" y="43.0" font-size="16" fill="#087f83" text-anchor="middle">q′</text><path d="M171 37L213 37" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><rect x="215" y="21" width="65" height="34" rx="5" fill="#f5f9fb" stroke="#ab650a"/><text x="247.5" y="43.0" font-size="16" fill="#ab650a" text-anchor="middle">head</text><path d="M249 60L249 91" fill="none" stroke="#ab650a" stroke-width="2" marker-end="url(#tip)"/><rect x="20" y="137" width="17" height="10" rx="5" fill="#e9ddf7" stroke="#7656a6"/><rect x="48" y="129" width="17" height="18" rx="5" fill="#e9ddf7" stroke="#7656a6"/><rect x="76" y="121" width="17" height="26" rx="5" fill="#e9ddf7" stroke="#7656a6"/><rect x="104" y="112" width="17" height="35" rx="5" fill="#e9ddf7" stroke="#7656a6"/><rect x="132" y="103" width="17" height="44" rx="5" fill="#e9ddf7" stroke="#7656a6"/><rect x="160" y="92" width="17" height="55" rx="5" fill="#e9ddf7" stroke="#7656a6"/><rect x="188" y="82" width="17" height="65" rx="5" fill="#e9ddf7" stroke="#7656a6"/><text x="25" y="176" font-size="16" fill="#7656a6" text-anchor="start">999 ordered quantile levels</text><text x="20" y="203" font-size="16" fill="#657b8b" text-anchor="start">wrapper: inverse transforms</text><text x="20" y="228" font-size="16" fill="#657b8b" text-anchor="start">+ aggregate ensemble views</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Repeat the CAST layer 12 times.</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">The regression head emits 999</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">quantiles; the wrapper returns</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">the prediction.</text></g></g></svg>