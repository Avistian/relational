<svg xmlns="http://www.w3.org/2000/svg" width="320" height="891" viewBox="0 0 320 891" role="img" aria-labelledby="title desc"><title id="title">A foreign key selects a row, not an array position</title><desc id="desc">Transfer 7 has sender key 10 and receiver key 90. Person key 10 maps to local row 1; key 90 maps to local row 0. The two edge types preserve these roles.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="891" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="390" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Read role-bearing keys</text><g transform="translate(0 60)"><text x="150" y="30" font-size="22" fill="#233c50" text-anchor="middle">Transfer 7</text><rect x="25" y="67" width="250" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="150.0" y="89.0" font-size="16" fill="#087f83" text-anchor="middle">sender key = 10</text><rect x="25" y="134" width="250" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="150.0" y="156.0" font-size="16" fill="#7656a6" text-anchor="middle">receiver key = 90</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Transfer 7 stores sender key 10</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">and receiver key 90. Keys are</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">identifiers.</text></g><g transform="translate(10 438)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Resolve tensor positions</text><g transform="translate(0 60)"><rect x="10" y="30" width="112" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="66.0" y="52.0" font-size="16" fill="#087f83" text-anchor="middle">key 10</text><rect x="180" y="30" width="112" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="236.0" y="52.0" font-size="16" fill="#087f83" text-anchor="middle">local 1</text><path d="M128 47L173 47" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><rect x="10" y="107" width="112" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="66.0" y="129.0" font-size="16" fill="#7656a6" text-anchor="middle">key 90</text><rect x="180" y="107" width="112" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="236.0" y="129.0" font-size="16" fill="#7656a6" text-anchor="middle">local 0</text><path d="M128 124L173 124" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><text x="150" y="207" font-size="22" fill="#233c50" text-anchor="middle">IDs ≠ array positions</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Person key 10 is local row 1;</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">key 90 is local row 0. Preserve</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">sender and receiver as distinct</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">relations.</text></g></g></svg>