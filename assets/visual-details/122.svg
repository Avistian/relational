<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">A foreign key selects a row, not an array position</title><desc id="desc">Transfer 7 has sender key 10 and receiver key 90. Person key 10 maps to local row 1; key 90 maps to local row 0. The two edge types preserve these roles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">A foreign key selects a row, not an array position</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><text x="50" y="110" font-size="21" style="fill:#233c50" text-anchor="start">Transfer table</text><text x="605" y="110" font-size="21" style="fill:#233c50" text-anchor="start">Person table</text><rect x="50" y="140" width="175" height="52" rx="9" fill="#f4f8fa" stroke="#657b8b"/><text x="137.5" y="172.0" font-size="18" style="fill:#657b8b" text-anchor="middle">transfer key</text><rect x="235" y="140" width="95" height="52" rx="9" fill="#f4f8fa" stroke="#7656a6"/><text x="282.5" y="172.0" font-size="18" style="fill:#7656a6" text-anchor="middle">7</text><rect x="50" y="207" width="175" height="52" rx="9" fill="#f4f8fa" stroke="#657b8b"/><text x="137.5" y="239.0" font-size="18" style="fill:#657b8b" text-anchor="middle">sender key</text><rect x="235" y="207" width="95" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="282.5" y="239.0" font-size="18" style="fill:#087f83" text-anchor="middle">10</text><rect x="50" y="274" width="175" height="52" rx="9" fill="#f4f8fa" stroke="#657b8b"/><text x="137.5" y="306.0" font-size="18" style="fill:#657b8b" text-anchor="middle">receiver key</text><rect x="235" y="274" width="95" height="52" rx="9" fill="#f4f8fa" stroke="#7656a6"/><text x="282.5" y="306.0" font-size="18" style="fill:#7656a6" text-anchor="middle">90</text><rect x="605" y="140" width="155" height="52" rx="9" fill="#f4f8fa" stroke="#657b8b"/><text x="682.5" y="172.0" font-size="18" style="fill:#657b8b" text-anchor="middle">local row 0</text><rect x="770" y="140" width="165" height="52" rx="9" fill="#f4f8fa" stroke="#7656a6"/><text x="852.5" y="172.0" font-size="18" style="fill:#7656a6" text-anchor="middle">key 90</text><rect x="605" y="235" width="155" height="52" rx="9" fill="#f4f8fa" stroke="#657b8b"/><text x="682.5" y="267.0" font-size="18" style="fill:#657b8b" text-anchor="middle">local row 1</text><rect x="770" y="235" width="165" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="852.5" y="267.0" font-size="18" style="fill:#087f83" text-anchor="middle">key 10</text><rect x="605" y="330" width="155" height="52" rx="9" fill="#f4f8fa" stroke="#657b8b"/><text x="682.5" y="362.0" font-size="18" style="fill:#657b8b" text-anchor="middle">local row 2</text><rect x="770" y="330" width="165" height="52" rx="9" fill="#f4f8fa" stroke="#7656a6"/><text x="852.5" y="362.0" font-size="18" style="fill:#7656a6" text-anchor="middle">key 300</text><path d="M335 233L596 260" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="455" y="215" font-size="18" style="fill:#087f83" text-anchor="middle">sender →</text><path d="M335 300L596 169" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="465" y="343" font-size="18" style="fill:#7656a6" text-anchor="middle">receiver →</text><text x="55" y="441" font-size="20" style="fill:#233c50" text-anchor="start">Edge identity includes source type, relation role and destination type.</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">Primary keys are identifiers. Tensor indices are positions in this particular graph.</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">Person key 300 remains a node even when this transfer has no edge to it.</text></svg>