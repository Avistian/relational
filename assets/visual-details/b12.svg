<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Follow the label to find the adaptation mechanism</title><desc id="desc">A supervised label can change model weights through a loss, or enter a frozen predictor as labeled context. In contextual adaptation, the support state changes while the parameter state stays fixed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">Follow the label to find the adaptation mechanism</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><text x="48" y="108" font-size="23" style="fill:#087f83" text-anchor="start">Weight adaptation</text><text x="535" y="108" font-size="23" style="fill:#7656a6" text-anchor="start">Context adaptation</text><rect x="45" y="150" width="390" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="240.0" y="182.0" font-size="18" style="fill:#087f83" text-anchor="middle">training examples → prediction → loss</text><path d="M241 207L241 246" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="45" y="252" width="390" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="240.0" y="284.0" font-size="18" style="fill:#087f83" text-anchor="middle">optimizer updates θ → θ′</text><path d="M241 309L241 348" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="45" y="354" width="390" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="240.0" y="386.0" font-size="18" style="fill:#087f83" text-anchor="middle">new query uses θ′</text><rect x="535" y="150" width="390" height="52" rx="9" fill="#f4f8fa" stroke="#7656a6"/><text x="730.0" y="182.0" font-size="18" style="fill:#7656a6" text-anchor="middle">support features + known labels</text><path d="M731 207L731 246" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="535" y="252" width="390" height="52" rx="9" fill="#f4f8fa" stroke="#7656a6"/><text x="730.0" y="284.0" font-size="18" style="fill:#7656a6" text-anchor="middle">frozen θ reads support + query</text><path d="M731 309L731 348" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="535" y="354" width="390" height="52" rx="9" fill="#f4f8fa" stroke="#7656a6"/><text x="730.0" y="386.0" font-size="18" style="fill:#7656a6" text-anchor="middle">new support can change prediction</text><text x="239" y="466" font-size="20" style="fill:#087f83" text-anchor="middle">label → loss → parameters</text><text x="731" y="466" font-size="20" style="fill:#7656a6" text-anchor="middle">label → model input → prediction</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">These are adaptation modes. A system can support both at different stages.</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">See the three model-specific architectures below for Griffin, OpenRFM and KumoRFM-2.</text></svg>