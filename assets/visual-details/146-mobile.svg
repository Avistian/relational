<svg xmlns="http://www.w3.org/2000/svg" width="320" height="891" viewBox="0 0 320 891" role="img" aria-labelledby="title desc"><title id="title">Sampling reach and computation reach are different</title><desc id="desc">On driver→result→race→circuit, three synchronous edge-local layers are needed for original circuit features to reach the driver. One local all-pairs attention block can connect those tokens only if all were sampled.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="891" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Count propagation steps</text><g transform="translate(0 60)"><rect x="35" y="12" width="129" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="99.5" y="34.0" font-size="16" fill="#087f83" text-anchor="middle">circuit</text><text x="190" y="36" font-size="17" fill="#657b8b" text-anchor="start">3 hops</text><path d="M99 48L99 67" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><rect x="35" y="71" width="129" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="99.5" y="93.0" font-size="16" fill="#087f83" text-anchor="middle">race</text><text x="190" y="95" font-size="17" fill="#657b8b" text-anchor="start">2 hops</text><path d="M99 107L99 126" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><rect x="35" y="130" width="129" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="99.5" y="152.0" font-size="16" fill="#087f83" text-anchor="middle">result</text><text x="190" y="154" font-size="17" fill="#657b8b" text-anchor="start">1 hops</text><path d="M99 166L99 185" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><rect x="35" y="189" width="129" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="99.5" y="211.0" font-size="16" fill="#087f83" text-anchor="middle">driver</text><text x="190" y="213" font-size="17" fill="#657b8b" text-anchor="start">0 hops</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Original circuit features</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">traverse three links to reach</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">the driver in a synchronous</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">root-readout GNN.</text></g><g transform="translate(10 458)"><rect x="0" y="0" width="300" height="390" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Check the admitted tokens</text><g transform="translate(0 60)"><rect x="15" y="23" width="270" height="126" rx="5" fill="#f5f0fa" stroke="#7656a6"/><path d="M202.6 87.0L93.2 87.0" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><circle cx="62" cy="87" r="27.200000000000003" fill="white" stroke="#7656a6" stroke-width="2"/><text x="62" y="92" font-size="16" fill="#7656a6" text-anchor="middle">driver</text><circle cx="237" cy="87" r="31.400000000000002" fill="white" stroke="#7656a6" stroke-width="2"/><text x="237" y="92" font-size="16" fill="#7656a6" text-anchor="middle">circuit</text><text x="150" y="191" font-size="18" fill="#7656a6" text-anchor="middle">inside the same sample</text><text x="150" y="224" font-size="17" fill="#b54e55" text-anchor="middle">absent token → no evidence</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">One all-pairs block can connect</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">driver and circuit only if the</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">sampler included both.</text></g></g></svg>