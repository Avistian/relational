<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">One averaging step can erase a node distinction</title><desc id="desc">For two connected nodes with self-loops, S has every entry 1/2. Multiplying [2,8] gives [5,5]; the common component remains while the difference vanishes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">One averaging step can erase a node distinction</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><text x="55" y="107" font-size="21" style="fill:#233c50" text-anchor="start">Exact two-node illustration with equal degrees and self-loops</text><circle cx="130" cy="211" r="42" fill="white" stroke="#087f83" stroke-width="3"/><text x="130" y="217" font-size="17" style="fill:#087f83" text-anchor="middle">2</text><circle cx="130" cy="368" r="42" fill="white" stroke="#7656a6" stroke-width="3"/><text x="130" y="374" font-size="17" style="fill:#7656a6" text-anchor="middle">8</text><circle cx="832" cy="211" r="42" fill="white" stroke="#087f83" stroke-width="3"/><text x="832" y="217" font-size="17" style="fill:#087f83" text-anchor="middle">5</text><circle cx="832" cy="368" r="42" fill="white" stroke="#087f83" stroke-width="3"/><text x="832" y="374" font-size="17" style="fill:#087f83" text-anchor="middle">5</text><path d="M130 257L130 321" stroke="#657b8b" stroke-width="3" fill="none"/><path d="M181 211L373 260" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M181 368L373 312" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="385" y="196" width="239" height="193" rx="9" fill="#f1f7f9" stroke="#c4d5de"/><text x="447" y="267" font-size="35" style="fill:#233c50" text-anchor="middle">½</text><text x="550" y="267" font-size="35" style="fill:#233c50" text-anchor="middle">½</text><text x="447" y="339" font-size="35" style="fill:#233c50" text-anchor="middle">½</text><text x="550" y="339" font-size="35" style="fill:#233c50" text-anchor="middle">½</text><text x="505" y="162" font-size="24" style="fill:#233c50" text-anchor="middle">S</text><path d="M635 262L782 211" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M635 318L782 368" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="80" y="457" font-size="22" style="fill:#7656a6" text-anchor="start">difference = 6</text><text x="764" y="457" font-size="22" style="fill:#087f83" text-anchor="start">difference = 0</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">Both nodes receive (2 + 8) / 2 = 5. Another identical mixing step leaves [5,5].</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">This linear equal-degree case does not imply identical raw limits on every graph.</text></svg>