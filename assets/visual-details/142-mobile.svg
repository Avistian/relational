<svg xmlns="http://www.w3.org/2000/svg" width="320" height="891" viewBox="0 0 320 891" role="img" aria-labelledby="title desc"><title id="title">A bridge can repeat the same source evidence</title><desc id="desc">In a linear path-counting illustration, one source-to-destination path carries a value once, while two bridge paths carry it twice. Collapsing the bridge can lose both multiplicity and role information.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="891" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="390" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">One bridge path</text><g transform="translate(0 60)"><path d="M65.0 100.0L124.0 100.0" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M175.0 100.0L234.0 100.0" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><circle cx="40" cy="100" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="40" y="105" font-size="16" fill="#087f83" text-anchor="middle">x</text><circle cx="150" cy="100" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="150" y="105" font-size="16" fill="#087f83" text-anchor="middle">b</text><circle cx="260" cy="100" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="260" y="105" font-size="16" fill="#087f83" text-anchor="middle">x</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Identity-weight propagation</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">carries source value x to the</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">destination once.</text></g><g transform="translate(10 438)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Two bridge paths</text><g transform="translate(0 60)"><path d="M66.25662866719654 101.84113463459262L127.89310618611559 63.68521998002368" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M66.16591373027512 128.30428863045864L127.98744972051388 167.163539824323" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M171.3665235161457 62.97966381821935L234.77881554320848 101.50114962905187" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M171.27779087895146 167.87538132700192L234.8710974858905 128.649603419918" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><circle cx="45" cy="115" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="45" y="120" font-size="16" fill="#087f83" text-anchor="middle">x</text><circle cx="150" cy="50" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="150" y="55" font-size="16" fill="#087f83" text-anchor="middle">b₁</text><circle cx="150" cy="181" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="150" y="186" font-size="16" fill="#087f83" text-anchor="middle">b₂</text><circle cx="257" cy="115" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="257" y="120" font-size="16" fill="#087f83" text-anchor="middle">2x</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Two distinct paths contribute</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">2x in this linear example. One</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">unweighted collapsed edge would</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">lose multiplicity.</text></g></g></svg>