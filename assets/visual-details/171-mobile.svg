<svg xmlns="http://www.w3.org/2000/svg" width="320" height="911" viewBox="0 0 320 911" role="img" aria-labelledby="title desc"><title id="title">Hold out the whole connected source family</title><desc id="desc">The held-out original shares a hash with a copy. Declared family links connect that copy to two more derivatives. Following all links quarantines the entire component from pretraining.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="911" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Follow the ancestry links</text><g transform="translate(0 60)"><path d="M96.0 46.0L201.0 46.0" fill="none" stroke="#ab650a" stroke-width="2"/><path d="M227.0 71.0L227.0 165.0" fill="none" stroke="#ab650a" stroke-width="2"/><path d="M202.0 191.0L96.0 191.0" fill="none" stroke="#ab650a" stroke-width="2"/><circle cx="70" cy="46" r="23.0" fill="white" stroke="#ab650a" stroke-width="2"/><text x="70" y="51" font-size="16" fill="#ab650a" text-anchor="middle">orig.</text><circle cx="227" cy="46" r="22" fill="white" stroke="#ab650a" stroke-width="2"/><text x="227" y="51" font-size="16" fill="#ab650a" text-anchor="middle">copy</text><circle cx="227" cy="191" r="22" fill="white" stroke="#ab650a" stroke-width="2"/><text x="227" y="196" font-size="16" fill="#ab650a" text-anchor="middle">A</text><circle cx="70" cy="191" r="22" fill="white" stroke="#ab650a" stroke-width="2"/><text x="70" y="196" font-size="16" fill="#ab650a" text-anchor="middle">B</text><text x="150" y="111" font-size="17" fill="#ab650a" text-anchor="middle">follow every link</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">An original, its identical</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">copy, and two family-linked</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">derivatives form one connected</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">component.</text></g><g transform="translate(10 458)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Quarantine its relatives</text><g transform="translate(0 60)"><rect x="20" y="22" width="260" height="34" rx="5" fill="#f5f9fb" stroke="#ab650a"/><text x="150.0" y="44.0" font-size="16" fill="#ab650a" text-anchor="middle">original → evaluation</text><rect x="20" y="86" width="260" height="34" rx="5" fill="#f5f9fb" stroke="#b54e55"/><text x="150.0" y="108.0" font-size="16" fill="#b54e55" text-anchor="middle">copy, A, B → quarantine</text><rect x="20" y="157" width="260" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="150.0" y="179.0" font-size="16" fill="#087f83" text-anchor="middle">unrelated C, D → candidates</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Keep the original in evaluation</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">and quarantine its three</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">relatives. Unconnected sources</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">remain training candidates.</text></g></g></svg>