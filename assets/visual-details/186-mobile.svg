<svg xmlns="http://www.w3.org/2000/svg" width="320" height="891" viewBox="0 0 320 891" role="img" aria-labelledby="title desc"><title id="title">Fast response, stale evidence</title><desc id="desc">An event can wait for a refresh before it reaches the cached representation. A quick response measures serving latency; it does not prove the evidence is fresh.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="891" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Read the four timestamps</text><g transform="translate(0 60)"><text x="20" y="36" font-size="18" fill="#657b8b" text-anchor="start">source event</text><rect x="184" y="14" width="99" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="233.5" y="36.0" font-size="16" fill="#087f83" text-anchor="middle">0</text><text x="20" y="91" font-size="18" fill="#657b8b" text-anchor="start">cache refresh</text><rect x="184" y="69" width="99" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="233.5" y="91.0" font-size="16" fill="#087f83" text-anchor="middle">2000</text><text x="20" y="146" font-size="18" fill="#657b8b" text-anchor="start">request</text><rect x="184" y="124" width="99" height="34" rx="5" fill="#f5f9fb" stroke="#ab650a"/><text x="233.5" y="146.0" font-size="16" fill="#ab650a" text-anchor="middle">2100</text><text x="20" y="201" font-size="18" fill="#657b8b" text-anchor="start">response</text><rect x="184" y="179" width="99" height="34" rx="5" fill="#f5f9fb" stroke="#ab650a"/><text x="233.5" y="201.0" font-size="16" fill="#ab650a" text-anchor="middle">2120</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Illustrative times in</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">milliseconds. Source event,</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">cache refresh, request and</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">response are separate clocks.</text></g><g transform="translate(10 458)"><rect x="0" y="0" width="300" height="390" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Measure the right interval</text><g transform="translate(0 60)"><rect x="10" y="21" width="280" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="150.0" y="43.0" font-size="16" fill="#7656a6" text-anchor="middle">2120 − 0 = 2120 ms</text><rect x="10" y="95" width="280" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="150.0" y="117.0" font-size="16" fill="#7656a6" text-anchor="middle">2000 − 0 = 2000 ms</text><rect x="10" y="169" width="280" height="34" rx="5" fill="#f5f9fb" stroke="#ab650a"/><text x="150.0" y="191.0" font-size="16" fill="#ab650a" text-anchor="middle">2120 − 2100 = 20 ms</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Source age at response is 2120</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">ms; incorporation lag is 2000</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">ms; request latency is 20 ms.</text></g></g></svg>