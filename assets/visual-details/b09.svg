<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">CAST exchanges summaries across the two table axes</title><desc id="desc">Feature attention mixes columns within a row; item attention mixes support examples within a column. CAST carries 3 item-summary tokens per row and 32 feature-summary tokens per feature, with cross-axis reads before axis-wise attention.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">CAST exchanges summaries across the two table axes</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><text x="40" y="102" font-size="21" style="fill:#233c50" text-anchor="start">Rows × features</text><rect x="105" y="150" width="48" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="157" y="150" width="48" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="209" y="150" width="48" height="41" rx="3" fill="#d7eeee" stroke="#aec3ce"/><rect x="261" y="150" width="48" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="313" y="150" width="48" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="105" y="195" width="48" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="157" y="195" width="48" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="209" y="195" width="48" height="41" rx="3" fill="#d7eeee" stroke="#aec3ce"/><rect x="261" y="195" width="48" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="313" y="195" width="48" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="105" y="240" width="48" height="41" rx="3" fill="#d7eeee" stroke="#aec3ce"/><rect x="157" y="240" width="48" height="41" rx="3" fill="#d7eeee" stroke="#aec3ce"/><rect x="209" y="240" width="48" height="41" rx="3" fill="#d7eeee" stroke="#aec3ce"/><rect x="261" y="240" width="48" height="41" rx="3" fill="#d7eeee" stroke="#aec3ce"/><rect x="313" y="240" width="48" height="41" rx="3" fill="#d7eeee" stroke="#aec3ce"/><rect x="105" y="285" width="48" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="157" y="285" width="48" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="209" y="285" width="48" height="41" rx="3" fill="#d7eeee" stroke="#aec3ce"/><rect x="261" y="285" width="48" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="313" y="285" width="48" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="105" y="330" width="48" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="157" y="330" width="48" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="209" y="330" width="48" height="41" rx="3" fill="#d7eeee" stroke="#aec3ce"/><rect x="261" y="330" width="48" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="313" y="330" width="48" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><text x="391" y="410" font-size="17" style="fill:#657b8b" text-anchor="start">width 192</text><path d="M116 260L353 260" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="230" y="130" font-size="18" style="fill:#087f83" text-anchor="middle">feature axis →</text><path d="M233 163L233 370" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="55" y="391" font-size="18" style="fill:#7656a6" text-anchor="start">item axis ↓</text><rect x="434" y="150" width="24" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="462" y="150" width="24" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="490" y="150" width="24" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="434" y="195" width="24" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="462" y="195" width="24" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="490" y="195" width="24" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="434" y="240" width="24" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="462" y="240" width="24" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="490" y="240" width="24" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="434" y="285" width="24" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="462" y="285" width="24" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="490" y="285" width="24" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="434" y="330" width="24" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="462" y="330" width="24" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="490" y="330" width="24" height="41" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><text x="482" y="126" font-size="18" style="fill:#087f83" text-anchor="middle">3 / row</text><path d="M373 237L427 237" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="105" y="436" width="48" height="20" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="157" y="436" width="48" height="20" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="209" y="436" width="48" height="20" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="261" y="436" width="48" height="20" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="313" y="436" width="48" height="20" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="105" y="460" width="48" height="20" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="157" y="460" width="48" height="20" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="209" y="460" width="48" height="20" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="261" y="460" width="48" height="20" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="313" y="460" width="48" height="20" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><tex