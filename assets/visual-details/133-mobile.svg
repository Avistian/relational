<svg xmlns="http://www.w3.org/2000/svg" width="320" height="911" viewBox="0 0 320 911" role="img" aria-labelledby="title desc"><title id="title">Two sums, with a root transform inside each relation</title><desc id="desc">For root feature 4, orders contribute 2×(1+2)+1+3×4 = 19. Tickets contribute 0.5×5−1−2×4 = −6.5. The outer relation sum is 12.5.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="911" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Sum within each relation</text><g transform="translate(0 60)"><text x="15" y="30" font-size="18" fill="#087f83" text-anchor="start">orders: Σ neighbors = 1+2</text><rect x="10" y="51" width="280" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="150.0" y="73.0" font-size="16" fill="#087f83" text-anchor="middle">2×3 + 1 + 3×4 = 19</text><text x="15" y="138" font-size="18" fill="#7656a6" text-anchor="start">tickets: Σ neighbors = 5</text><rect x="10" y="158" width="280" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="150.0" y="180.0" font-size="16" fill="#7656a6" text-anchor="middle">0.5×5 − 1 − 2×4 = −6.5</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Root feature 4 enters both</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">relation modules. Each module</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">also transforms its neighbor</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">sum.</text></g><g transform="translate(10 458)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Sum complete relation</text><text x="49" y="49" font-size="17" fill="#233c50" text-anchor="start">outputs</text><g transform="translate(0 60)"><circle cx="65" cy="50" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="65" y="55" font-size="16" fill="#087f83" text-anchor="middle">19</text><circle cx="230" cy="50" r="32" fill="white" stroke="#7656a6" stroke-width="2"/><text x="230" y="55" font-size="16" fill="#7656a6" text-anchor="middle">−6.5</text><path d="M65 80L129 134" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M230 87L173 134" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><circle cx="151" cy="159" r="22" fill="white" stroke="#ab650a" stroke-width="2"/><text x="151" y="164" font-size="16" fill="#ab650a" text-anchor="middle">+</text><text x="150" y="224" font-size="29" fill="#ab650a" text-anchor="middle">12.5</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Combine 19 and −6.5 to obtain</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">12.5. An empty relation can</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">retain its bias and root</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">contribution.</text></g></g></svg>