<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Missing, zero and an unknown category are different inputs</title><desc id="desc">Tokenization must preserve field identity, value type and missingness. A missing numeric field, an observed zero and an unseen categorical value are three different states.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">Missing, zero and an unknown category are different inputs</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><text x="50" y="112" font-size="21" style="fill:#233c50" text-anchor="start">Read value AND state before embedding a cell.</text><rect x="50" y="145" width="260" height="280" rx="9" fill="#f7f9fc" stroke="#087f83"/><text x="180" y="182" font-size="20" style="fill:#087f83" text-anchor="middle">numeric field</text><text x="180" y="245" font-size="28" style="fill:#087f83" text-anchor="middle">0</text><path d="M180 267L180 310" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="70" y="330" width="220" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="180.0" y="362.0" font-size="18" style="fill:#087f83" text-anchor="middle">observed</text><rect x="370" y="145" width="260" height="280" rx="9" fill="#f7f9fc" stroke="#ab650a"/><text x="500" y="182" font-size="20" style="fill:#ab650a" text-anchor="middle">numeric field</text><text x="500" y="245" font-size="28" style="fill:#ab650a" text-anchor="middle">—</text><path d="M500 267L500 310" stroke="#ab650a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="390" y="330" width="220" height="52" rx="9" fill="#f4f8fa" stroke="#ab650a"/><text x="500.0" y="362.0" font-size="18" style="fill:#ab650a" text-anchor="middle">missing</text><rect x="690" y="145" width="260" height="280" rx="9" fill="#f7f9fc" stroke="#7656a6"/><text x="820" y="182" font-size="20" style="fill:#7656a6" text-anchor="middle">categorical field</text><text x="820" y="245" font-size="28" style="fill:#7656a6" text-anchor="middle">new value</text><path d="M820 267L820 310" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="710" y="330" width="220" height="52" rx="9" fill="#f4f8fa" stroke="#7656a6"/><text x="820.0" y="362.0" font-size="18" style="fill:#7656a6" text-anchor="middle">unknown</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">Preserve column identity and type alongside the value representation.</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">Exact reserved tokens and missing-value encodings follow the fitted tokenizer contract.</text></svg>