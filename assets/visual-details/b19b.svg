<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Forecast future rows without feeding predictions back</title><desc id="desc">Fit time features using history only. Encode both historical and future timestamps with that map. Context rows have targets; future rows have hidden targets. The predictor returns one marginal distribution per horizon.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">Forecast future rows without feeding predictions back</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><text x="40" y="101" font-size="21" style="fill:#087f83" text-anchor="start">History: observed targets</text><text x="565" y="101" font-size="21" style="fill:#ab650a" text-anchor="start">Future: hidden targets</text><path d="M65 224L922 224" stroke="#657b8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M75 195L120 165" stroke="#087f83" stroke-width="3" fill="none"/><path d="M120 165L165 188" stroke="#087f83" stroke-width="3" fill="none"/><path d="M165 188L210 142" stroke="#087f83" stroke-width="3" fill="none"/><path d="M210 142L255 171" stroke="#087f83" stroke-width="3" fill="none"/><path d="M255 171L300 132" stroke="#087f83" stroke-width="3" fill="none"/><path d="M300 132L345 156" stroke="#087f83" stroke-width="3" fill="none"/><path d="M345 156L390 116" stroke="#087f83" stroke-width="3" fill="none"/><path d="M482 116L482 459" stroke="#ab650a" stroke-width="3" fill="none" stroke-dasharray="7 5"/><text x="482" y="489" font-size="18" style="fill:#ab650a" text-anchor="middle">forecast origin</text><rect x="55" y="282" width="347" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="228.5" y="314.0" font-size="18" style="fill:#087f83" text-anchor="middle">fit time-feature map on history</text><path d="M225 230L225 276" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="385" width="347" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="228.5" y="417.0" font-size="18" style="fill:#087f83" text-anchor="middle">context: [time features, y]</text><path d="M225 339L225 379" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="562" y="282" width="372" height="52" rx="9" fill="#f4f8fa" stroke="#ab650a"/><text x="748.0" y="314.0" font-size="18" style="fill:#ab650a" text-anchor="middle">apply SAME map to future times</text><path d="M408 307L554 307" stroke="#ab650a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="562" y="385" width="372" height="52" rx="9" fill="#f4f8fa" stroke="#ab650a"/><text x="748.0" y="417.0" font-size="18" style="fill:#ab650a" text-anchor="middle">queries: [time features, ?]</text><path d="M750 339L750 379" stroke="#ab650a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M630 147L630 211" stroke="#7656a6" stroke-width="3" fill="none"/><circle cx="630" cy="179" r="9" fill="white" stroke="#7656a6" stroke-width="3"/><text x="630" y="185" font-size="17" style="fill:#7656a6" text-anchor="middle">•</text><text x="630" y="255" font-size="17" style="fill:#657b8b" text-anchor="middle">h=1</text><path d="M750 135L750 199" stroke="#7656a6" stroke-width="3" fill="none"/><circle cx="750" cy="167" r="9" fill="white" stroke="#7656a6" stroke-width="3"/><text x="750" y="173" font-size="17" style="fill:#7656a6" text-anchor="middle">•</text><text x="750" y="255" font-size="17" style="fill:#657b8b" text-anchor="middle">h=2</text><path d="M870 157L870 221" stroke="#7656a6" stroke-width="3" fill="none"/><circle cx="870" cy="189" r="9" fill="white" stroke="#7656a6" stroke-width="3"/><text x="870" y="195" font-size="17" style="fill:#7656a6" text-anchor="middle">•</text><text x="870" y="255" font-size="17" style="fill:#657b8b" text-anchor="middle">h=3</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">Context + all future query rows → frozen TabPFN predictor → H marginal distributions.</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">No predicted target is fed into the next horizon. Intervals are schematic, not measured forecasts.</text></svg>