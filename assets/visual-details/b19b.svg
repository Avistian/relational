<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="931" viewBox="0 0 1000 931" role="img" aria-labelledby="title desc"><title id="title">Forecast future rows without feeding predictions back</title><desc id="desc">Fit time features using history only. Encode both historical and future timestamps with that map. Context rows have targets; future rows have hidden targets. The predictor returns one marginal distribution per horizon.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="931" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Freeze the forecast origin</text><g transform="translate(0 60)"><path d="M20 125L50 99" fill="none" stroke="#087f83" stroke-width="2"/><path d="M50 99L80 117" fill="none" stroke="#087f83" stroke-width="2"/><path d="M80 117L110 80" fill="none" stroke="#087f83" stroke-width="2"/><path d="M110 80L140 98" fill="none" stroke="#087f83" stroke-width="2"/><path d="M140 98L170 63" fill="none" stroke="#087f83" stroke-width="2"/><path d="M192 35L192 152" fill="none" stroke="#ab650a" stroke-width="2" stroke-dasharray="5 4"/><text x="80" y="28" font-size="17" fill="#087f83" text-anchor="middle">history</text><text x="243" y="28" font-size="17" fill="#ab650a" text-anchor="middle">future</text><text x="219" y="100" font-size="22" fill="#ab650a" text-anchor="middle">?</text><text x="251" y="100" font-size="22" fill="#ab650a" text-anchor="middle">?</text><text x="283" y="100" font-size="22" fill="#ab650a" text-anchor="middle">?</text><text x="150" y="190" font-size="17" fill="#233c50" text-anchor="middle">fit periods from history only</text><text x="150" y="220" font-size="16" fill="#657b8b" text-anchor="middle">calendar + known covariates</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Only available history fits</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">seasonality and preprocessing.</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">Future timestamps are known;</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">their targets are not.</text></g><g transform="translate(350 10)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Build a regression table</text><g transform="translate(0 60)"><text x="50" y="23" font-size="16" fill="#657b8b" text-anchor="middle">time</text><text x="119" y="23" font-size="16" fill="#657b8b" text-anchor="middle">sin</text><text x="188" y="23" font-size="16" fill="#657b8b" text-anchor="middle">cos</text><text x="257" y="23" font-size="16" fill="#657b8b" text-anchor="middle">target</text><rect x="18" y="39" width="65" height="37" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="50.5" y="62.5" font-size="16" fill="#087f83" text-anchor="middle">0</text><rect x="87" y="39" width="65" height="37" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="119.5" y="62.5" font-size="16" fill="#087f83" text-anchor="middle">0</text><rect x="156" y="39" width="65" height="37" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="188.5" y="62.5" font-size="16" fill="#087f83" text-anchor="middle">1</text><rect x="225" y="39" width="65" height="37" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="257.5" y="62.5" font-size="16" fill="#087f83" text-anchor="middle">y₀</text><rect x="18" y="80" width="65" height="37" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="50.5" y="103.5" font-size="16" fill="#087f83" text-anchor="middle">3</text><rect x="87" y="80" width="65" height="37" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="119.5" y="103.5" font-size="16" fill="#087f83" text-anchor="middle">1</text><rect x="156" y="80" width="65" height="37" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="188.5" y="103.5" font-size="16" fill="#087f83" text-anchor="middle">0</text><rect x="225" y="80" width="65" height="37" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="257.5" y="103.5" font-size="16" fill="#087f83" text-anchor="middle">y₃</text><rect x="18" y="121" width="65" height="37" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="50.5" y="144.5" font-size="16" fill="#087f83" text-anchor="middle">12</text><rect x="87" y="121" width="65" height="37" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="119.5" y="144.5" font-size="16" fill="#087f83" text-anchor="middle">0</text><rect x="156" y="121" width="65" height="37" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="188.5" y="144.5" font-size="16" fill="#087f83" text-anchor="middle">1</text><rect x="225" y="121" width="65" height="37" rx="5" fill="#fff6df" stroke="#087f83"/><text x="257.5" y="144.5" font-size="16" fill="#087f83" text-anchor="middle">?</text><text x="150" y="190" font-size="16" fill="#087f83" text-anchor="middle">period 12: same map at all times</text><text x="150" y="219" font-size="17" fill="#ab650a" text-anchor="middle">future time ≠ future answer</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Historical and future rows</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">share the same feature map.</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">This period-12 example shows</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">only two phase columns.</text></g><g transform="translate(690 10)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">03</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Embed cells and groups</text><g transform="translate(0 60)"><text x="150" y="22" font-size="17" fill="#087f83" text-anchor="middle">feature groups + target slot</text><rect x="36" y="44" width="72" height="39" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="72.0" y="68.5" font-size="16" fill="#087f83" text-anchor="middle">g₁</text><rect x="112" y="44" width="72" height="39" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="148.0" y="68.5" font-size="16" fill="#087f83" text-anchor="middle">g₂</text><rect x="188" y="44" width="72" height="39" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="224.0" y="68.5" font-size="16" fill="#087f83" text-anchor="middle">y</text><rect x="36" y="87" width="72" height="39" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="72.0" y="111.5" font-size="16" fill="#087f83" text-anchor="middle">g₁</text><rect x="112" y="87" width="72" height="39" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="148.0" y="111.5" font-size="16" fill="#087f83" text-anchor="middle">g₂</text><rect x="188" y="87" width="72" height="39" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="224.0" y="111.5" font-size="16" fill="#087f83" text-anchor="middle">y</text><rect x="36" y="130" width="72" height="39" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="72.0" y="154.5" font-size="16" fill="#087f83" text-anchor="middle">g₁</text><rect x="112" y="130" width="72" height="39" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="148.0" y="154.5" font-size="16" fill="#087f83" text-anchor="middle">g₂</text><rect x="188" y="130" width="72" height="39" rx="5" fill="#fff6df" stroke="#087f83"/><text x="224.0" y="154.5" font-size="16" fill="#087f83" text-anchor="middle">?</text><path d="M62 195L256 195" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M266 58L266 153" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><text x="150" y="224" font-size="18" fill="#657b8b" text-anchor="middle">(C+H) × (G+1) × d</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Group features and append a</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">target slot. Context target</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">slots are observed; future</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">target slots are masked.</text></g><g transform="translate(10 458)"><rect x="0" y="0" width="300" height="430" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">04</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Read context in the</text><text x="49" y="49" font-size="17" fill="#233c50" text-anchor="start">predictor</text><g transform="translate(0 60)"><rect x="24" y="40" width="58" height="36" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="53.0" y="63.0" font-size="16" fill="#087f83" text-anchor="middle">s₁</text><rect x="24" y="80" width="58" height="36" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="53.0" y="103.0" font-size="16" fill="#087f83" text-anchor="middle">s₂</text><rect x="24" y="120" width="58" height="36" rx="5" fill="#e5f2ef" stroke="#087f83"/><text x="53.0" y="143.0" font-size="16" fill="#087f83" text-anchor="middle">s₃</text><path d="M100 57L226 116" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><path d="M100 97L226 116" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><path d="M100 137L226 116" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><circle cx="255" cy="115" r="22" fill="white" stroke="#ab650a" stroke-width="2"/><text x="255" y="120" font-size="16" fill="#ab650a" text-anchor="middle">q</text><text x="150" y="22" font-size="18" fill="#087f83" text-anchor="middle">frozen TabPFN-v2</text><text x="150" y="193" font-size="16" fill="#087f83" text-anchor="middle">feature attention → row attention</text><text x="150" y="221" font-size="16" fill="#087f83" text-anchor="middle">→ feed-forward block; repeat</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Feature attention mixes slots</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">within a row. Row attention</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">brings historical evidence to</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">query cells; feed-forward</text><text x="12" y="412" font-size="16" fill="#657b8b" text-anchor="start">blocks update states.</text></g><g transform="translate(350 458)"><rect x="0" y="0" width="300" height="430" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">05</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Decode a distribution</text><g transform="translate(0 60)"><text x="150" y="23" font-size="17" fill="#ab650a" text-anchor="middle">query target representation</text><path d="M150 35L150 69" fill="none" stroke="#ab650a" stroke-width="2" marker-end="url(#tip)"/><rect x="58" y="74" width="184" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="150.0" y="96.0" font-size="16" fill="#087f83" text-anchor="middle">decoder → softmax</text><rect x="47" y="190" width="25" height="12" rx="5" fill="#e3d8f2" stroke="#7656a6"/><rect x="83" y="170" width="25" height="32" rx="5" fill="#e3d8f2" stroke="#7656a6"/><rect x="119" y="141" width="25" height="61" rx="5" fill="#e3d8f2" stroke="#7656a6"/><rect x="155" y="126" width="25" height="76" rx="5" fill="#e3d8f2" stroke="#7656a6"/><rect x="191" y="157" width="25" height="45" rx="5" fill="#e3d8f2" stroke="#7656a6"/><rect x="227" y="184" width="25" height="18" rx="5" fill="#e3d8f2" stroke="#7656a6"/><text x="150" y="226" font-size="16" fill="#7656a6" text-anchor="middle">probability over target bins</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Read each query target state.</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">Bin probabilities define a</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">discretized predictive</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">distribution over target</text><text x="12" y="412" font-size="16" fill="#657b8b" text-anchor="start">values.</text></g><g transform="translate(690 458)"><rect x="0" y="0" width="300" height="430" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">06</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Return the full horizon</text><g transform="translate(0 60)"><text x="150" y="23" font-size="17" fill="#7656a6" text-anchor="middle">one marginal per horizon</text><path d="M55 82L55 156" fill="none" stroke="#7656a6" stroke-width="2"/><path d="M42 82L68 82" fill="none" stroke="#7656a6" stroke-width="2"/><path d="M42 156L68 156" fill="none" stroke="#7656a6" stroke-width="2"/><circle cx="55" cy="119" r="9" fill="white" stroke="#ab650a" stroke-width="2"/><text x="55" y="124" font-size="16" fill="#ab650a" text-anchor="middle">•</text><text x="55" y="187" font-size="16" fill="#657b8b" text-anchor="middle">h=1</text><path d="M150 57L150 131" fill="none" stroke="#7656a6" stroke-width="2"/><path d="M137 57L163 57" fill="none" stroke="#7656a6" stroke-width="2"/><path d="M137 131L163 131" fill="none" stroke="#7656a6" stroke-width="2"/><circle cx="150" cy="94" r="9" fill="white" stroke="#ab650a" stroke-width="2"/><text x="150" y="99" font-size="16" fill="#ab650a" text-anchor="middle">•</text><text x="150" y="187" font-size="16" fill="#657b8b" text-anchor="middle">h=2</text><path d="M245 93L245 167" fill="none" stroke="#7656a6" stroke-width="2"/><path d="M232 93L258 93" fill="none" stroke="#7656a6" stroke-width="2"/><path d="M232 167L258 167" fill="none" stroke="#7656a6" stroke-width="2"/><circle cx="245" cy="130" r="9" fill="white" stroke="#ab650a" stroke-width="2"/><text x="245" y="135" font-size="16" fill="#ab650a" text-anchor="middle">•</text><text x="245" y="187" font-size="16" fill="#657b8b" text-anchor="middle">h=3</text><text x="150" y="225" font-size="18" fill="#ab650a" text-anchor="middle">No ŷ₁ → ŷ₂ feedback.</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Extract medians and quantiles</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">for every future row. No</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">predicted target is fed into</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">the next input.</text></g></g></svg>