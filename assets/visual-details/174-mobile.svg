<svg xmlns="http://www.w3.org/2000/svg" width="320" height="911" viewBox="0 0 320 911" role="img" aria-labelledby="title desc"><title id="title">A frozen encoder can still feed a trainable residual branch</title><desc id="desc">The course adapter takes h with width 32 through D:32→8, ReLU and U:8→32, then adds h. The encoder is frozen; the adapter and original task heads learn.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="911" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Follow the residual branch</text><g transform="translate(0 60)"><rect x="27.0" y="12" width="246" height="34" rx="5" fill="#f5f9fb" stroke="#657b8b"/><text x="150.0" y="34.0" font-size="16" fill="#657b8b" text-anchor="middle">frozen encoder → h:32</text><path d="M150 51L150 71" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><rect x="50.0" y="78" width="200" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="150.0" y="100.0" font-size="16" fill="#087f83" text-anchor="middle">D: 32 → 8 + ReLU</text><path d="M150 117L150 137" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><rect x="27.0" y="144" width="246" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="150.0" y="166.0" font-size="16" fill="#087f83" text-anchor="middle">U: 8 → 32</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">A frozen encoder still computes</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">h. The trainable branch</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">projects 32→8, applies ReLU,</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">then projects 8→32.</text></g><g transform="translate(10 458)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Add back the original state</text><g transform="translate(0 60)"><rect x="18" y="20" width="118" height="34" rx="5" fill="#f5f9fb" stroke="#657b8b"/><text x="77.0" y="42.0" font-size="16" fill="#657b8b" text-anchor="middle">h</text><rect x="167" y="20" width="115" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="224.5" y="42.0" font-size="16" fill="#087f83" text-anchor="middle">branch: 0</text><path d="M77 60L129 117" fill="none" stroke="#657b8b" stroke-width="2" marker-end="url(#tip)"/><path d="M224 60L172 117" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><circle cx="150" cy="140" r="22" fill="white" stroke="#ab650a" stroke-width="2"/><text x="150" y="145" font-size="16" fill="#ab650a" text-anchor="middle">+</text><path d="M150 168L150 186" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><text x="150" y="221" font-size="20" fill="#ab650a" text-anchor="middle">h′ = h → task heads</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">With U=0 and c=0 at</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">initialization, the branch is</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">zero and h′=h. The adapter and</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">original task heads train.</text></g></g></svg>