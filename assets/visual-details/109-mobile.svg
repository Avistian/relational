<svg xmlns="http://www.w3.org/2000/svg" width="320" height="891" viewBox="0 0 320 891" role="img" aria-labelledby="title desc"><title id="title">One fact, two clocks</title><desc id="desc">An event at time 2 observed at time 7 cannot appear in a prediction issued at time 5. Point-in-time reconstruction needs the observation clock as well as the event clock.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="891" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="390" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Compare the two clocks</text><g transform="translate(0 60)"><text x="18" y="47" font-size="17" fill="#657b8b" text-anchor="start">event</text><path d="M20 73L277 73" fill="none" stroke="#657b8b" stroke-width="2" marker-end="url(#tip)"/><circle cx="76" cy="73" r="16" fill="white" stroke="#087f83" stroke-width="2"/><text x="76" y="78" font-size="16" fill="#087f83" text-anchor="middle">2</text><text x="18" y="132" font-size="17" fill="#657b8b" text-anchor="start">observed</text><path d="M20 158L277 158" fill="none" stroke="#657b8b" stroke-width="2" marker-end="url(#tip)"/><circle cx="216" cy="158" r="16" fill="white" stroke="#b54e55" stroke-width="2"/><text x="216" y="163" font-size="16" fill="#b54e55" text-anchor="middle">7</text><path d="M160 23L160 190" fill="none" stroke="#ab650a" stroke-width="2" stroke-dasharray="5 4"/><text x="160" y="219" font-size="18" fill="#ab650a" text-anchor="middle">query = 5</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">The event happened at 2; the</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">system first observed it at 7.</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">The query was issued at 5.</text></g><g transform="translate(10 438)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Reconstruct what was known</text><g transform="translate(0 60)"><rect x="25" y="36" width="250" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="150.0" y="58.0" font-size="16" fill="#087f83" text-anchor="middle">2 ≤ 5: event-time pass</text><rect x="25" y="110" width="250" height="34" rx="5" fill="#f5f9fb" stroke="#b54e55"/><text x="150.0" y="132.0" font-size="16" fill="#b54e55" text-anchor="middle">7 &gt; 5: not observed yet</text><text x="150" y="208" font-size="23" fill="#b54e55" text-anchor="middle">fact excluded</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Event time passes the cutoff.</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">Observation time fails it, so</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">the fact is absent from the</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">query input.</text></g></g></svg>