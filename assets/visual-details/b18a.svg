<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">TACO compresses support into latent cells</title><desc id="desc">Support cells and K dummy rows enter the compressor. The resulting latent context passes through a residual MLP to the predictor alongside embedded queries. Compressor and predictor are pretrained together.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">TACO compresses support into latent cells</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><text x="47" y="107" font-size="20" style="fill:#233c50" text-anchor="start">N support rows</text><rect x="65" y="131" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="100" y="131" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="135" y="131" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="170" y="131" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="65" y="162" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="100" y="162" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="135" y="162" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="170" y="162" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="65" y="193" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="100" y="193" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="135" y="193" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="170" y="193" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="65" y="224" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="100" y="224" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="135" y="224" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="170" y="224" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="65" y="255" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="100" y="255" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="135" y="255" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="170" y="255" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="65" y="286" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="100" y="286" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="135" y="286" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="170" y="286" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><text x="308" y="107" font-size="20" style="fill:#233c50" text-anchor="start">K dummy rows</text><rect x="339" y="157" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="374" y="157" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="409" y="157" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="444" y="157" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="339" y="188" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="374" y="188" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="409" y="188" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="444" y="188" width="31" height="27" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><text x="312" y="255" font-size="17" style="fill:#ab650a" text-anchor="start">targets masked</text><path d="M218 224L520 223" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M483 188L520 211" stroke="#ab650a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="527" y="177" width="220" height="81" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="637.0" y="223.5" font-size="18" style="fill:#087f83" text-anchor="middle">compressor</text><path d="M753 218L809 218" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="821" y="158" width="27" height="35" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="852" y="158" width="27" height="35" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="883" y="158" width="27" height="35" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="914" y="158" width="27" height="35" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="821" y="197" width="27" height="35" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="852" y="197" width="27" height="35" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="883" y="197" width="27" height="35" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><rect x="914" y="197" width="27" height="35" rx="3" fill="#f3f5f9" stroke="#aec3ce"/><text x="883" y="279" font-size="18" style="fill:#7656a6" text-anchor="middle">latent cells</text><path d="M883 287L883 326" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="717" y="332" width="240" height="52" rx="9" fill="#f4f8fa" stroke="#7656a6"/><text x="837.0" y="364.0" font-size="18" style="fill:#7656a6" text-anchor="middle">residual MLP</text><path d="M709 358L642 358" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="389" y="332" width="247" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="512.5" y="364.0" font-size="18" style="fill:#087f83" text-anchor="middle">predictor</text><rect x="43" y="332" width="265" height="52" rx="9" fill="#f4f8fa" stroke="#ab650a"/><text x="175.5" y="364.0" font-size="18" style="fill:#ab650a" text-anchor="middle">embedded query cells</text><path d="M314 358L381 358" stroke="#ab650a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M514 389L514 438" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="514" y="469" font-size="23" style="fill:#087f83" text-anchor="middle">query prediction</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">Paper latent shape: K × (M+1) × L. The release uses feature groups plus a target slot.</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">Compressor and predictor are jointly pretrained. Latent rows are not ordinary observations.</text></svg>