<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">A frozen encoder can still feed a trainable residual branch</title><desc id="desc">The course adapter takes h with width 32 through D:32→8, ReLU and U:8→32, then adds h. The encoder is frozen; the adapter and original task heads learn.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">A frozen encoder can still feed a trainable residual branch</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><rect x="35" y="195" width="190" height="52" rx="9" fill="#f4f8fa" stroke="#657b8b"/><text x="130.0" y="227.0" font-size="18" style="fill:#657b8b" text-anchor="middle">frozen encoder</text><path d="M230 221L283 221" stroke="#657b8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="290" y="195" width="100" height="52" rx="9" fill="#f4f8fa" stroke="#657b8b"/><text x="340.0" y="227.0" font-size="18" style="fill:#657b8b" text-anchor="middle">h: 32</text><path d="M395 221L446 221" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="452" y="195" width="105" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="504.5" y="227.0" font-size="18" style="fill:#087f83" text-anchor="middle">D: 32→8</text><path d="M563 221L587 221" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="592" y="195" width="95" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="639.5" y="227.0" font-size="18" style="fill:#087f83" text-anchor="middle">ReLU</text><path d="M693 221L717 221" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="723" y="195" width="110" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="778.0" y="227.0" font-size="18" style="fill:#087f83" text-anchor="middle">U: 8→32</text><path d="M839 221L875 221" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="907" cy="221" r="27" fill="white" stroke="#ab650a" stroke-width="3"/><text x="907" y="227" font-size="17" style="fill:#ab650a" text-anchor="middle">+</text><path d="M338 191L338 123" stroke="#657b8b" stroke-width="3" fill="none"/><path d="M338 123L907 123" stroke="#657b8b" stroke-width="3" fill="none"/><path d="M907 123L907 187" stroke="#657b8b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="630" y="105" font-size="18" style="fill:#657b8b" text-anchor="middle">identity skip: h</text><path d="M907 253L907 323" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="717" y="329" width="230" height="52" rx="9" fill="#f4f8fa" stroke="#087f83"/><text x="832.0" y="361.0" font-size="18" style="fill:#087f83" text-anchor="middle">original task heads</text><path d="M711 355L647 355" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="493" y="329" width="147" height="52" rx="9" fill="#f4f8fa" stroke="#ab650a"/><text x="566.5" y="361.0" font-size="18" style="fill:#ab650a" text-anchor="middle">task loss</text><path d="M530 324L530 258" stroke="#7656a6" stroke-width="3" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M780 324L780 258" stroke="#7656a6" stroke-width="3" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="70" y="350" font-size="23" style="fill:#657b8b" text-anchor="start">Frozen ≠ skipped.</text><text x="70" y="381" font-size="18" style="fill:#657b8b" text-anchor="start">Forward computation still runs.</text><text x="495" y="447" font-size="18" style="fill:#7656a6" text-anchor="start">Dashed: gradients update adapter + heads.</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">h′ = h + U ReLU(Dh + b) + c      •      32 → 8 → 32      •      552 adapter parameters</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">Course variant: one residual adapter after the pooled encoder; U=0 and c=0 initially.</text></svg>