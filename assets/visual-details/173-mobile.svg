<svg xmlns="http://www.w3.org/2000/svg" width="320" height="911" viewBox="0 0 320 911" role="img" aria-labelledby="title desc"><title id="title">One pooled encoder, separate prediction heads</title><desc id="desc">The course model pools same-row cells and dated foreign-key-parent cells separately. Their vectors and a query-column embedding concatenate to width 96, then a 96→64→32 MLP feeds 21 local task heads.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="911" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Pool separate context</text><text x="49" y="49" font-size="17" fill="#233c50" text-anchor="start">routes</text><g transform="translate(0 60)"><rect x="20" y="18" width="260" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="150.0" y="40.0" font-size="16" fill="#087f83" text-anchor="middle">row cells → mean: 32</text><rect x="20" y="91" width="260" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="150.0" y="113.0" font-size="16" fill="#087f83" text-anchor="middle">FK cells → mean: 32</text><rect x="20" y="164" width="260" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="150.0" y="186.0" font-size="16" fill="#7656a6" text-anchor="middle">column embedding: 32</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Pool same-row and dated FK-</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">parent embeddings separately.</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">Add a query-column embedding;</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">each vector has width 32.</text></g><g transform="translate(10 458)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Encode, then choose a head</text><g transform="translate(0 60)"><rect x="37" y="16" width="226" height="34" rx="5" fill="#f5f9fb" stroke="#087f83"/><text x="150.0" y="38.0" font-size="16" fill="#087f83" text-anchor="middle">concat: 96</text><path d="M150 56L150 78" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><rect x="37" y="84" width="226" height="34" rx="5" fill="#f5f9fb" stroke="#7656a6"/><text x="150.0" y="106.0" font-size="16" fill="#7656a6" text-anchor="middle">MLP: 96 → 64 → 32</text><path d="M150 124L150 148" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><rect x="20" y="156" width="260" height="34" rx="5" fill="#f5f9fb" stroke="#ab650a"/><text x="150.0" y="178.0" font-size="16" fill="#ab650a" text-anchor="middle">21 local task heads</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Concatenate to width 96,</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">project through 64 and 32, then</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">use the appropriate one of 21</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">local task heads.</text></g></g></svg>