<svg xmlns="http://www.w3.org/2000/svg" width="320" height="891" viewBox="0 0 320 891" role="img" aria-labelledby="title desc"><title id="title">Two passes through a sampled computation graph</title><desc id="desc">Expand dependencies away from the seed; compute messages back toward it. Context nodes supply features, but only seed predictions enter this batch loss.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="320" height="891" fill="#fff"/><g font-family="system-ui,sans-serif"><g transform="translate(10 10)"><rect x="0" y="0" width="300" height="390" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">01</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Expand dependencies</text><g transform="translate(0 60)"><path d="M132.7872960144789 54.13071486474889L92.90121214494194 96.14405654066115" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><path d="M167.2127039855211 54.13071486474889L207.09878785505805 96.14405654066115" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><path d="M63.719501425037166 137.31031940381538L41.731718517961355 180.797267820032" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><path d="M84.14939662278992 138.26560855509436L100.48462751229849 179.80376710270184" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><path d="M215.8506033772101 138.26560855509436L199.5153724877015 179.80376710270184" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><path d="M236.28049857496285 137.31031940381538L258.2682814820387 180.797267820032" fill="none" stroke="#7656a6" stroke-width="2" marker-end="url(#tip)"/><circle cx="150" cy="36" r="22" fill="white" stroke="#ab650a" stroke-width="2"/><text x="150" y="41" font-size="16" fill="#ab650a" text-anchor="middle">seed</text><circle cx="75" cy="115" r="22" fill="white" stroke="#7656a6" stroke-width="2"/><text x="75" y="120" font-size="16" fill="#7656a6" text-anchor="middle">a</text><circle cx="225" cy="115" r="22" fill="white" stroke="#7656a6" stroke-width="2"/><text x="225" y="120" font-size="16" fill="#7656a6" text-anchor="middle">b</text><circle cx="30" cy="204" r="22" fill="white" stroke="#7656a6" stroke-width="2"/><text x="30" y="209" font-size="16" fill="#7656a6" text-anchor="middle">1</text><circle cx="110" cy="204" r="22" fill="white" stroke="#7656a6" stroke-width="2"/><text x="110" y="209" font-size="16" fill="#7656a6" text-anchor="middle">2</text><circle cx="190" cy="204" r="22" fill="white" stroke="#7656a6" stroke-width="2"/><text x="190" y="209" font-size="16" fill="#7656a6" text-anchor="middle">3</text><circle cx="270" cy="204" r="22" fill="white" stroke="#7656a6" stroke-width="2"/><text x="270" y="209" font-size="16" fill="#7656a6" text-anchor="middle">4</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Start at the seed. Find one-hop</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">dependencies, then the nodes</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">they require.</text></g><g transform="translate(10 438)"><rect x="0" y="0" width="300" height="410" rx="9" fill="#fbfcfd" stroke="#d2e0e5"/><text x="14" y="28" font-size="17" fill="#ab650a" text-anchor="start">02</text><text x="49" y="28" font-size="17" fill="#233c50" text-anchor="start">Compute back inward</text><g transform="translate(0 60)"><path d="M92.2127039855211 96.86928513525112L132.09878785505805 54.855943459338846" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M207.7872960144789 96.86928513525112L167.90121214494195 54.855943459338846" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M41.280498574962834 181.68968059618462L63.268281482038645 138.202732179968" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M100.85060337721008 180.73439144490564L84.51537248770151 139.19623289729816" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M199.1493966227899 180.73439144490564L215.4846275122985 139.19623289729816" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><path d="M258.71950142503715 181.68968059618462L236.73171851796135 138.202732179968" fill="none" stroke="#087f83" stroke-width="2" marker-end="url(#tip)"/><circle cx="150" cy="36" r="22" fill="white" stroke="#ab650a" stroke-width="2"/><text x="150" y="41" font-size="16" fill="#ab650a" text-anchor="middle">seed</text><circle cx="75" cy="115" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="75" y="120" font-size="16" fill="#087f83" text-anchor="middle">a</text><circle cx="225" cy="115" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="225" y="120" font-size="16" fill="#087f83" text-anchor="middle">b</text><circle cx="30" cy="204" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="30" y="209" font-size="16" fill="#087f83" text-anchor="middle">1</text><circle cx="110" cy="204" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="110" y="209" font-size="16" fill="#087f83" text-anchor="middle">2</text><circle cx="190" cy="204" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="190" y="209" font-size="16" fill="#087f83" text-anchor="middle">3</text><circle cx="270" cy="204" r="22" fill="white" stroke="#087f83" stroke-width="2"/><text x="270" y="209" font-size="16" fill="#087f83" text-anchor="middle">4</text></g><text x="12" y="332" font-size="16" fill="#657b8b" text-anchor="start">Outer states feed the first</text><text x="12" y="352" font-size="16" fill="#657b8b" text-anchor="start">hop, which feeds the seed. Only</text><text x="12" y="372" font-size="16" fill="#657b8b" text-anchor="start">seed predictions enter the</text><text x="12" y="392" font-size="16" fill="#657b8b" text-anchor="start">batch loss.</text></g></g></svg>