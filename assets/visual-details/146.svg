<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Sampling reach and computation reach are different</title><desc id="desc">On driver→result→race→circuit, three synchronous edge-local layers are needed for original circuit features to reach the driver. One local all-pairs attention block can connect those tokens only if all were sampled.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="620" fill="#fff"/><style>text{font-family:system-ui,sans-serif;fill:#233c50}</style><text x="30" y="38" font-size="24" style="fill:#233c50" text-anchor="start">Sampling reach and computation reach are different</text><path d="M30 59L970 59" stroke="#d5e3e8" stroke-width="3" fill="none"/><circle cx="125" cy="186" r="44" fill="white" stroke="#ab650a" stroke-width="3"/><text x="125" y="192" font-size="17" style="fill:#ab650a" text-anchor="middle">driver</text><text x="125" y="272" font-size="19" style="fill:#657b8b" text-anchor="middle">0 layers</text><circle cx="365" cy="186" r="44" fill="white" stroke="#087f83" stroke-width="3"/><text x="365" y="192" font-size="17" style="fill:#087f83" text-anchor="middle">result</text><path d="M316 186L177 186" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="365" y="272" font-size="19" style="fill:#657b8b" text-anchor="middle">1 layer</text><circle cx="605" cy="186" r="44" fill="white" stroke="#087f83" stroke-width="3"/><text x="605" y="192" font-size="17" style="fill:#087f83" text-anchor="middle">race</text><path d="M556 186L417 186" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="605" y="272" font-size="19" style="fill:#657b8b" text-anchor="middle">2 layers</text><circle cx="845" cy="186" r="44" fill="white" stroke="#087f83" stroke-width="3"/><text x="845" y="192" font-size="17" style="fill:#087f83" text-anchor="middle">circuit</text><path d="M796 186L657 186" stroke="#087f83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="845" y="272" font-size="19" style="fill:#657b8b" text-anchor="middle">3 layers</text><text x="55" y="104" font-size="21" style="fill:#233c50" text-anchor="start">Edge-local propagation: count the links back to the driver</text><path d="M841 345L141 345" stroke="#7656a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="489" y="382" font-size="20" style="fill:#7656a6" text-anchor="middle">all-pairs attention: one block, if both tokens are present</text><rect x="753" y="417" width="190" height="62" rx="9" fill="#fff2f1" stroke="#b54e55"/><text x="848" y="454" font-size="17" style="fill:#b54e55" text-anchor="middle">absent ≠ reachable</text><rect x="30" y="520" width="940" height="76" rx="9" fill="#f5f7fa" stroke="#c4d5de"/><text x="48" y="551" font-size="18" style="fill:#233c50" text-anchor="start">Sample membership bounds information access before either operator runs.</text><text x="48" y="579" font-size="16" style="fill:#657b8b" text-anchor="start">Schematic synchronous root-readout comparison; pooling would change these assumptions.</text></svg>