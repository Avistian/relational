<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="sm-62-historical-v1-title sm-62-historical-v1-desc"><title id="sm-62-historical-v1-title">TabPFN v1: one row token, many labeled-context interactions</title><desc id="sm-62-historical-v1-desc">The wrapper constructs views; the same frozen network reads each view. Only context tokens receive label embeddings. The query then reads those context states through the masked row blocks. After decoding each view, undo class permutations before combining probabilities.</desc><defs><marker id="sm-62-historical-v1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-62-historical-v1-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="720" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 062 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">The wrapper constructs views; the same frozen network reads each view.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="25" y="140" width="950" height="150" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><rect x="25" y="485" width="630" height="135" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><polyline data-edge="context:ctok" points="187.5,266 187.5,345" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-62-historical-v1-arrow)"/><polyline data-edge="query:qtok" points="497.5,266 497.5,345" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-62-historical-v1-arrow)"/><polyline data-edge="views:qtok" points="820.0,266 820,315 340,315 340,388 365,388.0" fill="none" stroke="#80669d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#sm-62-historical-v1-control)"/><polyline data-edge="ctok:blocks" points="187.5,431 187.5,525" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-62-historical-v1-arrow)"/><polyline data-edge="qtok:blocks" points="497.5,431 497,470 187,470 187.5,525" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-62-historical-v1-arrow)"/><polyline data-edge="blocks:head" points="320,568.0 365,568.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-62-historical-v1-arrow)"/><polyline data-edge="head:combine" points="630,568.0 695,568.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-62-historical-v1-arrow)"/><polyline data-edge="views:ctok" points="820.0,266 820,300 187,300 187.5,345" fill="none" stroke="#80669d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#sm-62-historical-v1-control)"/><rect x="35" y="147" width="493.12" height="20" fill="#f7faf9"/><text x="39" y="162" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">WRAPPER · context-fitted transformations / feature and class views</text><rect x="35" y="492" width="193.0" height="20" fill="#f7faf9"/><text x="39" y="507" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">FROZEN HISTORICAL NETWORK</text><g data-node="context"><rect x="55" y="180" width="265" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="69" y="206" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Labeled context</text><text x="69" y="228" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">Xc and yc</text><text x="69" y="250" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">fit the declared transform</text></g><g data-node="query"><rect x="365" y="180" width="265" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="379" y="206" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Unlabeled queries</text><text x="379" y="228" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">Xq transformed identically</text><text x="379" y="250" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">no query target supplied</text></g><g data-node="views"><rect x="695" y="180" width="250" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="709" y="206" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Create declared views</text><text x="709" y="228" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">feature / class permutations</text><text x="709" y="250" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">record inverse class maps</text></g><g data-node="ctok"><rect x="55" y="345" width="265" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="69" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Context row token</text><text x="69" y="393" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">pad / scale to 100 features</text><text x="69" y="415" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">Ex(x) + Ey(y): 512 wide</text></g><g data-node="qtok"><rect x="365" y="345" width="265" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="379" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Query row token</text><text x="379" y="393" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">same feature projection</text><text x="379" y="415" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">Ex(x): 512 wide</text></g><g data-node="blocks"><rect x="55" y="525" width="265" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="69" y="551" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">12 row blocks</text><text x="69" y="573" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">masked attention + FFN</text><text x="69" y="595" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">residuals and normalization</text></g><g data-node="head"><rect x="365" y="525" width="265" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="379" y="551" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Query decoder</text><text x="379" y="573" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">512 → 1024 → 10</text><text x="379" y="595" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">slice active classes; temperature</text></g><g data-node="combine"><rect x="695" y="525" width="250" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="709" y="551" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Undo class remapping</text><text x="709" y="573" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">softmax in original class order</text><text x="709" y="595" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">average view probabilities</text></g><text x="65" y="680" font-family="sans-serif" font-size="15" fill="#486777">Pretraining learned θ on synthetic tasks. A new table changes context, not θ.</text></svg>