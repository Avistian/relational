<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 815" role="img" aria-labelledby="sm-64-axial-network-title sm-64-axial-network-desc"><title id="sm-64-axial-network-title">TabPFN v2: keep the feature axis alive through inference</title><desc id="sm-64-axial-network-desc">A query learns from context at each token position across 12 blocks. Within-row attention connects the query’s feature tokens to its target token. Row attention lets that row read context keys/values only. Repeating the two axes propagates context-conditioned feature interactions to the query target state.</desc><defs><marker id="sm-64-axial-network-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-64-axial-network-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="815" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 064 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">A query learns from context at each token position across 12 blocks.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="25" y="425" width="950" height="215" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><polyline data-edge="x:groups" points="177.5,236 177.5,285" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-64-axial-network-arrow)"/><polyline data-edge="y:target" points="822.5,236 822.5,285" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-64-axial-network-arrow)"/><polyline data-edge="groups:feature" points="177.5,371 177.5,425.5 185.0,425.5 185.0,480" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-64-axial-network-arrow)"/><polyline data-edge="target:feature" points="822.5,371 822,405 35,405 35,523 50,523.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-64-axial-network-arrow)"/><polyline data-edge="feature:row" points="320,523.0 365,523.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-64-axial-network-arrow)"/><polyline data-edge="row:ffn" points="635,523.0 680,523.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-64-axial-network-arrow)"/><polyline data-edge="ffn:read" points="815.0,566 815,660 500,660 500.0,690" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-64-axial-network-arrow)"/><rect x="35" y="432" width="383.32" height="20" fill="#f7faf9"/><text x="39" y="447" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">REPEAT 12 DISTINCT BLOCKS · B × (C+Q) × (G+1) × 192</text><g data-node="x"><rect x="35" y="150" width="285" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="49" y="176" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Context / query features</text><text x="49" y="198" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">context-fitted numeric wrapper</text><text x="49" y="220" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">B × (C+Q) × F</text></g><g data-node="y"><rect x="680" y="150" width="285" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="694" y="176" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Context y / query missing</text><text x="694" y="198" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">value + missingness channels</text><text x="694" y="220" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">query flag distinguishes unknown</text></g><g data-node="groups"><rect x="35" y="285" width="285" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="49" y="311" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Two-feature group encoder</text><text x="49" y="333" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">2 values + 2 flags → 192</text><text x="49" y="355" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">add projected group identity</text></g><g data-node="target"><rect x="680" y="285" width="285" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="694" y="311" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Target encoder</text><text x="694" y="333" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">2 channels → 192</text><text x="694" y="355" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">append one target token</text></g><g data-node="feature"><rect x="50" y="480" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="64" y="506" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">1 · Within each row</text><text x="64" y="528" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">feature / target attention</text><text x="64" y="550" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">residual + LayerNorm</text></g><g data-node="row"><rect x="365" y="480" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="379" y="506" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">2 · At each token position</text><text x="379" y="528" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">context ↔ context; query ← context</text><text x="379" y="550" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">query uses first-head K/V reuse</text></g><g data-node="ffn"><rect x="680" y="480" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="694" y="506" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">3 · Token-wise FFN</text><text x="694" y="528" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">192 → 768 → 192; GELU</text><text x="694" y="550" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">residual + LayerNorm</text></g><g data-node="read"><rect x="350" y="690" width="300" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="364" y="716" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Query target states → head</text><text x="364" y="738" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">192 → 768 → 10; keep K classes</text><text x="364" y="760" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">temperature → softmax → Q × K</text></g><text x="60" y="610" font-family="sans-serif" font-size="15" fill="#486777">Row attention: residual + LayerNorm. Repeat the complete three-sublayer block.</text><text x="60" y="795" font-family="sans-serif" font-size="15" fill="#486777">Pretraining: synthetic query loss updates θ. This inference path holds θ fixed.</text></svg>