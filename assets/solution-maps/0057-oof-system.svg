<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="sm-57-oof-system-title sm-57-oof-system-desc"><title id="sm-57-oof-system-title">Cross-family stacking: each training row needs an honest prediction</title><desc id="sm-57-oof-system-desc">The combiner trains on predictions made without that row’s target. The entire fitted base procedure must exclude the held-out fold. After scattering OOF predictions into original row order, the combiner may use those rows’ labels. Test scoring waits until both base-serving and combiner policies are frozen.</desc><defs><marker id="sm-57-oof-system-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-57-oof-system-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="720" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 057 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">The combiner trains on predictions made without that row’s target.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="25" y="145" width="950" height="250" rx="12" fill="#eeebf8" fill-opacity=".35" stroke="#77629d" stroke-opacity=".35"/><polyline data-edge="split:families" points="300,243.0 370,243.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-57-oof-system-arrow)"/><polyline data-edge="families:scatter" points="650,243.0 725,243.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-57-oof-system-arrow)"/><polyline data-edge="scatter:combine" points="835.0,286 835,405 505,405 505.0,430" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-57-oof-system-arrow)"/><polyline data-edge="combine:out" points="645,473.0 700,473.0" fill="none" stroke="#80669d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#sm-57-oof-system-control)"/><polyline data-edge="serve:out" points="172.5,516 172,575 832,575 832.5,516" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-57-oof-system-arrow)"/><polyline data-edge="out:score" points="965,473.0 985,473 985,710 832,710 832.5,701" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-57-oof-system-arrow)"/><rect x="35" y="152" width="390.64" height="20" fill="#f7faf9"/><text x="39" y="167" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">OUTER TRAINING ONLY · repeat for every held-out fold</text><g data-node="split"><rect x="50" y="200" width="250" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="64" y="226" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Fold f held out</text><text x="64" y="248" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">other folds fit preprocessing</text><text x="64" y="270" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">and each base procedure</text></g><g data-node="families"><rect x="370" y="200" width="280" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="384" y="226" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">XGB | TabM | TabICL</text><text x="384" y="248" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">fit / construct context without f</text><text x="384" y="270" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">predict only excluded fold f</text></g><g data-node="scatter"><rect x="725" y="200" width="220" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="739" y="226" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Scatter by row ID</text><text x="739" y="248" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">repeat all folds</text><text x="739" y="270" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">Z: N × 3 OOF p</text></g><g data-node="combine"><rect x="365" y="430" width="280" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="379" y="456" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Fit / select combiner</text><text x="379" y="478" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">Z and outer-training y</text><text x="379" y="500" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">freeze weights / policy</text></g><g data-node="serve"><rect x="40" y="430" width="265" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="54" y="456" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">New row → base models</text><text x="54" y="478" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">declared serving fit policy</text><text x="54" y="500" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">same class / column order</text></g><g data-node="out"><rect x="700" y="430" width="265" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="714" y="456" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Base p → combiner</text><text x="714" y="478" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">one probability per row</text><text x="714" y="500" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">test y is absent</text></g><g data-node="score"><rect x="700" y="615" width="265" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="714" y="641" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Test labels → final score</text><text x="714" y="663" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">compare to frozen single model</text><text x="714" y="685" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">never select the oracle winner</text></g></svg>