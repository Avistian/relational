<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" role="img" aria-labelledby="sm-49-prompt-state-title sm-49-prompt-state-desc"><title id="sm-49-prompt-state-title">Trompt: the row is reread; prompt state evolves</title><desc id="sm-49-prompt-state-desc">Distinct cells share a prediction head, not their entire computation. The first routing weights use shared identities and zero state. Its gathered values make O¹ row-dependent. O¹ then changes the next cell’s prompt routing, even though both cells reread the original x.</desc><defs><marker id="sm-49-prompt-state-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-49-prompt-state-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="625" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 049 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">Distinct cells share a prediction head, not their entire computation.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="20" y="290" width="450" height="200" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><rect x="500" y="290" width="480" height="200" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><polyline data-edge="id:c1" points="380,213.0 275,213 275,450 155,450 155.0,431" fill="none" stroke="#80669d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#sm-49-prompt-state-control)"/><polyline data-edge="c1:v1" points="265,388.0 285,388.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-49-prompt-state-arrow)"/><polyline data-edge="v1:c2" points="445,388.0 525,388.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-49-prompt-state-arrow)"/><polyline data-edge="c2:v2" points="745,388.0 765,388.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-49-prompt-state-arrow)"/><polyline data-edge="x:v1" points="260,213.0 365,213 365.0,345" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-49-prompt-state-arrow)"/><polyline data-edge="x:v2" points="260,213.0 280,213 280,270 860,270 860.0,345" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-49-prompt-state-arrow)"/><polyline data-edge="v1:head" points="365.0,431 365,505 497,505 497.5,525" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-49-prompt-state-arrow)"/><polyline data-edge="v2:head" points="860.0,431 860,568 615,568.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-49-prompt-state-arrow)"/><rect x="30" y="297" width="127.12" height="20" fill="#f7faf9"/><text x="34" y="312" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">CELL 1 · O⁰ → O¹</text><rect x="510" y="297" width="127.12" height="20" fill="#f7faf9"/><text x="514" y="312" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">CELL 2 · O¹ → O²</text><g data-node="x"><rect x="40" y="170" width="220" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="54" y="196" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Original row x</text><text x="54" y="218" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">B × C</text><text x="54" y="240" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">reread at every cell</text></g><g data-node="id"><rect x="380" y="170" width="235" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="394" y="196" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Prompt + column IDs</text><text x="394" y="218" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">learned identities</text><text x="394" y="240" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">initial state O⁰ = 0</text></g><g data-node="c1"><rect x="45" y="345" width="220" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="59" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Fuse identities + O⁰</text><text x="59" y="393" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">score columns; softmax C</text><text x="59" y="415" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">routing B × P × C</text></g><g data-node="v1"><rect x="285" y="345" width="160" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="299" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Expand x</text><text x="299" y="393" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">gather over C</text><text x="299" y="415" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">O¹: B × P × d</text></g><g data-node="c2"><rect x="525" y="345" width="220" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="539" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Fuse identities + O¹</text><text x="539" y="393" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">new column routing</text><text x="539" y="415" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">sample-dependent</text></g><g data-node="v2"><rect x="765" y="345" width="190" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="779" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Expand x</text><text x="779" y="393" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">gather over C</text><text x="779" y="415" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">O²: B × P × d</text></g><g data-node="head"><rect x="380" y="525" width="235" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="394" y="551" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Same head on O¹, O²</text><text x="394" y="573" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">attention pool prompts</text><text x="394" y="595" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">cell logits → mean → p</text></g></svg>