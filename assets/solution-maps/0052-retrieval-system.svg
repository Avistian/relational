<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 735" role="img" aria-labelledby="sm-52-retrieval-system-title sm-52-retrieval-system-desc"><title id="sm-52-retrieval-system-title">TabR-S: retrieve evidence, then correct its meaning</title><desc id="sm-52-retrieval-system-desc">The query has a direct route and a label-bearing memory route. Keys affect both selected identities/weights and the relative-key correction T(k−kᵢ). The query representation also bypasses retrieval. A prediction is therefore not just a weighted label vote.</desc><defs><marker id="sm-52-retrieval-system-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-52-retrieval-system-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="735" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 052 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">The query has a direct route and a label-bearing memory route.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="20" y="145" width="305" height="400" rx="12" fill="#fff1de" fill-opacity=".35" stroke="#b27428" stroke-opacity=".35"/><rect x="360" y="145" width="620" height="400" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><polyline data-edge="q:hq" points="172.5,276 172.5,315" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-52-retrieval-system-arrow)"/><polyline data-edge="mem:hm" points="822.5,276 822.5,315" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-52-retrieval-system-arrow)"/><polyline data-edge="hq:search" points="295,358.0 390,358.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-52-retrieval-system-arrow)"/><polyline data-edge="hm:search" points="700,358.0 660,358.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-52-retrieval-system-arrow)"/><polyline data-edge="search:val" points="525.0,401 525.0,445" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-52-retrieval-system-arrow)"/><polyline data-edge="mem:val" points="945,233.0 965,233 965,488 660,488.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-52-retrieval-system-arrow)"/><polyline data-edge="hq:sum" points="172.5,401 172.5,590" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-52-retrieval-system-arrow)"/><polyline data-edge="val:sum" points="525.0,531 525,563 325,563 325,633 295,633.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-52-retrieval-system-arrow)"/><polyline data-edge="sum:head" points="295,633.0 390,633.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-52-retrieval-system-arrow)"/><rect x="30" y="152" width="83.2" height="20" fill="#f7faf9"/><text x="34" y="167" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">QUERY PATH</text><rect x="370" y="152" width="273.52" height="20" fill="#f7faf9"/><text x="374" y="167" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">MEMORY PATH · shared encoder weights</text><g data-node="q"><rect x="50" y="190" width="245" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="64" y="216" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Query features x</text><text x="64" y="238" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">unknown y never supplied</text><text x="64" y="260" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">B × F</text></g><g data-node="mem"><rect x="700" y="190" width="245" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="714" y="216" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Legal memory X, y, IDs</text><text x="714" y="238" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">training records only</text><text x="714" y="260" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">N × F; labels retained</text></g><g data-node="hq"><rect x="50" y="315" width="245" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="64" y="341" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Encode → h; key K(h)</text><text x="64" y="363" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">save h for residual</text><text x="64" y="385" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">B × d</text></g><g data-node="hm"><rect x="700" y="315" width="245" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="714" y="341" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Encode → hᵢ; key K(hᵢ)</text><text x="714" y="363" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">same encoder and key map</text><text x="714" y="385" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">N × d</text></g><g data-node="search"><rect x="390" y="315" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="404" y="341" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Nearest eligible keys</text><text x="404" y="363" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">top-m of −‖k−kᵢ‖²</text><text x="404" y="385" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">exclude own record ID</text></g><g data-node="val"><rect x="390" y="445" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="404" y="471" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Correct each label value</text><text x="404" y="493" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">vᵢ = E(yᵢ) + T(k−kᵢ)</text><text x="404" y="515" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">softmax scores → Σ pᵢvᵢ</text></g><g data-node="sum"><rect x="50" y="590" width="245" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="64" y="616" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Add direct + retrieved</text><text x="64" y="638" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">h + Σ pᵢvᵢ</text><text x="64" y="660" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">B × d</text></g><g data-node="head"><rect x="390" y="590" width="270" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="404" y="616" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Residual predictor → head</text><text x="404" y="638" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">classification probability</text><text x="404" y="660" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">or regression output</text></g><text x="405" y="705" font-family="sans-serif" font-size="15" fill="#486777">Training target → loss → weights; never into its own memory value.</text></svg>