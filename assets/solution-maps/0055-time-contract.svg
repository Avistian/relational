<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="sm-55-time-contract-title sm-55-time-contract-desc"><title id="sm-55-time-contract-title">TabReD: the split is part of the question</title><desc id="sm-55-time-contract-desc">The same rows can define two different deployment experiments. Yes. Its feature or label may not yet have been available at the cutoff. Temporal eligibility must check availability clocks before preprocessing, fitting or validation selection—not just before test scoring.</desc><defs><marker id="sm-55-time-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-55-time-contract-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="700" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 055 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">The same rows can define two different deployment experiments.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="25" y="140" width="450" height="425" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><rect x="525" y="140" width="450" height="425" rx="12" fill="#fff1de" fill-opacity=".35" stroke="#b27428" stroke-opacity=".35"/><polyline data-edge="pool:random" points="250.0,271 250.0,330" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-55-time-contract-arrow)"/><polyline data-edge="pool:clock" points="445,228.0 555,228.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-55-time-contract-arrow)"/><polyline data-edge="clock:time" points="750.0,271 750.0,330" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-55-time-contract-arrow)"/><polyline data-edge="random:rscore" points="250.0,416 250.0,470" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-55-time-contract-arrow)"/><polyline data-edge="time:tscore" points="750.0,416 750.0,470" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-55-time-contract-arrow)"/><polyline data-edge="rscore:gap" points="250.0,556 250,575 500,575 500.0,595" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-55-time-contract-arrow)"/><polyline data-edge="tscore:gap" points="750.0,556 750,575 500,575 500.0,595" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-55-time-contract-arrow)"/><rect x="35" y="147" width="332.08" height="20" fill="#f7faf9"/><text x="39" y="162" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">RANDOM PARTITION · exchangeable-row question</text><rect x="535" y="147" width="273.52" height="20" fill="#f7faf9"/><text x="539" y="162" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">TIME PARTITION · future-row question</text><g data-node="pool"><rect x="55" y="185" width="390" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="69" y="211" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Same audited row universe</text><text x="69" y="233" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">IDs, event time, feature-ready time</text><text x="69" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">label-ready time; fixed row counts</text></g><g data-node="clock"><rect x="555" y="185" width="390" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="569" y="211" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Cutoff → eligibility</text><text x="569" y="233" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">event occurred AND features ready</text><text x="569" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">training labels revealed by cutoff</text></g><g data-node="random"><rect x="55" y="330" width="390" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="69" y="356" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Random train / validation / test</text><text x="69" y="378" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">fit transforms on train only</text><text x="69" y="400" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">validation chooses model</text></g><g data-node="time"><rect x="555" y="330" width="390" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="569" y="356" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Train → validation → future test</text><text x="569" y="378" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">preserve declared time boundary</text><text x="569" y="400" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">selection uses past information only</text></g><g data-node="rscore"><rect x="55" y="470" width="390" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="69" y="496" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Held-out mixture error</text><text x="69" y="518" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">estimates this partition policy</text><text x="69" y="540" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">same budget as temporal arm</text></g><g data-node="tscore"><rect x="555" y="470" width="390" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="569" y="496" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Future-period error</text><text x="569" y="518" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">estimates this horizon / availability</text><text x="569" y="540" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">test labels enter only after prediction</text></g><g data-node="gap"><rect x="305" y="595" width="390" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="319" y="621" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Compare errors; diagnose separately</text><text x="319" y="643" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">a gap establishes policy sensitivity</text><text x="319" y="665" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">it does not identify the cause of drift</text></g></svg>