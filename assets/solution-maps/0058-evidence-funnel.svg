<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 615" role="img" aria-labelledby="sm-58-evidence-funnel-title sm-58-evidence-funnel-desc"><title id="sm-58-evidence-funnel-title">From a literature map to a testable experiment</title><desc id="sm-58-evidence-funnel-desc">A survey locates ideas; matched evidence tests a claim. The task roster, eligible method coverage and evaluation regime define the denominator. Reconstruct them before ranking. Then use a proposed explanation to design an intervention, rather than treating a meta-feature correlation as a cause.</desc><defs><marker id="sm-58-evidence-funnel-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-58-evidence-funnel-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="615" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 058 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">A survey locates ideas; matched evidence tests a claim.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><polyline data-edge="papers:protocol" points="315,208.0 360,208.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-58-evidence-funnel-arrow)"/><polyline data-edge="protocol:pool" points="640,208.0 685,208.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-58-evidence-funnel-arrow)"/><polyline data-edge="pool:ranks" points="825.0,251 825.0,345" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-58-evidence-funnel-arrow)"/><polyline data-edge="ranks:hyp" points="685,388.0 640,388.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-58-evidence-funnel-arrow)"/><polyline data-edge="hyp:test" points="360,388.0 315,388.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-58-evidence-funnel-arrow)"/><g data-node="papers"><rect x="35" y="165" width="280" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="49" y="191" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Paper claims</text><text x="49" y="213" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">task type / model operation</text><text x="49" y="235" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">what question did each study ask?</text></g><g data-node="protocol"><rect x="360" y="165" width="280" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="374" y="191" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Recover the experiment</text><text x="374" y="213" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">datasets; splits; tuning budget</text><text x="374" y="235" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">metric; missing methods</text></g><g data-node="pool"><rect x="685" y="165" width="280" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="699" y="191" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Matched denominator</text><text x="699" y="213" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">which tasks / methods survive?</text><text x="699" y="235" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">state exclusions before ranking</text></g><g data-node="ranks"><rect x="685" y="345" width="280" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="699" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Within-task comparisons</text><text x="699" y="393" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">then equal-task aggregation</text><text x="699" y="415" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">retain effect sizes and cost</text></g><g data-node="hyp"><rect x="360" y="345" width="280" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="374" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Candidate explanation</text><text x="374" y="393" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">meta-feature association</text><text x="374" y="415" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">a hypothesis, not identification</text></g><g data-node="test"><rect x="35" y="345" width="280" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="49" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Discriminating experiment</text><text x="49" y="393" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">hold a baseline fixed</text><text x="49" y="415" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">change the proposed mechanism</text></g><text x="45" y="535" font-family="sans-serif" font-size="15" fill="#486777">The output is a next experiment, not a universal leaderboard winner.</text></svg>