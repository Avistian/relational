<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="sm-70-decision-architecture-title sm-70-decision-architecture-desc"><title id="sm-70-decision-architecture-title">The final checkpoint: choose a defensible fitted system</title><desc id="sm-70-decision-architecture-desc">Compare where evidence enters, then test the same deployment contract. Save context IDs and labels, preprocessing, feature/class order, view policy and checkpoint identity. Compare this full procedure with the complete tree and TabM artifacts, using the same held-out rows and declared selection budget.</desc><defs><marker id="sm-70-decision-architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-70-decision-architecture-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="780" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 070 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">Compare where evidence enters, then test the same deployment contract.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="25" y="140" width="950" height="400" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><polyline data-edge="tree:treesave" points="170.0,276 170.0,360" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-70-decision-architecture-arrow)"/><polyline data-edge="tabm:tabmsave" points="500.0,276 500.0,360" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-70-decision-architecture-arrow)"/><polyline data-edge="pfn:pfnsave" points="830.0,276 830.0,360" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-70-decision-architecture-arrow)"/><polyline data-edge="treesave:eval" points="170.0,446 170,550 500,550 500.0,580" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-70-decision-architecture-arrow)"/><polyline data-edge="tabmsave:eval" points="500.0,446 500,550 500,550 500.0,580" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-70-decision-architecture-arrow)"/><polyline data-edge="pfnsave:eval" points="830.0,446 830,550 500,550 500.0,580" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-70-decision-architecture-arrow)"/><polyline data-edge="eval:next" points="500.0,666 500.0,690" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-70-decision-architecture-arrow)"/><rect x="35" y="147" width="515.0799999999999" height="20" fill="#f7faf9"/><text x="39" y="162" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">THREE WAYS TO USE TRAINING EVIDENCE · one matched evaluation contract</text><g data-node="tree"><rect x="35" y="190" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="49" y="216" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Tree model</text><text x="49" y="238" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">features → splits → leaf outputs</text><text x="49" y="260" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">training y fits splits and leaves</text></g><g data-node="treesave"><rect x="35" y="360" width="270" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="49" y="386" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Frozen fitted artifact</text><text x="49" y="408" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">save transforms + tree ensemble</text><text x="49" y="430" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">validation choice already fixed</text></g><g data-node="tabm"><rect x="365" y="190" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="379" y="216" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">TabM</text><text x="379" y="238" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">adapters → W → member heads</text><text x="379" y="260" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">training y updates weights; mean p</text></g><g data-node="tabmsave"><rect x="365" y="360" width="270" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="379" y="386" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Frozen fitted artifact</text><text x="379" y="408" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">save transforms + learned weights</text><text x="379" y="430" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">validation choice already fixed</text></g><g data-node="pfn"><rect x="695" y="190" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="709" y="216" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">PFN / TabICL</text><text x="709" y="238" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">query reads labeled context</text><text x="709" y="260" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">θ pretrained on synthetic tasks</text></g><g data-node="pfnsave"><rect x="695" y="360" width="270" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="709" y="386" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Frozen fitted artifact</text><text x="709" y="408" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">save context, wrapper, weights</text><text x="709" y="430" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">validation choice already fixed</text></g><g data-node="eval"><rect x="350" y="580" width="300" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="364" y="606" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Same held-out queries</text><text x="364" y="628" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">paired error; dataset-level uncertainty</text><text x="364" y="650" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">lifecycle time and information stress</text></g><g data-node="next"><rect x="350" y="690" width="300" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="364" y="716" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Relational research handoff</text><text x="364" y="738" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">name information flat tables lose</text><text x="364" y="760" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">test entity / event links fairly</text></g></svg>