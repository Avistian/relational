<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1240" role="img" aria-labelledby="sm-48-anchored-cross-system-title sm-48-anchored-cross-system-desc"><title id="sm-48-anchored-cross-system-title">DCNv2: two routes from a row to a prediction</title><desc id="sm-48-anchored-cross-system-desc">Explicit products and a nonlinear deep branch learn together. Save the embedded row x₀ once. Each cross layer mixes its current state, multiplies that mixture by the same x₀, and adds its own current state back. The independent deep branch reads x₀ through two ReLU layers. Only their final outputs are concatenated. A low-rank factorization changes the mixing operator inside the cross branch, not these connections.</desc><defs><marker id="sm-48-anchored-cross-system-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-48-anchored-cross-system-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="1240" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 048 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">Explicit products and a nonlinear deep branch learn together.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="25" y="440" width="635" height="440" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><rect x="690" y="440" width="285" height="440" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><polyline data-edge="numeric:x0" points="182.5,241 182,270 500,270 500.0,295" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-48-anchored-cross-system-arrow)"/><polyline data-edge="category:x0" points="817.5,241 817,270 500,270 500.0,295" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-48-anchored-cross-system-arrow)"/><polyline data-edge="x0:state" points="500.0,381 500,410 172,410 172.5,490" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-48-anchored-cross-system-arrow)"/><polyline data-edge="x0:deep" points="500.0,381 500,410 832,410 832.5,490" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-48-anchored-cross-system-arrow)"/><polyline data-edge="x0:product" points="650,338.0 675,338 675,693 620,693.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-48-anchored-cross-system-arrow)"/><polyline data-edge="state:mix" points="295,533.0 375,533.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-48-anchored-cross-system-arrow)"/><polyline data-edge="mix:product" points="497.5,576 497.5,650" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-48-anchored-cross-system-arrow)"/><polyline data-edge="state:add" points="172.5,576 172.5,650" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-48-anchored-cross-system-arrow)"/><polyline data-edge="product:add" points="375,693.0 295,693.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-48-anchored-cross-system-arrow)"/><polyline data-edge="add:cross" points="172.5,736 172,755 497,755 497.5,780" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-48-anchored-cross-system-arrow)"/><polyline data-edge="deep:deepout" points="832.5,576 832.5,780" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-48-anchored-cross-system-arrow)"/><polyline data-edge="cross:join" points="497.5,866 497,900 500,900 500.0,930" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-48-anchored-cross-system-arrow)"/><polyline data-edge="deepout:join" points="832.5,866 832,900 500,900 500.0,930" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-48-anchored-cross-system-arrow)"/><polyline data-edge="join:head" points="500.0,1016 500.0,1060" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-48-anchored-cross-system-arrow)"/><polyline data-edge="head:loss" points="650,1103.0 715,1103.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-48-anchored-cross-system-arrow)"/><rect x="35" y="447" width="441.88" height="20" fill="#f7faf9"/><text x="39" y="462" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">CROSS BLOCK × 2 · separate W,b; the anchor x₀ never changes</text><rect x="700" y="447" width="236.92" height="20" fill="#f7faf9"/><text x="704" y="462" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">DEEP BRANCH · reads x₀ directly</text><g data-node="numeric"><rect x="40" y="155" width="285" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="54" y="181" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Numeric fields</text><text x="54" y="203" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">training mean / standard deviation</text><text x="54" y="225" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">missing → standardized mean</text></g><g data-node="category"><rect x="675" y="155" width="285" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="689" y="181" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Categorical fields</text><text x="689" y="203" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">training vocabulary; unknown ID</text><text x="689" y="225" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">learned 4-wide embeddings</text></g><g data-node="x0"><rect x="350" y="295" width="300" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="364" y="321" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Concatenate → original x₀</text><text x="364" y="343" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">B × d; keep this vector available</text><text x="364" y="365" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">d = numeric width + embeddings</text></g><g data-node="state"><rect x="50" y="490" width="245" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="64" y="516" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Current state xₗ</text><text x="64" y="538" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">start with xₗ = x₀</text><text x="64" y="560" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">B × d</text></g><g data-node="mix"><rect x="375" y="490" width="245" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="389" y="516" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Mix coordinates</text><text x="389" y="538" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">a = Wₗxₗ + bₗ</text><text x="389" y="560" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">or Uₗ(Vₗᵀxₗ) + bₗ</text></g><g data-node="product"><rect x="375" y="650" width="245" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="389" y="676" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Multiply by anchor</text><text x="389" y="698" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">u = x₀ ⊙ a</text><text x="389" y="720" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">B × d; creates feature products</text></g><g data-node="add"><rect x="50" y="650" width="245" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="64" y="676" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Add the residual</text><text x="64" y="698" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">xₗ₊₁ = xₗ + u</text><text x="64" y="720" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">retain the current state</text></g><g data-node="cross"><rect x="375" y="780" width="245" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="389" y="806" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">After the second block</text><text x="389" y="828" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">x₂: B × d</text><text x="389" y="850" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">explicit crossed representation</text></g><g data-node="deep"><rect x="715" y="490" width="235" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="729" y="516" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Two hidden layers</text><text x="729" y="538" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">d → 32 → 32</text><text x="729" y="560" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">Linear → ReLU each time</text></g><g data-node="deepout"><rect x="715" y="780" width="235" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="729" y="806" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Deep representation</text><text x="729" y="828" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">B × 32</text><text x="729" y="850" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">implicit feature interactions</text></g><g data-node="join"><rect x="350" y="930" width="300" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="364" y="956" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Join both branch outputs</text><text x="364" y="978" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">concatenate [x₂ ; MLP(x₀)]</text><text x="364" y="1000" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">B × (d + 32)</text></g><g data-node="head"><rect x="350" y="1060" width="300" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="364" y="1086" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Linear head → logit z</text><text x="364" y="1108" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">sigmoid(z) for prediction</text><text x="364" y="1130" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">one probability per row</text></g><g data-node="loss"><rect x="715" y="1060" width="250" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="729" y="1086" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Supervised binary loss</text><text x="729" y="1108" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">training target y + logit z</text><text x="729" y="1130" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">updates all learned weights</text></g><text x="50" y="1175" font-family="sans-serif" font-size="15" fill="#486777">Solid paths carry one row’s features or training target. No cross-row attention is present.</text><text x="50" y="1206" font-family="sans-serif" font-size="15" fill="#486777">Factored mixing: d → r → d, with no activation between Vᵀ and U. The anchor stays outside.</text></svg>