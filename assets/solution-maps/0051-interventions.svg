<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-labelledby="sm-51-interventions-title sm-51-interventions-desc"><title id="sm-51-interventions-title">Change the problem; observe which bias helps</title><desc id="sm-51-interventions-desc">Three controlled interventions, not three new architectures. Rotation preserves information under an invertible map but changes axis alignment. Smoothing alters the target; irrelevant columns alter the input burden. Their different controls let us test different explanations for a tree–network gap.</desc><defs><marker id="sm-51-interventions-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-51-interventions-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="630" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 051 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">Three controlled interventions, not three new architectures.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><polyline data-edge="base:smooth" points="500.0,241 500,275 165,275 165.0,305" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-51-interventions-arrow)"/><polyline data-edge="smooth:smoothfit" points="165.0,391 165.0,440" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-51-interventions-arrow)"/><polyline data-edge="base:rotate" points="500.0,241 500,275 500,275 500.0,305" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-51-interventions-arrow)"/><polyline data-edge="rotate:rotatefit" points="500.0,391 500.0,440" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-51-interventions-arrow)"/><polyline data-edge="base:noise" points="500.0,241 500,275 835,275 835.0,305" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-51-interventions-arrow)"/><polyline data-edge="noise:noisefit" points="835.0,391 835.0,440" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-51-interventions-arrow)"/><g data-node="base"><rect x="365" y="155" width="270" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="379" y="181" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">One dataset, one split</text><text x="379" y="203" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">baseline features and labels</text><text x="379" y="225" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">freeze candidate recipes</text></g><g data-node="smooth"><rect x="30" y="305" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="44" y="331" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Smooth targets</text><text x="44" y="353" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">remove short-scale variation</text><text x="44" y="375" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">the target itself changes</text></g><g data-node="smoothfit"><rect x="30" y="440" width="270" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="44" y="466" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Refit tree and network</text><text x="44" y="488" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">same declared budget / split</text><text x="44" y="510" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">compare paired errors</text></g><g data-node="rotate"><rect x="365" y="305" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="379" y="331" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Rotate features</text><text x="379" y="353" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">invertible coordinate map</text><text x="379" y="375" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">information is retained</text></g><g data-node="rotatefit"><rect x="365" y="440" width="270" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="379" y="466" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Refit tree and network</text><text x="379" y="488" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">same declared budget / split</text><text x="379" y="510" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">compare paired errors</text></g><g data-node="noise"><rect x="700" y="305" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="714" y="331" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Add irrelevant columns</text><text x="714" y="353" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">keep target fixed</text><text x="714" y="375" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">increase nuisance inputs</text></g><g data-node="noisefit"><rect x="700" y="440" width="270" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="714" y="466" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Refit tree and network</text><text x="714" y="488" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">same declared budget / split</text><text x="714" y="510" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">compare paired errors</text></g><text x="40" y="580" font-family="sans-serif" font-size="15" fill="#486777">Interpret the changed gap only for the intervention performed.</text></svg>