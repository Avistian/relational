<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="sm-60-comparison-system-title sm-60-comparison-system-desc"><title id="sm-60-comparison-system-title">Compare complete procedures on the same task</title><desc id="sm-60-comparison-system-desc">The experiment freezes who may learn from which partition. Use the same task partitions and explicit budgets, retain each baseline’s essential recipe, select on validation, and compare frozen predictions with paired dataset-level summaries. Quality and lifecycle cost answer different parts of the decision.</desc><defs><marker id="sm-60-comparison-system-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-60-comparison-system-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="680" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 060 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">The experiment freezes who may learn from which partition.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><polyline data-edge="contract:t" points="500.0,236 500,270 165,270 165.0,300" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-60-comparison-system-arrow)"/><polyline data-edge="t:tp" points="165.0,386 165.0,445" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-60-comparison-system-arrow)"/><polyline data-edge="contract:n" points="500.0,236 500,270 500,270 500.0,300" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-60-comparison-system-arrow)"/><polyline data-edge="n:np" points="500.0,386 500.0,445" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-60-comparison-system-arrow)"/><polyline data-edge="contract:f" points="500.0,236 500,270 835,270 835.0,300" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-60-comparison-system-arrow)"/><polyline data-edge="f:fp" points="835.0,386 835.0,445" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-60-comparison-system-arrow)"/><polyline data-edge="tp:compare" points="165.0,531 165,550 500,550 500.0,570" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-60-comparison-system-arrow)"/><polyline data-edge="np:compare" points="500.0,531 500,550 500,550 500.0,570" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-60-comparison-system-arrow)"/><polyline data-edge="fp:compare" points="835.0,531 835,550 500,550 500.0,570" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-60-comparison-system-arrow)"/><g data-node="contract"><rect x="350" y="150" width="300" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="364" y="176" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Freeze comparison contract</text><text x="364" y="198" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">tasks / split / metrics / budgets</text><text x="364" y="220" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">eligibility and preprocessing</text></g><g data-node="t"><rect x="30" y="300" width="270" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="44" y="326" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Tree procedure</text><text x="44" y="348" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">fit splits / leaves</text><text x="44" y="370" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">select within allowed validation</text></g><g data-node="tp"><rect x="30" y="445" width="270" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="44" y="471" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Frozen test predictions</text><text x="44" y="493" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">same test row IDs</text><text x="44" y="515" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">record fit and inference cost</text></g><g data-node="n"><rect x="365" y="300" width="270" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="379" y="326" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Neural procedure</text><text x="379" y="348" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">fit weights + training recipe</text><text x="379" y="370" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">select within allowed validation</text></g><g data-node="np"><rect x="365" y="445" width="270" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="379" y="471" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Frozen test predictions</text><text x="379" y="493" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">same test row IDs</text><text x="379" y="515" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">record fit and inference cost</text></g><g data-node="f"><rect x="700" y="300" width="270" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="714" y="326" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Foundation procedure</text><text x="714" y="348" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">context + checkpoint + wrapper</text><text x="714" y="370" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">select within allowed validation</text></g><g data-node="fp"><rect x="700" y="445" width="270" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="714" y="471" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Frozen test predictions</text><text x="714" y="493" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">same test row IDs</text><text x="714" y="515" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">record fit and inference cost</text></g><g data-node="compare"><rect x="350" y="570" width="300" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="364" y="596" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Paired errors + cost</text><text x="364" y="618" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">dataset is the aggregate unit</text><text x="364" y="640" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">retain scope and uncertainty</text></g></svg>