<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 735" role="img" aria-labelledby="sm-63-prior-generator-title sm-63-prior-generator-desc"><title id="sm-63-prior-generator-title">The synthetic prior: sample a world, then sample its rows</title><desc id="sm-63-prior-generator-desc">Task-level randomness creates a shared mechanism across observations. No. A task has shared graph, weights and observation choices; rows receive fresh root/noise draws under that shared world. Resampling the mechanism per row destroys the within-task relationship the PFN is trained to infer.</desc><defs><marker id="sm-63-prior-generator-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-63-prior-generator-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="735" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 063 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">Task-level randomness creates a shared mechanism across observations.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="25" y="140" width="950" height="155" rx="12" fill="#eeebf8" fill-opacity=".35" stroke="#77629d" stroke-opacity=".35"/><rect x="25" y="335" width="950" height="190" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><polyline data-edge="hyper:graph" points="310,228.0 375,228.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-63-prior-generator-arrow)"/><polyline data-edge="graph:obs" points="630,228.0 695,228.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-63-prior-generator-arrow)"/><polyline data-edge="noise:apply" points="310,438.0 375,438.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-63-prior-generator-arrow)"/><polyline data-edge="graph:apply" points="502.5,271 502.5,395" fill="none" stroke="#80669d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#sm-63-prior-generator-control)"/><polyline data-edge="apply:xy" points="630,438.0 695,438.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-63-prior-generator-arrow)"/><polyline data-edge="obs:xy" points="822.5,271 822.5,395" fill="none" stroke="#80669d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#sm-63-prior-generator-control)"/><polyline data-edge="xy:split" points="822.5,481 822,560 502,560 502.5,595" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-63-prior-generator-arrow)"/><rect x="35" y="147" width="295.48" height="20" fill="#f7faf9"/><text x="39" y="162" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">ONCE PER TASK · shared generating world</text><rect x="35" y="342" width="368.68" height="20" fill="#f7faf9"/><text x="39" y="357" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">FOR EACH ROW · different observations, same world</text><g data-node="hyper"><rect x="55" y="185" width="255" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="69" y="211" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Draw hyperparameters</text><text x="69" y="233" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">depth / width / sparsity</text><text x="69" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">noise and mechanism choices</text></g><g data-node="graph"><rect x="375" y="185" width="255" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="389" y="211" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Sample graph + weights</text><text x="389" y="233" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">fixed within this task</text><text x="389" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">shared structural assignments</text></g><g data-node="obs"><rect x="695" y="185" width="255" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="709" y="211" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Choose observations</text><text x="709" y="233" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">features; target variable</text><text x="709" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">class threshold / class mapping</text></g><g data-node="noise"><rect x="55" y="395" width="255" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="69" y="421" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Draw roots and noise</text><text x="69" y="443" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">fresh exogenous values</text><text x="69" y="465" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">row-specific randomness</text></g><g data-node="apply"><rect x="375" y="395" width="255" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="389" y="421" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Evaluate the graph</text><text x="389" y="443" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">parents + noise → child</text><text x="389" y="465" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">follow directed graph order</text></g><g data-node="xy"><rect x="695" y="395" width="255" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="709" y="421" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Observe X; discretize Y</text><text x="709" y="443" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">causes / effects / proxies</text><text x="709" y="465" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">imbalanced classes possible</text></g><g data-node="split"><rect x="375" y="595" width="255" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="389" y="621" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Split context and query</text><text x="389" y="643" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">reveal only context labels</text><text x="389" y="665" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">PFN learns query likelihood</text></g><text x="55" y="715" font-family="sans-serif" font-size="15" fill="#486777">Repeated tasks vary the world; repeated rows reveal one sampled world.</text></svg>