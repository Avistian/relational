<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="sm-67-local-context-title sm-67-local-context-desc"><title id="sm-67-local-context-title">LoCalPFN: retrieval wraps a complete pretrained network</title><desc id="sm-67-local-context-desc">Selecting a context and adapting the weights are different operations. No. Frozen local inference composes retrieval with the pretrained PFN. Fine-tuning adds a separate query-loss gradient path. Approximate training shares anchor neighborhoods; exact inference retrieves for each query.</desc><defs><marker id="sm-67-local-context-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-67-local-context-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="800" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 067 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">Selecting a context and adapting the weights are different operations.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="25" y="140" width="950" height="160" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><polyline data-edge="q:knn" points="177.5,271 177,320 500,320 500.0,340" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-67-local-context-arrow)"/><polyline data-edge="bank:knn" points="817.5,271 817,320 500,320 500.0,340" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-67-local-context-arrow)"/><polyline data-edge="knn:norm" points="500.0,426 500.0,475" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-67-local-context-arrow)"/><polyline data-edge="norm:pfn" points="500.0,561 500.0,610" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-67-local-context-arrow)"/><polyline data-edge="train:pfn" points="315,653.0 365,653.0" fill="none" stroke="#80669d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#sm-67-local-context-control)"/><polyline data-edge="pfn:val" points="635,653.0 695,653.0" fill="none" stroke="#80669d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#sm-67-local-context-control)"/><rect x="35" y="147" width="419.92" height="20" fill="#f7faf9"/><text x="39" y="162" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">RETRIEVAL GEOMETRY · training-fitted scaler and clipping</text><g data-node="q"><rect x="50" y="185" width="255" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="64" y="211" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Query x</text><text x="64" y="233" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">transform with saved scaler</text><text x="64" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">do not provide its target</text></g><g data-node="bank"><rect x="690" y="185" width="255" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="704" y="211" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Memory X, y, IDs</text><text x="704" y="233" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">transform with same scaler</text><text x="704" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">exclude query ID during fitting</text></g><g data-node="knn"><rect x="365" y="340" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="379" y="366" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Exact nearest k records</text><text x="379" y="388" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">distance in fixed scaled space</text><text x="379" y="410" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">C(x) contains features + labels</text></g><g data-node="norm"><rect x="365" y="475" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="379" y="501" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Local normalization</text><text x="379" y="523" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">local context mean / sample SD</text><text x="379" y="545" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">pad to100; feature-count scaling</text></g><g data-node="pfn"><rect x="365" y="610" width="270" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="379" y="636" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Full historical v1 PFN</text><text x="379" y="658" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">row tokens → 12 blocks → head</text><text x="379" y="680" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">softmax → query probability</text></g><g data-node="train"><rect x="35" y="610" width="280" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="49" y="636" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Optional fine-tuning</text><text x="49" y="658" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">shared-anchor neighborhoods</text><text x="49" y="680" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">query loss updates PFN θ</text></g><g data-node="val"><rect x="695" y="610" width="270" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="709" y="636" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Validation-only selection</text><text x="709" y="658" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">choose tuning checkpoint</text><text x="709" y="680" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">then frozen exact test retrieval</text></g><text x="55" y="760" font-family="sans-serif" font-size="15" fill="#486777">k=N approaches full-context inference under matched preprocessing and class order.</text></svg>