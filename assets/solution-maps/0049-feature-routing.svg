<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 645" role="img" aria-labelledby="sm-49-feature-routing-title sm-49-feature-routing-desc"><title id="sm-49-feature-routing-title">ExcelFormer: make feature influence directional</title><desc id="sm-49-feature-routing-desc">A learned importance order changes who may send information. Follow the mask: weak → strong is blocked inside attention, but weak → pooled output remains open. Feat-Mix changes training examples; it is not another inference layer.</desc><defs><marker id="sm-49-feature-routing-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-49-feature-routing-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="645" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 049 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">A learned importance order changes who may send information.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="30" y="140" width="600" height="380" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><rect x="665" y="140" width="305" height="380" rx="12" fill="#eeebf8" fill-opacity=".35" stroke="#77629d" stroke-opacity=".35"/><polyline data-edge="x:emb" points="180.0,271 180.0,310" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-49-feature-routing-arrow)"/><polyline data-edge="emb:att" points="295,353.0 350,353.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-49-feature-routing-arrow)"/><polyline data-edge="att:pool" points="472.5,396 472.5,425" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-49-feature-routing-arrow)"/><polyline data-edge="pool:out" points="472.5,511 472.5,550" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-49-feature-routing-arrow)"/><polyline data-edge="mix:emb" points="700,228.0 645,228 645,405 180,405 180.0,396" fill="none" stroke="#80669d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#sm-49-feature-routing-control)"/><polyline data-edge="mix:loss" points="817.5,271 817.5,425" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-49-feature-routing-arrow)"/><polyline data-edge="out:loss" points="595,593.0 645,593 645,400 817,400 817.5,425" fill="none" stroke="#80669d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#sm-49-feature-routing-control)"/><rect x="40" y="147" width="412.59999999999997" height="20" fill="#f7faf9"/><text x="44" y="162" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">PREDICTION · feature states stay separate until pooling</text><rect x="675" y="147" width="105.16" height="20" fill="#f7faf9"/><text x="679" y="162" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">TRAINING ONLY</text><g data-node="x"><rect x="65" y="185" width="230" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="79" y="211" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Feature vector x</text><text x="79" y="233" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">B × F numeric inputs</text><text x="79" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">train-fitted feature order</text></g><g data-node="mix"><rect x="700" y="185" width="235" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="714" y="211" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Feat-Mix</text><text x="714" y="233" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">donor feature subsets</text><text x="714" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">information-weighted targets</text></g><g data-node="emb"><rect x="65" y="310" width="230" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="79" y="336" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Gated tokenizers</text><text x="79" y="358" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">one embedding per feature</text><text x="79" y="380" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">B × F × d</text></g><g data-node="att"><rect x="350" y="310" width="245" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="364" y="336" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Directed attention</text><text x="364" y="358" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">strong reads strong</text><text x="364" y="380" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">weak reads strong + weak</text></g><g data-node="pool"><rect x="350" y="425" width="245" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="364" y="451" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Residual blocks → pool</text><text x="364" y="473" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">attention + gated FFN × L</text><text x="364" y="495" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">learned feature pooling</text></g><g data-node="out"><rect x="350" y="550" width="245" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="364" y="576" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Normalization → head</text><text x="364" y="598" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">class logits → softmax</text><text x="364" y="620" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">B × K probabilities</text></g><g data-node="loss"><rect x="700" y="425" width="235" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="714" y="451" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Supervised loss</text><text x="714" y="473" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">mixed targets vs prediction</text><text x="714" y="495" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">update learned parameters</text></g><text x="350" y="290" font-family="sans-serif" font-size="15" fill="#486777">Only higher-ranked senders pass.</text></svg>