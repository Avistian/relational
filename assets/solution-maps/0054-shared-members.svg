<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="sm-54-shared-members-title sm-54-shared-members-desc"><title id="sm-54-shared-members-title">TabM-mini: many prediction paths, one expensive backbone</title><desc id="sm-54-shared-members-desc">Member diversity enters before shared layers; outputs stay separate. Members multiply the same input by different learned first-layer R vectors, then use shared matrices. Their heads stay independent. Training averages member losses; classification inference averages probabilities, not logits.</desc><defs><marker id="sm-54-shared-members-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-54-shared-members-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="650" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 054 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">Member diversity enters before shared layers; outputs stay separate.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="25" y="400" width="945" height="125" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><polyline data-edge="x:a" points="500.0,241 500,255 170,255 170.0,285" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-54-shared-members-arrow)"/><polyline data-edge="x:b" points="500.0,241 500,255 500,255 500.0,285" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-54-shared-members-arrow)"/><polyline data-edge="x:c" points="500.0,241 500,255 830,255 830.0,285" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-54-shared-members-arrow)"/><polyline data-edge="a:ah" points="170.0,371 170.0,430" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-54-shared-members-arrow)"/><polyline data-edge="b:bh" points="500.0,371 500.0,430" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-54-shared-members-arrow)"/><polyline data-edge="c:ch" points="830.0,371 830.0,430" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-54-shared-members-arrow)"/><polyline data-edge="ah:mean" points="170.0,516 170,533 500,533 500.0,550" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-54-shared-members-arrow)"/><polyline data-edge="bh:mean" points="500.0,516 500,533 500,533 500.0,550" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-54-shared-members-arrow)"/><polyline data-edge="ch:mean" points="830.0,516 830,533 500,533 500.0,550" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-54-shared-members-arrow)"/><rect x="35" y="407" width="595.6" height="20" fill="#f7faf9"/><text x="39" y="422" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">ONE SHARED BACKBONE · N linear / ReLU / dropout layers; dropout off at inference</text><g data-node="x"><rect x="370" y="155" width="260" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="384" y="181" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Transformed row x</text><text x="384" y="203" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">train-only impute / z-score</text><text x="384" y="225" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">broadcast B × k × F</text></g><g data-node="a"><rect x="40" y="285" width="260" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="54" y="311" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Member 1: x ⊙ R₁</text><text x="54" y="333" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">learned feature multipliers</text><text x="54" y="355" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">different effective functions</text></g><g data-node="b"><rect x="370" y="285" width="260" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="384" y="311" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Member 2: x ⊙ R₂</text><text x="384" y="333" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">learned feature multipliers</text><text x="384" y="355" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">different effective functions</text></g><g data-node="c"><rect x="700" y="285" width="260" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="714" y="311" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Member k: x ⊙ Rₖ</text><text x="714" y="333" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">learned feature multipliers</text><text x="714" y="355" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">different effective functions</text></g><g data-node="ah"><rect x="40" y="430" width="260" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="54" y="456" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">W shared → head A</text><text x="54" y="478" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">independent output projection</text><text x="54" y="500" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">logits → probability p</text></g><g data-node="bh"><rect x="370" y="430" width="260" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="384" y="456" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">W shared → head B</text><text x="384" y="478" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">independent output projection</text><text x="384" y="500" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">logits → probability p</text></g><g data-node="ch"><rect x="700" y="430" width="260" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="714" y="456" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">W shared → head C</text><text x="714" y="478" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">independent output projection</text><text x="714" y="500" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">logits → probability p</text></g><g data-node="mean"><rect x="370" y="550" width="260" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="384" y="576" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Average probabilities</text><text x="384" y="598" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">p = (p₁ + … + pₖ) / k</text><text x="384" y="620" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">one prediction per row</text></g></svg>