<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 725" role="img" aria-labelledby="sm-59-nested-selection-title sm-59-nested-selection-desc"><title id="sm-59-nested-selection-title">Validation overfitting: nest the selector, not just the fit</title><desc id="sm-59-nested-selection-desc">A low error can select lucky noise even when each candidate is valid. Deleted-row residuals score a fixed candidate. Taking their minimum adapts to those scores. The outer held fold must be absent from candidate fitting AND PRESS selection, so it evaluates the whole adaptive procedure.</desc><defs><marker id="sm-59-nested-selection-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-59-nested-selection-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="725" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 059 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">A low error can select lucky noise even when each candidate is valid.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="25" y="140" width="630" height="425" rx="12" fill="#eeebf8" fill-opacity=".35" stroke="#77629d" stroke-opacity=".35"/><rect x="690" y="140" width="285" height="425" rx="12" fill="#fff1de" fill-opacity=".35" stroke="#b27428" stroke-opacity=".35"/><polyline data-edge="train:krr" points="315,223.0 355,223.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-59-nested-selection-arrow)"/><polyline data-edge="krr:press" points="485.0,266 485.0,330" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-59-nested-selection-arrow)"/><polyline data-edge="press:select" points="485.0,416 485,430 35,430 35,503 55,503.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-59-nested-selection-arrow)"/><polyline data-edge="select:pred" points="315,503.0 715,503.0" fill="none" stroke="#80669d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#sm-59-nested-selection-control)"/><polyline data-edge="held:pred" points="832.5,266 832.5,460" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-59-nested-selection-arrow)"/><polyline data-edge="pred:eval" points="832.5,546 832,585 500,585 500.0,610" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-59-nested-selection-arrow)"/><rect x="35" y="147" width="229.6" height="20" fill="#f7faf9"/><text x="39" y="162" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">OUTER-FOLD TRAINING COMPLEMENT</text><rect x="700" y="147" width="119.8" height="20" fill="#f7faf9"/><text x="704" y="162" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">OUTER HELD FOLD</text><g data-node="train"><rect x="55" y="180" width="260" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="69" y="206" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Outer-training rows</text><text x="69" y="228" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">features and labels</text><text x="69" y="250" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">define candidate grid</text></g><g data-node="krr"><rect x="355" y="180" width="260" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="369" y="206" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Fit each KRR candidate</text><text x="369" y="228" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">kernel + regularization</text><text x="369" y="250" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">solve coefficients</text></g><g data-node="press"><rect x="355" y="330" width="260" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="369" y="356" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Deleted-row residuals</text><text x="369" y="378" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">αᵢ / inverse diagonalᵢ</text><text x="369" y="400" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">mean squared PRESS</text></g><g data-node="select"><rect x="55" y="460" width="260" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="69" y="486" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Select minimum PRESS</text><text x="69" y="508" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">keep selected fitted model</text><text x="69" y="530" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">freeze choice for held fold</text></g><g data-node="held"><rect x="715" y="180" width="235" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="729" y="206" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Held features</text><text x="729" y="228" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">held targets excluded</text><text x="729" y="250" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">from the entire left region</text></g><g data-node="pred"><rect x="715" y="460" width="235" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="729" y="486" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Selected KRR predicts</text><text x="729" y="508" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">no further selection</text><text x="729" y="530" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">then reveal held targets</text></g><g data-node="eval"><rect x="350" y="610" width="300" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="364" y="636" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Outer predictions → error</text><text x="364" y="658" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">repeat; preserve pairing</text><text x="364" y="680" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">report selector performance</text></g></svg>