<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="sm-53-recipe-system-title sm-53-recipe-system-desc"><title id="sm-53-recipe-system-title">RealMLP-TD-S: the predictor and how it is learned</title><desc id="sm-53-recipe-system-desc">Preprocessing, parameterization and schedule form one recipe. The transform fixes input scale, trainable feature scales adapt it, NTP parameterization controls layer scale, and the optimizer schedule controls the path to a validation-selected checkpoint. Width describes only part of that system.</desc><defs><marker id="sm-53-recipe-system-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-53-recipe-system-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="620" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 053 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">Preprocessing, parameterization and schedule form one recipe.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="25" y="140" width="640" height="380" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><rect x="700" y="140" width="275" height="380" rx="12" fill="#eeebf8" fill-opacity=".35" stroke="#77629d" stroke-opacity=".35"/><polyline data-edge="raw:scale" points="182.5,276 182.5,325" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-53-recipe-system-arrow)"/><polyline data-edge="scale:mlp" points="310,368.0 355,368.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-53-recipe-system-arrow)"/><polyline data-edge="mlp:head" points="492.5,411 492.5,440" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-53-recipe-system-arrow)"/><polyline data-edge="opt:sched" points="837.5,276 837.5,325" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-53-recipe-system-arrow)"/><polyline data-edge="sched:mlp" points="725,368.0 630,368.0" fill="none" stroke="#80669d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#sm-53-recipe-system-control)"/><polyline data-edge="sched:select" points="837.5,411 837.5,440" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-53-recipe-system-arrow)"/><polyline data-edge="select:head" points="725,483.0 630,483.0" fill="none" stroke="#80669d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#sm-53-recipe-system-control)"/><rect x="35" y="147" width="97.84" height="20" fill="#f7faf9"/><text x="39" y="162" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">FORWARD PATH</text><rect x="710" y="147" width="119.8" height="20" fill="#f7faf9"/><text x="714" y="162" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">LEARNING RECIPE</text><g data-node="raw"><rect x="55" y="190" width="255" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="69" y="216" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Numeric row</text><text x="69" y="238" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">train median / IQR</text><text x="69" y="260" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">range fallback; smooth clip</text></g><g data-node="scale"><rect x="55" y="325" width="255" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="69" y="351" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Learned feature scales</text><text x="69" y="373" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">one multiplier per feature</text><text x="69" y="395" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">B × F</text></g><g data-node="mlp"><rect x="355" y="325" width="275" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="369" y="351" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Three hidden layers</text><text x="369" y="373" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">NTP linear → activation</text><text x="369" y="395" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">F → d → d → d</text></g><g data-node="head"><rect x="355" y="440" width="275" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="369" y="466" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Zero-initialized head</text><text x="369" y="488" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">class logits / target value</text><text x="369" y="510" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">saved checkpoint output</text></g><g data-node="opt"><rect x="725" y="190" width="225" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="739" y="216" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Parameter groups</text><text x="739" y="238" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">initialization + decay</text><text x="739" y="260" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">learning-rate policy</text></g><g data-node="sched"><rect x="725" y="325" width="225" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="739" y="351" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">coslog4 schedule</text><text x="739" y="373" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">four settling opportunities</text><text x="739" y="395" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">training loss → updates</text></g><g data-node="select"><rect x="725" y="440" width="225" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="739" y="466" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Validation selection</text><text x="739" y="488" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">choose checkpoint</text><text x="739" y="510" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">freeze for test</text></g><text x="65" y="580" font-family="sans-serif" font-size="15" fill="#486777">A saved model needs the fitted transform as well as its weights.</text></svg>