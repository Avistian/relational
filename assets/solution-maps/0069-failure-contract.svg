<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="sm-69-failure-contract-title sm-69-failure-contract-desc"><title id="sm-69-failure-contract-title">Open environments: keep failures inside the evaluation</title><desc id="sm-69-failure-contract-desc">A changed class, schema or distribution challenges a different contract. Its native output axis cannot name that class. A confidence detector may flag uncertainty, but detection is a separate evaluated task. Keep unsupported rows in all-query accounting instead of silently making the test easier.</desc><defs><marker id="sm-69-failure-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-69-failure-contract-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="700" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 069 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">A changed class, schema or distribution challenges a different contract.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><polyline data-edge="contract:class" points="500.0,236 500,280 165,280 165.0,315" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-69-failure-contract-arrow)"/><polyline data-edge="class:classp" points="165.0,401 165.0,455" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-69-failure-contract-arrow)"/><polyline data-edge="contract:feat" points="500.0,236 500,280 500,280 500.0,315" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-69-failure-contract-arrow)"/><polyline data-edge="feat:featp" points="500.0,401 500.0,455" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-69-failure-contract-arrow)"/><polyline data-edge="contract:shift" points="500.0,236 500,280 835,280 835.0,315" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-69-failure-contract-arrow)"/><polyline data-edge="shift:shiftp" points="835.0,401 835.0,455" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-69-failure-contract-arrow)"/><polyline data-edge="classp:audit" points="165.0,541 165,568 500,568 500.0,595" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-69-failure-contract-arrow)"/><polyline data-edge="featp:audit" points="500.0,541 500,568 500,568 500.0,595" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-69-failure-contract-arrow)"/><polyline data-edge="shiftp:audit" points="835.0,541 835,568 500,568 500.0,595" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-69-failure-contract-arrow)"/><g data-node="contract"><rect x="350" y="150" width="300" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="364" y="176" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Freeze prediction contract</text><text x="364" y="198" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">known class vocabulary / schema</text><text x="364" y="220" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">context, fallback, metric, cost</text></g><g data-node="class"><rect x="30" y="315" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="44" y="341" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Emerging classes</text><text x="44" y="363" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">hold a class out of context</text><text x="44" y="385" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">separate naming from detection</text></g><g data-node="classp"><rect x="30" y="455" width="270" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="44" y="481" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Frozen predictions</text><text x="44" y="503" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">retain unsupported / hard rows</text><text x="44" y="525" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">score declared objective</text></g><g data-node="feat"><rect x="365" y="315" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="379" y="341" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Feature removal</text><text x="379" y="363" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">same query IDs; declared fallback</text><text x="379" y="385" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">preserve paired comparison</text></g><g data-node="featp"><rect x="365" y="455" width="270" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="379" y="481" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Frozen predictions</text><text x="379" y="503" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">retain unsupported / hard rows</text><text x="379" y="525" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">score declared objective</text></g><g data-node="shift"><rect x="700" y="315" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="714" y="341" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Distribution shift</text><text x="714" y="363" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">declare the changed law</text><text x="714" y="385" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">keep temporal / label eligibility</text></g><g data-node="shiftp"><rect x="700" y="455" width="270" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="714" y="481" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Frozen predictions</text><text x="714" y="503" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">retain unsupported / hard rows</text><text x="714" y="525" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">score declared objective</text></g><g data-node="audit"><rect x="350" y="595" width="300" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="364" y="621" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Absolute score + change</text><text x="364" y="643" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">failure size ≠ baseline quality</text><text x="364" y="665" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">state the violated contract</text></g></svg>