<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 875" role="img" aria-labelledby="sm-66-three-transformers-title sm-66-three-transformers-desc"><title id="sm-66-three-transformers-title">TabICL: build row representations before learning from labels</title><desc id="sm-66-three-transformers-desc">Three transformers change the unit of attention: column → row → dataset. The row stage concatenates four 128-wide CLS outputs into one 512-wide row vector. Labels enter only after that compression, before dataset ICL. Column memory uses context values; the later dataset stage uses context row keys.</desc><defs><marker id="sm-66-three-transformers-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-66-three-transformers-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="875" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 066 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">Three transformers change the unit of attention: column → row → dataset.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="25" y="280" width="950" height="175" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><rect x="25" y="500" width="620" height="180" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><rect x="680" y="500" width="295" height="180" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><polyline data-edge="table:u" points="180.0,236 180.0,325" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-66-three-transformers-arrow)"/><polyline data-edge="u:mem" points="310,368.0 370,368.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-66-three-transformers-arrow)"/><polyline data-edge="mem:cell" points="630,368.0 690,368.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-66-three-transformers-arrow)"/><polyline data-edge="cell:row" points="820.0,411 820,475 180,475 180.0,545" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-66-three-transformers-arrow)"/><polyline data-edge="row:compress" points="310,588.0 370,588.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-66-three-transformers-arrow)"/><polyline data-edge="compress:icl" points="610,588.0 705,588.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-66-three-transformers-arrow)"/><polyline data-edge="labels:icl" points="965,193.0 985,193 985,588 950,588.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-66-three-transformers-arrow)"/><polyline data-edge="icl:head" points="827.5,631 827.5,688.0 822.5,688.0 822.5,745" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-66-three-transformers-arrow)"/><rect x="35" y="287" width="427.24" height="20" fill="#f7faf9"/><text x="39" y="302" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">1 · COLUMN NETWORK · 3 inducing blocks per column · d=128</text><rect x="35" y="507" width="434.56" height="20" fill="#f7faf9"/><text x="39" y="522" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">2 · ROW NETWORK · 3 attention blocks, then one CLS readout</text><rect x="690" y="507" width="156.4" height="20" fill="#f7faf9"/><text x="694" y="522" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">3 · DATASET ICL × 12</text><g data-node="table"><rect x="35" y="150" width="290" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="49" y="176" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Numeric Xc and Xq</text><text x="49" y="198" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">context-fitted preprocessing</text><text x="49" y="220" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">N × F scalar cells</text></g><g data-node="labels"><rect x="680" y="150" width="285" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="694" y="176" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Context labels yc</text><text x="694" y="198" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">kept out of column / row stages</text><text x="694" y="220" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">not available for query rows</text></g><g data-node="u"><rect x="50" y="325" width="260" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="64" y="351" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Shared scalar projection</text><text x="64" y="373" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">cells → U: N × 128</text><text x="64" y="395" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">context slice Uc only → readers</text></g><g data-node="mem"><rect x="370" y="325" width="260" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="384" y="351" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">128 inducing readers I</text><text x="384" y="373" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">M = MAB(I, Uc)</text><text x="384" y="395" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">fixed-size context memory</text></g><g data-node="cell"><rect x="690" y="325" width="260" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="704" y="351" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Every cell reads M</text><text x="704" y="373" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">V = MAB(U, M)</text><text x="704" y="395" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">then affine: x·W(V)+b(V)</text></g><g data-node="row"><rect x="50" y="545" width="260" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="64" y="571" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Feature interactions</text><text x="64" y="593" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">prepend 4 CLS; apply RoPE</text><text x="64" y="615" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">attention within each row</text></g><g data-node="compress"><rect x="370" y="545" width="240" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="384" y="571" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Concatenate 4 CLS</text><text x="384" y="593" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">4 × 128 → 512</text><text x="384" y="615" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">N × 512; feature axis gone</text></g><g data-node="icl"><rect x="705" y="545" width="245" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="719" y="571" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Context gets labels</text><text x="719" y="593" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">query rows read context only</text><text x="719" y="615" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">512-wide row attention + FFN</text></g><g data-node="head"><rect x="680" y="745" width="285" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="694" y="771" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Query row head</text><text x="694" y="793" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">512 → 1024 → 10</text><text x="694" y="815" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">active-class softmax → Q × K</text></g><text x="50" y="435" font-family="sans-serif" font-size="15" fill="#486777">Repeat the MAB pair 3 times; apply the conditioned affine once, after the final block.</text><text x="50" y="735" font-family="sans-serif" font-size="15" fill="#486777">Column/row representation: no label input.</text><text x="50" y="768" font-family="sans-serif" font-size="15" fill="#486777">MAB = attention + residual + normalization + FFN.</text><text x="50" y="802" font-family="sans-serif" font-size="15" fill="#486777">Pretraining changes weights; new-table ICL does not.</text></svg>