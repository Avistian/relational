"69" y="368" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">xⱼwⱼ + bⱼ; d=32</text><text x="69" y="390" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">B × (F+1) × 32</text></g><g data-node="block"><rect x="360" y="320" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="374" y="346" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">FT-T block × 2</text><text x="374" y="368" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">attention residual</text><text x="374" y="390" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">ReGLU FFN residual</text></g><g data-node="head"><rect x="360" y="425" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="374" y="451" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">CLS → LN → ReLU → head</text><text x="374" y="473" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">binary logit; BCE training</text><text x="374" y="495" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">validation selects recipe</text></g><g data-node="test"><rect x="725" y="185" width="225" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="739" y="211" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Held-out test X</text><text x="739" y="233" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">same saved transform</text><text x="739" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">same frozen model</text></g><g data-node="pred"><rect x="725" y="425" width="225" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="739" y="451" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Frozen predictions</text><text x="739" y="473" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">sigmoid(logit)</text><text x="739" y="495" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">test y still hidden</text></g><g data-node="score"><rect x="540" y="550" width="280" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="554" y="576" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Paired test comparison</text><text x="554" y="598" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">test y enters metric here</text><text x="554" y="620" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">aggregate by dataset</text></g><text x="65" y="285" font-family="sans-serif" font-size="15" fill="#486777">Other contestants: tree and MLP recipes fit here.</text></svg>