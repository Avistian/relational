<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="sm-50-checkpoint-fit-title sm-50-checkpoint-fit-desc"><title id="sm-50-checkpoint-fit-title">A fair comparison contains a complete fitted procedure</title><desc id="sm-50-checkpoint-fit-desc">The FT-Transformer is one contestant inside the selection boundary. Validation may choose a configuration or stopping point. The test features pass through that frozen choice; test targets meet predictions only at the final score. A stronger attention block cannot repair a breached boundary.</desc><defs><marker id="sm-50-checkpoint-fit-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-50-checkpoint-fit-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="650" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 050 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">The FT-Transformer is one contestant inside the selection boundary.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="25" y="145" width="640" height="370" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><rect x="700" y="145" width="275" height="370" rx="12" fill="#fff1de" fill-opacity=".35" stroke="#b27428" stroke-opacity=".35"/><polyline data-edge="data:tok" points="177.5,271 177.5,320" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-50-checkpoint-fit-arrow)"/><polyline data-edge="tok:block" points="300,363.0 360,363.0" fill="none" stroke="#426975" stroke-width="2" s