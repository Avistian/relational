<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 755" role="img" aria-labelledby="sm-65-embedding-probe-title sm-65-embedding-probe-desc"><title id="sm-65-embedding-probe-title">Query embeddings: freeze the encoder, learn a new readout</title><desc id="sm-65-embedding-probe-desc">Embedding extraction is itself a fitted-context procedure. A labeled context state can already contain that row’s target. Query-role extraction removes this direct path: each training fold is embedded using only other-fold labels, then scattered to original row order before probe fitting.</desc><defs><marker id="sm-65-embedding-probe-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-65-embedding-probe-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="755" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 065 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">Embedding extraction is itself a fitted-context procedure.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="25" y="140" width="455" height="370" rx="12" fill="#eeebf8" fill-opacity=".35" stroke="#77629d" stroke-opacity=".35"/><rect x="520" y="140" width="455" height="370" rx="12" fill="#fff1de" fill-opacity=".35" stroke="#b27428" stroke-opacity=".35"/><polyline data-edge="fold:encode1" points="252.5,271 252.5,325" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-65-embedding-probe-arrow)"/><polyline data-edge="full:encode2" points="747.5,271 747.5,325" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-65-embedding-probe-arrow)"/><polyline data-edge="encode1:scatter" points="252.5,411 252.5,450" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-65-embedding-probe-arrow)"/><polyline data-edge="scatter:probe" points="252.5,536 252,608 550,608.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-65-embedding-probe-arrow)"/><polyline data-edge="encode2:probe" points="747.5,411 747.5,565" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-65-embedding-probe-arrow)"/><rect x="35" y="147" width="229.6" height="20" fill="#f7faf9"/><text x="39" y="162" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">TRAINING EMBEDDINGS · 10 folds</text><rect x="530" y="147" width="214.96" height="20" fill="#f7faf9"/><text x="534" y="162" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">VALIDATION / TEST EMBEDDINGS</text><g data-node="fold"><rect x="55" y="185" width="395" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="69" y="211" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Hold fold f in query role</text><text x="69" y="233" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">other folds provide context labels</text><text x="69" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">f supplies features only</text></g><g data-node="full"><rect x="550" y="185" width="395" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="564" y="211" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">All training rows as context</text><text x="564" y="233" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">validation or test rows are queries</text><text x="564" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">their labels never enter encoder</text></g><g data-node="encode1"><rect x="55" y="325" width="395" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="69" y="351" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Frozen v2 encoder</text><text x="69" y="373" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">12 feature / row blocks</text><text x="69" y="395" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">read final query target states: 192</text></g><g data-node="encode2"><rect x="550" y="325" width="395" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="564" y="351" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Same frozen v2 encoder</text><text x="564" y="373" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">same 192-wide readout</text><text x="564" y="395" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">different context size/composition</text></g><g data-node="scatter"><rect x="55" y="450" width="395" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="69" y="476" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Scatter embeddings into row order</text><text x="69" y="498" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">N × 192; attach training y</text><text x="69" y="520" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">no self-target in extraction</text></g><g data-node="probe"><rect x="550" y="565" width="395" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="564" y="591" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Fit / select linear probe</text><text x="564" y="613" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">fit on training vectors; validation selects</text><text x="564" y="635" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">freeze probe; test once</text></g><text x="55" y="720" font-family="sans-serif" font-size="15" fill="#486777">The probe changes; the pretrained encoder does not. Context mismatch remains testable.</text></svg>