<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="sm-56-benchmark-reduction-title sm-56-benchmark-reduction-desc"><title id="sm-56-benchmark-reduction-title">TabArena: follow the unit of evidence</title><desc id="sm-56-benchmark-reduction-desc">A score becomes a rank only within a declared comparison pool. Not with the displayed reduction: rank methods within dataset/split, average splits within each dataset, then give datasets equal weight. Bootstrap paired datasets, retaining their method results together.</desc><defs><marker id="sm-56-benchmark-reduction-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-56-benchmark-reduction-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="650" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 056 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">A score becomes a rank only within a declared comparison pool.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><polyline data-edge="ledger:rank" points="310,208.0 365,208.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-56-benchmark-reduction-arrow)"/><polyline data-edge="rank:within" points="635,208.0 690,208.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-56-benchmark-reduction-arrow)"/><polyline data-edge="within:mean" points="825.0,251 825.0,345" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-56-benchmark-reduction-arrow)"/><polyline data-edge="within:boot" points="825.0,251 825,300 340,300 340,388 365,388.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-56-benchmark-reduction-arrow)"/><polyline data-edge="scope:ledger" points="175.0,345 175.0,251" fill="none" stroke="#80669d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#sm-56-benchmark-reduction-control)"/><polyline data-edge="mean:read" points="825.0,431 825,495 500,495 500.0,525" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-56-benchmark-reduction-arrow)"/><polyline data-edge="boot:read" points="500.0,431 500.0,525" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-56-benchmark-reduction-arrow)"/><g data-node="ledger"><rect x="40" y="165" width="270" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="54" y="191" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Frozen score ledger</text><text x="54" y="213" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">dataset / split / method / regime</text><text x="54" y="235" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">verify complete matched coverage</text></g><g data-node="rank"><rect x="365" y="165" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="379" y="191" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Rank each dataset / split</text><text x="379" y="213" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">lower error is better</text><text x="379" y="235" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">ties receive average rank</text></g><g data-node="within"><rect x="690" y="165" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="704" y="191" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Average over splits</text><text x="704" y="213" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">one rank per method / dataset</text><text x="704" y="235" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">folds do not become datasets</text></g><g data-node="mean"><rect x="690" y="345" width="270" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="704" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Average over datasets</text><text x="704" y="393" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">equal dataset weights</text><text x="704" y="415" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">one score per method</text></g><g data-node="boot"><rect x="365" y="345" width="270" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="379" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Paired dataset bootstrap</text><text x="379" y="393" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">resample whole dataset records</text><text x="379" y="415" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">retain method pairing</text></g><g data-node="scope"><rect x="40" y="345" width="270" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="54" y="371" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Name the fitted regime</text><text x="54" y="393" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">default / tuned / ensemble</text><text x="54" y="415" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">different fitted procedures</text></g><g data-node="read"><rect x="365" y="525" width="270" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="379" y="551" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Rank + uncertainty</text><text x="379" y="573" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">comparison pool changes rank</text><text x="379" y="595" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">neither rank nor Elo is accuracy</text></g></svg>