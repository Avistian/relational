<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 855" role="img" aria-labelledby="sm-68-temporal-pfn-title sm-68-temporal-pfn-desc"><title id="sm-68-temporal-pfn-title">Drift-resilient PFN: time conditions a learned inference rule</title><desc id="sm-68-temporal-pfn-desc">The prior changes relationships; the forward model encodes the domain clock. No: its 100 coordinates concatenate with each pair of feature values before projection. The temporal prior supplies the assumption about changing tasks. A timestamp channel alone does not identify tomorrow’s relationship.</desc><defs><marker id="sm-68-temporal-pfn-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-68-temporal-pfn-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="855" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 068 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">The prior changes relationships; the forward model encodes the domain clock.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="25" y="140" width="950" height="155" rx="12" fill="#eeebf8" fill-opacity=".35" stroke="#77629d" stroke-opacity=".35"/><rect x="25" y="340" width="950" height="365" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><polyline data-edge="g:h" points="305,228.0 370,228.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-68-temporal-pfn-arrow)"/><polyline data-edge="h:pre" points="625,228.0 690,228.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-68-temporal-pfn-arrow)"/><polyline data-edge="time:encode" points="305,438.0 370,438.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-68-temporal-pfn-arrow)"/><polyline data-edge="encode:blocks" points="497.5,481 497.5,565" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-68-temporal-pfn-arrow)"/><polyline data-edge="target:blocks" points="817.5,481 817,520 345,520 345,608 370,608.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-68-temporal-pfn-arrow)"/><polyline data-edge="blocks:head" points="625,608.0 690,608.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-68-temporal-pfn-arrow)"/><rect x="35" y="147" width="617.56" height="20" fill="#f7faf9"/><text x="39" y="162" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">PRETRAINING IDEA · reconstruct the assumption; do not claim a fresh pretraining run</text><rect x="35" y="347" width="485.8" height="20" fill="#f7faf9"/><text x="39" y="362" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">RELEASED FORWARD PATH · historical labeled context + future query</text><g data-node="g"><rect x="50" y="185" width="255" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="64" y="211" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Base structural graph G</text><text x="64" y="233" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">relationships generate X, y</text><text x="64" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">selected edges may drift</text></g><g data-node="h"><rect x="370" y="185" width="255" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="384" y="211" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Drift graph H(time)</text><text x="384" y="233" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">coherent changes to G weights</text><text x="384" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">sample ordered-domain tasks</text></g><g data-node="pre"><rect x="690" y="185" width="255" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="704" y="211" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Query likelihood loss</text><text x="704" y="233" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">learn weights across tasks</text><text x="704" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">freeze released θ for inference</text></g><g data-node="time"><rect x="50" y="395" width="255" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="64" y="421" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Domain c → Time2Vec</text><text x="64" y="443" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">1 linear + 99 sine coordinates</text><text x="64" y="465" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">normalize clock using context</text></g><g data-node="encode"><rect x="370" y="395" width="255" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="384" y="421" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Time in every pair</text><text x="384" y="443" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">[2 values; 100 time coords]</text><text x="384" y="465" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">102 → 192; add group identity</text></g><g data-node="target"><rect x="690" y="395" width="255" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="704" y="421" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Target encoder</text><text x="704" y="443" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">context y; query label hidden</text><text x="704" y="465" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">2 → 192 target token</text></g><g data-node="blocks"><rect x="370" y="565" width="255" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="384" y="591" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">12 axial blocks</text><text x="384" y="613" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">feature attention → row attention</text><text x="384" y="635" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">FFN; residual + LN each time</text></g><g data-node="head"><rect x="690" y="565" width="255" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="704" y="591" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Query target → head</text><text x="704" y="613" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">192 → 768 → 10</text><text x="704" y="635" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">keep K logits → softmax</text></g><text x="50" y="755" font-family="sans-serif" font-size="15" fill="#486777">Query row attention reads source K/V only. Future labels are never memory.</text><text x="50" y="795" font-family="sans-serif" font-size="15" fill="#486777">Matched tests compare released Drift, NoT2V and Base procedures separately.</text></svg>