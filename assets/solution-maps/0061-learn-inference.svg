<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 745" role="img" aria-labelledby="sm-61-learn-inference-title sm-61-learn-inference-desc"><title id="sm-61-learn-inference-title">PFN: train on tasks; infer from a labeled set</title><desc id="sm-61-learn-inference-desc">The outer optimizer learns a reusable conditional prediction rule. Its activations and predictive density change. At inference its weights stay fixed. During pretraining only, query targets enter the negative log likelihood, whose gradient updates those shared weights across sampled tasks.</desc><defs><marker id="sm-61-learn-inference-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#426975"/></marker><marker id="sm-61-learn-inference-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#80669d"/></marker></defs><rect width="1000" height="745" fill="#fcfdfd"/><rect width="1000" height="116" fill="#173b4a"/><text x="35" y="36" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#95d5cb">LESSON 061 · SOLUTION MAP</text><text x="35" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">The outer optimizer learns a reusable conditional prediction rule.</text><text x="35" y="94" font-family="sans-serif" font-size="13" fill="#d6e6e9">Solid arrows: information flow   ·   Dashed arrows: fitting / selection control</text><rect x="25" y="140" width="950" height="165" rx="12" fill="#eeebf8" fill-opacity=".35" stroke="#77629d" stroke-opacity=".35"/><rect x="25" y="340" width="620" height="285" rx="12" fill="#e8f4f0" fill-opacity=".35" stroke="#32877e" stroke-opacity=".35"/><rect x="680" y="340" width="295" height="285" rx="12" fill="#eeebf8" fill-opacity=".35" stroke="#77629d" stroke-opacity=".35"/><polyline data-edge="prior:labels" points="310,233.0 375,233.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-61-learn-inference-arrow)"/><polyline data-edge="prior:truth" points="180.0,190 180,170 832,170 832.5,190" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-61-learn-inference-arrow)"/><polyline data-edge="labels:tokens" points="500.0,276 500,325 180,325 180.0,390" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-61-learn-inference-arrow)"/><polyline data-edge="tokens:blocks" points="310,433.0 365,433.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-61-learn-inference-arrow)"/><polyline data-edge="blocks:density" points="490.0,476 490.0,525" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-61-learn-inference-arrow)"/><polyline data-edge="truth:loss" points="832.5,276 832.5,525" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-61-learn-inference-arrow)"/><polyline data-edge="density:loss" points="615,568.0 715,568.0" fill="none" stroke="#426975" stroke-width="2" stroke-linejoin="round" marker-end="url(#sm-61-learn-inference-arrow)"/><polyline data-edge="loss:blocks" points="832.5,525 832,365 340,365 340,433 365,433.0" fill="none" stroke="#80669d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#sm-61-learn-inference-control)"/><rect x="35" y="147" width="354.04" height="20" fill="#f7faf9"/><text x="39" y="162" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">PRETRAINING · repeated sampled regression tasks</text><rect x="35" y="347" width="332.08" height="20" fill="#f7faf9"/><text x="39" y="362" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">FORWARD · same operator on new real contexts</text><rect x="690" y="347" width="127.12" height="20" fill="#f7faf9"/><text x="694" y="362" font-family="sans-serif" font-size="12.00" font-weight="bold" fill="#496573">PRETRAINING ONLY</text><g data-node="prior"><rect x="50" y="190" width="260" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="64" y="216" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Sample one GP task</text><text x="64" y="238" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">joint draw at all row inputs</text><text x="64" y="260" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">split context and query</text></g><g data-node="labels"><rect x="375" y="190" width="250" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="389" y="216" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Context (Xc, yc)</text><text x="389" y="238" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">query Xq; hide yq</text><text x="389" y="260" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">Ex shared; Ey context only</text></g><g data-node="truth"><rect x="715" y="190" width="235" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="729" y="216" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Hidden targets yq</text><text x="729" y="238" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">used only by loss</text><text x="729" y="260" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">never a forward input</text></g><g data-node="tokens"><rect x="50" y="390" width="260" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="64" y="416" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Context: Ex(x) + Ey(y)</text><text x="64" y="438" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">query: Ex(x) only</text><text x="64" y="460" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">B × (C+Q) × 64</text></g><g data-node="blocks"><rect x="365" y="390" width="250" height="86" rx="9" fill="#e8f4f0" stroke="#32877e" stroke-width="1.25"/><text x="379" y="416" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Row blocks × 3</text><text x="379" y="438" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">residual → LayerNorm</text><text x="379" y="460" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">context + own query eligible</text></g><g data-node="density"><rect x="365" y="525" width="250" height="86" rx="9" fill="#fff1de" stroke="#b27428" stroke-width="1.25"/><text x="379" y="551" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Head → 64 bin masses</text><text x="379" y="573" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">divide finite-bin mass by width</text><text x="379" y="595" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">tail bins keep full support</text></g><g data-node="loss"><rect x="715" y="525" width="235" height="86" rx="9" fill="#eeebf8" stroke="#77629d" stroke-width="1.25"/><text x="729" y="551" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="#183c4b">Query density loss</text><text x="729" y="573" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">−log pθ(yq | Xq, context)</text><text x="729" y="595" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#183c4b">backpropagate into θ</text></g><text x="60" y="690" font-family="sans-serif" font-size="15" fill="#486777">NEW TASK: real context + query → frozen forward path → density. No optimizer.</text></svg>