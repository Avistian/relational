<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">An information ceiling · find the lost distinction</title><desc id="desc">Two opposite histories can become the same vector before a predictor sees them. A constructive information argument, not a claim that every flat table has this ceiling or that any GNN automatically repairs it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65847f"/></marker></defs>
