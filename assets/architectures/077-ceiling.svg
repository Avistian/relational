<text x="713" y="595" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#526b66">Readout / prediction</text>
<text x="34" y="620" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="normal" fill="#526b66">A constructive information argument, not a claim that every flat table has this ceiling or that any GNN automatically repairs it.</text>
