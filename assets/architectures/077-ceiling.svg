<text x="321" y="457" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="bold" fill="#14766c">Retain a time feature</text>
<text x="321" y="480" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#193a3a">last − first: +40 versus −40</text>
<rect x="582" y="433" width="230" height="98" rx="10" fill="#e6f3f0" stroke="#14766c" stroke-opacity=".45"/>
<rect x="582" y="446" width="4" height="25" rx="2" fill="#14766c"/>
<text x="595" y="457" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="bold" fill="#14766c">Same classifier family</text>
<text x="595" y="480" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#193a3a">Now the inputs are</text>
<text x="595" y="498" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#193a3a">distinguishable</text>
<rect x="856" y="433" width="230" height="98" rx="10" fill="#eeebfa" stroke="#7460a2" stroke-opacity=".45"/>
<rect x="856" y="446" width="4" height="25" rx="2" fill="#7460a2"/>
<text x="869" y="457" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="bold" fill="#7460a2">Audit eligible history</text>
<text x="869" y="480" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#193a3a">Recovery depends on</text>
<text x="869" y="498" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#193a3a">available records</text>
