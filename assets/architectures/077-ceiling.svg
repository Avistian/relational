<text x="869" y="202" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#193a3a">At most 1 correct out of 2</text>
<rect x="308" y="433" width="230" height="98" rx="10" fill="#e6f3f0" stroke="#14766c" stroke-opacity=".45"/>
