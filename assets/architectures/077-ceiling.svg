<text x="47" y="202" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#193a3a">10 → 30 → 50 · target 1</text>
<rect x="34" y="294" width="230" height="98" rx="10" fill="#f1eee7" stroke="#867a67" stroke-opacity=".45"/>
<rect x="34" y="307" width="4" height="25" rx="2" fill="#867a67"/>
<text x="47" y="318" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="bold" fill="#867a67">History B</text>
<text x="47" y="341" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#193a3a">50 → 30 → 10 · target 0</text>
<rect x="308" y="155" width="230" height="98" rx="10" fill="#e6f3f0" stroke="#14766c" stroke-opacity=".45"/>
<rect x="308" y="168" width="4" height="25" rx="2" fill="#14766c"/>
<text x="321" y="179" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="bold" fill="#14766c">Order-free summary</text>
<text x="321" y="202" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#193a3a">count 3; sum 90; mean 30;</text>
<text x="321" y="220" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#193a3a">max 50</text>
<rect x="582" y="155" width="230" height="98" rx="10" fill="#e6f3f0" stroke="#14766c" stroke-opacity=".45"/>
<rect x="582" y="168" width="4" height="25" rx="2" fill="#14766c"/>
<text x="595" y="179" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="bold" fill="#14766c">Identical representation</text>
<text x="595" y="202" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#193a3a">Any deterministic g gets</text>
<text x="595" y="220" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="normal" fill="#193a3a">same input</text>
