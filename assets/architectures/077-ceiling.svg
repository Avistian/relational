<text x="34" y="45" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="bold" fill="#647b75">RELATIONAL LEARNING  /  MODEL &amp; INFORMATION FLOW</text>
<text x="34" y="83" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#193a3a">An information ceiling · find the lost distinction</text>
<text x="34" y="114" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#526b66">Two opposite histories can become the same vector before a predictor sees them.</text>
