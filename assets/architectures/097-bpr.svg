<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Pairwise ranking · one scorer, two item branches</title><desc id="desc">Matrix factorization with sampled comparisons; no graph message passing. q determines which ranking errors train the scorer. Missing items are unobserved, not certified dislikes; full-paper BPR replay is NOT_RUN.</desc>
