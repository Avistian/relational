<title id="title">GIN · count locally, read out at every depth</title><desc id="desc">The MUTAG release adds graph-level class logits from the input and all hidden depths. At inference dropout is off and batch-normalization state is fixed. Parameters transfer across graphs; labels never enter the forward pass.</desc>
