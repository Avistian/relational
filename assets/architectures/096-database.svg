<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Database → graph · preserve rows before learning</title><desc id="desc">Foreign-key roles define edges; composite keys preserve distinct events. Construction is not training. A valid foreign key establishes referential integrity; it does not establish prediction-time availability.</desc>
