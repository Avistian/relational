<text x="34" y="83" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#193a3a">Database → graph · preserve rows before learning</text>
<text x="34" y="114" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#526b66">Foreign-key roles define edges; composite keys preserve distinct events.</text>
