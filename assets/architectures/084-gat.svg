<title id="title">GAT · learn a neighbor distribution for each head</title><desc id="desc">Neighbor softmax precedes aggregation; class softmax follows the output layer. Weights are shared across edges inside a head, not between heads. Attention coefficients describe this forward pass, not causal importance.</desc>
