<title id="title">Bipartite recommendation · return to an item</title><desc id="desc">Deterministic scorer: preserve the intermediate item and user identities. No neural weights or gradient objective. Degree-zero users use the declared fallback; official offline splits do not establish temporal validity.</desc>
