<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TabPFN v1 · the actual released predictor</title><link rel="stylesheet" href="../../../assets/architecture-atlas.css"><link rel="stylesheet" href="../../../assets/l062-tabpfn.css"><style>body{margin:0;padding:20px;background:#e9eff1}main{max-width:760px;margin:auto}.arch-atlas{margin:0}@media(max-width:600px){body{padding:8px}}</style><body class="l062"><main><figure class="arch-atlas" id="architecture-rowpfn" data-architecture-revision="rowpfn" aria-labelledby="aa-title-rowpfn">
<div class="aa-header"><p class="aa-kicker">Lesson 062 / architecture study</p><h3 id="aa-title-rowpfn">TabPFN v1 · the actual released predictor</h3><p class="aa-question"><strong>Trace this:</strong> Where do labels enter, and how does a query keep its own information?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Prepare each view</strong><span>Context-only moments → constants/power/outliers → scale 100/k and zero pad.</span><code class="aa-shape">B × (C+Q) × 100</code></li><li><strong>Encode whole rows</strong><span>Linear feature 100→512; add Linear label 1→512 only to context. No unknown-label or position embedding.</span><code class="aa-shape">context: Ex(x)+Ey(y); query: Ex(x)</code></li><li><strong>Read context memory</strong><span>Four shared-projection heads; all receivers read only context keys/values. Query self edges removed.</span><code class="aa-shape">head width 128; scores (C+Q) × C</code></li><li><strong>Postnorm residuals · repeat 12</strong><span>Attention → add → LayerNorm; Linear 512→1024 → GELU → Linear 1024→512 → add → LayerNorm.</span><code class="aa-shape">B × (C+Q) × 512</code></li><li><strong>Read query states</strong><span>Linear 512→1024 → GELU → Linear 1024→10; keep first K class logits.</span><code class="aa-shape">B × Q × K</code></li><li><strong>Align and combine views</strong><span>Undo class rotations → mean logits → divide by .8 → softmax. Frozen weights at inference.</span><code class="aa-shape">V × Q × K → Q × K</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>One connected query path</h4><svg class="aa-topology" viewBox="0 0 320 128" role="img" aria-labelledby="topology-tabpfn-v1-encode"><title id="topology-tabpfn-v1-encode">Context and query rows are encoded separately before the repeated blocks</title><defs><marker id="arrow-tabpfn-v1-encode" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#087e83"/></marker></defs><polyline points="77,46 77,78" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-tabpfn-v1-encode)"/><polyline points="242,46 242,78" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-tabpfn-v1-encode)"/><g data-architecture-node="true"><rect x="5" y="8" width="145" height="38" rx="5" fill="#eaf5f2" stroke="#a9cdc8"/><text x="77.5" y="32" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">context x,y</text></g><g data-architecture-node="true"><rect x="170" y="8" width="145" height="38" rx="5" fill="#fff1df" stroke="#dfbd91"/><text x="242.5" y="32" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">query x</text></g><g data-architecture-node="true"><rect x="5" y="78" width="145" height="38" rx="5" fill="#eaf5f2" stroke="#a9cdc8"/><text x="77.5" y="102" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Ex(x) + Ey(y)</text></g><g data-architecture-node="true"><rect x="170" y="78" width="145" height="38" rx="5" fill="#fff1df" stroke="#dfbd91"/><text x="242.5" y="102" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Ex(x) only</text></g></svg><div style="border:2px solid #087e83;border-radius:8px;padding:10px"><strong>↓ Repeat this block 12 times ↓</strong><p>Current context and query states enter each block. Context states update at every layer.</p><svg class="aa-topology" viewBox="0 0 320 290" role="img" aria-labelledby="topology-tabpfn-v1-block"><title id="topology-tabpfn-v1-block">Shared projections; context self attention and query cross attention; both residual paths then feed forward</title><defs><marker id="arrow-tabpfn-v1-block" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#087e83"/></marker></defs><polyline points="77,46 77,90" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-tabpfn-v1-block)"/><polyline points="242,46 242,90" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-tabpfn-v1-block)"/><polyline points="105,46 105,65 220,65 220,90" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-tabpfn-v1-block)"/><polyline points="77,128 77,152 105,152 105,174" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-tabpfn-v1-block)"/><polyline points="242,128 242,152 215,152 215,174" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-tabpfn-v1-block)"/><polyline points="160,212 160,246" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-tabpfn-v1-block)"/><g data-architecture-node="true"><rect x="5" y="8" width="145" height="38" rx="5" fill="#eaf5f2" stroke="#a9cdc8"/><text x="77.5" y="32" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">context h → U,K,V</text></g><g data-architecture-node="true"><rect x="170" y="8" width="145" height="38" rx="5" fill="#fff1df" stroke="#dfbd91"/><text x="242.5" y="32" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">query h → U</text></g><g data-architecture-node="true"><rect x="5" y="90" width="145" height="38" rx="5" fill="#eaf5f2" stroke="#a9cdc8"/><text x="77.5" y="114" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">context ← context</text></g><g data-architecture-node="true"><rect x="170" y="90" width="145" height="38" rx="5" fill="#fff1df" stroke="#dfbd91"/><text x="242.5" y="114" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">query ← context</text></g><g data-architecture-node="true"><rect x="45" y="174" width="230" height="38" rx="5" fill="#f3f6f8" stroke="#b5c8d1"/><text x="160.0" y="198" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">add own h → LayerNorm</text></g><g data-architecture-node="true"><rect x="45" y="246" width="230" height="38" rx="5" fill="#f3f6f8" stroke="#b5c8d1"/><text x="160.0" y="270" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">FFN → add → LayerNorm</text></g></svg><p>Feed both updated row sets into the next block. After block 12, read only query states.</p></div><svg class="aa-topology" viewBox="0 0 320 194" role="img" aria-labelledby="topology-tabpfn-v1-head"><title id="topology-tabpfn-v1-head">Query states enter a classification head; class mapping is reversed before logit averaging and softmax</title><defs><marker id="arrow-tabpfn-v1-head" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#087e83"/></marker></defs><polyline points="160,46 160,78" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-tabpfn-v1-head)"/><polyline points="160,116 160,148" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-tabpfn-v1-head)"/><g data-architecture-node="true"><rect x="20" y="8" width="280" height="38" rx="5" fill="#f3f6f8" stroke="#b5c8d1"/><text x="160.0" y="32" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">query head 512→1024→10</text></g><g data-architecture-node="true"><rect x="20" y="78" width="280" height="38" rx="5" fill="#f3f6f8" stroke="#b5c8d1"/><text x="160.0" y="102" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">class align → mean logits / .8</text></g><g data-architecture-node="true"><rect x="20" y="148" width="280" height="38" rx="5" fill="#f3f6f8" stroke="#b5c8d1"/><text x="160.0" y="172" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">softmax → probabilities</text></g></svg><table class="aa-matrix"><thead><tr><th>receives ↓</th><th>c1</th><th>c2</th><th>q1</th><th>q2</th></tr></thead><tbody><tr><th>q1 weights</th><td class="">.269</td><td class="">.731</td><td class="aa-blocked">×</td><td class="aa-blocked">×</td></tr><tr><th>value a</th><td class="">1</td><td class="">0</td><td class="">8</td><td class="">90</td></tr><tr><th>value b</th><td class="">0</td><td class="">2</td><td class="">6</td><td class="">70</td></tr></tbody></table><div class="aa-equation">q1 attention = (.269, 1.462)</div><p class="aa-caption">Synthetic width-2 head fixture: scores(0,1), softmax(.269,.731). Query values are blocked. Residual h preserves the receiver; the final head is not this illustrative two-coordinate vector.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> Context labels enter Ey before all 12 blocks. Another query supplies no key/value; each query keeps its own projected features and residual state.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Full released historical v1: d512, H4, FFN1024, L12, output10, dropout0, postnorm, GELU, numeric wrapper and actual copied pretrained weights. Prior fitting used synthetic held-out labels; this lab measures frozen inference, not new training.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></body></html>
