<div class="aa-header"><p class="aa-kicker">Lesson 062 / architecture study</p><h3 id="aa-title-rowpfn">TabPFN v1 route · context is the memory</h3><p class="aa-question"><strong>Trace this:</strong> Can query 2 become a key or value used by query 1?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Encode whole rows</strong><span>Feature projection plus label representation; query targets are unknown.</span><code class="aa-shape">B × (C+Q) × D</code></li><li><strong>Read context only</strong><span>Projected queries read labeled context keys/values; query-key columns are blocked.</span><code class="aa-shape">per head: (C+Q) × C</code></li><li><strong>Repeat Transformer blocks</strong><span>Attention and feed-forward residual paths transform row states.</span><code class="aa-shape">B × (C+Q) × D</code></li><li><strong>Read query states</strong><span>Normalization → class head → softmax.</span><code class="aa-shape">B × Q × classes</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>An information-access matrix</h4><table class="aa-matrix"><thead><tr><th>reads ↓</th><th>ctx 1</th><th>ctx 2</th><th>query 1</th><th>query 2</th></tr></thead><tbody><tr><th>ctx 1</th><td class="">✓</td><td class="">✓</td><td class="aa-blocked">×</td><td class="aa-blocked">×</td></tr><tr><th>ctx 2</th><td class="">✓</td><td class="">✓</td><td class="aa-blocked">×</td><td class="aa-blocked">×</td></tr><tr><th>query 1</th><td class="">✓</td><td class="">✓</td><td class="aa-blocked">×</td><td class="aa-blocked">×</td></tr><tr><th>query 2</th><td class="">✓</td><td class="">✓</td><td class="aa-blocked">×</td><td class="aa-blocked">×</td></tr></tbody></table><p class="aa-caption">✓ means an allowed sender, not weight one. Softmax distributes mass over allowed context columns. Residual paths preserve each row’s own features.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> Query 1 cannot read query 2 through attention. With fixed context and preprocessing, appending query 2 leaves query 1’s path unchanged.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Historical v1 conceptual route; the local RowPFN is a reduced two-layer mirror with an explicit unknown-label embedding. Actual v1 measurements use a separately pinned pretrained implementation.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></html>
