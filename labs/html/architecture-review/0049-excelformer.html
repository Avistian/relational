<div class="aa-header"><p class="aa-kicker">Lesson 049 / architecture study</p><h3 id="aa-title-excelformer">ExcelFormer · direct the feature graph</h3><p class="aa-question"><strong>Trace this:</strong> Can the highest-ranked feature token read the weakest feature token?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Order and encode</strong><span>Rank columns by training-only importance; apply per-feature gated tokenizers.</span><code class="aa-shape">B × F → B × F × d</code></li><li><strong>Restrict feature attention</strong><span>Mask senders with lower importance than the receiving token.</span><code class="aa-shape">per head: B × F × F</code></li><li><strong>Transform and repeat</strong><span>Residual attention and gated feed-forward stages update feature states.</span><code class="aa-shape">B × F × d</code></li><li><strong>Pool and predict</strong><span>Learned feature-axis pooling → normalization → activation → head.</span><code class="aa-shape">B × d → class logits</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>The mask is a directed graph</h4><table class="aa-matrix"><thead><tr><th>reads ↓</th><th>strong</th><th>middle</th><th>weak</th></tr></thead><tbody><tr><th>strong</th><td class="">1</td><td class="aa-blocked">×</td><td class="aa-blocked">×</td></tr><tr><th>middle</th><td class="">½</td><td class="">½</td><td class="aa-blocked">×</td></tr><tr><th>weak</th><td class="">⅓</td><td class="">⅓</td><td class="">⅓</td></tr></tbody></table><div class="aa-op"><span class="aa-vector"><b>2</b><b>4</b><b>9</b></span><span class="aa-arrow" aria-label="then">→</span><span class="aa-vector"><b>2</b><b>3</b><b>5</b></span></div><p class="aa-caption">Uniform allowed scores, one value coordinate. × means forbidden. Rows receive; columns send. Outputs are weighted sums, not mask counts.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> The strong token cannot read the weak token through this attention mask. The final pooled prediction can still use the weak token directly.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Local ExcelFormer mechanism. Importance is fitted on training labels. Feat-Mix changes training examples/targets and is absent from this prediction path.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></html>
