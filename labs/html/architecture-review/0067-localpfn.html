<div class="aa-header"><p class="aa-kicker">Lesson 067 / architecture study</p><h3 id="aa-title-localpfn">Local PFN · select context, then adapt</h3><p class="aa-question"><strong>Trace this:</strong> Which operation changes record IDs, and which changes pretrained tensors?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Define a memory geometry</strong><span>Fit scaling on training rows; preserve IDs and label eligibility.</span><code class="aa-shape">N × F</code></li><li><strong>Retrieve a local context</strong><span>Squared distances → stable eligible top-k; exclude anchor/query identity.</span><code class="aa-shape">query → k labeled rows</code></li><li><strong>Optional adaptation</strong><span>Build disjoint local context/query episodes; query loss updates a copied checkpoint.</span><code class="aa-shape">θ → θ′ by optimizer steps</code></li><li><strong>Select and predict</strong><span>Validation selects adaptation step; frozen chosen weights predict untouched test queries.</span><code class="aa-shape">PFN(context, query) → probability</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>Two interventions, two state changes</h4><table class="aa-matrix"><thead><tr><th>stage ↓</th><th>context IDs</th><th>weights</th></tr></thead><tbody><tr><th>retrieval</th><td class="">change</td><td class="">fixed θ</td></tr><tr><th>fine-tuning</th><td class="">episode-specific</td><td class="">change θ→θ′</td></tr></tbody></table><div class="aa-equation">episode context IDs ∩ query IDs = ∅</div><div class="aa-pair"><div class="aa-tile"><strong>Retrieval evidence</strong><b>saved neighbor IDs</b></div><div class="aa-tile aa-change"><strong>Adaptation evidence</strong><b>nonzero tensor delta</b></div></div><p class="aa-caption">This is a state-change audit. A different prediction alone cannot tell you whether retrieval or gradient adaptation caused it.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> Retrieval changes the model input. Fine-tuning changes the fitted function. Compare them as separate arms before interpreting their combination.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Actual historical v1 checkpoint in the local comparison. Exact retrieval, six-step adaptation and tiny test panels differ from the full paper protocol; approximate-neighborhood scale claims remain separate.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></html>
