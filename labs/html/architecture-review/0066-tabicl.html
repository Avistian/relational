<div class="aa-header"><p class="aa-kicker">Lesson 066 / architecture study</p><h3 id="aa-title-tabicl">TabICL · column, row, dataset</h3><p class="aa-question"><strong>Trace this:</strong> Which stage compresses the context, and which later stage can still be quadratic?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Build column context</strong><span>Inducing vectors read training-column tokens; every cell then reads the summaries.</span><code class="aa-shape">C × d → m × d → N × d</code></li><li><strong>Create cell and row representations</strong><span>Context-conditioned W·x+B; row Transformer gathers feature tokens into four summaries.</span><code class="aa-shape">4 × 128 → row width 512</code></li><li><strong>Run dataset-level ICL</strong><span>Add context labels; a separate Transformer learns from row representations.</span><code class="aa-shape">N × 512; context-only memory</code></li><li><strong>Predict query labels</strong><span>Query states → output MLP → class probabilities.</span><code class="aa-shape">Q × classes</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>Compression changes one cost term</h4><div class="aa-op"><span><b>C=500</b><br>context rows</span><span class="aa-arrow" aria-label="then">→</span><span><b>m=16</b><br>summaries</span><span class="aa-arrow" aria-label="then">→</span><span><b>N=500</b><br>cell readers</span></div><div class="aa-pair"><div class="aa-tile"><strong>Full column attention</strong><b>250,000</b></div><div class="aa-tile aa-change"><strong>Two inducing stages</strong><b>16,000</b></div></div><div class="aa-equation">mC + Nm = 8,000 + 8,000</div><div class="aa-equation">cell x=2: W=(.5,−1), B=(.1,.3)</div><div class="aa-op"><span>W·x+B</span><span class="aa-arrow" aria-label="then">→</span><span class="aa-vector"><b>1.1</b><b>-1.7</b></span></div><p class="aa-caption">Score elements per column/head; projection, row and dataset costs are excluded. W and B are cell/context-conditioned, not global constants.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> Inducing attention reduces the column-memory term. It does not remove the final dataset learner’s context-attention cost.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Original paper dimensions in the overview; local code isolates inducing and affine operators. Actual timing/quality use pinned v1.1; larger v2 comparisons belong to the later checkpoint.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></html>
