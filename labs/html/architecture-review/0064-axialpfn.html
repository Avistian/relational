<div class="aa-header"><p class="aa-kicker">Lesson 064 / architecture study</p><h3 id="aa-title-axialpfn">TabPFN v2 route · alternate table axes</h3><p class="aa-question"><strong>Trace this:</strong> How does a query target token obtain feature and labeled-context information?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Encode cells and labels</strong><span>Feature tokens plus a target token; query target is unknown.</span><code class="aa-shape">B × N × G × D; G=F+1</code></li><li><strong>Mix within each row</strong><span>Feature attention reads all G tokens of the same row.</span><code class="aa-shape">BN × G × D</code></li><li><strong>Mix each token position across rows</strong><span>Sample attention reads context rows only. Repeat feature/sample blocks.</span><code class="aa-shape">BG × N × D</code></li><li><strong>Read query target tokens</strong><span>Take the target-token position for query rows; apply class head.</span><code class="aa-shape">B × Q × D → B × Q × classes</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>Same table, two legal reading directions</h4><table class="aa-matrix"><thead><tr><th>stage ↓</th><th>feature 1</th><th>feature 2</th><th>target</th></tr></thead><tbody><tr><th>context</th><td class="">x₁</td><td class="">x₂</td><td class="">y</td></tr><tr><th>query</th><td class="">x₁*</td><td class="">x₂*</td><td class="aa-query">?</td></tr></tbody></table><div class="aa-equation">feature: [BN, G, D] → mix G</div><div class="aa-equation">sample: [BG, N, D] → read C</div><div class="aa-pair"><div class="aa-tile"><strong>Within a row</strong><b>features ↔ target</b></div><div class="aa-tile aa-change"><strong>Across rows</strong><b>query ← context</b></div></div><p class="aa-caption">N=C+Q. The unknown target token can first mix with its row features, then read target-position context states. Later stages repeat this exchange.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> Changing the reshape changes the information graph. Feature attention and sample attention normalize over different axes.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Local AxialPFN key-part mirror. Official feature grouping/IDs, distribution encoders, priors and inference ensembling are omitted locally; measured v2 scores use the pinned official checkpoint.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></html>
