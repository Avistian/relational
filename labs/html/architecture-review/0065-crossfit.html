<div class="aa-header"><p class="aa-kicker">Lesson 065 / architecture study</p><h3 id="aa-title-crossfit">Query embeddings · hide the right labels</h3><p class="aa-question"><strong>Trace this:</strong> How can a supervised head train on labels that the encoder was forbidden to see?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Partition training rows</strong><span>Preserve row IDs and assign K folds.</span><code class="aa-shape">N rows → fold IDs</code></li><li><strong>Encode each held-out fold</strong><span>Frozen pretrained encoder gets other folds as labeled context; held-out rows are unlabeled queries.</span><code class="aa-shape">fold queries → fold × D</code></li><li><strong>Restore order and train head</strong><span>Scatter embeddings to original rows; fit scaler and logistic head on (Z,y).</span><code class="aa-shape">Z: N × D</code></li><li><strong>Evaluate with frozen head</strong><span>Average test embeddings over declared fold contexts; test labels score only.</span><code class="aa-shape">test × D → probabilities</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>One row has two distinct label roles</h4><table class="aa-matrix"><thead><tr><th>stage ↓</th><th>encoder context</th><th>encoder query</th><th>head target</th></tr></thead><tbody><tr><th>row in A</th><td class="">absent</td><td class="aa-blocked">hidden</td><td class="">yᵢ allowed</td></tr><tr><th>rows B+C</th><td class="">labels</td><td class="">not queried</td><td class="">their own OOF y</td></tr></tbody></table><div class="aa-equation">zᵢ = encoder(D outside fold A, xᵢ)</div><div class="aa-equation">head training pair = (zᵢ, yᵢ)</div><p class="aa-caption">The row’s target is hidden while constructing its representation, then used as ordinary supervised head-training data.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> Cross-fitting protects the encoder input route. It does not remove the need for independent head selection and test evaluation.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Frozen historical v2 encoder plus local cross-fitted linear head. The final-layer local protocol differs from the paper’s intermediate-layer selection experiment.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></html>
