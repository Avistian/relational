<div class="aa-header"><p class="aa-kicker">Lesson 050 / architecture study</p><h3 id="aa-title-ftt">FT-Transformer · numeric checkpoint</h3><p class="aa-question"><strong>Trace this:</strong> Where do row values enter, and how does a residual carry information around each update?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Fit and transform</strong><span>Fit median, mean and SD on train; apply to every partition. Numeric features only.</span><code class="aa-shape">B × C → B × C</code></li><li><strong>Tokenize and prepend CLS</strong><span>Each scalar xⱼ becomes xⱼwⱼ+bⱼ. A learned CLS is prepended.</span><code class="aa-shape">B × C → B × T × 32; T=C+1</code></li><li><strong>Attention residual</strong><span>Four heads, eight coordinates per head. Skip attention LayerNorm in block 1; normalize in block 2.</span><code class="aa-shape">u = x + Attention(N(x))</code></li><li><strong>Gated residual; repeat twice</strong><span>LayerNorm → Linear 32→84 → ReGLU → dropout → Linear 42→32. Two separate learned blocks.</span><code class="aa-shape">v = u + FFN(LayerNorm(u))</code></li><li><strong>Read final CLS</strong><span>LayerNorm → ReLU → Linear 32→1; sigmoid for probability. Train with binary cross-entropy on logits.</span><code class="aa-shape">B × T × 32 → B × 32 → B</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>One residual branch, then a numerical token</h4><svg class="aa-topology" viewBox="0 0 320 207" role="img" aria-labelledby="topology-ftt-residual"><title id="topology-ftt-residual">The input goes through the update and directly to the addition</title><defs><marker id="arrow-ftt-residual" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#087e83"/></marker></defs><polyline points="157,46 157,77" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-ftt-residual)"/><polyline points="157,115 157,155" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-ftt-residual)"/><polyline points="75,27 30,27 30,174 75,174" fill="none" stroke="#087e83" stroke-width="1.7" stroke-dasharray="4 3" marker-end="url(#arrow-ftt-residual)"/><g data-architecture-node="true"><rect x="75" y="8" width="165" height="38" rx="5" fill="#fff1df" stroke="#dfbd91"/><text x="157.5" y="32" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">input x</text></g><g data-architecture-node="true"><rect x="75" y="77" width="165" height="38" rx="5" fill="#eaf5f2" stroke="#a9cdc8"/><text x="157.5" y="101" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Attention(N(x))</text></g><g data-architecture-node="true"><rect x="75" y="155" width="165" height="38" rx="5" fill="#f3f6f8" stroke="#b5c8d1"/><text x="157.5" y="179" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">ADD → u</text></g></svg><table class="aa-matrix"><thead><tr><th>stage ↓</th><th>xⱼ</th><th>wⱼ</th><th>bⱼ</th></tr></thead><tbody><tr><th>fixture</th><td class="">2</td><td class="">(.5,−1)</td><td class="">(.1,.3)</td></tr></tbody></table><div class="aa-equation">2 × (.5, −1) + (.1, .3) = (1.1, −1.7)</div><p class="aa-caption">Dashed path is the identity skip, not dropout. The FFN has its own identical residual pattern. The tokenizer fixture uses d=2 for arithmetic only.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> Both residuals preserve a direct path. Attention mixes tokens in one row; no other row is a sender. Only the final CLS reaches the head.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Local numeric variant: d=32, L=2, H=4, ReGLU h=42; attention/FFN dropout 0.1 during training and off in eval, residual dropout 0. The paper fixes H=8. No categorical lookup, compression or pretraining. Copied-weight parity is scoped to evaluation; the benchmark recipe differs.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></html>
