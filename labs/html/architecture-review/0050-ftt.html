<div class="aa-header"><p class="aa-kicker">Lesson 050 / architecture study</p><h3 id="aa-title-ftt">FT-Transformer · a row becomes tokens</h3><p class="aa-question"><strong>Trace this:</strong> What does a scalar become before attention, and which token reaches the head?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Tokenize features</strong><span>Numeric scalar × learned feature vector + bias; categorical lookup; add CLS.</span><code class="aa-shape">B × F → B × (F+1) × d</code></li><li><strong>Mix the row</strong><span>Multihead feature attention with the declared residual/normalization variant.</span><code class="aa-shape">scores B × heads × T × T</code></li><li><strong>Transform and repeat</strong><span>Feed-forward blocks, including the checked ReGLU variant, update tokens.</span><code class="aa-shape">B × T × d</code></li><li><strong>Read CLS</strong><span>Normalization/activation and prediction head on the final CLS state.</span><code class="aa-shape">B × d → B × output width</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>The tokenizer already learns coordinates</h4><table class="aa-matrix"><thead><tr><th>stage ↓</th><th>scalar x</th><th>learned W</th><th>learned b</th></tr></thead><tbody><tr><th>inputs</th><td class="">2</td><td class="">(.5,−1)</td><td class="">(.1,.3)</td></tr></tbody></table><div class="aa-equation">2 × (0.5, −1) + (0.1, 0.3)</div><div class="aa-op"><span>feature token</span><span class="aa-arrow" aria-label="then">→</span><span class="aa-vector"><b>1.1</b><b>-1.7</b></span></div><div class="aa-pair"><div class="aa-tile"><strong>Attention reads</strong><b>tokens in this row</b></div><div class="aa-tile aa-change"><strong>Prediction head reads</strong><b>final CLS</b></div></div><p class="aa-caption">A two-coordinate tokenizer fixture; actual hidden width is larger. T includes the CLS token.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> The feature scalar becomes a learned vector before attention. Ordinary FT-T feature attention does not read other data rows.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Reused FT-Transformer baseline, not a newly proposed model. Exact normalization, CLS placement and ReGLU settings follow the checked local variant; recipe parity is audited separately.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></html>
