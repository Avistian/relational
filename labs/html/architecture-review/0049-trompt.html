<div class="aa-header"><p class="aa-kicker">Lesson 049 / architecture study</p><h3 id="aa-title-trompt">Trompt · values refine prompt routing</h3><p class="aa-question"><strong>Trace this:</strong> Why can cell 2 route two rows differently when cell 1 cannot?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Encode each original row</strong><span>Each cell: per-column affine → ReLU → LayerNorm. Separate learned column/prompt identities also use LayerNorm.</span><code class="aa-shape">x: B × C → values: B × C × d</code></li><li><strong>Fuse and route</strong><span>Start O⁰=0; concatenate normalized prompts with Oprev, map 2d→d, add both residuals; score column identities.</span><code class="aa-shape">softmax over C: B × P × C</code></li><li><strong>Expand the value path</strong><span>Learned scalar→P scaling → ReLU → GroupNorm (2 groups) + broadcast original values.</span><code class="aa-shape">B × C × d → B × P × C × d</code></li><li><strong>Gather and pass state</strong><span>Multiply routing weights by expanded values and sum C; feed Oℓ to the next distinct cell, which rereads x.</span><code class="aa-shape">Oℓ: B × P × d; repeat L cells</code></li><li><strong>Shared head for every cell</strong><span>Dense prompt scores → softmax over P → weighted sum → Dense → ReLU → LayerNorm → Dense.</span><code class="aa-shape">B × P × d → B × d → B × T</code></li><li><strong>Train and infer</strong><span>Training sums L cross-entropies. Local inference averages L logits, then class softmax.</span><code class="aa-shape">cell logits B × L × T → probabilities B × T</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>State makes later routing sample-specific</h4><svg class="aa-topology" viewBox="0 0 320 290" role="img" aria-labelledby="topology-trompt-state"><title id="topology-trompt-state">Original row enters both cells; prior state connects them; prediction head is shared</title><defs><marker id="arrow-trompt-state" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#087e83"/></marker></defs><polyline points="105,27 110,27 110,97 120,97" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-trompt-state)"/><polyline points="60,46 60,179 120,179" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-trompt-state)"/><polyline points="225,46 225,78" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-trompt-state)"/><polyline points="210,116 210,160" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-trompt-state)"/><polyline points="300,97 314,97 314,264 275,264" fill="none" stroke="#087e83" stroke-width="1.7" stroke-dasharray="4 3" marker-end="url(#arrow-trompt-state)"/><polyline points="210,198 210,245" fill="none" stroke="#087e83" stroke-width="1.7" stroke-dasharray="4 3" marker-end="url(#arrow-trompt-state)"/><g data-architecture-node="true"><rect x="15" y="8" width="90" height="38" rx="5" fill="#fff1df" stroke="#dfbd91"/><text x="60.0" y="32" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">row x</text></g><g data-architecture-node="true"><rect x="150" y="8" width="150" height="38" rx="5" fill="#eaf5f2" stroke="#a9cdc8"/><text x="225.0" y="32" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">O⁰ = zero</text></g><g data-architecture-node="true"><rect x="120" y="78" width="180" height="38" rx="5" fill="#eaf5f2" stroke="#a9cdc8"/><text x="210.0" y="102" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">cell 1 → O¹</text></g><g data-architecture-node="true"><rect x="120" y="160" width="180" height="38" rx="5" fill="#eaf5f2" stroke="#a9cdc8"/><text x="210.0" y="184" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">cell 2 → O²</text></g><g data-architecture-node="true"><rect x="45" y="245" width="230" height="38" rx="5" fill="#f3f6f8" stroke="#b5c8d1"/><text x="160.0" y="269" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">shared head → logits</text></g></svg><table class="aa-matrix"><thead><tr><th>stage ↓</th><th>col 1</th><th>col 2</th><th>col 3</th></tr></thead><tbody><tr><th>one prompt M</th><td class="">0.2</td><td class="">0.3</td><td class="">0.5</td></tr><tr><th>value coordinate</th><td class="">1</td><td class="">0</td><td class="">4</td></tr></tbody></table><div class="aa-equation">sum over C: 0.2×1 + 0.3×0 + 0.5×4 = 2.2</div><p class="aa-caption">Solid paths carry x or recurrent state; dashed paths invoke the same head. M¹ is shared across rows, but O¹ differs when x differs. Fixture arithmetic is synthetic.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> Cell 1 sees zero previous state and shared identities, so its M¹ cannot depend on x. Its value aggregation O¹ does depend on x; cell 2 can use O¹ to change M².</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Complete local numeric mirror: d=16, P=8, L=2, T=2. Zero initial state follows paper §5.1; expansion/group count follow pinned independent PyTorch Frame components. Original benchmark defaults d=P=128, L=6 are not the local training recipe.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></html>
