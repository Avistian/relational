<div class="aa-header"><p class="aa-kicker">Lesson 049 / architecture study</p><h3 id="aa-title-trompt">Trompt · prompts gather feature evidence</h3><p class="aa-question"><strong>Trace this:</strong> Which dimension disappears when each prompt gathers a row’s feature values?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Encode columns and values</strong><span>Column identities and cell values enter the model through distinct representations.</span><code class="aa-shape">column C × d; cells B × C × d</code></li><li><strong>Route prompts</strong><span>Prompt/row-conditioned states score column identities; normalize over C.</span><code class="aa-shape">B × P × C</code></li><li><strong>Gather and iterate</strong><span>Weight expanded feature values and sum over columns; full model repeats prompt processing.</span><code class="aa-shape">B × P × C × d → B × P × d</code></li><li><strong>Read prompt states</strong><span>The full model combines prompt states for its prediction head.</span><code class="aa-shape">row representation → output</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>One prompt gathers three vectors</h4><table class="aa-matrix"><thead><tr><th>stage ↓</th><th>col 1</th><th>col 2</th><th>col 3</th></tr></thead><tbody><tr><th>weight</th><td class="">0.2</td><td class="">0.3</td><td class="">0.5</td></tr><tr><th>value 1</th><td class="">1</td><td class="">0</td><td class="">4</td></tr><tr><th>value 2</th><td class="">0</td><td class="">2</td><td class="">1</td></tr></tbody></table><div class="aa-equation">0.2(1,0) + 0.3(0,2) + 0.5(4,1)</div><div class="aa-op"><span>sum over C</span><span class="aa-arrow" aria-label="then">→</span><span class="aa-vector"><b>2.2</b><b>1.1</b></span></div><p class="aa-caption">Illustrative weights after column softmax. Prompts are learned vectors, not natural-language instructions.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> Aggregation removes the column axis C while preserving prompt P and hidden coordinate d.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Paper-level route; the local lab implements prompt weighting and aggregation only. Full Trompt training and benchmark reproduction are not implemented here.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></html>
