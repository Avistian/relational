<div class="aa-header"><p class="aa-kicker">Lesson 068 / architecture study</p><h3 id="aa-title-driftpfn">Temporal PFN · train on changing tasks</h3><p class="aa-question"><strong>Trace this:</strong> What generates drift during pretraining, and what history is legal at inference?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Sample a changing mechanism</strong><span>A task-specific function of time produces SCM edge weights.</span><code class="aa-shape">time t → W(t)</code></li><li><strong>Generate an episode</strong><span>Earlier context and later queries share that changing mechanism and declared noise model.</span><code class="aa-shape">SCM → [features, time], labels</code></li><li><strong>Pretrain a PFN</strong><span>Query-label loss trains the predictor across episodes; generating graph is not supplied at inference.</span><code class="aa-shape">episodes → fixed θ</code></li><li><strong>Predict later rows</strong><span>Eligible historical labels + query features/time → fixed pretrained predictor.</span><code class="aa-shape">context before cutoff → future probability</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>Past event does not imply known label</h4><table class="aa-matrix"><thead><tr><th>stage ↓</th><th>event</th><th>label arrives</th><th>cutoff</th></tr></thead><tbody><tr><th>record</th><td class="">3</td><td class="">5</td><td class="">4</td></tr></tbody></table><div class="aa-pair"><div class="aa-tile"><strong>Event test: 3 ≤ 4</strong><b>passes</b></div><div class="aa-tile aa-change"><strong>Label test: 5 ≤ 4</strong><b>blocked</b></div></div><div class="aa-equation">eligible = (event ≤ cutoff) AND (label ≤ cutoff)</div><p class="aa-caption">A concrete availability fixture. Time changes the task generator during pretraining; at deployment the model receives observed features/time, not the true SCM.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> Two boundaries matter: what dynamics pretraining teaches, and which labels were actually available when a prediction was made.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Local changing-edge RowPFN ablation, not the full published temporal architecture or benchmark. Earlier/later evaluation is paired across the stationary and drifting-prior arms.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></html>
