<div class="aa-header"><p class="aa-kicker">Lesson 061 / architecture study</p><h3 id="aa-title-gppfn">Row PFN · infer from a labeled set</h3><p class="aa-question"><strong>Trace this:</strong> Can a query read itself without reading its hidden target?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Sample and split a GP task</strong><span>One joint function draw; reveal n context labels, hide m query labels.</span><code class="aa-shape">x: B × N × F; yc: B × n</code></li><li><strong>Encode whole rows</strong><span>Context: Ex(x)+Ey(y). Query: Ex(x) only. No positional encoding.</span><code class="aa-shape">B × N × d; lab d=64</code></li><li><strong>Masked attention residual</strong><span>All context columns plus identity. H=4 heads; concatenate → output projection.</span><code class="aa-shape">u = LayerNorm(h + Attention(h))</code></li><li><strong>GELU residual; repeat three blocks</strong><span>Linear 64→128 → GELU → Linear 128→64; independent postnorm blocks.</span><code class="aa-shape">h′ = LayerNorm(u + FFN(u))</code></li><li><strong>Predict query densities</strong><span>Query states → Linear 64→128 → GELU → Linear 128→64; softmax masses.</span><code class="aa-shape">B × m × 64 → full-support Riemann density</code></li><li><strong>Train / infer</strong><span>Pretraining query NLL updates weights. A new task only changes context inputs.</span><code class="aa-shape">no query labels enter forward(x,yc)</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>One head: equal allowed scores</h4><svg class="aa-topology" viewBox="0 0 320 296" role="img" aria-labelledby="topology-gp-row-route"><title id="topology-gp-row-route">Context labels enter context tokens; query labels enter pretraining loss only.</title><defs><marker id="arrow-gp-row-route" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#087e83"/></marker></defs><polyline points="78,43 78,72" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-gp-row-route)"/><polyline points="244,43 244,72" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-gp-row-route)"/><polyline p <figcaption class="aa-answer"><strong>Read the path:</strong> Self attention uses the query feature token only. Context tokens cannot read queries; extra query rows cannot leak through a later context state.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Original released row PFN mask includes query self edges. Postnorm GELU blocks, zero initial attention/FFN output projections, dropout 0. Local width 64/layers 3/bins 64 differs from original large GP training. Full-support tails preserve density outside sampled borders.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></body></html>
