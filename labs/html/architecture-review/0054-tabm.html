<div class="aa-header"><p class="aa-kicker">Lesson 054 / architecture study</p><h3 id="aa-title-tabm">TabM · separate members, shared matrices</h3><p class="aa-question"><strong>Trace this:</strong> How do identical input rows take different paths through the same W?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Broadcast the row</strong><span>Train-only imputation/z-score, then k views; R starts ±1 and learns real values.</span><code class="aa-shape">B × F → B × k × F</code></li><li><strong>Share expensive weights</strong><span>Mini: first R only; N shared W and shared biases, ReLU, training-only dropout.</span><code class="aa-shape">B × k × hidden width</code></li><li><strong>Use member heads</strong><span>Each member has an independent output projection.</span><code class="aa-shape">B × k × output width</code></li><li><strong>Aggregate probabilities</strong><span>Classification: mean probabilities. Regression: mean scalars. Train: mean member losses.</span><code class="aa-shape">B × output width</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>Two members, one shared matrix</h4><p class="aa-small">x=(2,3), W=[[1,2],[3,4]], S=1, bias=0.</p><table class="aa-matrix"><thead><tr><th>stage ↓</th><th>member A</th><th>member B</th></tr></thead><tbody><tr><th>R</th><td class="">(1,1)</td><td class="">(1,−1)</td></tr><tr><th>x ⊙ R</th><td class="">(2,3)</td><td class="">(2,−3)</td></tr><tr><th>× shared W</th><td class="">(11,16)</td><td class="">(−7,−8)</td></tr></tbody></table><div class="aa-pair"><div class="aa-tile"><strong>p₁=0.9, p₂=0.6</strong><b>mean p = 0.750</b></div><div class="aa-tile aa-change"><strong>Mean logits first</strong><b>p ≈ 0.786</b></div></div><p class="aa-caption">Pre-activation adapter fixture. The probability example is a separate head-output fixture showing why operation order matters.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> Adapters create different effective functions while retaining one W. Softmax and member averaging do not commute.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Corrected v2 numeric mini: only first R; shared backbone weights/biases; separate heads. Full TabM adds R,S and member biases in each block. Input labels appear only in the training loss. Shared batches pictured; the closer trainer also supports distinct rows per member.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></html>
