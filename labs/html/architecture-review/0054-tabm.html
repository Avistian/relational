<div class="aa-header"><p class="aa-kicker">Lesson 054 / architecture study</p><h3 id="aa-title-tabm">TabM · separate members, shared matrices</h3><p class="aa-question"><strong>Trace this:</strong> How do identical input rows take different paths through the same W?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Broadcast the row</strong><span>Make k member views; the first learned sign adapter differentiates them.</span><code class="aa-shape">B × F → B × k × F</code></li><li><strong>Share expensive weights</strong><span>Adapt input/output directions around W; ReLU and dropout follow.</span><code class="aa-shape">B × k × hidden width</code></li><li><strong>Use member heads</strong><span>Each member has an independent output projection.</span><code class="aa-shape">B × k × classes</code></li><li><strong>Aggregate probabilities</strong><span>Softmax each member, then mean over k. Training averages member losses.</span><code class="aa-shape">B × classes</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>Two adapters, one shared matrix</h4><p class="aa-small">x=(2,3), W=[[1,2],[3,4]], S=1, bias=0.</p><table class="aa-matrix"><thead><tr><th>stage ↓</th><th>member A</th><th>member B</th></tr></thead><tbody><tr><th>R</th><td class="">(1,1)</td><td class="">(1,−1)</td></tr><tr><th>x ⊙ R</th><td class="">(2,3)</td><td class="">(2,−3)</td></tr><tr><th>× shared W</th><td class="">(11,16)</td><td class="">(−7,−8)</td></tr></tbody></table><div class="aa-pair"><div class="aa-tile"><strong>p₁=0.9, p₂=0.6</strong><b>mean p = 0.750</b></div><div class="aa-tile aa-change"><strong>Mean logits first</strong><b>p ≈ 0.786</b></div></div><p class="aa-caption">Pre-activation adapter fixture. The probability example is a separate head-output fixture showing why operation order matters.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> Adapters create different effective functions while retaining one W. Softmax and member averaging do not commute.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> The local mini variant omits later multiplicative adapters; full local TabM retains them. Both preserve member biases and heads. Neither is k independently trained dense backbones.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></html>
