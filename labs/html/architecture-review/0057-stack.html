<div class="aa-header"><p class="aa-kicker">Lesson 057 / architecture study</p><h3 id="aa-title-stack">OOF stack · predictions become features</h3><p class="aa-question"><strong>Trace this:</strong> Which fitted base model is allowed to produce the training feature for row i?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Partition outer training rows</strong><span>Assign folds and preserve stable row IDs; keep outer test untouched.</span><code class="aa-shape">N rows → K folds</code></li><li><strong>Predict held-out folds</strong><span>For each family, fit on other folds and predict the excluded fold.</span><code class="aa-shape">fold outputs → aligned N × M</code></li><li><strong>Train the combiner</strong><span>Use OOF probabilities Z and training targets y; select under the declared validation rule.</span><code class="aa-shape">Z: N × M; y: N</code></li><li><strong>Serve the stack</strong><span>Declared refit/fold-model policy → aligned base probabilities → frozen combiner.</span><code class="aa-shape">new rows × M → probabilities</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>Every diagonal is held out</h4><table class="aa-matrix"><thead><tr><th>stage ↓</th><th>fit B+C</th><th>fit A+C</th><th>fit A+B</th></tr></thead><tbody><tr><th>predict A</th><td class="">OOF</td><td class="aa-blocked">×</td><td class="aa-blocked">×</td></tr><tr><th>predict B</th><td class="aa-blocked">×</td><td class="">OOF</td><td class="aa-blocked">×</td></tr><tr><th>predict C</th><td class="aa-blocked">×</td><td class="aa-blocked">×</td><td class="">OOF</td></tr></tbody></table><div class="aa-equation">Z[i, :] = base predictions made without yᵢ</div><p class="aa-caption">M counts model probability features in this binary illustration. The diagonal maps each row fold to its eligible training complement.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> The combiner may train on yᵢ. The base fit producing Zᵢ must not have trained on that target.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Cross-family stacking procedure, not a new base network. Group/time structure must also be respected by folds. Class order, row IDs and serving refit policy are part of the saved artifact.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></html>
