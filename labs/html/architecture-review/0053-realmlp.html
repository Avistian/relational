<div class="aa-header"><p class="aa-kicker">Lesson 053 / architecture study</p><h3 id="aa-title-realmlp">RealMLP-TD-S · the recipe is in the path</h3><p class="aa-question"><strong>Trace this:</strong> Which transformations control input scale before the first hidden activation?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Fit robust preprocessing</strong><span>Training median and IQR; range fallback; smooth clipping.</span><code class="aa-shape">B × F</code></li><li><strong>Learn feature scale</strong><span>Multiply each coordinate by its learned scale; width is unchanged.</span><code class="aa-shape">B × F → B × F</code></li><li><strong>Repeat hidden layers</strong><span>Three NTP linear → activation stages; SELU classification, Mish regression.</span><code class="aa-shape">F → d → d → d; local d=64, paper d=256</code></li><li><strong>Predict and select</strong><span>Zero-initialized output head; validation selects a scheduled training checkpoint.</span><code class="aa-shape">B × output width</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>Smooth clipping preserves order</h4><table class="aa-matrix"><thead><tr><th>stage ↓</th><th>z=0</th><th>z=3</th><th>z=6</th></tr></thead><tbody><tr><th>c(z)</th><td class="">0</td><td class="">2.121</td><td class="">2.683</td></tr></tbody></table><div class="aa-equation">c(z) = z / √(1 + (z/3)²)</div><div class="aa-equation">linear(x) = xW / √dᵢₙ + b</div><div class="aa-pair"><div class="aa-tile"><strong>Input scale</strong><b>learned per feature</b></div><div class="aa-tile aa-change"><strong>Large magnitudes</strong><b>approach ±3</b></div></div><p class="aa-caption">Numeric transform values are computed from the displayed formula. Constant and zero-IQR features have explicit fallback policies.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> The architecture alone does not specify training: parameter groups, initialization and coslog4 scheduling change how this path is learned.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Local numeric TD-S variant. Robust preprocessing is fitted only on training rows. A reduced-width local run is distinct from the published recipe-size experiment.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></html>
