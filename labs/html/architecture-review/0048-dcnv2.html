<div class="aa-header"><p class="aa-kicker">Lesson 048 / architecture study</p><h3 id="aa-title-dcnv2">DCNv2 · keep the original input alive</h3><p class="aa-question"><strong>Trace this:</strong> Which vector anchors every cross update, and what does rank one actually compute?</p></div>
<div class="aa-body"><div class="aa-route"><p class="aa-section-label">The forward path</p><ol><li><strong>Embed one row</strong><span>Concatenate numeric features and categorical embeddings. Save x₀.</span><code class="aa-shape">B × d</code></li><li><strong>Cross repeatedly</strong><span>xₗ₊₁ = xₗ + x₀ ⊙ (Wₗxₗ + bₗ). The anchor stays x₀.</span><code class="aa-shape">B × d → B × d</code></li><li><strong>Route the deep branch</strong><span>Parallel: MLP(x₀). Stacked: MLP(xL). Parallel concatenates both branches.</span><code class="aa-shape">cross + deep → head input</code></li><li><strong>Predict</strong><span>Linear head produces a logit; sigmoid gives class probability.</span><code class="aa-shape">B × 1</code></li></ol></div><div class="aa-focus"><p class="aa-section-label">Inside the key operation</p><h4>Inside a rank-one cross layer</h4><svg class="aa-topology" viewBox="0 0 320 255" role="img" aria-labelledby="topology-dcn-route"><title id="topology-dcn-route">Parallel DCNv2: original input branches into cross and deep networks, then concatenates before the head.</title><defs><marker id="arrow-dcn-route" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#087e83"/></marker></defs><polyline points="160,43 160,57 77,57 77,73" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-dcn-route)"/><polyline points="160,57 247,57 247,73" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-dcn-route)"/><polyline points="77,113 77,133 125,133 125,143" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-dcn-route)"/><polyline points="247,113 247,133 195,133 195,143" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-dcn-route)"/><polyline points="160,183 160,208" fill="none" stroke="#087e83" stroke-width="1.7" marker-end="url(#arrow-dcn-route)"/><g data-architecture-node="true"><rect x="115" y="5" width="90" height="38" rx="5" fill="#fff1df" stroke="#dfbd91"/><text x="160.0" y="29" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">input x₀</text></g><g data-architecture-node="true"><rect x="10" y="75" width="135" height="38" rx="5" fill="#eaf5f2" stroke="#a9cdc8"/><text x="77.5" y="99" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">cross × L</text></g><g data-architecture-node="true"><rect x="185" y="75" width="125" height="38" rx="5" fill="#f3f6f8" stroke="#b5c8d1"/><text x="247.5" y="99" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">MLP(x₀)</text></g><g data-architecture-node="true"><rect x="90" y="145" width="140" height="38" rx="5" fill="#f3f6f8" stroke="#b5c8d1"/><text x="160.0" y="169" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">concatenate</text></g><g data-architecture-node="true"><rect x="100" y="210" width="120" height="38" rx="5" fill="#f3f6f8" stroke="#b5c8d1"/><text x="160.0" y="234" text-anchor="middle" fill="#203d4b" font-family="system-ui,sans-serif" font-size="14" font-weight="600">linear head</text></g></svg><p class="aa-small">Parallel route pictured. Stacked route sends the cross output into the MLP instead.</p><p class="aa-small">Column-vector fixture: x₀=xₗ=(2,3), V=(1,2), U=(1,3), bias=0.</p><div class="aa-op"><span class="aa-vector"><b>2</b><b>3</b></span><span class="aa-arrow" aria-label="then">→</span><span><b>Vᵀx = 8</b><br><small>2 → 1</small></span><span class="aa-arrow" aria-label="then">→</span><span><small>U · 8 &nbsp; (1 → 2)</small><br><span class="aa-vector"><b>8</b><b>24</b></span></span></div><div class="aa-equation">x₀ ⊙ U(Vᵀxₗ) = (16, 72)</div><div class="aa-equation">xₗ + update = (18, 75)</div><p class="aa-caption">The bottleneck compresses d→r, then expands r→d. The original input multiplies the expanded update coordinate by coordinate.</p></div></div>
<figcaption class="aa-answer"><strong>Read the path:</strong> Low rank constrains the mixed directions; it does not remove the anchor or residual. Parallel and stacked deep branches read different inputs.</figcaption><div class="aa-scope"><p><strong>Variant &amp; evidence.</strong> Dense and low-rank DCNv2 cross paths. The nonlinear mixture extension adds gates and expert nonlinearities; its function is not the same polynomial cross stack.</p><p><a href="./index.html">All architecture studies</a></p></div></figure></main></html>
