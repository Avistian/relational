<div class="aa-header"><p class="aa-kicker">Lesson 061 / architecture study</p><h3 id="aa-title-countpfn">Count PFN · learn a posterior rule</h3><p class="aa-question"><strong>Trace this:</strong> What changes between pretraining episodes, and what stays fixed at inference?</p></div>

 style="width:66.6667%"></div></div><b>0.667</b></div><div class="aa-bar-row"><span>empirical</span><div class="aa-track"><div class="aa-bar" style="width:75.0000%"></div></div><b>0.75</b></div><p class="aa-caption">Beta–Bernoulli example. Bars share a probability scale from zero to one; posterior shrinkage differs from the empirical rate. Dashed return arrow is the pretraining gradient update; it is absent at inference.</p></div></div>
