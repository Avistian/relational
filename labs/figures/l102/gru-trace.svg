<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><rect width="1000" height="430" fill="#fcfbf7"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#196b70"/></marker></defs><text x="30" y="40" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#173540" font-weight="bold">One scalar GRU update, with every intermediate exposed</text><text x="30" y="73" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#173540" font-weight="normal">Illustrative fixed weights only. The real model learns all gates in 172 dimensions.</text><rect x="30" y="115" width="240" height="150" rx="9" fill="#edf6f4" stroke="#b9cecb"/><text x="46" y="144" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#196b70" font-weight="bold">Inputs</text><text x="46" y="172" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Old memory = 0.4000</text><text x="46" y="197" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Event feature = 1.0000</text><text x="46" y="222" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Reset r = keep z = 0.5</text><rect x="330" y="115" width="300" height="150" rx="9" fill="#edf6f4" stroke="#b9cecb"/><text x="346" y="144" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#196b70" font-weight="bold">Candidate</text><text x="346" y="172" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Reset hidden: 0.25 × 0.4</text><text x="346" y="197" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Preactivation: 1 + 0.1 = 1.1</text><text x="346" y="222" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">tanh(1.1) = 0.8005</text><rect x="690" y="115" width="280" height="150" rx="9" fill="#edf6f4" stroke="#b9cecb"/><text x="706" y="144" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#196b70" font-weight="bold">Updated memory</text><text x="706" y="172" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">0.5 × old + 0.5 × candidate</text><text x="706" y="197" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">0.2000 + 0.4002</text><text x="706" y="222" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">= 0.6002</text><path d="M270 187 L330 187" stroke="#196b70" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M630 187 L690 187" stroke="#196b70" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="30" y="316" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#196b70" font-weight="bold">Why this is a gate, not an overwrite</text><text x="30" y="350" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#173540" font-weight="normal">z near 1 keeps history; z near 0 favors the candidate. r controls the old-state contribution</text><text x="30" y="380" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#173540" font-weight="normal">inside that candidate. Last-message aggregation selects the input; it is not a GRU gate.</text></svg>