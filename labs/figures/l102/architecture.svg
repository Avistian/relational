<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img"><rect width="1000" height="820" fill="#fcfbf7"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#196b70"/></marker></defs><text x="30" y="38" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#173540" font-weight="bold">TGN-attn / from event history to an edge score</text><text x="30" y="68" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#173540" font-weight="normal">Wikipedia release variant · 172-dimensional memory · one attention layer</text><rect x="30" y="100" width="430" height="116" rx="9" fill="#edf6f4" stroke="#b9cecb"/><text x="46" y="129" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#196b70" font-weight="bold">1   Past observed events</text><text x="46" y="157" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">(source, destination, time, edge[172])</text><text x="46" y="182" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Pending last message per node: [688]</text><rect x="530" y="100" width="440" height="116" rx="9" fill="#edf6f4" stroke="#b9cecb"/><text x="546" y="129" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#196b70" font-weight="bold">2   Recompute candidate memory</text><text x="546" y="157" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">GRU(message[688], old state[172])</text><text x="546" y="182" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Differentiable state S* [9,228 × 172]</text><path d="M460 158 L530 158" stroke="#196b70" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="264" width="430" height="168" rx="9" fill="#edf6f4" stroke="#b9cecb"/><text x="46" y="293" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#196b70" font-weight="bold">3   Legal temporal context</text><text x="46" y="321" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Query nodes: source, positive, negative</text><text x="46" y="346" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Most recent 10 edges: time &lt; query time</text><text x="46" y="371" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Each neighbor: state[172] + edge[172]</text><text x="46" y="396" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">                         + time encoding[172]</text><rect x="530" y="264" width="440" height="168" rx="9" fill="#edf6f4" stroke="#b9cecb"/><text x="546" y="293" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#196b70" font-weight="bold">4   Two-head temporal attention</text><text x="546" y="321" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Query [344] = own state + time(0)</text><text x="546" y="346" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Key/value [516] → attention output [344]</text><text x="546" y="371" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Append own state → MLP → z[172]</text><text x="546" y="396" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Empty history: keep own-state path</text><path d="M460 345 L530 345" stroke="#196b70" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M750 216 L750 264" stroke="#196b70" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="530" y="480" width="440" height="112" rx="9" fill="#edf6f4" stroke="#b9cecb"/><text x="546" y="509" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#196b70" font-weight="bold">5   Shared edge decoder</text><text x="546" y="537" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">concat(z_source, z_candidate) [344]</text><text x="546" y="562" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">MLP 344 → 172 → 1 → sigmoid score</text><path d="M750 432 L750 480" stroke="#196b70" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="480" width="430" height="112" rx="9" fill="#edf6f4" stroke="#b9cecb"/><text x="46" y="509" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#196b70" font-weight="bold">6   Signal from observed events</text><text x="46" y="537" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Observed pair: 1; sampled destination: 0</text><text x="46" y="562" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">BCE(positive) + BCE(negative)</text><path d="M530 536 L460 536" stroke="#196b70" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="646" width="940" height="122" rx="9" fill="#fff3df" stroke="#b9cecb"/><text x="46" y="675" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#196b70" font-weight="bold">7   Queue current positives for a later batch</text><text x="46" y="703" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Persist consumed old messages for real endpoints. Construct both directed raw messages.</text><text x="46" y="728" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">[own state 172 | other state 172 | event 172 | elapsed encoding 172] = 688.</text><text x="46" y="753" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Last event per node wins. Detach after the optimizer step. Negatives never write memory.</text><path d="M245 592 L245 646" stroke="#196b70" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="30" y="800" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#173540" font-weight="normal">Inference: freeze weights; update after observed events. Never ingest hypothetical candidates.</text></svg>