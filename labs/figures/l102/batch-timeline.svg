<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><rect width="1000" height="470" fill="#fcfbf7"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#196b70"/></marker></defs><text x="30" y="40" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#173540" font-weight="bold">Two clocks: observed now, memory update learned later</text><text x="30" y="72" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#173540" font-weight="normal">A–B at t=1, A–C at t=2, B–C at t=3. Batch size = 2.</text><rect x="30" y="110" width="435" height="225" rx="9" fill="#edf6f4" stroke="#b9cecb"/><text x="46" y="139" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#196b70" font-weight="bold">Batch 1: events 1 and 2</text><text x="46" y="167" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Start: zero memory; no pending messages.</text><text x="46" y="192" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Score A–B and A–C with this memory.</text><text x="46" y="217" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Queue messages after both predictions.</text><text x="46" y="242" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">For A, last aggregation keeps t=2.</text><text x="46" y="267" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">For B, keep t=1. For C, keep t=2.</text><text x="46" y="292" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">End: update weights; detach messages.</text><rect x="530" y="110" width="440" height="225" rx="9" fill="#edf6f4" stroke="#b9cecb"/><text x="546" y="139" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#196b70" font-weight="bold">Batch 2: event 3</text><text x="546" y="167" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Read pending A(t=2), B(t=1), C(t=2).</text><text x="546" y="192" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Current GRU weights → candidate S*.</text><text x="546" y="217" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Score B–C using S*.</text><text x="546" y="242" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Loss gradients reach the GRU through S*.</text><text x="546" y="267" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Queue B–C after its prediction.</text><text x="546" y="292" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#173540" font-weight="normal">Past data; current trainable updater.</text><path d="M465 220 L530 220" stroke="#196b70" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="30" y="383" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#196b70" font-weight="bold">Shared memory does not mean identical graph neighborhoods.</text><text x="30" y="417" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#173540" font-weight="normal">The t=2 query can sample the t=1 edge. Its memory still excludes batch-1 updates.</text><text x="30" y="446" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#173540" font-weight="normal">Batch size changes memory access even with a strict temporal adjacency cutoff.</text></svg>