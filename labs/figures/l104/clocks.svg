<svg xmlns="http://www.w3.org/2000/svg" width="940" height="476" viewBox="0 0 940 476"><style>text{font-family:DejaVu Sans,sans-serif}</style><rect width="940" height="476" fill="#fafaf7"/><text x="30" y="38" font-size="25" fill="#183742" font-weight="600">Two clocks decide whether one record can be used</text><text x="30" y="68" font-size="16" fill="#63767d" font-weight="400">Fixed query: day 8 • strict event history • availability checked separately</text><text x="30" y="161" font-size="18" fill="#183742" font-weight="600">Original</text><path d="M160 155L880 155" stroke="#c8d3d4" stroke-width="3" fill="none"/><path d="M340 155L400 155" stroke="#087e82" stroke-width="3" fill="none"/><circle cx="340" cy="155" r="7" fill="#087e82"/><path d="M400 146l9 9l-9 9l-9 -9Z" fill="#087e82"/><text x="316" y="134" font-size="15" fill="#087e82" font-weight="400">event 3</text><text x="366" y="190" font-size="15" fill="#087e82" font-weight="400">arrival 4</text><text x="30" y="251" font-size="18" fill="#183742" font-weight="600">Correction</text><path d="M160 245L880 245" stroke="#c8d3d4" stroke-width="3" fill="none"/><path d="M340 245L700 245" stroke="#b3473e" stroke-width="3" fill="none"/><circle cx="340" cy="245" r="7" fill="#b3473e"/><path d="M700 236l9 9l-9 9l-9 -9Z" fill="#b3473e"/><text x="316" y="224" font-size="15" fill="#b3473e" font-weight="400">event 3</text><text x="666" y="280" font-size="15" fill="#b3473e" font-weight="400">arrival 9</text><path d="M640 100L640 290" stroke="#183742" stroke-width="3" fill="none" stroke-dasharray="7 5"/><text x="610" y="96" font-size="16" fill="#183742" font-weight="600">query 8</text><text x="155" y="321" font-size="15" fill="#63767d" font-weight="400">0</text><text x="335" y="321" font-size="15" fill="#63767d" font-weight="400">3</text><text x="395" y="321" font-size="15" fill="#63767d" font-weight="400">4</text><text x="635" y="321" font-size="15" fill="#63767d" font-weight="400">8</text><text x="695" y="321" font-size="15" fill="#63767d" font-weight="400">9</text><text x="875" y="321" font-size="15" fill="#63767d" font-weight="400">12</text><rect x="30" y="348" width="425" height="102" rx="8" fill="white" stroke="#bdcfd1"/><text x="48" y="379" font-size="20" fill="#087e82" font-weight="600">Original: 3 &lt; 8 AND 4 ≤ 8</text><text x="48" y="415" font-size="18" fill="#183742" font-weight="400">ALLOW · both conditions hold</text><rect x="485" y="348" width="425" height="102" rx="8" fill="white" stroke="#bdcfd1"/><text x="503" y="379" font-size="20" fill="#b3473e" font-weight="600">Correction: 3 &lt; 8 BUT 9 &gt; 8</text><text x="503" y="415" font-size="18" fill="#183742" font-weight="400">BLOCK · happened earlier, arrived later</text></svg>