<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480"><style>text{font-family:DejaVu Sans,sans-serif}</style><rect width="940" height="480" fill="#fafaf7"/><text x="30" y="38" font-size="25" fill="#183742" font-weight="600">The child has a stricter question than the root</text><text x="30" y="68" font-size="16" fill="#63767d" font-weight="400">TGAT example • parent time is not a universal cutoff for all hops</text><rect x="30" y="100" width="245" height="104" rx="8" fill="white" stroke="#bdcfd1"/><text x="48" y="135" font-size="22" fill="#183742" font-weight="600">A queried at 8</text><text x="48" y="171" font-size="18" fill="#183742" font-weight="400">A–B event at 5</text><path d="M275 151L345 151" stroke="#087e82" stroke-width="3" fill="none"/><text x="288" y="132" font-size="15" fill="#087e82" font-weight="400">5 &lt; 8</text><rect x="345" y="100" width="245" height="104" rx="8" fill="white" stroke="#bdcfd1"/><text x="363" y="135" font-size="22" fill="#183742" font-weight="600">B queried at 5</text><text x="363" y="171" font-size="18" fill="#183742" font-weight="400">child cutoff = 5</text><path d="M590 151L646 151" stroke="#087e82" stroke-width="3" fill="none"/><path d="M646 151L646 284" stroke="#087e82" stroke-width="3" fill="none"/><path d="M646 151L692 151" stroke="#087e82" stroke-width="3" fill="none"/><rect x="692" y="100" width="220" height="104" rx="8" fill="white" stroke="#bdcfd1"/><text x="710" y="136" font-size="19" fill="#183742" font-weight="600">B–D event at 2</text><text x="710" y="173" font-size="18" fill="#087e82" font-weight="400">2 &lt; 5 · ALLOW</text><path d="M646 284L692 284" stroke="#b3473e" stroke-width="3" fill="none" stroke-dasharray="7 5"/><rect x="692" y="233" width="220" height="104" rx="8" fill="white" stroke="#bdcfd1"/><text x="710" y="269" font-size="19" fill="#183742" font-weight="600">B–C event at 6</text><text x="710" y="306" font-size="18" fill="#b3473e" font-weight="400">6 ≥ 5 · BLOCK</text><text x="30" y="268" font-size="21" fill="#b3473e" font-weight="600">Wrong check: 6 &lt; 8 passes.</text><text x="30" y="302" font-size="18" fill="#183742" font-weight="400">It answers the root’s question, not the child’s.</text><rect x="30" y="371" width="882" height="83" rx="8" fill="white" stroke="#bdcfd1"/><text x="48" y="402" font-size="21" fill="#087e82" font-weight="600">Legal dependency path:  A@8 → B@5 → D@2</text><text x="48" y="433" font-size="17" fill="#183742" font-weight="400">Log sampled event time against its own request cutoff at every hop.</text></svg>