<svg xmlns="http://www.w3.org/2000/svg" width="940" height="487" viewBox="0 0 940 487"><style>text{font-family:DejaVu Sans,sans-serif}</style><rect width="940" height="487" fill="#fafaf7"/><text x="30" y="38" font-size="25" fill="#183742" font-weight="600">Old query ≠ available training label</text><text x="30" y="68" font-size="16" fill="#63767d" font-weight="400">Horizon = 5 days • reporting delay = 2 days • model fit = day 10</text><text x="30" y="161" font-size="18" fill="#183742" font-weight="600">Query A</text><path d="M160 155L880 155" stroke="#c8d3d4" stroke-width="3" fill="none"/><rect x="280" y="145" width="300" height="20" fill="#087e82" opacity=".23"/><path d="M580 155L700 155" stroke="#087e82" stroke-width="3" fill="none" stroke-dasharray="7 5"/><circle cx="280" cy="155" r="7" fill="#087e82"/><circle cx="700" cy="155" r="7" fill="#087e82"/><text x="263" y="132" font-size="15" fill="#087e82" font-weight="400">query 2</text><text x="669" y="191" font-size="15" fill="#087e82" font-weight="400">mature 9</text><text x="30" y="266" font-size="18" fill="#183742" font-weight="600">Query B</text><path d="M160 260L880 260" stroke="#c8d3d4" stroke-width="3" fill="none"/><rect x="400" y="250" width="300" height="20" fill="#b3473e" opacity=".23"/><path d="M700 260L820 260" stroke="#b3473e" stroke-width="3" fill="none" stroke-dasharray="7 5"/><circle cx="400" cy="260" r="7" fill="#b3473e"/><circle cx="820" cy="260" r="7" fill="#b3473e"/><text x="383" y="237" font-size="15" fill="#b3473e" font-weight="400">query 4</text><text x="789" y="296" font-size="15" fill="#b3473e" font-weight="400">mature 11</text><path d="M760 93L760 312" stroke="#183742" stroke-width="3" fill="none" stroke-dasharray="7 5"/><text x="730" y="89" font-size="17" fill="#183742" font-weight="600">fit 10</text><text x="190" y="330" font-size="16" fill="#63767d" font-weight="400">Solid band: future target window. Dashes: reporting delay.</text><rect x="30" y="360" width="425" height="100" rx="8" fill="white" stroke="#bdcfd1"/><text x="48" y="394" font-size="21" fill="#087e82" font-weight="600">A: 2 &lt; 10 AND 9 ≤ 10</text><text x="48" y="430" font-size="18" fill="#183742" font-weight="400">Eligible target at fitting time</text><rect x="485" y="360" width="425" height="100" rx="8" fill="white" stroke="#bdcfd1"/><text x="503" y="394" font-size="21" fill="#b3473e" font-weight="600">B: 4 &lt; 10 BUT 11 &gt; 10</text><text x="503" y="430" font-size="18" fill="#183742" font-weight="400">Exclude until the target matures</text></svg>