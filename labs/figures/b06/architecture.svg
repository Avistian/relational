<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1510" viewBox="0 0 480 1510" role="img"><title>Mitra concept and explicit course forward pass</title><rect width="480" height="1510" rx="16" fill="#f4f7f2"/><style>text{font-family:system-ui;fill:#183c37;font-size:20px}.title{font-size:23px;font-weight:bold}.small{font-size:18px}rect.box{stroke:#a7c8bc;fill:white;stroke-width:2}.arr{stroke:#287b67;stroke-width:3}</style><text x="24" y="36" class="title">The generator shapes the learner</text><rect class="box" x="18" y="58" width="444" height="145" rx="10" style="fill:#e1f1e8"/><text x="32" y="88" class="title">1 · Choose one task generator</text><text x="32" y="117">u &lt; p → SCM task</text><text x="32" y="144">u ≥ p → tree task</text><text x="32" y="171">Choice applies to the whole table.</text><path d="M240,203 v24 m-7,-8 l7,8 l7,-8" class="arr" fill="none"/><rect class="box" x="18" y="233" width="444" height="171" rx="10" style="fill:white"/><text x="32" y="263" class="title">2 · Split the generated table</text><text x="32" y="292">24 support rows: X and known y</text><text x="32" y="319">8 query rows: X; y hidden from model</text><text x="32" y="346">Fit transforms on support only.</text><text x="32" y="373">Query y enters the loss afterward.</text><path d="M240,404 v24 m-7,-8 l7,8 l7,-8" class="arr" fill="none"/><rect class="box" x="18" y="434" width="444" height="171" rx="10" style="fill:white"/><text x="32" y="464" class="title">3 · Embed individual cells</text><text x="32" y="493">Course: 32 rows × 5 tokens × 32</text><text x="32" y="520">4 scalar features → linear projection</text><text x="32" y="547">Target → class0 / class1 / missing</text><text x="32" y="574">Query target token is “missing”.</text><path d="M240,605 v24 m-7,-8 l7,8 l7,-8" class="arr" fill="none"/><rect class="box" x="18" y="635" width="444" height="171" rx="10" style="fill:#e6edf8"/><text x="32" y="665" class="title">4 · Column attention</text><text x="32" y="694">Each row mixes its five tokens.</text><text x="32" y="721">Scores: 4 heads × 5 × 5</text><text x="32" y="748">Weighted values carry feature</text><text x="32" y="775">information into its target token.</text><path d="M240,806 v24 m-7,-8 l7,8 l7,-8" class="arr" fill="none"/><rect class="box" x="18" y="836" width="444" height="171" rx="10" style="fill:#e6edf8"/><text x="32" y="866" class="title">5 · Row attention</text><text x="32" y="895">For each column, read support rows.</text><text x="32" y="922">Scores: 4 heads × 32 × 24</text><text x="32" y="949">No query rows in keys or values.</text><text x="32" y="976">Residual + MLP; repeat blocks ×2.</text><path d="M240,1007 v24 m-7,-8 l7,8 l7,-8" class="arr" fill="none"/><rect class="box" x="18" y="1037" width="444" height="144" rx="10" style="fill:white"/><text x="32" y="1067" class="title">6 · Read query target tokens</text><text x="32" y="1096">8 query tokens → 2 logits each</text><text x="32" y="1123">Softmax → class probabilities</text><text x="32" y="1150">Cross-entropy → update in training</text><path d="M240,1181 v24 m-7,-8 l7,8 l7,-8" class="arr" fill="none"/><rect class="box" x="18" y="1211" width="444" height="144" rx="10" style="fill:#fff0d7"/><text x="32" y="1241" class="title">Inference boundary</text><text x="32" y="1270">Weights stay fixed on a new task.</text><text x="32" y="1297">Supply fresh support X,y and query X.</text><text x="32" y="1324">Fine-tuning would update weights.</text><rect class="box" x="18" y="1383" width="444" height="107" rx="10" style="fill:white"/><text x="32" y="1413" class="title">Original Mitra scope</text><text x="32" y="1442">12 blocks; width512; 4 heads.</text><text x="32" y="1469">Course sizes and generators differ.</text></svg>