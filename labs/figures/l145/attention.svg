<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="425" viewBox="0 0 1100 425" role="img"><title>Two attention domains • sampled tokens and training-time centroid state</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#506c77"/></marker></defs><rect width="1100" height="425" fill="#f4f8f7"/><text x="24" y="36" font-size="25" fill="#153342" font-family="sans-serif">Two attention domains • sampled tokens and training-time centroid state</text><rect x="25" y="75" width="510" height="150" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="39" y="102" font-size="19" fill="#197278" font-family="sans-serif">Local attention: within each sampled query</text><text x="39" y="129" font-size="15" fill="#153342" font-family="sans-serif">Q,K,V: B × 4 × 300 × 128</text><text x="39" y="153" font-size="15" fill="#153342" font-family="sans-serif">softmax(QKᵀ / √128) V</text><text x="39" y="177" font-size="15" fill="#153342" font-family="sans-serif">Products of different FK branches can interact directly.</text><text x="39" y="201" font-size="15" fill="#153342" font-family="sans-serif">This does not recover rows excluded from the sample.</text><rect x="570" y="75" width="505" height="150" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="584" y="102" font-size="19" fill="#197278" font-family="sans-serif">Global attention: learned centroid memory</text><text x="584" y="129" font-size="15" fill="#153342" font-family="sans-serif">Query: root token. Keys/values: 4096 centroids.</text><text x="584" y="153" font-size="15" fill="#153342" font-family="sans-serif">log(count) biases attention toward occupied centroids.</text><text x="584" y="177" font-size="15" fill="#153342" font-family="sans-serif">Zero-count centroids receive −∞ attention logits.</text><text x="584" y="201" font-size="15" fill="#153342" font-family="sans-serif">EMA: old state × .99 + batch contribution × .01.</text><rect x="25" y="265" width="510" height="125" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="39" y="292" font-size="19" fill="#197278" font-family="sans-serif">Training</text><text x="39" y="319" font-size="15" fill="#153342" font-family="sans-serif">Compute prediction from current centroid state.</text><text x="39" y="343" font-size="15" fill="#153342" font-family="sans-serif">Update codebook from training root features.</text><text x="39" y="367" font-size="15" fill="#153342" font-family="sans-serif">Save centroid buffers with the selected checkpoint.</text><rect x="570" y="265" width="505" height="125" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="584" y="292" font-size="19" fill="#197278" font-family="sans-serif">Evaluation</text><text x="584" y="319" font-size="15" fill="#153342" font-family="sans-serif">Freeze centroids and running normalization statistics.</text><text x="584" y="343" font-size="15" fill="#153342" font-family="sans-serif">Release still resamples structural PE and uses</text><text x="584" y="367" font-size="15" fill="#153342" font-family="sans-serif">attention dropout: eval() does not make outputs fixed.</text></svg>