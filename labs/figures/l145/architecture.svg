<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img"><title>RelGT • five row descriptions, two attention domains, one prediction</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#506c77"/></marker></defs><rect width="1100" height="790" fill="#f4f8f7"/><text x="24" y="36" font-size="25" fill="#153342" font-family="sans-serif">RelGT • five row descriptions, two attention domains, one prediction</text><rect x="25" y="62" width="1045" height="85" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="39" y="89" font-size="19" fill="#197278" font-family="sans-serif">Input query: (driver, cutoff) + foreign-key graph + row attributes</text><text x="39" y="116" font-size="15" fill="#153342" font-family="sans-serif">Sample K=300 slots including the root. Each slot belongs to one query; timestamps require an owner-cutoff audit.</text><rect x="25" y="187" width="195" height="111" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="39" y="214" font-size="19" fill="#197278" font-family="sans-serif">Table type</text><text x="39" y="241" font-size="15" fill="#153342" font-family="sans-serif">Table ID → lookup</text><text x="39" y="265" font-size="15" fill="#153342" font-family="sans-serif">B × 300 × 512</text><path d="M122,147 L122,187" stroke="#506c77" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M122,298 L122,340" stroke="#506c77" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="235" y="187" width="195" height="111" rx="12" fill="white" stroke="#bf6900" stroke-width="2"/><text x="249" y="214" font-size="19" fill="#bf6900" font-family="sans-serif">Hop distance</text><text x="249" y="241" font-size="15" fill="#153342" font-family="sans-serif">Distance → lookup</text><text x="249" y="265" font-size="15" fill="#153342" font-family="sans-serif">B × 300 × 512</text><path d="M332,147 L332,187" stroke="#506c77" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M332,298 L332,340" stroke="#506c77" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="445" y="187" width="195" height="111" rx="12" fill="white" stroke="#7d4c9e" stroke-width="2"/><text x="459" y="214" font-size="19" fill="#7d4c9e" font-family="sans-serif">Relative age</text><text x="459" y="241" font-size="15" fill="#153342" font-family="sans-serif">Age → sinusoid</text><text x="459" y="265" font-size="15" fill="#153342" font-family="sans-serif">→ linear, width 512</text><path d="M542,147 L542,187" stroke="#506c77" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M542,298 L542,340" stroke="#506c77" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="655" y="187" width="195" height="111" rx="12" fill="white" stroke="#176ca4" stroke-width="2"/><text x="669" y="214" font-size="19" fill="#176ca4" font-family="sans-serif">Row features</text><text x="669" y="241" font-size="15" fill="#153342" font-family="sans-serif">Typed columns</text><text x="669" y="265" font-size="15" fill="#153342" font-family="sans-serif">→ ResNet, width 512</text><path d="M752,147 L752,187" stroke="#506c77" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M752,298 L752,340" stroke="#506c77" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="865" y="187" width="195" height="111" rx="12" fill="white" stroke="#a34255" stroke-width="2"/><text x="879" y="214" font-size="19" fill="#a34255" font-family="sans-serif">Local structure</text><text x="879" y="241" font-size="15" fill="#153342" font-family="sans-serif">Random scalar</text><text x="879" y="265" font-size="15" fill="#153342" font-family="sans-serif">→ 4 GIN layers</text><path d="M962,147 L962,187" stroke="#506c77" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M962,298 L962,340" stroke="#506c77" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="25" y="340" width="1045" height="102" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="39" y="367" font-size="19" fill="#197278" font-family="sans-serif">Normalize each vector → concatenate → nonlinear mixer</text><text x="39" y="394" font-size="15" fill="#153342" font-family="sans-serif">[type | hop | time | row | PE]: B × 300 × 2560</text><text x="39" y="418" font-size="15" fill="#153342" font-family="sans-serif">Linear(2560,1024) → ReLU → Linear(1024,512). Root token is slot 0.</text><rect x="25" y="490" width="500" height="113" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="39" y="517" font-size="19" fill="#197278" font-family="sans-serif">Local: all 300 × 300 token pairs</text><text x="39" y="544" font-size="15" fill="#153342" font-family="sans-serif">L Transformer layers, 4 heads, 128 coordinates/head</text><text x="39" y="568" font-size="15" fill="#153342" font-family="sans-serif">Readout = root + weighted neighbor sum → B × 512</text><rect x="570" y="490" width="500" height="113" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="584" y="517" font-size="19" fill="#197278" font-family="sans-serif">Global: root → 4096 centroids</text><text x="584" y="544" font-size="15" fill="#153342" font-family="sans-serif">QKᵀ / √512 + log(occupancy) → softmax → values</text><text x="584" y="568" font-size="15" fill="#153342" font-family="sans-serif">EMA buffers update in training only → B × 512</text><path d="M270,442 L270,490" stroke="#506c77" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M820,442 L820,490" stroke="#506c77" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="25" y="657" width="1045" height="103" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="39" y="684" font-size="19" fill="#197278" font-family="sans-serif">Prediction: concatenate local and global → task head</text><text x="39" y="711" font-size="15" fill="#153342" font-family="sans-serif">B × 1024 → FFN → B × 512 → scalar finishing position</text><text x="39" y="735" font-size="15" fill="#153342" font-family="sans-serif">Train: mean absolute error. Evaluate: train-percentile clipping; source attention and PE remain stochastic.</text><path d="M270,603 L270,657" stroke="#506c77" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M820,603 L820,657" stroke="#506c77" stroke-width="2" fill="none" marker-end="url(#a)"/></svg>