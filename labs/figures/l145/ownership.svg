<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="425" viewBox="0 0 1100 425" role="img"><title>Temporal ownership • audit the raw timestamp, not the cached age</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#506c77"/></marker></defs><rect width="1100" height="425" fill="#f4f8f7"/><text x="24" y="36" font-size="25" fill="#153342" font-family="sans-serif">Temporal ownership • audit the raw timestamp, not the cached age</text><rect x="25" y="75" width="315" height="150" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="39" y="102" font-size="19" fill="#197278" font-family="sans-serif">Two requested queries</text><text x="39" y="129" font-size="15" fill="#153342" font-family="sans-serif">(driver 7, cutoff 5)</text><text x="39" y="153" font-size="15" fill="#153342" font-family="sans-serif">(driver 7, cutoff 10)</text><text x="39" y="177" font-size="15" fill="#153342" font-family="sans-serif">Event times: 4 and 9.</text><rect x="388" y="75" width="320" height="150" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="402" y="102" font-size="19" fill="#197278" font-family="sans-serif">Released cache key: driver 7</text><text x="402" y="129" font-size="15" fill="#153342" font-family="sans-serif">Second query replaces first.</text><text x="402" y="153" font-size="15" fill="#153342" font-family="sans-serif">Both rows receive the time-10 tokens.</text><text x="402" y="177" font-size="15" fill="#153342" font-family="sans-serif">Age(9) = 10 − 9 = 1.</text><rect x="756" y="75" width="315" height="150" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="770" y="102" font-size="19" fill="#197278" font-family="sans-serif">Independent audit</text><text x="770" y="129" font-size="15" fill="#153342" font-family="sans-serif">For cutoff 5: event 9 is FUTURE.</text><text x="770" y="153" font-size="15" fill="#153342" font-family="sans-serif">Positive cached age conceals it.</text><text x="770" y="177" font-size="15" fill="#153342" font-family="sans-serif">Check actual event time ≤ owner cutoff.</text><path d="M340,145 L386,145" stroke="#506c77" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M709,145 L754,145" stroke="#506c77" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="32" y="275" font-size="23" fill="#153342" font-family="sans-serif">A time encoder describes a token. It does not authorize access to that token.</text><rect x="30" y="310" width="1040" height="85" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="44" y="337" font-size="19" fill="#197278" font-family="sans-serif">The safe cache identity</text><text x="44" y="364" font-size="15" fill="#153342" font-family="sans-serif">(entity ID, cutoff, sampler configuration, graph fingerprint). A repaired cache is a different experiment.</text></svg>