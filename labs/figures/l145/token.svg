<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img"><title>Five elements • distinguish concatenation from addition</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#506c77"/></marker></defs><rect width="1100" height="430" fill="#f4f8f7"/><text x="24" y="36" font-size="25" fill="#153342" font-family="sans-serif">Five elements • distinguish concatenation from addition</text><rect x="24" y="75" width="195" height="106" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="38" y="102" font-size="19" fill="#197278" font-family="sans-serif">type</text><text x="38" y="129" font-size="15" fill="#153342" font-family="sans-serif">illustrative scalar: 1</text><text x="38" y="153" font-size="15" fill="#153342" font-family="sans-serif">one slot, d=1</text><rect x="234" y="75" width="195" height="106" rx="12" fill="white" stroke="#bf6900" stroke-width="2"/><text x="248" y="102" font-size="19" fill="#bf6900" font-family="sans-serif">hop</text><text x="248" y="129" font-size="15" fill="#153342" font-family="sans-serif">illustrative scalar: 2</text><text x="248" y="153" font-size="15" fill="#153342" font-family="sans-serif">one slot, d=1</text><rect x="444" y="75" width="195" height="106" rx="12" fill="white" stroke="#7d4c9e" stroke-width="2"/><text x="458" y="102" font-size="19" fill="#7d4c9e" font-family="sans-serif">time</text><text x="458" y="129" font-size="15" fill="#153342" font-family="sans-serif">illustrative scalar: 3</text><text x="458" y="153" font-size="15" fill="#153342" font-family="sans-serif">one slot, d=1</text><rect x="654" y="75" width="195" height="106" rx="12" fill="white" stroke="#176ca4" stroke-width="2"/><text x="668" y="102" font-size="19" fill="#176ca4" font-family="sans-serif">features</text><text x="668" y="129" font-size="15" fill="#153342" font-family="sans-serif">illustrative scalar: 4</text><text x="668" y="153" font-size="15" fill="#153342" font-family="sans-serif">one slot, d=1</text><rect x="864" y="75" width="195" height="106" rx="12" fill="white" stroke="#a34255" stroke-width="2"/><text x="878" y="102" font-size="19" fill="#a34255" font-family="sans-serif">structure</text><text x="878" y="129" font-size="15" fill="#153342" font-family="sans-serif">illustrative scalar: 5</text><text x="878" y="153" font-size="15" fill="#153342" font-family="sans-serif">one slot, d=1</text><text x="30" y="225" font-size="21" fill="#153342" font-family="sans-serif">Concatenate: [1 | 2 | 3 | 4 | 5]  — information stays in distinct coordinates.</text><rect x="30" y="267" width="500" height="130" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="44" y="294" font-size="19" fill="#197278" font-family="sans-serif">A deliberately simple linear mixer</text><text x="44" y="321" font-size="15" fill="#153342" font-family="sans-serif">Weights [1, 0, 0, 2, −1]</text><text x="44" y="345" font-size="15" fill="#153342" font-family="sans-serif">1×1 + 0×2 + 0×3 + 2×4 − 1×5 = 4</text><text x="44" y="369" font-size="15" fill="#153342" font-family="sans-serif">Remove structure (set to zero): output becomes 9.</text><rect x="562" y="267" width="507" height="130" rx="12" fill="white" stroke="#197278" stroke-width="2"/><text x="576" y="294" font-size="19" fill="#197278" font-family="sans-serif">What stays fixed?</text><text x="576" y="321" font-size="15" fill="#153342" font-family="sans-serif">All other inputs and projection weights.</text><text x="576" y="345" font-size="15" fill="#153342" font-family="sans-serif">Released model uses five 512-vectors, normalization,</text><text x="576" y="369" font-size="15" fill="#153342" font-family="sans-serif">then Linear(2560,1024) → ReLU → Linear(1024,512).</text></svg>