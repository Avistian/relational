#cbe5dd" stroke="#cbd7da"/><text x="985" y="312" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#18354a" font-weight="normal" text-anchor="middle">11</text><text x="205" y="352" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#526674" font-weight="normal" text-anchor="start">Each subset is [B, 7]. Column positions stay fixed; no mixing of different rows.</text><rect x="30" y="375" width="1140" height="370" rx="12" fill="#fffdf8" stroke="#cbd7da"/><text x="50" y="407" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#007f78" font-weight="bold" text-anchor="start">02  SHARED computation · three views of the SAME batch</text><text x="53" y="460" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#007f78" font-weight="bold" text-anchor="start">view 1</text><text x="53" y="487" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#526674" font-weight="normal" text-anchor="start">+ train noise</text><path d="M171,463 L211,463" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="216" y="434" width="211" height="67" rx="12" fill="#e6f2ef" stroke="#cbd7da"/><text x="321" y="460" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="middle">E: 7 → 64 → 64</text><text x="321" y="485" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#18354a" font-weight="normal" text-anchor="middle">h1 [B,64]</text><path d="M431,449 L493,442" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="498" y="419" width="221" height="42" rx="12" fill="#e9edf8" stroke="#cbd7da"/><text x="608" y="447" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#18354a" font-weight="normal" text-anchor="middle">G → z [B,32], norm</text><path d="M431,483 L493,496" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="498" y="469" width="221" height="42" rx="12" fill="#fff0df" stroke="#cbd7da"/><text x="608" y="497" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#18354a" font-weight="normal" text-anchor="middle">D → full row [B,12]</text><path d="M724,489 L783,489" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M724,441 L783,441" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="53" y="558" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#007f78" font-weight="bold" text-anchor="start">view 2</text><text x="53" y="585" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#526674" font-weight="normal" text-anchor="start">+ train noise</text><path d="M171,561 L211,561" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="216" y="532" width="211" height="67" rx="12" fill="#e6f2ef" stroke="#cbd7da"/><text x="321" y="558" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="middle">E: 7 → 64 → 64</text><text x="321" y="583" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#18354a" font-weight="normal" text-anchor="middle">h2 [B,64]</text><path d="M431,547 L493,540" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="498" y="517" width="221" height="42" rx="12" fill="#e9edf8" stroke="#cbd7da"/><text x="608" y="545" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#18354a" font-weight="normal" text-anchor="middle">G → z [B,32], norm</text><path d="M431,581 L493,594" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="498" y="567" width="221" height="42" rx="12" fill="#fff0df" stroke="#cbd7da"/><text x="608" y="595" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#18354a" font-weight="normal" text-anchor="middle">D → full row [B,12]</text><path d="M724,587 L783,587" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M724,539 L783,539" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="53" y="656" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#007f78" font-weight="bold" text-anchor="start">view 3</text><text x="53" y="683" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#526674" font-weight="normal" text-anchor="start">+ train noise</text><path d="M171,659 L211,659" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="216" y="630" width="211" height="67" rx="12" fill="#e6f2ef" stroke="#cbd7da"/><text x="321" y="656" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="middle">E: 7 → 64 → 64</text><text x="321" y="681" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#18354a" font-weight="normal" text-anchor="middle">h3 [B,64]</text><path d="M431,645 L493,638" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="498" y="615" width="221" height="42" rx="12" fill="#e9edf8" stroke="#cbd7da"/><text x="608" y="643" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#18354a" font-weight="normal" text-anchor="middle">G → z [B,32], norm</text><path d="M431,679 L493,692" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="498" y="665" width="221" height="42" rx="12" fill="#fff0df" stroke="#cbd7da"/><text x="608" y="693" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#18354a" font-weight="normal" text-anchor="middle">D → full row [B,12]</text><path d="M724,685 L783,685" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M724,637 L783,637" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="791" y="425" width="355" height="283" rx="12" fill="#fff" stroke="#cbd7da"/><text x="810" y="456" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#18354a" font-weight="bold" text-anchor="start">One objective, three jobs</text><text x="810" y="495" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#ba4d26" font-weight="bold" text-anchor="start">Reconstruct every original column</text><text x="810" y="520" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#526674" font-weight="normal" text-anchor="start">including columns absent from the view</text><text x="810" y="560" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#007f78" font-weight="bold" text-anchor="start">Compare pairs: (1,2), (1,3), (2,3)</text><text x="810" y="585" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#18354a" font-weight="normal" text-anchor="start">2B × 2B NT-Xent; self excluded</text><text x="810" y="625" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#18354a" font-weight="bold" text-anchor="start">Bring same-row projections closer</text><text x="810" y="650" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#18354a" font-weight="normal" text-anchor="start">Squared distance; average over pairs</text><text x="810" y="688" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#007f78" font-weight="normal" text-anchor="start">Gradients reach E, G and D.</text><text x="53" y="731" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526674" font-weight="normal" text-anchor="start">E, G and D are each reused across subsets. E uses LeakyReLU; final latent layer is linear.</text><rect x="30" y="766" width="1140" height="171" rx="12" fill="#e6f2ef" stroke="#cbd7da"/><text x="50" y="796" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#007f78" font-weight="bold" text-anchor="start">03  INFERENCE · same windows, no noise; discard D and G</text><text x="53" y="840" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#18354a" font-weight="bold" text-anchor="start">h₁, h₂, h₃</text><text x="53" y="867" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#18354a" font-weight="normal" text-anchor="start">each [B,64]</text><path d="M220,847 L272,847" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="278" y="816" width="278" height="68" rx="12" fill="#ffffff" stroke="#cbd7da"/><text x="417" y="842" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#007f78" font-weight="bold" text-anchor="middle">mean over VIEWS</text><text x="417" y="870" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18354a" font-weight="normal" text-anchor="middle">h̄ = (h₁ + h₂ + h₃) / 3</text><path d="M562,847 L612,847" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="618" y="816" width="273" height="68" rx="12" fill="#ffffff" stroke="#cbd7da"/><text x="754" y="842" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#18354a" font-weight="normal" text-anchor="middle">frozen linear probe</text><text x="754" y="870" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#18354a" font-weight="normal" text-anchor="middle">h̄ [B,64] → logits [B,C]</text><path d="M897,847 L947,847" stroke="#007f78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="961" y="843" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#18354a" font-weight="bold" text-anchor="start">softmax</text><text x="961" y="870" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#18354a" font-weight="normal" text-anchor="start">prediction</text><text x="52" y="918" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526674" font-weight="normal" text-anchor="start">Example: h₁=(1,3), h₂=(5,7), h₃=(3,2) → h̄=(3,4). Rows never average into each other.</text></svg>