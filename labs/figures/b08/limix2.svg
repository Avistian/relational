<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1060" viewBox="0 0 440 1060" role="img"><title>LimiX-2 · separate pathways</title><rect width="440" height="1060" rx="16" fill="#f2f5f1"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#173e36;font-size:18px}.title{font-size:21px;font-weight:bold}.arrow{stroke:#397761;stroke-width:2;fill:none}</style><text x="18" y="32" class="title">LimiX-2 · separate pathways</text><rect x="18" y="54" width="404" height="152" rx="9" fill="#ffffff" stroke="#b5cbc1"/><text x="30" y="83" class="title">1  Encode the observed table</text><text x="30" y="110">Feature cells: N × F × 256</text><text x="30" y="135">Task slots: N × 4 × 256</text><text x="30" y="160">Query targets replaced by MASK</text><text x="30" y="185">Missing X + column code retained</text><path class="arrow" d="M220 209 v23 m-6 -7 l6 7 l6 -7"/><rect x="18" y="238" width="404" height="152" rx="9" fill="#dcece4" stroke="#b5cbc1"/><text x="30" y="267" class="title">2  Attend across rows</text><text x="30" y="294">X: each column attends over rows</text><text x="30" y="319">Y: join 4 slots → width 1024</text><text x="30" y="344">Both read support keys only</text><text x="30" y="369">Residual preserves own query X</text><path class="arrow" d="M220 393 v23 m-6 -7 l6 7 l6 -7"/><rect x="18" y="422" width="404" height="127" rx="9" fill="#ffffff" stroke="#b5cbc1"/><text x="30" y="451" class="title">3  Gate each pathway</text><text x="30" y="478">Independent feature / task SwiGLU</text><text x="30" y="503">gate = SiLU(Wg z + bg)</text><text x="30" y="528">output = Wo(gate ⊙ (Wv z + bv))</text><path class="arrow" d="M220 552 v23 m-6 -7 l6 7 l6 -7"/><rect x="18" y="581" width="404" height="152" rx="9" fill="#dcece4" stroke="#b5cbc1"/><text x="30" y="610" class="title">4  Attend within each row</text><text x="30" y="637">Feature queries → X and task slots</text><text x="30" y="662">Task queries → X only</text><text x="30" y="687">Separate feature / task projections</text><text x="30" y="712">Repeat steps 2–4 across 24 blocks</text><path class="arrow" d="M220 736 v23 m-6 -7 l6 7 l6 -7"/><rect x="18" y="765" width="404" height="127" rx="9" fill="#ffffff" stroke="#b5cbc1"/><text x="30" y="794" class="title">5  Read out at two depths</text><text x="30" y="821">Shallow X → adapter → reconstruct</text><text x="30" y="846">Final task slots → adapter → target</text><text x="30" y="871">Class logits or 5000 regression bins</text><path class="arrow" d="M220 895 v23 m-6 -7 l6 7 l6 -7"/><rect x="18" y="924" width="404" height="102" rx="9" fill="#e8eafa" stroke="#b5cbc1"/><text x="30" y="953" class="title">Course mechanism differs</text><text x="30" y="980">2 blocks, width 16, scalar MSE heads</text><text x="30" y="1005">Same access rules; no weight parity</text></svg>