   <g id="text_1">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193248" x="29.52" y="32.148" transform="rotate(-0 29.52 32.148)">Heterogeneous mini-batching: a query defines its computation</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193248" x="37.89" y="87.588" transform="rotate(-0 37.89 87.588)">1  Typed database</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(37.89 122.017828)">customer [24,4] · static</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(37.89 139.617828)">orders [144,4] · time 1…6</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(37.89 156.799313)">product [12,4] · static</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193248" x="294.57" y="87.588" transform="rotate(-0 294.57 87.588)">2  Query / legal inputs</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(294.57 122.103766)">4 customer seeds; cutoff = 5</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(294.57 139.199313)">Filter forward + reverse edges</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(294.57 157.864937)">Labels remain outside features</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193248" x="556.83" y="87.588" transform="rotate(-0 556.83 87.588)">3  Incoming dependencies</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(556.83 121.599312)">Hop 1: customer ← orders</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(556.83 139.199313)">Hop 2: orders ← product / customer</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(556.83 156.799313)">Fanout: per relation, per hop</text>
   </g>
