    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193248" x="37.89" y="240.048" transform="rotate(-0 37.89 240.048)">4  Batch-local tensors</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(37.89 273.906344)">x_dict: [N_type,4]</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(37.89 291.506344)">edge_index_dict: [2,E_relation]</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(37.89 309.106344)">n_id: local → typed global ID</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(37.89 326.706344)">e_id: original relation-edge ID</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193248" x="294.57" y="240.048" transform="rotate(-0 294.57 240.048)">5  Shared typed encoder</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(294.57 273.890016)">Layer 1: means + root → ReLU</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(294.57 291.562203)">Layer 2: means + root → ReLU</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(294.57 310.324937)">Widths: 4 → 16 → 16</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(294.57 326.706344)">Customer head → [N_customer]</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193248" x="556.83" y="240.048" transform="rotate(-0 556.83 240.048)">6  Seeds own the loss</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(556.83 274.059312)">First B customer logits → BCE</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(556.83 291.659312)">Only seed labels → objective</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(556.83 309.259312)">Backward + Adam update</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(556.83 326.859312)">Context supplies messages</text>
   </g>
