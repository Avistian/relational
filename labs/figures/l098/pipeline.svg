   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(37.89 448.695312)">All neighbors: logits + gradients ≈ dense oracle</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(37.89 466.295313)">Same customer, two cutoffs: two disjoint query histories</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193248" x="414.54" y="414.684" transform="rotate(-0 414.54 414.684)">INFERENCE · freeze the selected checkpoint</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(414.54 448.695312)">Full legal context → validation / test predictions</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(414.54 466.295313)">Training fanout varies; evaluation stays fixed</text>
   </g>
