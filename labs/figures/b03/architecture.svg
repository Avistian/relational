<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1210" viewBox="0 0 500 1210"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52716e"/></marker></defs><rect width="500" height="1210" rx="18" fill="#f3f6f1"/><text x="250" y="34" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="600" fill="#183d38">ONE TABLE, TWO TIMESCALES</text><rect x="22" y="53" width="456" height="131" rx="12" fill="#e5eadf" stroke="#b1c5b8"/><text x="250" y="83" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="600" fill="#183d38">Before your task · pretraining</text><text x="250" y="111" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">Synthetic tasks → support / query episodes</text><text x="250" y="135" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">Query prediction loss updates θ</text><text x="250" y="159" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">NOT RUN in B03</text><path d="M250 185V212" stroke="#52716e" stroke-width="2" marker-end="url(#arrow)"/><text x="250" y="236" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="600" fill="#183d38">Freeze θ. Now supply your table.</text><rect x="22" y="258" width="456" height="108" rx="12" fill="#fff" stroke="#b1c5b8"/><text x="250" y="288" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="600" fill="#183d38">Support and query inputs</text><text x="250" y="316" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">Support: Xₛ + yₛ   |   Query: Xq only</text><text x="250" y="340" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">No query target enters the model.</text><path d="M250 368V390" stroke="#52716e" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="400" width="456" height="108" rx="12" fill="#fff" stroke="#b1c5b8"/><text x="250" y="430" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="600" fill="#183d38">Historical v2 wrapper · four views</text><text x="250" y="458" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">Fit transforms; permute features / classes</text><text x="250" y="482" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">Track each view and each label meaning.</text><path d="M250 509V531" stroke="#52716e" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="541" width="456" height="108" rx="12" fill="#fff" stroke="#b1c5b8"/><text x="250" y="571" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="600" fill="#183d38">Cell groups + target token</text><text x="250" y="599" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">Pairs of features; missingness indicators</text><text x="250" y="623" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">(S + Q) × (ceil(F / 2) + 1) × 192</text><path d="M250 650V672" stroke="#52716e" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="682" width="456" height="182" rx="12" fill="#dcece6" stroke="#548874"/><text x="250" y="712" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="600" fill="#183d38">12 alternating-attention blocks</text><text x="250" y="740" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">Feature attention → mix within each row</text><text x="250" y="764" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">Row attention → read support keys / values</text><text x="250" y="788" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">Feed-forward + residual normalization</text><text x="250" y="812" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">6 heads × 32 coordinates</text><path d="M250 865V887" stroke="#52716e" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="897" width="456" height="108" rx="12" fill="#fff" stroke="#b1c5b8"/><text x="250" y="927" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="600" fill="#183d38">Read the query target tokens</text><text x="250" y="955" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">Classifier head → temperature → probabilities</text><text x="250" y="979" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">Restore class columns for every view.</text><path d="M250 1006V1028" stroke="#52716e" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="1038" width="456" height="108" rx="12" fill="#f1e8d4" stroke="#beaa77"/><text x="250" y="1068" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="600" fill="#183d38">Average aligned view probabilities</text><text x="250" y="1096" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">Q × C predictions → independent scoring</text><text x="250" y="1120" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#183d38">Same weights; different context / computation.</text><text x="250" y="1180" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#183d38">B03: pinned v2 diagnostic ≠ paper benchmark</text></svg>