   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="40.3452" y="501.343444" transform="rotate(-0 40.3452 501.343444)">4  Learn the mixture; predict finishing position</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(40.3452 523.685662)">Release: sigmoid(w) h_GNN + (1 - sigmoid(w)) h_attention</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(40.3452 540.338631)">Two-layer prediction head → one value per complete query key</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(32.31 571.514711)">Release: one outer hybrid block; configurable attention depth.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(32.31 584.717719)">Paper lists four model layers. That discrepancy remains unresolved.</text>
   </g>
