L 255.9 154.097301 
" style="fill: none; stroke: #334455; stroke-width: 1.8; stroke-linecap: round"/>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="40.3452" y="193.882444" transform="rotate(-0 40.3452 193.882444)">2  Encode, then choose</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(40.3452 216.377631)">Type + hop + age + table fields + structural position</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(40.3452 233.296147)">Five normalized channels → concatenate → MLP → H [B, K, 512]</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(40.3452 249.377631)">Preserve nearby nodes; score distant nodes with H[j] · H[seed]</text>
   </g>
