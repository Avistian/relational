   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start" x="22.266" y="23.156719" transform="rotate(-0 22.266 23.156719)">GelGT · a query becomes a prediction</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="22.266" y="51.107719" transform="rotate(-0 22.266 51.107719)">Paper / released architecture overview · no full model trained here</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="40.3452" y="102.406444" transform="rotate(-0 40.3452 102.406444)">1  Query + database</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(40.3452 124.901631)">(driver, cutoff) → PK/FK graph → legal two-hop candidates</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(40.3452 141.401631)">Published regression budget: 500 candidates → 300 retained tokens</text>
   </g>
   <g id="patch_7">
    <path d="M 258.3 149.664523 
Q 258.3 155.287143 258.3 158.897301 
" style="fill: none; stroke: #334455; stroke-width: 1.8; stroke-linecap: round"/>
    <path d="M 260.7 154.097301 
