   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="40.3452" y="300.604444" transform="rotate(-0 40.3452 300.604444)">3a  Local topology</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(40.3452 323.099631)">Induced edges + node states</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(40.3452 339.599631)">3 × GraphSAGE</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(40.3452 357.165256)">Normalize → GELU → residual</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(40.3452 372.599631)">Read query node</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(40.3452 386.064319)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(40.3452 405.446662)">h_GNN [B, 512]</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="278.8902" y="300.604444" transform="rotate(-0 278.8902 300.604444)">3b  Temporal attention</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(278.8902 323.518147)">Q, K, V [B, heads, K, 128]</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(278.8902 339.599631)">lag → exp(-((lag-μ)/σ)²)</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(278.8902 356.099631)">Learned projection → bias</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(278.8902 373.300022)">softmax(QKᵀ/√128 + bias)V</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(278.8902 389.099631)">Query + weighted neighbors</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(278.8902 405.446662)">h_attention [B, 512]</text>
   </g>
