    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #20394b" x="15.57" y="29.376" transform="rotate(-0 15.57 29.376)">HGSampling · normalize locally, budget by type</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566775" x="15.57" y="51.552" transform="rotate(-0 15.57 51.552)">Illustrative budget update with no pre-sampling cap: two selected papers share author b</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f86" x="30.636" y="105.8832" transform="rotate(-0 30.636 105.8832)">EXPAND TWO PAPERS</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #20394b" transform="translate(30.636 133.246112)">p₀ has authors {a, b}: +1/2</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #20394b" transform="translate(30.636 149.746112)">p₁ has authors {b, c}: +1/2</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #20394b" transform="translate(30.636 167.311737)">Both contributions reach b</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a87319" x="256.626" y="105.8832" transform="rotate(-0 256.626 105.8832)">AUTHOR BUDGET</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #20394b" transform="translate(256.626 133.664628)">B(a,b,c) = [.5, 1, .5]</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #20394b" transform="translate(256.626 149.746112)">Square = [.25, 1, .25]</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #20394b" transform="translate(256.626 166.664628)">P(a,b,c) = [1/6, 2/3, 1/6]</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b54c32" x="493.776" y="105.8832" transform="rotate(-0 493.776 105.8832)">SAMPLE + RECONSTRUCT</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #20394b" transform="translate(493.776 133.246112)">Draw within each node type</text>
