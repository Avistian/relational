   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #20394b" x="23.94" y="270.54" transform="rotate(-0 23.94 270.54)">Uniform author sampling gives [1/3,1/3,1/3]. HGSampling favors the shared, densely connected author.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #20394b" x="23.94" y="303.804" transform="rotate(-0 23.94 303.804)">Types have separate quotas. A million paper candidates do not consume the author quota.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #20394b" x="23.94" y="337.068" transform="rotate(-0 23.94 337.068)">Release detail: cap each expanded relation neighborhood before adding its normalized budget.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b54c32" x="23.94" y="370.332" transform="rotate(-0 23.94 370.332)">Timestamp detail: untimed neighbors inherit context; induced-edge reconstruction needs a separate audit.</text>
