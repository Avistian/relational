   <g id="text_8">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f8c" x="488.196" y="104.22" transform="rotate(-0 488.196 104.22)">COLLAPSE ENDPOINTS</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(488.196 135.362203)">p0 → a0 → p1</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(488.196 152.962203)">p0 → a1 → p1</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(488.196 167.624)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(488.196 189.324937)">Walk count: 2</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(488.196 205.859312)">Binary endpoint edge: 1</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(488.196 223.459312)">Sender p1 contributes once</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193248" x="23.94" y="353.7" transform="rotate(-0 23.94 353.7)">Self is reachable: p0 → a0 → p0. All three papers share a1 in the matrix example.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193248" x="23.94" y="378.648" transform="rotate(-0 23.94 378.648)">Remove p2–a1: its off-diagonal neighbors disappear. Add another shared author: no new endpoint.</text>
   </g>
