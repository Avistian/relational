   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193248" x="18.36" y="26.604" transform="rotate(-0 18.36 26.604)">PAP · two walks can still mean one neighbor</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526776" x="18.36" y="51.552" transform="rotate(-0 18.36 51.552)">Worked construction · endpoint adjacency retains reachability, not the number of shared authors</text>
   </g>
