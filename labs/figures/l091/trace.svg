   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536b77" x="21.15" y="46.008" transform="rotate(-0 21.15 46.008)">Scalar fixture; messages travel into T. Features, weights and self path are held fixed.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f8c" x="32.868" y="92.5776" transform="rotate(-0 32.868 92.5776)">BUYS · teal</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183447" transform="translate(32.868 125.887456)">A = 2, C = 8</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183447" transform="translate(32.868 143.492612)">Mean = (2 + 8) / 2 = 5</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183447" transform="translate(32.868 160.680112)">Weight 2 → contribution 10</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a34430" x="253.278" y="92.5776" transform="rotate(-0 253.278 92.5776)">RETURNS · rust</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183447" transform="translate(253.278 126.448628)">C = 8</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183447" transform="translate(253.278 143.616362)">Mean = 8 / 1 = 8</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #183447" transform="translate(253.278 160.680112)">Weight −1 → contribution −8</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c89025" x="473.688" y="92.5776" transform="rotate(-0 473.688 92.5776)">SELF · gold</text>
   </g>
