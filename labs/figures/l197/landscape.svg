<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc"><title id="title">Three routes from relational information to a prediction</title><desc id="desc">Graph-native processing uses linked rows. Synthetic-prior RDB-PFN uses generated relational tasks and DFS features. RDBLearn reuses a pretrained tabular predictor on relational summaries. All routes obey query-time information limits.</desc><rect width="960" height="790" rx="22" fill="#f1f7f5"/><style>text{font-family:Arial,sans-serif;fill:#183e47}.title{font-size:27px;font-weight:700}.label{font-size:20px;font-weight:700}.small{font-size:17px}.box{fill:white;stroke:#91b8b2;stroke-width:1.5}</style><text x="35" y="47" class="title">ONE QUERY · THREE DESIGN STRATEGIES</text><text x="35" y="79" class="small">Ada at day 30: known support labels + eligible history → hidden query prediction</text><rect x="24" y="115" width="912" height="176" rx="14" fill="#d7ebe7"/><text x="44" y="148" class="label">01 · Graph-native learning</text><rect x="44" y="168" width="205" height="57" rx="9" class="box"/><text x="146" y="202" text-anchor="middle" class="small">Eligible linked rows</text><path d="M251 195h10m-5 -5l5 5l-5 5" stroke="#35655e" fill="none" stroke-width="2"/><rect x="264" y="168" width="205" height="57" rx="9" class="box"/><text x="366" y="202" text-anchor="middle" class="small">Row / cell encoder</text><path d="M471 195h10m-5 -5l5 5l-5 5" stroke="#35655e" fill="none" stroke-width="2"/><rect x="484" y="168" width="205" height="57" rx="9" class="box"/><text x="586" y="202" text-anchor="middle" class="small">Graph mixing</text><path d="M691 195h10m-5 -5l5 5l-5 5" stroke="#35655e" fill="none" stroke-width="2"/><rect x="704" y="168" width="205" height="57" rx="9" class="box"/><text x="806" y="202" text-anchor="middle" class="small">Task prediction</text><text x="44" y="261" class="small">Griffin: pretrain → fine-tune. Relational ICL: support conditions frozen prediction.</text><rect x="24" y="310" width="912" height="176" rx="14" fill="#e4e5f3"/><text x="44" y="343" class="label">02 · Synthetic relational prior</text><rect x="44" y="363" width="205" height="57" rx="9" class="box"/><text x="146" y="397" text-anchor="middle" class="small">Generated DB tasks</text><path d="M251 390h10m-5 -5l5 5l-5 5" stroke="#35655e" fill="none" stroke-width="2"/><rect x="264" y="363" width="205" height="57" rx="9" class="box"/><text x="366" y="397" text-anchor="middle" class="small">DFS linearization</text><path d="M471 390h10m-5 -5l5 5l-5 5" stroke="#35655e" fill="none" stroke-width="2"/><rect x="484" y="363" width="205" height="57" rx="9" class="box"/><text x="586" y="397" text-anchor="middle" class="small">Pretrain predictor</text><path d="M691 390h10m-5 -5l5 5l-5 5" stroke="#35655e" fill="none" stroke-width="2"/><rect x="704" y="363" width="205" height="57" rx="9" class="box"/><text x="806" y="397" text-anchor="middle" class="small">New-task ICL</text><text x="44" y="456" class="small">RDB-PFN: relational structure shapes synthetic experience; inference uses feature rows.</text><rect x="24" y="505" width="912" height="176" rx="14" fill="#f1e6d8"/><text x="44" y="538" class="label">03 · Reuse a tabular foundation model</text><rect x="44" y="558" width="205" height="57" rx="9" class="box"/><text x="146" y="592" text-anchor="middle" class="small">Eligible linked rows</text><path d="M251 585h10m-5 -5l5 5l-5 5" stroke="#35655e" fill="none" stroke-width="2"/><rect x="264" y="558" width="205" height="57" rx="9" class="box"/><text x="366" y="592" text-anchor="middle" class="small">Relational summaries</text><path d="M471 585h10m-5 -5l5 5l-5 5" stroke="#35655e" fill="none" stroke-width="2"/><rect x="484" y="558" width="205" height="57" rx="9" class="box"/><text x="586" y="592" text-anchor="middle" class="small">Pretrained backend</text><path d="M691 585h10m-5 -5l5 5l-5 5" stroke="#35655e" fill="none" stroke-width="2"/><rect x="704" y="558" width="205" height="57" rx="9" class="box"/><text x="806" y="592" text-anchor="middle" class="small">New-task ICL</text><text x="44" y="651" class="small">RDBLearn: reuse earlier tabular pretraining; no new relational pretraining.</text><text x="35" y="725" class="label">Keep three questions separate</text><text x="35" y="757" class="small">Representation: what is seen? · Prior: what was learned? · Adaptation: what changes?</text></svg>