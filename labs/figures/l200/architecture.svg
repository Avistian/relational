<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1130" viewBox="0 0 440 1130" role="img" aria-labelledby="t d"><title id="t">RDB-PFN released base checkpoint</title><desc id="d">Support features and labels plus query features enter feature and target encoders. Six blocks mix features then read support rows only. Query target tokens produce two logits. The attention mask has support columns visible and query columns hidden.</desc><rect width="440" height="1130" rx="18" fill="#edf4ef"/><style>text{font-family:Arial,sans-serif;fill:#183f33;font-size:17px}.h{font-size:23px;font-weight:bold}.b{font-size:18px;font-weight:bold}.small{font-size:15px}.card{fill:white;stroke:#9fbcad;stroke-width:1.5}.arrow{stroke:#347863;stroke-width:2.5;fill:none}</style><text x="22" y="36" class="h">RDB-PFN · inference path</text><text x="22" y="63">Released base: 6 blocks · width 96</text>
<rect x="20" y="85" width="400" height="115" rx="10" class="card"/><text x="35" y="113" class="b">512 support + 702 query rows</text><text x="35" y="140">Same numeric DFS features in all arms</text><text x="35" y="166">Support labels observed; query labels hidden</text><text x="35" y="189" class="small">Prior learned before this task; weights fixed here</text>
<path class="arrow" d="M220 202v23m-6 -6l6 6 6-6"/>
<rect x="20" y="231" width="400" height="122" rx="10" class="card"/><text x="35" y="260" class="b">Encode features + target token</text><text x="35" y="286">Support statistics → scalar projection</text><text x="35" y="312">Query target input = mean(support labels)</text><text x="35" y="339" class="small">B × 1214 × (F + 1) × 96</text>
<path class="arrow" d="M220 355v23m-6 -6l6 6 6-6"/>
<rect x="20" y="384" width="400" height="440" rx="10" fill="#d9ebe1" stroke="#578b72" stroke-width="2"/><text x="35" y="415" class="b">Repeat six times</text>
<rect x="35" y="432" width="370" height="75" rx="8" class="card"/><text x="48" y="460" class="b">1 · Mix features within each row</text><text x="48" y="488">4 heads × 24 coordinates</text>
<text x="35" y="539" class="b">2 · Each row reads support only</text>
<text x="180" y="568" class="small">keys / values →</text><text x="181" y="592" class="small">S1</text><text x="230" y="592" class="small">S2</text><text x="279" y="592" class="small">Q1</text><text x="328" y="592" class="small">Q2</text>
<text x="131" y="621" class="small">S1</text><rect x="175" y="603" width="40" height="22" rx="3" fill="#32745e" stroke="#9fbcad"/><rect x="224" y="603" width="40" height="22" rx="3" fill="#32745e" stroke="#9fbcad"/><rect x="273" y="603" width="40" height="22" rx="3" fill="#f8faf8" stroke="#9fbcad"/><rect x="322" y="603" width="40" height="22" rx="3" fill="#f8faf8" stroke="#9fbcad"/><text x="131" y="647" class="small">S2</text><rect x="175" y="629" width="40" height="22" rx="3" fill="#32745e" stroke="#9fbcad"/><rect x="224" y="629" width="40" height="22" rx="3" fill="#32745e" stroke="#9fbcad"/><rect x="273" y="629" width="40" height="22" rx="3" fill="#f8faf8" stroke="#9fbcad"/><rect x="322" y="629" width="40" height="22" rx="3" fill="#f8faf8" stroke="#9fbcad"/><text x="131" y="673" class="small">Q1</text><rect x="175" y="655" width="40" height="22" rx="3" fill="#32745e" stroke="#9fbcad"/><rect x="224" y="655" width="40" height="22" rx="3" fill="#32745e" stroke="#9fbcad"/><rect x="273" y="655" width="40" height="22" rx="3" fill="#f8faf8" stroke="#9fbcad"/><rect x="322" y="655" width="40" height="22" rx="3" fill="#f8faf8" stroke="#9fbcad"/><text x="131" y="699" class="small">Q2</text><rect x="175" y="681" width="40" height="22" rx="3" fill="#32745e" stroke="#9fbcad"/><rect x="224" y="681" width="40" height="22" rx="3" fill="#32745e" stroke="#9fbcad"/><rect x="273" y="681" width="40" height="22" rx="3" fill="#f8faf8" stroke="#9fbcad"/><rect x="322" y="681" width="40" height="22" rx="3" fill="#f8faf8" stroke="#9fbcad"/><text x="35" y="730" class="small">Green = visible. Query columns stay hidden.</text><text x="35" y="755" class="small">Illustrative 2-support / 2-query mask</text><text x="35" y="786">3 · Feed-forward 96 → 192 → 96</text><text x="35" y="811" class="small">Residual additions and layer normalization</text>
