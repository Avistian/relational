<svg xmlns="http://www.w3.org/2000/svg" width="460" height="1080" viewBox="0 0 460 1080" role="img"><title>iLTM · weights plus context</title><rect width="460" height="1080" rx="16" fill="#f3f5f0"/><style>text{font-family:DejaVu Sans,sans-serif;font-size:19px;fill:#213d39}.title{font-size:22px;font-weight:bold}.arrow{stroke:#287a68;stroke-width:2;fill:none}</style><text x="20" y="36" class="title">iLTM · weights plus context</text><rect x="18" y="60" width="424" height="109" rx="10" fill="white" stroke="#a7bdb4"/><text class="title" x="30" y="89">Fit the task representation</text><text x="30" y="119">GBDT leaves and/or robust features</text><text x="30" y="146">One-hot leaf path: leaf 2 → [0,1,0]</text><path class="arrow" d="M230 172 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="201" width="424" height="109" rx="10" fill="white" stroke="#a7bdb4"/><text class="title" x="30" y="230">Project to a fixed width</text><text x="30" y="260">Randomized embedding → width 512</text><text x="30" y="287">Keep fitted trees and projection state.</text><path class="arrow" d="M230 313 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="342" width="424" height="109" rx="10" fill="#deebe4" stroke="#a7bdb4"/><text class="title" x="30" y="371">Sequential hypernetwork</text><text x="30" y="401">Generation rows + labels + summaries</text><text x="30" y="428">Main MLP: width 512, three layers.</text><path class="arrow" d="M230 454 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="483" width="424" height="109" rx="10" fill="white" stroke="#a7bdb4"/><text class="title" x="30" y="512">Two paths, one representation</text><text x="30" y="542">Query → MLP → main logits</text><text x="30" y="569">Context → hidden vectors + known labels</text><path class="arrow" d="M230 595 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="624" width="424" height="136" rx="10" fill="#e7eafa" stroke="#a7bdb4"/><text class="title" x="30" y="653">Retrieve a second score</text><text x="30" y="683">Cosine similarity S[q,c]</text><text x="30" y="710">S × context one-hot labels / τ</text><text x="30" y="737">Mix: (1−α) main + α retrieval</text><path class="arrow" d="M230 763 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="792" width="424" height="109" rx="10" fill="white" stroke="#a7bdb4"/><text class="title" x="30" y="821">Serve the complete model</text><text x="30" y="851">α &gt; 0 retains contextual dependence.</text><text x="30" y="878">Optional fine-tuning/ensemble add cost.</text><path class="arrow" d="M230 904 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="933" width="424" height="109" rx="10" fill="#fff0d6" stroke="#a7bdb4"/><text class="title" x="30" y="962">Evidence boundary</text><text x="30" y="992">Real-table meta-training in the paper.</text><text x="30" y="1019">B07a: architecture only, NOT_RUN.</text></svg>