<svg xmlns="http://www.w3.org/2000/svg" width="460" height="960" viewBox="0 0 460 960" role="img"><title>MotherNet · compact child MLP</title><rect width="460" height="960" rx="16" fill="#f3f5f0"/><style>text{font-family:DejaVu Sans,sans-serif;font-size:19px;fill:#213d39}.title{font-size:22px;font-weight:bold}.arrow{stroke:#287a68;stroke-width:2;fill:none}</style><text x="20" y="36" class="title">MotherNet · compact child MLP</text><rect x="18" y="60" width="424" height="109" rx="10" fill="white" stroke="#a7bdb4"/><text class="title" x="30" y="89">A labeled table becomes tokens</text><text x="30" y="119">n rows; pad features to 100</text><text x="30" y="146">feature projection + class encoding</text><path class="arrow" d="M230 172 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="201" width="424" height="109" rx="10" fill="#deebe4" stroke="#a7bdb4"/><text class="title" x="30" y="230">12 transformer layers</text><text x="30" y="260">Support rows interact at width 512.</text><text x="30" y="287">Pool by class → 10 × 512 summary.</text><path class="arrow" d="M230 313 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="342" width="424" height="109" rx="10" fill="white" stroke="#a7bdb4"/><text class="title" x="30" y="371">Decode variable weight factors</text><text x="30" y="401">Task-specific P: 512 × 32</text><text x="30" y="428">Meta-learned fixed F: 32 × 100</text><path class="arrow" d="M230 454 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="483" width="424" height="136" rx="10" fill="#e7eafa" stroke="#a7bdb4"/><text class="title" x="30" y="512">One generated layer, unpacked</text><text x="30" y="542">x[100] → F x[32] → P(F x)[512]</text><text x="30" y="569">Add bias, then ReLU.</text><text x="30" y="596">Repeat with second 512-wide layer.</text><path class="arrow" d="M230 622 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="651" width="424" height="136" rx="10" fill="white" stroke="#a7bdb4"/><text class="title" x="30" y="680">Query → child → probabilities</text><text x="30" y="710">Two hidden layers; rank 32 factors.</text><text x="30" y="737">Keep factors, biases and preprocessing.</text><text x="30" y="764">The query does not reread support.</text><path class="arrow" d="M230 790 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="819" width="424" height="109" rx="10" fill="#fff0d6" stroke="#a7bdb4"/><text class="title" x="30" y="848">Pretraining is a separate loop</text><text x="30" y="878">Synthetic tasks → query loss → θ update</text><text x="30" y="905">B07a: architecture only, NOT_RUN.</text></svg>