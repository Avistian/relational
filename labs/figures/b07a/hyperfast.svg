<svg xmlns="http://www.w3.org/2000/svg" width="460" height="1140" viewBox="0 0 460 1140" role="img"><title>HyperFast · generate, then serve</title><rect width="460" height="1140" rx="16" fill="#f3f5f0"/><style>text{font-family:DejaVu Sans,sans-serif;font-size:19px;fill:#213d39}.title{font-size:22px;font-weight:bold}.arrow{stroke:#287a68;stroke-width:2;fill:none}</style><text x="20" y="36" class="title">HyperFast · generate, then serve</text><rect x="18" y="60" width="424" height="109" rx="10" fill="white" stroke="#a7bdb4"/><text class="title" x="30" y="89">Support: labeled rows</text><text x="30" y="119">Train-only scaler; sample 512 rows.</text><text x="30" y="146">Repeat to 1024 for the 784-d PCA.</text><path class="arrow" d="M230 172 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="201" width="424" height="109" rx="10" fill="white" stroke="#a7bdb4"/><text class="title" x="30" y="230">Random features → fitted PCA</text><text x="30" y="260">X[1024,d] → ReLU(X R)[1024,32768]</text><text x="30" y="287">Center → project → Z[1024,784]</text><path class="arrow" d="M230 313 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="342" width="424" height="109" rx="10" fill="#deebe4" stroke="#a7bdb4"/><text class="title" x="30" y="371">Condition on table and class</text><text x="30" y="401">[zᵢ, mean(z), mean(z | yᵢ), onehot(yᵢ)]</text><text x="30" y="428">First hypernetwork input: 2398 values.</text><path class="arrow" d="M230 454 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="483" width="424" height="136" rx="10" fill="white" stroke="#a7bdb4"/><text class="title" x="30" y="512">Generate hidden layers</text><text x="30" y="542">Shared MLP → mean over support</text><text x="30" y="569">Linear decoder → matrix 784 × 784</text><text x="30" y="596">Then next layer sees prior activations.</text><path class="arrow" d="M230 622 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="651" width="424" height="136" rx="10" fill="#e7eafa" stroke="#a7bdb4"/><text class="title" x="30" y="680">Generate each output column</text><text x="30" y="710">Mean generated vector for class k</text><text x="30" y="737">+ mean hidden vector for class k</text><text x="30" y="764">Stack → output matrix 784 × K + bias</text><path class="arrow" d="M230 790 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="819" width="424" height="109" rx="10" fill="white" stroke="#a7bdb4"/><text class="title" x="30" y="848">Query → RF/PCA → main MLP</text><text x="30" y="878">Hidden layers 784 → 784 + residual</text><text x="30" y="905">Output logits[K] → softmax</text><path class="arrow" d="M230 931 v22 m-6 -7 l6 7 l6 -7"/><rect x="18" y="960" width="424" height="136" rx="10" fill="#fff0d6" stroke="#a7bdb4"/><text class="title" x="30" y="989">Optional two-space 1-NN</text><text x="30" y="1019">Keep support inputs and labels.</text><text x="30" y="1046">Add learned bias at each nearest class.</text><text x="30" y="1073">B07a varies only this correction.</text></svg>