<svg xmlns="http://www.w3.org/2000/svg" width="950" height="1025" viewBox="0 0 950 1025"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#007f80"/></marker></defs><style>text{font-family:DejaVu Sans,sans-serif;fill:#173342}.title{font-size:25px;font-weight:bold}.head{font-size:18px;font-weight:bold}.body{font-size:16px}.small{font-size:14px;fill:#52636b}.arrow{stroke:#007f80;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="950" height="1025" fill="#faf9f5"/><text x="30" y="40" class="title">TGAT · a representation is computed for a node AND a time</text><text x="30" y="70" class="small">Released Wikipedia variant · two layers · two heads · d = 172 · N = 20</text><rect x="30" y="95" width="430" height="100" rx="10" fill="white" stroke="#b9cccb"/><text x="47" y="124" class="head">Query (u, t) + event store</text><text x="47" y="152" class="body">Retrieve 20 eligible incident records</text><text x="47" y="176" class="body">Historical rows contain node, edge, timestamp</text><rect x="490" y="95" width="430" height="100" rx="10" fill="white" stroke="#b9cccb"/><text x="507" y="124" class="head">Raw features + shared parameters</text><text x="507" y="152" class="body">Zero node vectors; 172 edge features</text><text x="507" y="176" class="body">No recurrent per-node state is stored</text><path class="arrow" d="M245 195L245 225"/><path class="arrow" d="M705 195L705 225"/><rect x="30" y="225" width="890" height="120" rx="10" fill="white" stroke="#b9cccb"/><text x="47" y="254" class="head">Recursive layer: evaluate every child at its own interaction time</text><text x="47" y="282" class="body">Root: h^(ℓ−1)(u, t)     Child: h^(ℓ−1)(vᵢ, tᵢ)     Age: Δtᵢ = t − tᵢ</text><text x="47" y="306" class="body">At layer 0: read raw features. At layers 1 and 2: repeat retrieval + attention.</text><text x="47" y="330" class="body">Frequency and phase parameters produce Φ(Δt) = cos(ωΔt + b).</text><path class="arrow" d="M245 345L245 375"/><path class="arrow" d="M705 345L705 375"/><rect x="30" y="375" width="430" height="110" rx="10" fill="white" stroke="#b9cccb"/><text x="47" y="404" class="head">Root record → query projection</text><text x="47" y="432" class="body">[h(u,t) | zero edge | Φ(0)]</text><text x="47" y="456" class="body">B × 1 × 516 → 2 heads, width 258</text><rect x="490" y="375" width="430" height="110" rx="10" fill="white" stroke="#b9cccb"/><text x="507" y="404" class="head">History records → keys and values</text><text x="507" y="432" class="body">[h(vᵢ,tᵢ) | edgeᵢ | Φ(t−tᵢ)]</text><text x="507" y="456" class="body">B × 20 × 516 → 2 heads, width 258</text><path class="arrow" d="M245 485L245 515"/><path class="arrow" d="M705 485L705 515"/><rect x="30" y="515" width="890" height="120" rx="10" fill="white" stroke="#b9cccb"/><text x="47" y="544" class="head">Inside each head: compatibility → weighting → content</text><text x="47" y="572" class="body">qKᵀ / √258 → padding mask → softmax α → dropout → Σ αᵢVᵢ</text><text x="47" y="596" class="body">Two head outputs → concatenate → projection → residual + layer norm</text><text x="47" y="620" class="body">Merge [context 516 | root 172] → MLP 688 → 172 → embedding 172</text><path class="arrow" d="M475 635L475 665"/><text x="125" y="690" class="head">Evaluate the same encoder θ at three endpoint queries</text><rect x="30" y="710" width="275" height="80" rx="10" fill="white" stroke="#b9cccb"/><text x="47" y="739" class="head">Target hᵥ(t)</text><text x="47" y="767" class="body">B × 172 · shared encoder θ</text><rect x="338" y="710" width="275" height="80" rx="10" fill="white" stroke="#b9cccb"/><text x="355" y="739" class="head">Source hᵤ(t)</text><text x="355" y="767" class="body">B × 172 · shared encoder θ</text><rect x="646" y="710" width="274" height="80" rx="10" fill="white" stroke="#b9cccb"/><text x="663" y="739" class="head">Negative h⁻(t)</text><text x="663" y="767" class="body">B × 172 · shared encoder θ</text><path class="arrow" d="M167 790V810H245V830"/><path class="arrow" d="M475 790V805H245V830"/><path class="arrow" d="M475 790V805H705V830"/><path class="arrow" d="M783 790V810H705V830"/><rect x="30" y="830" width="430" height="100" rx="10" fill="white" stroke="#b9cccb"/><text x="47" y="859" class="head">Positive pair · shared decoder ψ</text><text x="47" y="887" class="body">[hᵤ | hᵥ] : 344 → 172 → 1</text><text x="47" y="911" class="body">Sigmoid → positive BCE</text><rect x="490" y="830" width="430" height="100" rx="10" fill="white" stroke="#b9cccb"/><text x="507" y="859" class="head">Negative pair · shared decoder ψ</text><text x="507" y="887" class="body">[hᵤ | h⁻] : 344 → 172 → 1</text><text x="507" y="911" class="body">Sigmoid → negative BCE</text><text x="30" y="965" class="body">Training loss = mean positive BCE + mean negative BCE. Inference freezes θ and ψ.</text><text x="30" y="997" class="small">Release replay preserves sampler/padding quirks. Corrected comparison is a separate lane.</text></svg>