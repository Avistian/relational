<svg xmlns="http://www.w3.org/2000/svg" width="720" height="535" viewBox="0 0 720 535"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#007f80"/></marker></defs><style>text{font-family:DejaVu Sans,sans-serif;fill:#173342}.title{font-size:25px;font-weight:bold}.head{font-size:18px;font-weight:bold}.body{font-size:16px}.small{font-size:14px;fill:#52636b}.arrow{stroke:#007f80;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="720" height="535" fill="#faf9f5"/><text x="30" y="40" class="title">Each child uses its connecting event time</text><rect x="30" y="75" width="290" height="110" rx="10" fill="white" stroke="#b9cccb"/><text x="47" y="104" class="head">Root query A @ 8</text><text x="47" y="132" class="body">Available first hop: A–B @ 5</text><text x="47" y="156" class="body">Ask for B’s state at time 5</text><path class="arrow" d="M320 130L375 130"/><rect x="375" y="75" width="315" height="110" rx="10" fill="white" stroke="#b9cccb"/><text x="392" y="104" class="head">Child query B @ 5</text><text x="392" y="132" class="body">B–C @ 4: eligible</text><text x="392" y="156" class="body">B–D @ 6: future to this query</text><rect x="30" y="225" width="660" height="125" rx="10" fill="white" stroke="#b9cccb"/><text x="47" y="254" class="head">Two boundaries, one chronological path</text><text x="47" y="282" class="body">A@8 → edge@5 → B@5 → edge@4 → C@4</text><text x="47" y="306" class="body">A@8 → edge@5 → B@5 → edge@6   ✕</text><text x="47" y="330" class="body">Filtering every edge only at root time 8 admits an invalid path.</text><text x="30" y="392" class="head">Separate release counterexample: history [1, 3, 5], query 4</text><rect x="30" y="415" width="315" height="95" rx="10" fill="white" stroke="#b9cccb"/><text x="47" y="444" class="head">Correct strict prefix</text><text x="47" y="472" class="body">Returns [1, 3]</text><rect x="375" y="415" width="315" height="95" rx="10" fill="white" stroke="#b9cccb"/><text x="392" y="444" class="head">Released binary-search slice</text><text x="392" y="472" class="body">Returns [1] · one event omitted</text></svg>