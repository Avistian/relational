   </g>
   <g id="text_10">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243b37" transform="translate(30.636 278.356036)">No test labels enter fit()</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243b37" transform="translate(30.636 294.756544)">No future-positive blacklist</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173c36" x="237.096" y="251.937187" transform="rotate(-0 237.096 251.937187)">PAIRWISE GRADIENT</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243b37" transform="translate(237.096 277.810528)">softplus(s_neg − s_pos) + L2</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243b37" transform="translate(237.096 294.756544)">Adam updates U, V and item bias</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173c36" x="477.036" y="251.938125" transform="rotate(-0 477.036 251.938125)">TWO SCORES [B]</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243b37" transform="translate(477.036 277.810528)">s_pos = U[u] · V[i] + b[i]</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243b37" transform="translate(477.036 294.610528)">s_neg = U[u] · V[j] + b[j]</text>
   </g>
