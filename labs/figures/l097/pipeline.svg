   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173c36" x="23.94" y="28.2672" transform="rotate(-0 23.94 28.2672)">WHAT THE SAMPLER CHANGES</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #46635e" x="23.94" y="50.4432" transform="rotate(-0 23.94 50.4432)">One typed relation • two shared score branches • one fixed evaluation catalog</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173c36" x="30.636" y="105.021187" transform="rotate(-0 30.636 105.021187)">TRAIN BASE ONLY</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243b37" transform="translate(30.636 131.040544)">Observed ratings → block mask</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243b37" transform="translate(30.636 147.840544)">Likes ≥4 → positive pairs [N,2]</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243b37" transform="translate(30.636 164.640544)">Like-degrees → proposal weights</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173c36" x="237.096" y="105.021187" transform="rotate(-0 237.096 105.021187)">CONDITIONAL SAMPLER</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243b37" transform="translate(237.096 132.057731)">Fix user u and relation likes</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243b37" transform="translate(237.096 147.840544)">Uniform / (degree+1)^0.75</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243b37" transform="translate(237.096 164.640544)">Or highest score of 4 uniform draws</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173c36" x="477.036" y="105.021187" transform="rotate(-0 477.036 105.021187)">SHARED EMBEDDINGS</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243b37" transform="translate(477.036 131.440036)">User table U [943,32]</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243b37" transform="translate(477.036 148.240036)">Item table V [1682,32] + bias</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #243b37" transform="translate(477.036 164.640544)">Same U,V score positive i and negative j</text>
   </g>
