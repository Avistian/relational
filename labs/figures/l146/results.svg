<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img"><title>Paired predictions · a conditional comparison</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#607983"/></marker></defs><rect width="1000" height="625" fill="#f4f8f7"/><text x="24" y="38" font-family="sans-serif" font-size="26" fill="#203b48">Paired predictions · a conditional comparison</text><text x="30" y="80" font-family="sans-serif" font-size="18" fill="#203b48">Fresh full-data course runs · three seed pairs · fixed recipe · not paper-result reproduction.</text><text x="30" y="151" font-family="sans-serif" font-size="20" fill="#203b48">Seed 0</text><path d="M296.58992635518945 145 H350.3398402611031" stroke="#7d949a" stroke-width="2"/><circle cx="296.58992635518945" cy="145" r="8" fill="#247c7a"/><text x="271.58992635518945" y="127" font-family="sans-serif" font-size="17" fill="#247c7a">4.261</text><circle cx="350.3398402611031" cy="145" r="8" fill="#92507e"/><text x="325.3398402611031" y="127" font-family="sans-serif" font-size="17" fill="#92507e">4.337</text><text x="30" y="221" font-family="sans-serif" font-size="20" fill="#203b48">Seed 1</text><path d="M349.22319940847706 215 H763.4100736448105" stroke="#7d949a" stroke-width="2"/><circle cx="349.22319940847706" cy="215" r="8" fill="#247c7a"/><text x="324.22319940847706" y="197" font-family="sans-serif" font-size="17" fill="#247c7a">4.335</text><circle cx="763.4100736448105" cy="215" r="8" fill="#92507e"/><text x="738.4100736448105" y="197" font-family="sans-serif" font-size="17" fill="#92507e">4.918</text><text x="30" y="291" font-family="sans-serif" font-size="20" fill="#203b48">Seed 2</text><path d="M313.49028402998846 285 H536.0509596604882" stroke="#7d949a" stroke-width="2"/><circle cx="313.49028402998846" cy="285" r="8" fill="#247c7a"/><text x="288.49028402998846" y="267" font-family="sans-serif" font-size="17" fill="#247c7a">4.285</text><circle cx="536.0509596604882" cy="285" r="8" fill="#92507e"/><text x="511.05095966048816" y="267" font-family="sans-serif" font-size="17" fill="#92507e">4.598</text><text x="190" y="345" font-family="sans-serif" font-size="17" fill="#203b48">Lower test MAE is better; line joins one seed label, not equal initialization.</text><rect x="25" y="389" width="460" height="130" rx="10" fill="white" stroke="#247c7a" stroke-width="2"/><text x="40" y="419" font-family="sans-serif" font-size="21" fill="#247c7a">GNN control · mean ± sample SD</text><text x="40" y="449" font-family="sans-serif" font-size="17" fill="#203b48">Test 4.2936 ± 0.0378</text><text x="40" y="474" font-family="sans-serif" font-size="17" fill="#203b48">Parameters 3,485,825</text><text x="40" y="499" font-family="sans-serif" font-size="17" fill="#203b48">Total fit worker time 197.3 s</text><rect x="515" y="389" width="460" height="130" rx="10" fill="white" stroke="#92507e" stroke-width="2"/><text x="530" y="419" font-family="sans-serif" font-size="21" fill="#92507e">Reduced RelGT · mean ± sample SD</text><text x="530" y="449" font-family="sans-serif" font-size="17" fill="#203b48">Test 4.6175 ± 0.2911</text><text x="530" y="474" font-family="sans-serif" font-size="17" fill="#203b48">Parameters 3,359,558</text><text x="530" y="499" font-family="sans-serif" font-size="17" fill="#203b48">Total fit worker time 207.4 s</text><text x="30" y="560" font-family="sans-serif" font-size="19" fill="#203b48">GNN − RelGT: -0.3239 ± 0.2538 MAE (seed SD; not a confidence interval).</text><text x="30" y="595" font-family="sans-serif" font-size="17" fill="#203b48">Architecture, encodings, readout, state and runtime differ. This is descriptive task evidence.</text></svg>