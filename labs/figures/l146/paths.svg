<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img"><title>Information access = sample × propagation × readout</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#607983"/></marker></defs><rect width="1000" height="490" fill="#f4f8f7"/><text x="24" y="38" font-family="sans-serif" font-size="26" fill="#203b48">Information access = sample × propagation × readout</text><text x="26" y="77" font-family="sans-serif" font-size="20" fill="#203b48">Question: when can the circuit’s original attributes change a root prediction?</text><rect x="30" y="109" width="205" height="96" rx="10" fill="white" stroke="#247c7a" stroke-width="2"/><text x="45" y="139" font-family="sans-serif" font-size="21" fill="#203b48">Driver</text><text x="45" y="169" font-family="sans-serif" font-size="17" fill="#203b48">root / prediction</text><path d="M235 155 L273 155" fill="none" stroke="#607983" stroke-width="2" marker-end="url(#a)"/><rect x="275" y="109" width="205" height="96" rx="10" fill="white" stroke="#247c7a" stroke-width="2"/><text x="290" y="139" font-family="sans-serif" font-size="21" fill="#203b48">Result</text><text x="290" y="169" font-family="sans-serif" font-size="17" fill="#203b48">one FK edge</text><path d="M480 155 L518 155" fill="none" stroke="#607983" stroke-width="2" marker-end="url(#a)"/><rect x="520" y="109" width="205" height="96" rx="10" fill="white" stroke="#247c7a" stroke-width="2"/><text x="535" y="139" font-family="sans-serif" font-size="21" fill="#203b48">Race</text><text x="535" y="169" font-family="sans-serif" font-size="17" fill="#203b48">two FK edges</text><path d="M725 155 L763 155" fill="none" stroke="#607983" stroke-width="2" marker-end="url(#a)"/><rect x="765" y="109" width="205" height="96" rx="10" fill="white" stroke="#247c7a" stroke-width="2"/><text x="780" y="139" font-family="sans-serif" font-size="21" fill="#203b48">Circuit</text><text x="780" y="169" font-family="sans-serif" font-size="17" fill="#203b48">three FK edges</text><rect x="30" y="250" width="450" height="135" rx="10" fill="white" stroke="#247c7a" stroke-width="2"/><text x="45" y="280" font-family="sans-serif" font-size="21" fill="#247c7a">Synchronous GNN · root readout</text><text x="45" y="310" font-family="sans-serif" font-size="17" fill="#203b48">Layer 1: result → driver</text><text x="45" y="335" font-family="sans-serif" font-size="17" fill="#203b48">Layer 2: race → result → driver</text><text x="45" y="360" font-family="sans-serif" font-size="17" fill="#203b48">Layer 3: circuit → race → result → driver</text><rect x="515" y="250" width="450" height="135" rx="10" fill="white" stroke="#92507e" stroke-width="2"/><text x="530" y="280" font-family="sans-serif" font-size="21" fill="#92507e">Local all-pairs attention</text><text x="530" y="310" font-family="sans-serif" font-size="17" fill="#203b48">If all four tokens were retrieved:</text><text x="530" y="335" font-family="sans-serif" font-size="17" fill="#203b48">one attention block can connect circuit → driver.</text><text x="530" y="360" font-family="sans-serif" font-size="17" fill="#203b48">If circuit was excluded: no direct access.</text><text x="30" y="427" font-family="sans-serif" font-size="18" fill="#203b48">Assumptions matter: pooling, structural encoders and sampling can change this trace.</text><text x="30" y="458" font-family="sans-serif" font-size="18" fill="#203b48">Illustrative three-hop chain. The measured course sampler is limited to two hops.</text></svg>