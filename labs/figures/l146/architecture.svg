<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="878" viewBox="0 0 1000 878" role="img"><title>Two complete forward passes · the measured course variants</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#607983"/></marker></defs><rect width="1000" height="878" fill="#f4f8f7"/><text x="24" y="38" font-family="sans-serif" font-size="26" fill="#203b48">Two complete forward passes · the measured course variants</text><rect x="25" y="77" width="950" height="98" rx="10" fill="white" stroke="#247c7a" stroke-width="2"/><text x="40" y="107" font-family="sans-serif" font-size="21" fill="#203b48">One immutable query context, shared by both arms</text><text x="40" y="137" font-family="sans-serif" font-size="17" fill="#203b48">(driver, cutoff) → legal two-hop BFS → K=32 slots; all induced directed FK relations.</text><text x="40" y="162" font-family="sans-serif" font-size="17" fill="#203b48">B≤128; same graph/row statistics, same sampling seed, same train/validation/test queries.</text><rect x="25" y="223" width="450" height="130" rx="10" fill="white" stroke="#247c7a" stroke-width="2"/><text x="40" y="253" font-family="sans-serif" font-size="21" fill="#247c7a">GNN control · initial B × 32 × 64</text><text x="40" y="283" font-family="sans-serif" font-size="17" fill="#203b48">Source typed row encoder + type embedding</text><text x="40" y="308" font-family="sans-serif" font-size="17" fill="#203b48">+ sinusoidal relative age → linear projection</text><text x="40" y="333" font-family="sans-serif" font-size="17" fill="#203b48">Sum → LayerNorm; no GIN positional encoder.</text><rect x="525" y="223" width="450" height="130" rx="10" fill="white" stroke="#92507e" stroke-width="2"/><text x="540" y="253" font-family="sans-serif" font-size="21" fill="#92507e">Reduced RelGT · initial B × 32 × 64</text><text x="540" y="283" font-family="sans-serif" font-size="17" fill="#203b48">Five width-64 vectors: row/type/hop/time/GIN</text><text x="540" y="308" font-family="sans-serif" font-size="17" fill="#203b48">Normalize → concatenate (width 320)</text><text x="540" y="333" font-family="sans-serif" font-size="17" fill="#203b48">320 → 128 → 64 nonlinear mixture.</text><path d="M250 175 L250 223" fill="none" stroke="#607983" stroke-width="2" marker-end="url(#a)"/><path d="M750 175 L750 223" fill="none" stroke="#607983" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="399" width="450" height="155" rx="10" fill="white" stroke="#247c7a" stroke-width="2"/><text x="40" y="429" font-family="sans-serif" font-size="21" fill="#247c7a">Two relation-specific mean layers</text><text x="40" y="459" font-family="sans-serif" font-size="17" fill="#203b48">For each relation: mean incoming neighbors.</text><text x="40" y="484" font-family="sans-serif" font-size="17" fill="#203b48">Apply one learned 64 → 64 map per relation.</text><text x="40" y="509" font-family="sans-serif" font-size="17" fill="#203b48">Add destination-type self transform.</text><text x="40" y="534" font-family="sans-serif" font-size="17" fill="#203b48">Sum relations → LayerNorm → ReLU/dropout.</text><rect x="525" y="399" width="450" height="155" rx="10" fill="white" stroke="#92507e" stroke-width="2"/><text x="540" y="429" font-family="sans-serif" font-size="21" fill="#92507e">Two local blocks + centroid branch</text><text x="540" y="459" font-family="sans-serif" font-size="17" fill="#203b48">Local Q,K,V: B × 4 × 32 × 16.</text><text x="540" y="484" font-family="sans-serif" font-size="17" fill="#203b48">Each token attends all 32 sampled slots.</text><text x="540" y="509" font-family="sans-serif" font-size="17" fill="#203b48">Root also reads 128 EMA centroids.</text><text x="540" y="534" font-family="sans-serif" font-size="17" fill="#203b48">Local/global fusion: B × 128 → B × 64.</text><path d="M250 353 L250 399" fill="none" stroke="#607983" stroke-width="2" marker-end="url(#a)"/><path d="M750 353 L750 399" fill="none" stroke="#607983" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="600" width="450" height="103" rx="10" fill="white" stroke="#247c7a" stroke-width="2"/><text x="40" y="630" font-family="sans-serif" font-size="21" fill="#247c7a">Root MLP → one scalar</text><text x="40" y="660" font-family="sans-serif" font-size="17" fill="#203b48">Root slot only → 64 → 64 → 1.</text><text x="40" y="685" font-family="sans-serif" font-size="17" fill="#203b48">No centroid memory; dropout off at eval.</text><rect x="525" y="600" width="450" height="103" rx="10" fill="white" stroke="#92507e" stroke-width="2"/><text x="540" y="630" font-family="sans-serif" font-size="21" fill="#92507e">Source head → one scalar</text><text x="540" y="660" font-family="sans-serif" font-size="17" fill="#203b48">Pooled local + global → scalar prediction.</text><text x="540" y="685" font-family="sans-serif" font-size="17" fill="#203b48">Eval dropout off; fixed structural draws.</text><path d="M250 554 L250 600" fill="none" stroke="#607983" stroke-width="2" marker-end="url(#a)"/><path d="M750 554 L750 600" fill="none" stroke="#607983" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="749" width="950" height="99" rx="10" fill="white" stroke="#247c7a" stroke-width="2"/><text x="40" y="779" font-family="sans-serif" font-size="21" fill="#203b48">Common recipe; distinct models, parameter counts and computation</text><text x="40" y="809" font-family="sans-serif" font-size="17" fill="#203b48">L1 loss · Adam .001 · 10 full epochs · 3 seeds · first validation minimum · fixed clipping.</text><text x="40" y="834" font-family="sans-serif" font-size="17" fill="#203b48">COURSE EXPERIMENT. Reduced RelGT and custom GNN; neither is the paper’s full comparison.</text></svg>