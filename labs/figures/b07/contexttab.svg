<svg xmlns="http://www.w3.org/2000/svg" width="460" height="1165" viewBox="0 0 460 1165" role="img"><title>ConTextTab · labeled context</title><rect width="460" height="1165" rx="14" fill="#f3f6f2"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#193c38;font-size:18px}.title{font-size:21px;font-weight:bold}.box{fill:white;stroke:#a7bdb8;stroke-width:1.5}.arrow{stroke:#357866;stroke-width:2;fill:none}</style><text x="20" y="34" class="title">ConTextTab · labeled context</text><rect class="box" x="18" y="58" width="424" height="112" rx="9" style="fill:#ffffff"/><text x="30" y="86" class="title">Known context + unknown query</text><text x="30" y="113">2 support rows: X and y</text><text x="30" y="138">1 query row: X only; target hidden</text><path class="arrow" d="M230 170 v23 m-6 -7 l6 7 l6 -7"/><rect class="box" x="18" y="201" width="424" height="137" rx="9" style="fill:#ffffff"/><text x="30" y="229" class="title">Cell vector + header vector</text><text x="30" y="256">text: MiniLM → learned projection</text><text x="30" y="281">number: scalar or soft-bin encoding</text><text x="30" y="306">date: day + month + year encodings</text><path class="arrow" d="M230 338 v23 m-6 -7 l6 7 l6 -7"/><text x="30" y="393">S1</text><rect x="88" y="369" width="94" height="32" fill="#dcece4" stroke="#a7bdb8"/><text x="124" y="393">x₁</text><rect x="199" y="369" width="94" height="32" fill="#dcece4" stroke="#a7bdb8"/><text x="235" y="393">x₂</text><rect x="310" y="369" width="94" height="32" fill="#fff0d7" stroke="#a7bdb8"/><text x="346" y="393">y</text><text x="30" y="433">S2</text><rect x="88" y="409" width="94" height="32" fill="#dcece4" stroke="#a7bdb8"/><text x="124" y="433">x₁</text><rect x="199" y="409" width="94" height="32" fill="#dcece4" stroke="#a7bdb8"/><text x="235" y="433">x₂</text><rect x="310" y="409" width="94" height="32" fill="#fff0d7" stroke="#a7bdb8"/><text x="346" y="433">y</text><text x="30" y="473">Q</text><rect x="88" y="449" width="94" height="32" fill="#dcece4" stroke="#a7bdb8"/><text x="124" y="473">x₁</text><rect x="199" y="449" width="94" height="32" fill="#dcece4" stroke="#a7bdb8"/><text x="235" y="473">x₂</text><rect x="310" y="449" width="94" height="32" fill="#fff0d7" stroke="#a7bdb8"/><text x="346" y="473">?</text><text x="32" y="511">Toy hidden table: 3 × 3 × 768</text><path class="arrow" d="M230 526 v23 m-6 -7 l6 7 l6 -7"/><rect class="box" x="18" y="557" width="424" height="112" rx="9" style="fill:#e1eee6"/><text x="30" y="585" class="title">Mix columns within each row</text><text x="30" y="612">Each row combines its cells.</text><text x="30" y="637">Read labeled support across rows.</text><path class="arrow" d="M230 669 v23 m-6 -7 l6 7 l6 -7"/><rect class="box" x="18" y="700" width="424" height="112" rx="9" style="fill:#ffffff"/><text x="30" y="728" class="title">Repeat attention blocks</text><text x="30" y="755">Base: depth 12, width 768</text><text x="30" y="780">Default shares weights across depth.</text><path class="arrow" d="M230 812 v23 m-6 -7 l6 7 l6 -7"/><rect class="box" x="18" y="843" width="424" height="137" rx="9" style="fill:#ffffff"/><text x="30" y="871" class="title">Decode query target</text><text x="30" y="898">classification: probabilities over classes</text><text x="30" y="923">binning regression: Σ p(bin) × bin value</text><text x="30" y="948">repeat contexts → average 8 predictions</text><path class="arrow" d="M230 980 v23 m-6 -7 l6 7 l6 -7"/><rect class="box" x="18" y="1011" width="424" height="127" rx="9" style="fill:#fff0d7"/><text x="30" y="1039" class="title">New task, same weights</text><text x="30" y="1066">Support labels influence predictions.</text><text x="30" y="1091">No query answers enter the model.</text><text x="30" y="1116">Original benchmark: source-gated.</text></svg>