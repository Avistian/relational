<svg xmlns="http://www.w3.org/2000/svg" width="460" height="1250" viewBox="0 0 460 1250" role="img"><title>TabSTAR · target-aware transfer</title><rect width="460" height="1250" rx="14" fill="#f3f6f2"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#193c38;font-size:18px}.title{font-size:21px;font-weight:bold}.box{fill:white;stroke:#a7bdb8;stroke-width:1.5}.arrow{stroke:#357866;stroke-width:2;fill:none}</style><text x="20" y="34" class="title">TabSTAR · target-aware transfer</text><rect class="box" x="18" y="58" width="424" height="112" rx="9" style="fill:#ffffff"/><text x="30" y="86" class="title">Known row + all candidates</text><text x="30" y="113">features: volume, country</text><text x="30" y="138">candidates: quality low AND high</text><path class="arrow" d="M230 170 v23 m-6 -7 l6 7 l6 -7"/><rect class="box" x="18" y="201" width="424" height="137" rx="9" style="fill:#ffffff"/><text x="30" y="229" class="title">Verbalize each element</text><text x="30" y="256">text: “country: France”</text><text x="30" y="281">number: name + bin + quantile</text><text x="30" y="306">numeric path keeps the precise z-score</text><path class="arrow" d="M230 338 v23 m-6 -7 l6 7 l6 -7"/><rect class="box" x="18" y="369" width="424" height="112" rx="9" style="fill:#ffffff"/><text x="30" y="397" class="title">Two encoders, width 384</text><text x="30" y="424">string → e5-small-v2 → semantic vector</text><text x="30" y="449">scalar → small MLP → numeric vector</text><path class="arrow" d="M230 481 v23 m-6 -7 l6 7 l6 -7"/><rect class="box" x="18" y="512" width="424" height="183" rx="9"/><text x="30" y="542">Per-element fusion: two-token attention</text><rect x="38" y="562" width="166" height="38" fill="#dcece4"/><text x="47" y="587">text: 384</text><rect x="258" y="562" width="166" height="38" fill="#dcece4"/><text x="267" y="587">number: 384</text><path class="arrow" d="M121 605 L213 643 M340 605 L247 643"/><text x="97" y="670">average outputs → 384</text><path class="arrow" d="M230 695 v23 m-6 -7 l6 7 l6 -7"/><rect class="box" x="18" y="726" width="424" height="137" rx="9" style="fill:#e1eee6"/><text x="30" y="754" class="title">Six feature-interaction layers</text><text x="30" y="781">2 features + 2 candidates → 4 × 384</text><text x="30" y="806">all element tokens attend within row</text><text x="30" y="831">no feature-position encoding</text><path class="arrow" d="M230 863 v23 m-6 -7 l6 7 l6 -7"/><rect class="box" x="18" y="894" width="424" height="137" rx="9" style="fill:#ffffff"/><text x="30" y="922" class="title">Shared head → class scores</text><text x="30" y="949">low token → score; high token → score</text><text x="30" y="974">softmax(scores) → class probabilities</text><text x="30" y="999">true query class is never an input</text><path class="arrow" d="M230 1031 v23 m-6 -7 l6 7 l6 -7"/><rect class="box" x="18" y="1062" width="424" height="159" rx="9" style="fill:#edf0fb"/><text x="30" y="1090" class="title">Adaptation uses gradients</text><text x="30" y="1117">Pretraining updates upper text layers.</text><text x="30" y="1142">Downstream: train LoRA adapters.</text><text x="30" y="1167">Eligible encoder layers can adapt.</text><text x="30" y="1192">B07 explains this; no TabSTAR fit here.</text></svg>