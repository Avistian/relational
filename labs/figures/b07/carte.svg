<svg xmlns="http://www.w3.org/2000/svg" width="460" height="1020" viewBox="0 0 460 1020" role="img"><title>CARTE · one row becomes a graph</title><rect width="460" height="1020" rx="14" fill="#f3f6f2"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#193c38;font-size:18px}.title{font-size:21px;font-weight:bold}.box{fill:white;stroke:#a7bdb8;stroke-width:1.5}.arrow{stroke:#357866;stroke-width:2;fill:none}</style><text x="20" y="34" class="title">CARTE · one row becomes a graph</text><rect class="box" x="18" y="58" width="424" height="112" rx="9" style="fill:#ffffff"/><text x="30" y="86" class="title">Known cells → vector leaves</text><text x="30" y="113">volume z=2 → 2 × header vector</text><text x="30" y="138">country=France → text vector</text><path class="arrow" d="M230 170 v23 m-6 -7 l6 7 l6 -7"/><rect class="box" x="18" y="201" width="424" height="195" rx="9"/><path class="arrow" d="M104 274 L210 332 M355 274 L250 332"/><text x="40" y="233">Columns label the edges</text><text x="35" y="266">2 × e_volume</text><text x="274" y="266">v_France</text><text x="30" y="300">e_volume</text><text x="315" y="300">e_country</text><circle cx="230" cy="341" r="23" fill="#d6eae0" stroke="#357866"/><text x="209" y="348">row</text><text x="36" y="384">center = mean(edge ⊙ leaf)</text><path class="arrow" d="M230 396 v23 m-6 -7 l6 7 l6 -7"/><rect class="box" x="18" y="427" width="424" height="136" rx="9" style="fill:#e1eee6"/><text x="30" y="455" class="title">Map nodes, then attend</text><text x="30" y="482">sender message = edge ⊙ node</text><text x="30" y="507">12 heads × 25 coordinates</text><text x="30" y="532">center ← weighted incoming messages</text><path class="arrow" d="M230 563 v23 m-6 -7 l6 7 l6 -7"/><rect class="box" x="18" y="594" width="424" height="111" rx="9" style="fill:#ffffff"/><text x="30" y="622" class="title">Readout → one 300-vector</text><text x="30" y="649">LayerNorm → feedforward → LayerNorm</text><text x="30" y="674">Only the center is consumed.</text><path class="arrow" d="M230 705 v23 m-6 -7 l6 7 l6 -7"/><rect class="box" x="18" y="736" width="424" height="111" rx="9" style="fill:#edf0fb"/><text x="30" y="764" class="title">Fit a ridge head on training rows</text><text x="30" y="791">64 train: scaler + coefficients</text><text x="30" y="816">64 validation: choose alpha 1 / 10 / 100</text><path class="arrow" d="M230 847 v23 m-6 -7 l6 7 l6 -7"/><rect class="box" x="18" y="878" width="424" height="118" rx="9" style="fill:#ffffff"/><text x="30" y="906" class="title">256 test predictions per run</text><text x="30" y="933">Weights in graph encoder stay fixed.</text><text x="30" y="958">Paper uses different downstream fitting.</text></svg>