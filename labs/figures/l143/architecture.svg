<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="904" viewBox="0 0 1100 904" role="img"><title>RelGNN: full forward pass with an expanded composite route</title><desc>A constructor and result fuse before driver-owned attention; four heads combine into the root prediction. All sampled rows retain their query cutoff.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087e82"/></marker></defs><rect width="1100" height="904" fill="#f5f8f7"/><text x="28" y="38" font-size="26" fill="#163746" font-family="DejaVu Sans,sans-serif">RelGNN · keep the source role until the destination chooses</text><text x="28" y="66" font-size="17" fill="#087e82" font-family="DejaVu Sans,sans-serif">Released F1 variant: one composite layer · four heads · 128 channels per head</text><rect x="28" y="90" width="1044" height="86" rx="12" fill="white" stroke="#087e82" stroke-width="2"/><text x="44" y="119" font-size="20" fill="#087e82" font-family="DejaVu Sans,sans-serif">01  Retrieve and encode each query</text><text x="44" y="147" font-size="20" fill="#163746" font-family="DejaVu Sans,sans-serif">(driver, cutoff) → sample 128 / 64 → table encoders + query-relative time</text><text x="44" y="171" font-size="20" fill="#163746" font-family="DejaVu Sans,sans-serif">Each row has 128 coordinates and its own query owner. Keys define graph links.</text><path d="M550,176 L550,205" fill="none" stroke="#087e82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="205" width="1044" height="377" rx="16" fill="#eaf4f2"/><text x="46" y="237" font-size="21" fill="#087e82" font-family="DejaVu Sans,sans-serif">02  Inspect ONE ordered constructor → result → driver route</text><rect x="48" y="258" width="305" height="92" rx="12" fill="white" stroke="#087e82" stroke-width="2"/><text x="64" y="287" font-size="20" fill="#087e82" font-family="DejaVu Sans,sans-serif">Source: constructor s</text><text x="64" y="315" font-size="20" fill="#163746" font-family="DejaVu Sans,sans-serif">Its own role’s 128-vector</text><text x="64" y="339" font-size="20" fill="#163746" font-family="DejaVu Sans,sans-serif">Example scalars: 2, 4</text><rect x="393" y="258" width="305" height="92" rx="12" fill="white" stroke="#a85d0a" stroke-width="2"/><text x="409" y="287" font-size="20" fill="#a85d0a" font-family="DejaVu Sans,sans-serif">Fact: result f</text><text x="409" y="315" font-size="20" fill="#163746" font-family="DejaVu Sans,sans-serif">Keep the event’s attributes</text><text x="409" y="339" font-size="20" fill="#163746" font-family="DejaVu Sans,sans-serif">Example scalars: 1, 0</text><rect x="738" y="258" width="314" height="92" rx="12" fill="white" stroke="#7051a0" stroke-width="2"/><text x="754" y="287" font-size="20" fill="#7051a0" font-family="DejaVu Sans,sans-serif">Destination: driver d</text><text x="754" y="315" font-size="20" fill="#163746" font-family="DejaVu Sans,sans-serif">Supplies the attention query</text><text x="754" y="339" font-size="20" fill="#163746" font-family="DejaVu Sans,sans-serif">Illustrative query: 1</text><path d="M201,350 L201,382" fill="none" stroke="#087e82" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M545,350 L545,382" fill="none" stroke="#a85d0a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="382" width="650" height="92" rx="12" fill="white" stroke="#087e82" stroke-width="2"/><text x="64" y="411" font-size="20" fill="#087e82" font-family="DejaVu Sans,sans-serif">Fuse source + fact, separately for this route</text><text x="64" y="439" font-size="20" fill="#163746" font-family="DejaVu Sans,sans-serif">u = Wsource · sum(s) + bsource + Wfact · f</text><text x="64" y="463" font-size="20" fill="#163746" font-family="DejaVu Sans,sans-serif">Scalar fusion: 2 + 1 = 3; 4 + 0 = 4.</text><path d="M373,474 L373,502" fill="none" stroke="#087e82" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M895,350 L895,502" fill="none" stroke="#7051a0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="502" width="1004" height="61" rx="12" fill="white" stroke="#7051a0" stroke-width="2"/><text x="64" y="531" font-size="20" fill="#7051a0" font-family="DejaVu Sans,sans-serif">Attention: softmax over THIS destination’s incoming facts</text><text x="64" y="552" font-size="20" fill="#163746" font-family="DejaVu Sans,sans-serif">Scalar example: scores [3, 4] → weights [0.269, 0.731] → weighted value 3.731</text><path d="M550,582 L550,614" fill="none" stroke="#087e82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="614" width="1044" height="102" rx="12" fill="white" stroke="#087e82" stroke-width="2"/><text x="44" y="643" font-size="20" fill="#087e82" font-family="DejaVu Sans,sans-serif">03  Restore the real dimensions and combine routes</text><text x="44" y="671" font-size="20" fill="#163746" font-family="DejaVu Sans,sans-serif">4 heads × 128 → weighted values → concatenate to 512 + destination skip</text><text x="44" y="695" font-size="20" fill="#163746" font-family="DejaVu Sans,sans-serif">Project to 128 → sum routes → LayerNorm → ReLU. Also update fact states.</text><path d="M550,716 L550,746" fill="none" stroke="#087e82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="746" width="1044" height="94" rx="12" fill="white" stroke="#087e82" stroke-width="2"/><text x="44" y="775" font-size="20" fill="#087e82" font-family="DejaVu Sans,sans-serif">04  Predict at the queried driver</text><text x="44" y="803" font-size="20" fill="#163746" font-family="DejaVu Sans,sans-serif">Root vectors [B,128] → prediction head → one finishing-position estimate</text><text x="44" y="827" font-size="20" fill="#163746" font-family="DejaVu Sans,sans-serif">Train: unclipped L1 loss → gradients. Evaluate: train-percentile clipping.</text><text x="28" y="875" font-size="17" fill="#163746" font-family="DejaVu Sans,sans-serif">Two graph edges ≠ two model layers. B = query batch size. The scalar trace is illustrative.</text></svg>