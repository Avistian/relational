<svg xmlns="http://www.w3.org/2000/svg" width="900" height="475" viewBox="0 0 900 475"><rect width="900" height="475" fill="#faf9f6"/><style>text{font-family:Arial,sans-serif;fill:#18344a;font-size:18px}.title{font-size:25px;font-weight:bold}.small{font-size:16px}.bad{fill:#9e3540}</style><text x="30" y="40" class="title">One query, one cutoff — through every dependency</text>
<text x="30" y="73">Illustrative query: customer A at day 5 · two incoming hops</text>
<path d="M215 174 L345 174 M555 174 L680 174" stroke="#247b76" stroke-width="4"/>
<rect x="30" y="125" width="185" height="100" rx="10" fill="#d9ede5"/><text x="48" y="157">Purchase E</text><text x="48" y="187">event 5 · arrival 5</text><text x="48" y="211" class="small">INCLUDE at hop 2</text>
<rect x="345" y="125" width="210" height="100" rx="10" fill="#d9ede5"/><text x="365" y="157">Account B</text><text x="365" y="187">event 1 · arrival 1</text><text x="365" y="211" class="small">INCLUDE at hop 1</text>
<rect x="680" y="125" width="190" height="100" rx="10" fill="#dce8f3"/><text x="700" y="158">Customer A</text><text x="700" y="188">query cutoff = 5</text><text x="700" y="212" class="small">predict future target</text>
<text x="240" y="161">→</text><text x="601" y="161">→</text>
<rect x="30" y="280" width="370" height="86" rx="10" fill="#f5dce0"/><text x="48" y="311">Outcome C: event 8 · arrival 8</text><text x="48" y="343" class="bad">EXCLUDE: future second-hop source</text>
<rect x="445" y="280" width="425" height="86" rx="10" fill="#f5dce0"/><text x="465" y="311">Correction D: event 2 · arrival 9</text><text x="465" y="343" class="bad">EXCLUDE: past event, late arrival</text>
<text x="30" y="410">Cutoff stays 5 at hop 2. It does not become account B's creation day 1.</text>
<text x="30" y="445">Filter legal rows and edges → expand incoming neighbors → aggregate → predict.</text></svg>