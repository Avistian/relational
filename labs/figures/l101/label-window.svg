<svg xmlns="http://www.w3.org/2000/svg" width="900" height="425" viewBox="0 0 900 425"><rect width="900" height="425" fill="#faf9f6"/><style>text{font-family:Arial,sans-serif;fill:#18344a;font-size:18px}.title{font-size:25px;font-weight:bold}.small{font-size:16px}.bad{fill:#9e3540}</style><text x="30" y="40" class="title">A query date is not its label's availability date</text><text x="30" y="75">Illustrative horizon: 3 days · model fitted at validation day 10</text>
<line x1="120" x2="820" y1="125" y2="125" stroke="#18344a" stroke-width="3"/>
<line x1="570" x2="570" y1="100" y2="370" stroke="#9e3540" stroke-width="3" stroke-dasharray="7 6"/>
<text x="150" y="113">day 5</text><text x="390" y="113">day 8</text><text x="530" y="92">day 10: fit</text><text x="655" y="113">day 11</text>
<rect x="180" y="170" width="240" height="48" fill="#d9ede5"/><text x="200" y="201">label window (5, 8]</text><text x="620" y="201">TRAIN: ready by fit</text>
<rect x="420" y="252" width="240" height="48" fill="#f5dce0"/><text x="438" y="283">label window (8, 11]</text><text x="35" y="284" class="bad">PURGE from training</text>
<text x="30" y="353">Both queries precede day 10. Only the first has a fully observed label.</text><text x="30" y="395">At inference, features end at the query cutoff; the target starts after it.</text></svg>