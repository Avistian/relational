    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(237.654 157.886937)">PK 200 → local 1</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(237.654 173.321312)">  buyer 30 / referrer NULL</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(237.654 190.886937)">PK 300 → local 2</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(237.654 206.321312)">  buyer 10 / referrer NULL</text>
