   <g id="text_13">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="29.52" y="253.908" transform="rotate(-0 29.52 253.908)">4 node types  •  4 forward FK roles  •  4 optional reverse stores  •  12 + 12 edges</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193248" x="36.774" y="303.804" transform="rotate(-0 36.774 303.804)">1  Resolve identity</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(36.774 335.558937)">Stable sorted PK → local index</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(36.774 350.993312)">NULL: no edge; orphan: reject</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(36.774 367.911828)">Forward tensor: [2, number of links]</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193248" x="287.874" y="303.804" transform="rotate(-0 287.874 303.804)">2  Preserve two line paths</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(287.874 334.493312)">Two line nodes reach product 10</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(287.874 350.993312)">via the same order and buyer.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(287.874 367.928156)">Quantities: 2 + 3 = 5</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193248" x="538.974" y="303.804" transform="rotate(-0 538.974 303.804)">3  Verify the query</text>
   </g>
   <g id="text_19">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(538.974 334.493312)">Graph paths = SQL JOIN rows</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(538.974 350.993312)">SUM(quantity) = 5, not 1 or 2</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #193248" transform="translate(538.974 367.493312)">LEFT JOIN keeps zero-order customers</text>
   </g>
