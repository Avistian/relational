<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1260" viewBox="0 0 1000 1260" role="img" aria-labelledby="title desc"><title id="title">TabDPT: an episode becomes a prediction</title><desc id="desc">Real table, target-free retrieval, disjoint context and query,100-wide row projection,768-wide transformer with support-only keys and values, two task heads. Training updates weights; inference freezes them. Released training sampler order differs.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#267566" stroke-width="1.5"/></marker></defs><rect width="1000" height="1260" rx="20" fill="#f8faf6"/><style>text{font-family:system-ui,sans-serif;fill:#173a35}.head{font-size:28px;font-weight:700}.sub{font-size:19px}.label{font-size:23px;font-weight:650}.small{font-size:18px}.box{fill:white;stroke:#b3cec4;stroke-width:2}.arrow{stroke:#267566;stroke-width:3;fill:none;marker-end:url(#a)}</style><text x="45" y="53" class="head">TabDPT · learn from columns, predict from context</text><text x="45" y="84" class="sub">Original architecture · 16 layers · width 768 · 4 attention heads</text><rect x="40" y="115" width="440" height="145" rx="12" class="box" style="fill:white"/><text x="58" y="147" class="label">PRETRAIN · real table T ∈ Rⁿˣᶠ</text><text x="58" y="177" class="small">Choose column c as the prediction target.</text><text x="58" y="203" class="small">Paper order: remove c, then retrieve rows.</text><text x="58" y="229" class="small">Split selected rows without replacement.</text><rect x="520" y="115" width="440" height="145" rx="12" class="box" style="fill:white"/><text x="538" y="147" class="label">INFER · new task, fixed weights</text><text x="538" y="177" class="small">Eligible training rows provide Xₛ and yₛ.</text><text x="538" y="203" class="small">Retrieve using features of query xq.</text><text x="538" y="229" class="small">Query labels never enter this path.</text><path d="M255,260 L255,305" class="arrow"/><path d="M745,260 L745,305" class="arrow"/><rect x="40" y="305" width="440" height="150" rx="12" class="box" style="fill:white"/><text x="58" y="337" class="label">Support: Xₛ [S,F], yₛ [S,1]</text><text x="58" y="367" class="small">Fit eligible-context preprocessing.</text><text x="58" y="393" class="small">Pad / reduce feature width to 100.</text><text x="58" y="419" class="small">Row projection: 100 → 768; RMS normalize.</text><rect x="520" y="305" width="440" height="150" rx="12" class="box" style="fill:white"/><text x="538" y="337" class="label">Queries: Xq [Q,F]</text><text x="538" y="367" class="small">Apply inference support statistics.</text><text x="538" y="393" class="small">Same feature view and row projection.</text><text x="538" y="419" class="small">No query target embedding.</text><path d="M255,455 L255,490" class="arrow"/><path d="M745,455 L745,490" class="arrow"/><rect x="40" y="490" width="440" height="125" rx="12" class="box" style="fill:#e4f1e9"/><text x="58" y="522" class="label">Condition support rows</text><text x="58" y="552" class="small">φₓ(Xₛ) + φᵧ(yₛ) → [S,768]</text><text x="58" y="578" class="small">Regression y normalization uses support.</text><rect x="520" y="490" width="440" height="125" rx="12" class="box" style="fill:#e4f1e9"/><text x="538" y="522" class="label">Keep query targets outside</text><text x="538" y="552" class="small">φₓ(Xq) → [Q,768]</text><text x="538" y="578" class="small">Concatenate support then queries.</text><path d="M255,615 L255,657" class="arrow"/><path d="M745,615 L745,657" class="arrow"/><rect x="40" y="657" width="920" height="193" rx="12" class="box" style="fill:#dcece5"/><text x="58" y="689" class="label">ROW TRANSFORMER ×16 · [S+Q,768]</text><text x="58" y="719" class="small">Pre-norm → attention → residual → pre-norm → MLP → residual</text><text x="58" y="745" class="small">Q projections: all S+Q rows.  K and V projections: S support rows only.</text><text x="58" y="771" class="small">Per-head width: 768 / 4 = 192. Attention matrix: [4,S+Q,S].</text><text x="58" y="797" class="small">Queries read support; support does not read queries. No query-to-query attention.</text><path d="M255,850 L255,889" class="arrow"/><path d="M745,850 L745,889" class="arrow"/><rect x="40" y="889" width="440" height="118" rx="12" class="box" style="fill:white"/><text x="58" y="921" class="label">Classification head</text><text x="58" y="951" class="small">Query states → active-class logits</text><text x="58" y="977" class="small">Cross-entropy during pretraining.</text><rect x="520" y="889" width="440" height="118" rx="12" class="box" style="fill:white"/><text x="538" y="921" class="label">Regression head</text><text x="538" y="951" class="small">Query states → scalar target</text><text x="538" y="977" class="small">Undo support target normalization.</text><rect x="40" y="1040" width="920" height="86" rx="12" class="box" style="fill:#e8f0f5"/><text x="58" y="1072" class="label">Training boundary</text><text x="58" y="1102" class="small">Query targets score the loss and update weights; inference only changes context.</text><rect x="40" y="1153" width="920" height="78" rx="12" class="box" style="fill:#fff0d9"/><text x="58" y="1185" class="label">SOURCE AUDIT · do not silently merge these paths</text><text x="58" y="1215" class="small">Released training use_knn retrieves before target removal. See the counterexample.</text></svg>