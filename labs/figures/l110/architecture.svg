   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(307.404 372.264427)">QUEUE AFTERWARD</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(307.404 388.217044)">Now read current edge features (172)</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(307.404 404.492044)">Build messages for real endpoints only</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(307.404 420.767044)">Detach between training batches</text>
   </g>
