   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #647579" x="18.36" y="47.1168" transform="rotate(-0 18.36 47.1168)">Wikipedia · one layer · two attention heads · dimensions per event unless stated</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(31.194 91.970044)">OLD queued message (688)</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(31.194 108.121997)">[own 172 | other 172 | edge 172 | time 172]</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(31.194 124.514302)">GRU(message, memory 172) → state 172</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(31.194 140.795044)">Prior positive interactions only</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(307.404 91.970044)">QUESTION: user u, page v, time t</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(307.404 108.245044)">Also sample one negative page v−</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(307.404 124.520044)">Gather ten historical edges with time &lt; t</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(307.404 141.812231)">Current event features are not read here</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(31.194 228.279567)">HISTORY ATTENTION for u, v and v−</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(31.194 243.949997)">Query = [own state 172 | time(0) 172] → 344</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(31.194 260.224997)">Key/value = [neighbor state 172 | past edge 172 | time(t−τ) 172] → 516</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(31.194 276.623044)">Two-head attention + merge with own state → embedding 172</text>
   </g>
