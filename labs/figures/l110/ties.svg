   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233b45" x="18.36" y="26.604" transform="rotate(-0 18.36 26.604)">A strict sampler cannot protect a leaking memory path</text>
