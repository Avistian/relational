   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #647579" x="18.36" y="47.1168" transform="rotate(-0 18.36 47.1168)">Worked stream [1, 2, 2, 2, 3, 4] · nominal batch size two · timestamps in arbitrary units</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(36.774 100.162997)">Fixed slicing: [1, 2]  |  [2, 2]  |  [3, 4]</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(36.774 116.561044)">First group queues time 2 → second group scores time 2</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(36.774 132.836044)">History lookup excludes time 2; memory may still consume it.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(36.774 213.814997)">Keep ties together: [1, 2, 2, 2]  |  [3, 4]</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(36.774 231.230231)">Previous maximum 2 &lt; next minimum 3</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #233b45" transform="translate(36.774 246.488044)">All time-2 questions use the same pre-group temporal state.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #647579" x="35.1" y="299.9232" transform="rotate(-0 35.1 299.9232)">Soft batch size: preserve order and every event; extend through the last timestamp group.</text>
   </g>
