<svg xmlns="http://www.w3.org/2000/svg" width="480" height="680" viewBox="0 0 480 680" role="img" aria-labelledby="t d"><title id="t">Same customer, different information paths</title><desc id="d">Age-only inputs collapse Ada and Bo. Order sums separate them. Raw linked orders retain more detail than the sums. Prediction differences do not isolate architecture.</desc><rect width="480" height="680" rx="18" fill="#eef5f0"/><style>text{font-family:Arial,sans-serif;fill:#173f30;font-size:18px}.head{font-size:24px;font-weight:bold}.sub{font-size:16px}.card{fill:white;stroke:#a5c4b3;stroke-width:1.5}</style><text x="24" y="40" class="head">Trace the information first</text><text x="24" y="72">Course example · no trained model scores</text><rect x="20" y="95" width="440" height="112" rx="10" class="card"/><text x="36" y="127">Eligible rows at the same cutoff</text><text x="36" y="158">Ada: age 40; orders [10, 20]</text><text x="36" y="186">Bo: age 40; orders [20, 40]</text><text x="235" y="239">↓</text><rect x="20" y="255" width="440" height="91" rx="10" class="card"/><text x="36" y="285">A · Target-row-only predictor</text><text x="36" y="316">Ada [40] = Bo [40] → identical inputs</text><rect x="20" y="362" width="440" height="112" rx="10" class="card"/><text x="36" y="392">B · Aggregate → flat predictor</text><text x="36" y="424">Ada [40, 30] ≠ Bo [40, 60]</text><text x="36" y="451" class="sub">Order sum added information absent from A.</text><rect x="20" y="490" width="440" height="114" rx="10" class="card"/><text x="36" y="520">C · Linked rows → relational predictor</text><text x="36" y="550">Ada retains [10, 20], not only sum 30.</text><text x="36" y="578" class="sub">Replacing with [15, 15] changes C, not B.</text><text x="24" y="642" class="sub">B vs C: test which retained distinction matters.</text></svg>