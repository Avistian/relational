<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1470" viewBox="0 0 600 1470"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37696e"/></marker></defs><rect width="600" height="1470" rx="20" fill="#eef4f5"/><text x="300" y="36" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="600" fill="#173f44">TabFlex · what is compressed?</text><rect x="24" y="57" width="552" height="103" rx="12" fill="#dcebed" stroke="#93b4b8"/><text x="300" y="86" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173f44">Pretraining learns the prediction rule</text><text x="300" y="113" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Synthetic support/query episodes → query loss</text><text x="300" y="136" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Update encoder, attention, FFN and head weights.</text><path d="M300 164v25" stroke="#37696e" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="198" width="552" height="111" rx="12" fill="#fff" stroke="#93b4b8"/><text x="300" y="227" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173f44">Inference freezes those weights</text><text x="300" y="254" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Support X[S,F], y[S] + query X[Q,F]</text><text x="300" y="277" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Wrapper chooses S100 / L100 / H1K by S and F.</text><text x="300" y="300" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">F &gt; 1000: random projection discards dimensions.</text><path d="M300 313v25" stroke="#37696e" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="347" width="552" height="110" rx="12" fill="#fff" stroke="#93b4b8"/><text x="300" y="376" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173f44">A row becomes one embedding</text><text x="300" y="403" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Feature encoder F → E (paper E = 512)</text><text x="300" y="426" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Support: feature embedding + label embedding</text><text x="300" y="449" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Query: feature embedding only; targets held out.</text><path d="M300 461v25" stroke="#37696e" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="495" width="552" height="117" rx="12" fill="#dcebed" stroke="#93b4b8"/><text x="300" y="524" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173f44">Each attention head forms Q, K, V</text><text x="300" y="551" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Support queries read support; query rows read support.</text><text x="300" y="574" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Positive map φ(x) = ELU(x) + 1</text><text x="300" y="597" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Kφ[S,d] and V[S,dv] feed the summary.</text><path d="M300 616v25" stroke="#37696e" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="650" width="552" height="130" rx="12" fill="#cee3e5" stroke="#93b4b8"/><text x="300" y="679" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173f44">Compress support into two statistics</text><text x="300" y="706" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">A = Kφᵀ V           shape d × dv</text><text x="300" y="729" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">z = sum over support of Kφ      shape d</text><text x="300" y="752" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Output(q) = φ(q) A / (φ(q) z + ε)</text><text x="300" y="775" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">No query × support score matrix is materialized.</text><path d="M300 784v25" stroke="#37696e" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="818" width="552" height="109" rx="12" fill="#fff" stroke="#93b4b8"/><text x="300" y="847" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173f44">Complete the learned block</text><text x="300" y="874" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Output projection → residual + normalization</text><text x="300" y="897" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Feed-forward network → residual + normalization</text><text x="300" y="920" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Repeat blocks; a summary is recomputed per layer.</text><path d="M300 931v25" stroke="#37696e" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="965" width="552" height="107" rx="12" fill="#fff" stroke="#93b4b8"/><text x="300" y="994" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173f44">Decode and align predictions</text><text x="300" y="1021" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">MLP class logits → wrapper probabilities</text><text x="300" y="1044" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Release views: S100/H1K = 3; L100 = 1</text><text x="300" y="1067" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Capacity checks must preserve original class identities.</text><path d="M300 1076v25" stroke="#37696e" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="1110" width="552" height="110" rx="12" fill="#f2e6cc" stroke="#93b4b8"/><text x="300" y="1139" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173f44">Three axes remain separate</text><text x="300" y="1166" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Rows S: summaries replace pairwise attention work.</text><text x="300" y="1189" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Features F: input projection still grows with width.</text><text x="300" y="1212" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Classes C: class head and training prior still constrain C.</text><rect x="24" y="1244" width="552" height="118" rx="12" fill="#f2e6cc" stroke="#93b4b8"/><text x="300" y="1273" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173f44">B04a measurement boundary</text><text x="300" y="1300" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Figure 9: isolated attention kernels; source gate closed.</text><text x="300" y="1323" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">Course lab: fixed projection + label kernel readout.</text><text x="300" y="1346" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173f44">No learned blocks, no TabFlex checkpoint or pretraining.</text><text x="300" y="1402" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173f44">Named shapes distinguish feature width F from head width d.</text><text x="300" y="1430" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173f44">Primary sources: TabFlex §§3–5 and released model code.</text></svg>