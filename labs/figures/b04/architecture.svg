<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1330" viewBox="0 0 560 1330"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47766f"/></marker></defs><rect width="560" height="1330" rx="18" fill="#f2f6f3"/><text x="280" y="37" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="600" fill="#173e39">TabICLv2 · one prediction, end to end</text><rect x="22" y="60" width="516" height="102" rx="12" fill="#e2eee8" stroke="#9eb9ab"/><text x="280" y="90" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173e39">Before this task: learn an inference rule</text><text x="280" y="118" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">Synthetic tasks → query loss → update θ</text><text x="280" y="141" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">Prior, architecture and optimizer all matter.</text><path d="M280 166v24" stroke="#47766f" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="201" width="516" height="110" rx="12" fill="#fff" stroke="#9eb9ab"/><text x="280" y="231" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173e39">At inference: freeze θ</text><text x="280" y="259" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">Support X[S,F], y[S] · Query X[Q,F]</text><text x="280" y="282" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">Query targets stay in the scorer only.</text><text x="280" y="305" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">Fit wrapper transforms on support.</text><path d="M280 315v24" stroke="#47766f" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="349" width="516" height="110" rx="12" fill="#fff" stroke="#9eb9ab"/><text x="280" y="379" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173e39">Repeated groups + target-aware embedding</text><text x="280" y="407" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">N = S + Q · three values per feature position</text><text x="280" y="430" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">N × F × 128; support labels added early</text><text x="280" y="453" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">“same” grouping preserves F positions.</text><path d="M280 463v24" stroke="#47766f" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="497" width="516" height="112" rx="12" fill="#e2eee8" stroke="#9eb9ab"/><text x="280" y="527" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173e39">Column stage · 3 induced-attention blocks</text><text x="280" y="555" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">128 inducing vectors per feature position</text><text x="280" y="578" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">Aggregate support → broadcast to rows</text><text x="280" y="601" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">QASSMax on inducing-query aggregation.</text><path d="M280 613v24" stroke="#47766f" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="647" width="516" height="112" rx="12" fill="#e2eee8" stroke="#9eb9ab"/><text x="280" y="677" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173e39">Row stage · 3 transformer blocks</text><text x="280" y="705" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">Within each row: F tokens + 4 CLS tokens</text><text x="280" y="728" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">4 × 128 CLS outputs → one 512-wide row</text><text x="280" y="751" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">Representation compression happens here.</text><path d="M280 763v24" stroke="#47766f" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="797" width="516" height="112" rx="12" fill="#e2eee8" stroke="#9eb9ab"/><text x="280" y="827" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173e39">Dataset ICL · 12 transformer blocks</text><text x="280" y="855" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">N × 512 row vectors; add support targets</text><text x="280" y="878" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">8 heads, QASSMax; queries read support</text><text x="280" y="901" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">Longer context still means more attention work.</text><path d="M280 913v24" stroke="#47766f" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="947" width="516" height="112" rx="12" fill="#fff" stroke="#9eb9ab"/><text x="280" y="977" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173e39">Prediction head + wrapper</text><text x="280" y="1005" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">512 → 1024 → up to 10 class logits</text><text x="280" y="1028" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">Temperature → class alignment → view average</text><text x="280" y="1051" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">B04: one view, Q × 2 output probabilities.</text><path d="M280 1063v24" stroke="#47766f" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="1097" width="516" height="115" rx="12" fill="#f2e8d3" stroke="#9eb9ab"/><text x="280" y="1127" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#173e39">Score and audit outside the model</text><text x="280" y="1155" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">Query IDs + probabilities + held-out labels</text><text x="280" y="1178" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">Accuracy · log loss · Brier · time · peak RSS</text><text x="280" y="1201" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173e39">384 fresh course predictions; paper lane blocked.</text><text x="280" y="1250" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#173e39">Classification checkpoint: v2-20260212</text><text x="280" y="1278" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173e39">Full source + shapes are inspectable in the notebook.</text></svg>