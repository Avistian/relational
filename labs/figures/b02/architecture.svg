<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1030" viewBox="0 0 560 1030" role="img" aria-labelledby="t d"><title id="t">Numerical representation, shared paths, and packed members</title><desc id="d">Training-only preprocessing feeds either raw or embedded numbers. TabM shares a weight matrix across adapted paths; TabPack gives each member independent weights and hyperparameters, selects using validation and averages at inference.</desc><rect width="560" height="1030" rx="14" fill="#eef5f2"/><style>text{font-family:Arial,sans-serif;fill:#153b30;font-size:18px}.h{font-size:23px;font-weight:bold}.small{font-size:16px}.box{fill:white;stroke:#adc7b9;stroke-width:1.5}.arrow{fill:#44755f;font-size:26px}</style><text x="25" y="35" class="h">Two axes, three mechanisms</text><text x="25" y="64" class="small">Trace training information through to a prediction.</text><rect x="16" y="85" width="528" height="120" rx="10" class="box"/><text x="32" y="116" class="h">01 · Representation</text><text x="32" y="148" class="">Training-only transforms → each numeric feature</text><text x="32" y="180" class="">Raw scalar x   OR   embedding e(x) → concatenate</text><text x="270" y="238" class="arrow">↓</text><rect x="16" y="255" width="528" height="180" rx="10" class="box"/><text x="32" y="287" class="h">02a · TabM: shared backbone weights</text><text x="32" y="322" class="">Path 1:  x ⊙ r₁  →  shared W  →  ⊙ s₁ + b₁</text><text x="32" y="355" class="">Path 2:  x ⊙ r₂  →  shared W  →  ⊙ s₂ + b₂</text><text x="32" y="390" class="">Nonlinear layers → independent output heads</text><text x="32" y="418" class="small">Mean member losses train all paths.</text><rect x="16" y="455" width="528" height="195" rx="10" class="box"/><text x="32" y="488" class="h">02b · TabPack: independent weights</text><text x="32" y="523" class="">Member 1: e₁(x) → W₁ → prediction 1</text><text x="32" y="556" class="">Member 2: e₂(x) → W₂ → prediction 2</text><text x="32" y="590" class="">Different depth / dropout / optimizer settings</text><text x="32" y="622" class="small">Packed operations + shape masks; no shared W.</text><text x="270" y="683" class="arrow">↓</text><rect x="16" y="700" width="528" height="145" rx="10" class="box"/><text x="32" y="734" class="h">03 · Validation selects</text><text x="32" y="770" class="">TabM: checkpoint / hyperparameter decisions</text><text x="32" y="805" class="">TabPack: online member ensemble + stopping</text><text x="32" y="831" class="small">Count selection even when it occurs inside one run.</text><text x="270" y="878" class="arrow">↓</text><rect x="16" y="890" width="528" height="115" rx="10" class="box"/><text x="32" y="922" class="h">04 · Freeze → predict → score</text><text x="32" y="957" class="">Average retained predictions; test labels score only.</text><text x="32" y="986" class="small">Changed representations need controlled ablations.</text></svg>