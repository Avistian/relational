name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # Teaching-workspace bookkeeping is not part of the published site, so a
    # doc-only commit should not spend a Pages deployment. A commit touching
    # both these and site files still deploys.
    paths-ignore:
      - 'NOTES.md'
      - 'MISSION.md'
      - 'RESOURCES.md'
      - 'SESSION.md'
      - 'GLOSSARY.md'
      - 'CURRICULUM.md'
      - 'CURRICULUM_STAGE.md'
      - 'misconceptions.md'
      - 'thesis-dossier.md'
      - 'learning-records/**'
      - 'reviews/**'
      - 'plan/**'
      - 'modal/**'
      - 'solutions/**'
      - '.agents/**'
      - '.cursor/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build site
        run: |
          VER=$(python3 -c "import json; print(json.load(open('lessons/manifest.json'))['version'])")
          sed -i "s/name=\"rdl-manifest-version\" content=\"[0-9]*\"/name=\"rdl-manifest-version\" content=\"$VER\"/" index.html notebooks.html
          mkdir -p public/labs
          cp index.html notebooks.html flashcards.html .nojekyll public/
          cp -r assets lessons reference public/
          # Notebooks for the web: rendered HTML (view) + sources (download/Colab/Binder) + README
          cp -r labs/html public/labs/
          cp -r labs/figures public/labs/
          cp labs/*.ipynb public/labs/ 2>/dev/null || true
          cp labs/README.md public/labs/ 2>/dev/null || true
          # L049 links its reproducibility evidence and operator from the lesson.
          cp labs/_verify_l049_results.json labs/_reference_l049_results.json public/labs/
          cp labs/_paper_repro_l049_closer_summary.json public/labs/
          cp labs/l049-reproduction.md public/labs/
          mkdir -p public/modal
          cp modal/l049_paper_repro.py public/modal/
          # L050 checkpoint links its measured evidence and reproduction contract.
          cp labs/_verify_l050_results.json labs/l050-reproduction.md public/labs/
          if [ -f labs/_paper_repro_l050_closer_summary.json ]; then cp labs/_paper_repro_l050_closer_summary.json public/labs/; fi
          cp modal/l050_paper_repro.py public/modal/
          cp labs/_scaleup_l050_evidence.json labs/_paper_repro_l050_measured.py public/labs/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Do NOT wrap this in an outer retry. When the Pages backend stalls in
      # `deployment_queued`, deploy-pages cancels the deployment on timeout, and
      # a deployment is keyed on the commit SHA — so a retry within the same run
      # recreates the cancelled record and fails instantly ("Deployment
      # cancelled"), turning a slow deploy into a hard failure (run 31099288142).
      # `timeout` cannot buy more room either: values above the 600000 ms default
      # are clamped to it. Transient status errors are already retried inside the
      # action; a stall is recovered by deploying a new commit.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
