name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # Teaching-workspace bookkeeping is not part of the published site, so a
    # doc-only commit should not spend a Pages deployment. A commit touching
    # both these and site files still deploys.
    paths-ignore:
      - 'NOTES.md'
      - 'MISSION.md'
      - 'RESOURCES.md'
      - 'SESSION.md'
      - 'GLOSSARY.md'
      - 'CURRICULUM.md'
      - 'CURRICULUM_STAGE.md'
      - 'misconceptions.md'
      - 'thesis-dossier.md'
      - 'learning-records/**'
      - 'reviews/**'
      - 'plan/**'
      - 'modal/**'
      - 'solutions/**'
      - '.agents/**'
      - '.cursor/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify clean-checkout publication inputs
        run: python3 labs/_check_pages_checkout.py

      - name: Build site
        run: |
          VER=$(python3 -c "import json; print(json.load(open('lessons/manifest.json'))['version'])")
          sed -i "s/name=\"rdl-manifest-version\" content=\"[0-9]*\"/name=\"rdl-manifest-version\" content=\"$VER\"/" index.html notebooks.html
          mkdir -p public/labs
          # Shared architecture builders and notebook portability for L071–L100.
          cp labs/_architecture_071_090.py labs/_architecture_091_100.py labs/_depth_091_100.py labs/_walkthrough_delivery.py public/labs/
          cp index.html notebooks.html flashcards.html .nojekyll public/
          cp -r assets lessons reference public/
          # Notebooks for the web: rendered HTML (view) + sources (download/Colab/Binder) + README
          cp -r labs/html public/labs/
          cp -r labs/figures public/labs/
          cp labs/*.ipynb public/labs/ 2>/dev/null || true
          cp labs/README.md public/labs/ 2>/dev/null || true
          # L188: reproducible literature collection, paper log and offline replay.
          mkdir -p public/labs/evidence/l188 public/labs/solutions
