name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Ubuntu 26.04 /tmp has a per-user tmpfs quota; export + build exceeds it.
    # runner.temp lives on disk. Keep the publication check itself unchanged.
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Only test imports; the full teaching/lab environment is unnecessary.
      # Installation happens on this disposable hosted runner, never locally.
      - name: Install check dependencies
        run: python -m pip install 'PyYAML==6.0.3' 'numpy==2.5.0' 'pandas==3.0.3' 'scikit-learn==1.9.0' 'pyarrow==24.0.0'

      - name: Check archived B05 sources for Google API keys
        run: python3 labs/_test_b05_source_secrets.py

      - name: Verify generated lesson visuals
        run: python3 scripts/refresh_lesson_visuals.py --check

      - name: Verify clean-checkout publication inputs
        run: python3 labs/_check_pages_checkout.py

      - name: Verify search index
        run: python3 scripts/search_index.py --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
